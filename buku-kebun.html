<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4C9">
<title>Buku Kebun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Buku Kebun — struktur gaya Jurnal Trading, palet Hijau Padi (#FFF4C9 #C7E78B #81AE64 #709053) */
:root{--ink:#FFF4C9;--ink-raised:#FFFAE2;--paper:#243019;--paper-dim:#485C33;--paper-faint:#4C6436;--gold:#4E6F35;--gold-dim:#709053;--fill:#81AE64;--fill-hi:#C7E78B;--on-fill:#1F2A16;--act-bg:#C7E78B;--act-tx:#1F2A16;--gain:#25703A;--loss:#9E3826;--line:#D3C88C;--line-soft:#E8DDA8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html[data-theme="dark"]{--ink:#161D12;--ink-raised:#1F2918;--paper:#FFF4C9;--paper-dim:#C4C09A;--paper-faint:#B2AE8C;--gold:#C7E78B;--gold-dim:#81AE64;--fill:#81AE64;--fill-hi:#C7E78B;--on-fill:#14200E;--act-bg:#1F2918;--act-tx:#C7E78B;--gain:#8FD08A;--loss:#E88A72;--line:#34422A;--line-soft:#27331F;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--ink);transition:background .2s}
body{margin:0;background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
::selection{background:var(--fill-hi);color:var(--on-fill)}
.wrap{max-width:920px;margin:0 auto;padding:0 20px 96px}
header.masthead{padding:30px 0 20px;border-bottom:1px solid var(--line)}
.masthead-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:22px;letter-spacing:.01em}
.brand em{font-style:italic;color:var(--gold);font-weight:500}
.updated{font-size:12px;color:var(--paper-faint);margin-top:10px}
.theme-toggle{background:none;border:1px solid var(--line);color:var(--paper-dim);width:30px;height:30px;font-size:14px;cursor:pointer;line-height:1}
.theme-toggle:hover{color:var(--gold);border-color:var(--gold)}
.hero{padding:26px 4px 6px}
.hero-label{font-size:12px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
.hero-number{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(36px,9vw,64px);line-height:1;color:var(--gold);letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums}
.hero-sub{font-size:13px;color:var(--paper-dim);margin-top:8px}
.up{color:var(--gain)}.down{color:var(--loss)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--line-soft)}
.stat{padding:14px 10px;border-left:1px solid var(--line-soft);min-width:0}
.stat:first-child{border-left:0;padding-left:0}
.stat-lbl{font-size:10.5px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;line-height:1.25;white-space:nowrap}
.stat-val{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:var(--sv,17px);line-height:1.2;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums}
.main-tabs{display:flex;gap:2px;margin:22px 0 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.main-tabs::-webkit-scrollbar{display:none}
.main-tab-btn{background:none;border:0;color:var(--paper-dim);font:inherit;font-size:12.5px;letter-spacing:.02em;padding:12px 18px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.main-tab-btn:hover{color:var(--paper)}
.main-tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:2px}
.bnav-btn{background:none;border:0;color:var(--paper-faint);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;flex:1;min-width:0;font:inherit;font-size:9.5px;transition:color .15s,background .15s}
.bnav-btn.active{color:var(--act-tx);background:var(--act-bg)}
.bnav-icon{width:19px;height:19px}
@media (max-width:720px){.main-tabs{display:none}.bottom-nav{display:flex}}
.panel{margin-top:20px}
section{padding:22px 20px;margin-bottom:16px;background:var(--ink-raised);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
@media (max-width:600px){section{padding:18px 14px;border-radius:12px}}
h2{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:20px;margin:0 0 14px;color:var(--paper)}
.note{font-size:12px;color:var(--paper-faint)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13px}
.row:first-of-type{border-top:0}
.row .mu{color:var(--paper-dim)}
.row-tuju{cursor:pointer;align-items:center;min-height:44px}.row-tuju:hover>span:first-child{color:var(--gold)}.row-tuju:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:block;font-size:10.5px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:13px;padding:10px 11px;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:8px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.seg{display:flex;gap:8px}
.btn{font:inherit;font-size:13px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--paper-dim);cursor:pointer;flex:1}
.btn:hover{color:var(--gold);border-color:var(--gold)}
.btn.on{color:var(--gold);border-color:var(--gold);background:var(--ink)}
.btn.gold{background:var(--fill);color:var(--on-fill);border-color:var(--fill);font-weight:600;width:100%;margin-top:18px}
.btn.gold:hover{color:var(--on-fill);opacity:.9}
.sc{cursor:pointer}
.sc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sc-name{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:500}
.badge{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--paper-faint);border:1px solid var(--line);padding:1px 7px}
.badge.live{color:var(--gold);border-color:var(--gold)}
.det{margin-top:12px;padding-top:6px;border-top:1px solid var(--line-soft)}
.tblwrap{overflow-x:auto}
table.ledger{width:100%;border-collapse:collapse;font-size:12.5px}
table.ledger th{font-size:10.5px;font-weight:500;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em;text-align:right;padding:8px;border-bottom:1px solid var(--line)}
table.ledger td{padding:8px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
table.ledger th:first-child,table.ledger td:first-child{text-align:left}
table.ledger tbody tr:hover{background:var(--ink)}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--fill);color:var(--on-fill);padding:8px 16px;font-size:12.5px;z-index:120}
.fab{position:fixed;right:max(20px,calc((100vw - 920px)/2 + 20px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--fill);color:var(--on-fill);box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;z-index:55;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .15s}
.fab:hover{opacity:.92}.fab:active{transform:scale(.94)}
.fab:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.fab svg{width:26px;height:26px}
.fab[hidden]{display:none}
.fab svg{transition:transform .18s}.fab.open svg{transform:rotate(45deg)}
.fab-scrim{position:fixed;inset:0;z-index:54;background:rgba(0,0,0,.28)}
.fab-dial{position:fixed;right:max(20px,calc((100vw - 920px)/2 + 20px));bottom:calc(144px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-scrim[hidden],.fab-dial[hidden]{display:none}
.fab-item{border:0;border-radius:24px;padding:12px 18px;background:var(--fill);color:var(--on-fill);font:inherit;font-size:14px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;white-space:nowrap}
.fab-item:active{transform:scale(.96)}.fab-item:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (min-width:721px){.fab{bottom:28px}.fab-dial{bottom:96px}}
/* ---------- Setelan ---------- */
body{zoom:var(--zoom,1)}
/* v0.1.078: elemen lebar (bulatan latar Efek kaca, angka panjang) tidak boleh melebarkan layout viewport; di Chrome Android itu membuat navbar fixed lebih lebar dari layar. clip tidak mematikan sticky */
html,body{overflow-x:clip}
.bottom-nav{box-sizing:border-box;overflow:hidden}
.bottom-nav .bnav-btn{overflow:hidden}
.bnav-btn span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row>span,.tx-n,.note{overflow-wrap:anywhere}
html[data-scheme="emas"]{--ink:#F3EDE0;--ink-raised:#E8E0CC;--paper:#2B2415;--paper-dim:#62573F;--paper-faint:#5E5541;--gold:#9C7526;--gold-dim:#B08F4E;--fill:#C9A24B;--fill-hi:#E8D9A8;--on-fill:#2B2415;--act-bg:#E8E0CC;--act-tx:#2B2415;--gain:#3F6B38;--loss:#8F3F2B;--line:#D9CFB4;--line-soft:#E3DAC3}
html[data-scheme="emas"][data-theme="dark"]{--ink:#1B1712;--ink-raised:#231E17;--paper:#EDE6D6;--paper-dim:#C5B9A3;--paper-faint:#B4A890;--gold:#C9A24B;--gold-dim:#8C744E;--fill:#C9A24B;--fill-hi:#C9A24B;--on-fill:#1B1712;--act-bg:#231E17;--act-tx:#C9A24B;--gain:#84AB7C;--loss:#DD8A74;--line:#3A3226;--line-soft:#2A251C;color-scheme:dark}
.masthead-right{display:flex;align-items:center;gap:10px}
.theme-toggle.active{color:var(--gold);border-color:var(--gold)}
.eye{background:none;border:0;color:var(--paper-faint);cursor:pointer;font-size:13px;padding:2px 4px;margin-left:4px}
.eye:hover{color:var(--gold)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 14px;flex-wrap:wrap;margin-bottom:6px}
.sec-head h2{margin:0}
.sec-head .note{max-width:38ch;text-align:right}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line-soft)}
.sec-head+.settings-row{border-top:0}
.settings-desc{min-width:0}
.settings-desc strong{display:block;font-size:13px;font-weight:500}
.settings-desc span{display:block;font-size:12px;color:var(--paper-faint);margin-top:2px;max-width:46ch}
.seg.sm{flex-wrap:wrap;justify-content:flex-end}
.seg.sm .btn,.settings-row>.btn{flex:0 0 auto;padding:7px 12px;font-size:12px}
.settings-input{width:84px;text-align:right}
.settings-text{width:100%;min-height:96px;margin-top:6px;font:inherit;font-size:11.5px;padding:10px 11px;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:8px;resize:vertical}
.settings-text:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.danger:hover{color:var(--loss);opacity:.85}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
@media (max-width:600px){.settings-row{flex-direction:column;align-items:stretch;gap:10px}.seg.sm{justify-content:flex-start}.settings-input{width:100%;text-align:left}.sec-head .note{text-align:left;max-width:none}}
/* ---------- Liquid Glass bergaya iOS (v0.1.069; sakelar di Setelan, berlaku untuk semua skema dan mode) ----------
   Bahan: kaca bening berlapis (sorot spekular kiri-atas + isian tembus pandang) dengan blur kuat, saturasi tinggi,
   tepi bercahaya terarah (terang di kiri-atas, redup di kanan-bawah), dan bayangan lembut. Kontrol berbentuk kapsul,
   navigasi bawah melayang, tab aktif berupa "lensa" kaca. Cadangan: padat bila blur tidak didukung atau pengguna
   memilih Kurangi Transparansi. */
html[data-glass="1"]{
  --lg-spec:radial-gradient(130% 95% at 0% 0%,rgba(255,255,255,.38),rgba(255,255,255,0) 46%);
  --lg-fill:linear-gradient(150deg,rgba(255,255,255,.38),rgba(255,255,255,.20));
  --lg-btn:linear-gradient(160deg,rgba(255,255,255,.40),rgba(255,255,255,.18));
  --lg-lens:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.24));
  --lg-hi:inset 1px 1px 0 rgba(255,255,255,.80),inset -1px -1px 0 rgba(255,255,255,.26);
  --lg-hi-s:inset 1px 1px 0 rgba(255,255,255,.65),inset -1px -1px 0 rgba(255,255,255,.18);
  --lg-blur:blur(14px) saturate(160%);
  --glass:var(--lg-fill);--glass-edge:rgba(255,255,255,.50);
  --glass-shadow:0 8px 24px rgba(50,70,35,.10),0 1px 3px rgba(50,70,35,.06);
  --glass-nav:rgba(255,255,255,.16);--glass-input:rgba(255,255,255,.30);--glass-th:rgba(255,255,255,.55);
  background:none}
html[data-glass="1"][data-theme="dark"]{
  --lg-spec:radial-gradient(130% 95% at 0% 0%,rgba(255,255,255,.13),rgba(255,255,255,0) 44%);
  --lg-fill:linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),linear-gradient(rgba(12,18,9,.54),rgba(12,18,9,.54));
  --lg-btn:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.04)),linear-gradient(rgba(12,18,9,.38),rgba(12,18,9,.38));
  --lg-lens:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.08)),linear-gradient(rgba(12,18,9,.30),rgba(12,18,9,.30));
  --lg-hi:inset 1px 1px 0 rgba(255,255,255,.24),inset -1px -1px 0 rgba(255,255,255,.05);
  --lg-hi-s:inset 1px 1px 0 rgba(255,255,255,.20),inset -1px -1px 0 rgba(255,255,255,.04);
  --lg-blur:blur(16px) saturate(145%);
  --glass-edge:rgba(255,255,255,.14);
  --glass-shadow:0 10px 30px rgba(0,0,0,.30),0 1px 4px rgba(0,0,0,.16);
  --glass-nav:rgba(22,29,18,.36);--glass-input:rgba(255,255,255,.05);--glass-th:rgba(0,0,0,.26)}
@supports (background:color-mix(in srgb,red 50%,transparent)){
  html[data-glass="1"] body{background:
    radial-gradient(900px 700px at 82% 0%,color-mix(in srgb,var(--fill) 40%,transparent),transparent 62%),
    radial-gradient(820px 760px at 0% 100%,color-mix(in srgb,var(--gold-dim) 30%,transparent),transparent 64%),
    radial-gradient(640px 520px at 18% 18%,color-mix(in srgb,var(--fill-hi) 52%,transparent),transparent 70%),
    radial-gradient(700px 560px at 60% 60%,color-mix(in srgb,var(--fill) 22%,transparent),transparent 74%),
    var(--ink);}
  html[data-glass="1"][data-theme="dark"] .gbg{background:
    radial-gradient(900px 700px at 82% 0%,color-mix(in srgb,var(--fill) 24%,transparent),transparent 62%),
    radial-gradient(820px 760px at 0% 100%,color-mix(in srgb,var(--gold-dim) 22%,transparent),transparent 64%),
    radial-gradient(640px 520px at 18% 18%,color-mix(in srgb,var(--fill) 9%,transparent),transparent 70%),
    var(--ink);}
}
html[data-glass="1"] body{background:var(--ink);}
/* bahan kaca untuk permukaan besar */
html[data-glass="1"] :is(section,.pd-kartu,.dm-kartu,.cx-pop,.bottom-nav,.toast){
  background:var(--lg-spec),var(--lg-fill);border:1px solid var(--glass-edge);
  box-shadow:var(--glass-shadow),var(--lg-hi)}
/* v0.1.072 — blur hanya untuk permukaan yang melayang di atas isi; kartu isi, tombol, dan kolom isian tanpa blur (hemat GPU HP) */
html[data-glass="1"] :is(.pd-kartu,.dm-kartu,.cx-pop,.bottom-nav,.toast){-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur)}
.fab{will-change:transform}
html[data-glass="1"] section{border-radius:28px}
html[data-glass="1"] .hero-card{border-left:1px solid var(--glass-edge)}
@supports (background:color-mix(in srgb,red 50%,transparent)){
  html[data-glass="1"] .hero-card{background:var(--lg-spec),linear-gradient(150deg,color-mix(in srgb,var(--fill) 14%,rgba(255,255,255,.30)),color-mix(in srgb,var(--fill) 5%,rgba(255,255,255,.14)))}
  html[data-glass="1"][data-theme="dark"] .hero-card{background:var(--lg-spec),linear-gradient(150deg,color-mix(in srgb,var(--fill) 20%,transparent),color-mix(in srgb,var(--fill) 6%,transparent)),linear-gradient(rgba(12,18,9,.54),rgba(12,18,9,.54))}
}
html[data-glass="1"] .pd-kartu,html[data-glass="1"] .dm-kartu{border-radius:30px 30px 0 0;border-bottom:0}
@media (min-width:721px){html[data-glass="1"] .pd-kartu,html[data-glass="1"] .dm-kartu{border-radius:30px;border-bottom:1px solid var(--glass-edge)}}
html[data-glass="1"] .cx-pop:not(.sheet){border-radius:20px}
html[data-glass="1"] .cx-pop.sheet{border-radius:28px 28px 0 0;border-bottom:0}
html[data-glass="1"] .toast{border-radius:999px;color:var(--paper);padding:10px 18px}
html[data-glass="1"] .dm-lapis{background:rgba(20,28,16,.34)}
html[data-glass="1"] .fab-scrim{background:rgba(20,28,16,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* kontrol kapsul */
html[data-glass="1"] :is(.btn,.theme-toggle,.dm-x,.fab-item){
  background:var(--lg-btn);border:1px solid var(--glass-edge);border-radius:999px;
  box-shadow:var(--lg-hi-s),0 2px 6px rgba(0,0,0,.05);
  transition:transform .3s cubic-bezier(.2,.9,.3,1.35),background .2s,color .15s,border-color .15s,box-shadow .2s}
html[data-glass="1"] .theme-toggle,html[data-glass="1"] .dm-x{border-radius:50%}
html[data-glass="1"] .badge{border-radius:999px}
html[data-glass="1"] :is(.btn,.theme-toggle,.dm-x,.fab-item,.bnav-btn):active{transform:scale(.95)}
html[data-glass="1"] .btn:hover,html[data-glass="1"] .theme-toggle:hover{border-color:var(--glass-edge);color:var(--gold)}
html[data-glass="1"] .btn.on{background:var(--lg-lens);color:var(--gold);border-color:var(--glass-edge);box-shadow:var(--lg-hi-s),0 3px 8px rgba(0,0,0,.07)}
html[data-glass="1"] .btn.gold{color:var(--on-fill);border-color:rgba(255,255,255,.55)}
html[data-glass="1"] .btn.danger{border-color:color-mix(in srgb,var(--loss) 55%,transparent)}
@supports (background:color-mix(in srgb,red 50%,transparent)){
  html[data-glass="1"] .btn.gold,html[data-glass="1"] .fab-item{background:radial-gradient(130% 100% at 20% 0%,rgba(255,255,255,.38),rgba(255,255,255,0) 58%),color-mix(in srgb,var(--fill) 68%,transparent);color:var(--on-fill);box-shadow:var(--lg-hi-s),0 8px 20px color-mix(in srgb,var(--fill) 38%,transparent)}
}
/* kolom isian: kaca cekung */
html[data-glass="1"] :is(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]),select,textarea,.cx-btn){
  background:var(--glass-input);border:1px solid var(--glass-edge);border-radius:16px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.08),inset 0 -1px 0 rgba(255,255,255,.35)}
html[data-glass="1"] :is(input,select,textarea,.cx-btn):focus-visible{border-color:var(--gold);outline:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.08),0 0 0 3px color-mix(in srgb,var(--gold) 28%,transparent)}
/* navigasi bawah melayang + lensa aktif */
html[data-glass="1"] .bottom-nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:999px;padding:5px;background:var(--lg-spec),var(--lg-fill),var(--glass-nav)}
html[data-glass="1"] .bnav-btn{border-radius:999px;padding:7px 2px;transition:transform .3s cubic-bezier(.2,.9,.3,1.35),color .15s,background .2s,box-shadow .2s}

/* v0.1.068 — Agenda lintas siklus */

/* v0.1.070 — geometri latar untuk efek kaca (hanya tampil saat kaca Nyala) */
.gbg{display:none}
html[data-glass="1"] .gbg{display:block;position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;contain:strict}
.gbg .gs{position:absolute;display:block}
.gbg .g1{width:clamp(220px,52vw,520px);aspect-ratio:1;border-radius:50%;right:-24%;top:-12%;background:radial-gradient(circle at 30% 28%,var(--fill-hi),var(--fill) 72%);opacity:.50}
.gbg .g2{width:clamp(200px,46vw,460px);aspect-ratio:1;border-radius:50%;left:-16%;bottom:6%;border:clamp(14px,3.4vw,34px) solid var(--gold-dim);opacity:.38}
.gbg .g3{width:clamp(110px,26vw,250px);aspect-ratio:1;left:7%;top:21%;border-radius:24%;transform:rotate(18deg);background:linear-gradient(135deg,var(--fill),transparent 88%);opacity:.55}
.gbg .g4{width:clamp(120px,28vw,270px);aspect-ratio:1;right:9%;top:47%;transform:rotate(-12deg);clip-path:polygon(50% 6%,96% 92%,4% 92%);background:linear-gradient(160deg,var(--fill-hi),var(--fill));opacity:.55}
.gbg .g5{width:clamp(160px,36vw,350px);aspect-ratio:1.15;left:48%;bottom:-7%;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);background:linear-gradient(200deg,var(--gold-dim),transparent 92%);opacity:.42}
.gbg .g6{width:clamp(150px,38vw,380px);height:clamp(90px,19vh,200px);left:-3%;top:60%;background:repeating-linear-gradient(135deg,var(--fill) 0 2px,transparent 2px 15px);-webkit-mask-image:linear-gradient(90deg,#000,transparent);mask-image:linear-gradient(90deg,#000,transparent);opacity:.55}
.gbg .g7{width:clamp(120px,30vw,300px);height:clamp(90px,17vh,190px);right:5%;bottom:21%;background:radial-gradient(circle,var(--gold-dim) 2.2px,transparent 2.8px) 0 0/19px 19px;-webkit-mask-image:linear-gradient(270deg,#000,transparent);mask-image:linear-gradient(270deg,#000,transparent);opacity:.55}
.gbg .g8{width:clamp(60px,16vw,150px);aspect-ratio:1;border-radius:50%;left:40%;top:37%;border:3px solid var(--fill-hi);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 62%);opacity:.7}
.gbg .g9{width:clamp(70px,15vw,150px);height:clamp(70px,15vw,150px);right:30%;top:7%;border-radius:0 100% 0 0;background:linear-gradient(225deg,var(--fill),transparent 86%);opacity:.45}
html[data-glass="1"][data-theme="dark"] .gbg .g1{opacity:.20}html[data-glass="1"][data-theme="dark"] .gbg .g2{opacity:.16}html[data-glass="1"][data-theme="dark"] .gbg .g3{opacity:.20}html[data-glass="1"][data-theme="dark"] .gbg .g4{opacity:.20}html[data-glass="1"][data-theme="dark"] .gbg .g5{opacity:.16}html[data-glass="1"][data-theme="dark"] .gbg .g6{opacity:.24}html[data-glass="1"][data-theme="dark"] .gbg .g7{opacity:.24}html[data-glass="1"][data-theme="dark"] .gbg .g8{opacity:.28}html[data-glass="1"][data-theme="dark"] .gbg .g9{opacity:.16}
@media print{.gbg{display:none!important}}

/* v0.1.070 — keterbacaan di atas kaca bening */

html[data-glass="1"] :is(.m-chev,.chev){color:var(--paper-dim)}

.mh-kiri{display:flex;align-items:center;gap:10px;min-width:0;flex:1}

/* Cetak polos laporan (v0.1.074): dokumen #cetak-lap dibuat saat mencetak; warna literal agar tidak ikut tema/kaca */

  #cetak-lap .ct-rinci{font-size:8.5pt}
  #cetak-lap .ct-cat{font-size:8pt;color:#333;margin:5pt 0 0;line-height:1.35}
  #cetak-lap .ct-bc{width:26%}
  #cetak-lap .ct-bar{display:block;height:8pt;border:.7pt solid #000;background:#fff}
  #cetak-lap .ct-bar i{display:block;height:100%;background:#555;-webkit-print-color-adjust:exact;print-color-adjust:exact}

  /* halaman lain yang dicetak langsung: token terang + tanpa kaca walau tema gelap atau Efek kaca aktif */
  html[data-theme="dark"],html[data-theme="dark"][data-scheme]{--ink:#fff;--ink-raised:#fff;--paper:#000;--paper-dim:#333;--paper-faint:#555;--gold:#2f4a1d;--gold-dim:#4e6f35;--gain:#1b5e20;--loss:#b71c1c;--line:#999;--line-soft:#ccc;--fill:#81AE64;--fill-hi:#C7E78B;--on-fill:#1F2A16;--act-bg:#E4F0C8;--act-tx:#1F2A16}
  html[data-glass="1"] section{background:none!important;border:1px solid #999!important;border-radius:6px!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}

}

.dm-kartu.pd-kartu{display:block;overflow-y:auto}

/* v0.1.079 — Laporan satu halaman */
.lap-filter .lap-fl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-faint);margin-top:2px}

.lap-kartu>summary::after{content:'›';position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:20px;line-height:1;color:var(--paper-faint);transition:transform .15s}
.lap-kartu[open]>summary::after{transform:translateY(-50%) rotate(90deg)}
.lap-kartu>summary:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.lk-n{font-weight:600;min-width:0;overflow-wrap:anywhere}.lk-v{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:0 0 auto;font-size:13px}
.lk-isi{padding:0 0 10px}

.lap-det>summary::-webkit-details-marker{display:none}
.lap-det>summary::after{content:'›';margin-left:auto;font-size:20px;color:var(--paper-faint);transition:transform .15s}
.lap-det[open]>summary::after{transform:rotate(90deg)}
.lap-untung>.mu{font-size:12px;letter-spacing:.04em;color:var(--paper-dim)}
.lap-kpi{gap:6px}.lap-kpi b{font-size:12.5px;white-space:nowrap;overflow-wrap:normal}

/* ---------- Layout desktop (v0.1.080) ----------
   Hanya tata letak untuk layar >= 1100px: rail ikon di kiri, header breadcrumb + pill, Beranda sebagai grid dashboard.
   Warna, font, dan gaya kartu tetap memakai token yang ada. Di bawah 1100px tampilan tidak berubah. */
.rail-logo{display:none}
@media (min-width:1100px){
  .wrap{max-width:1560px;margin:0 auto;padding:24px 36px 64px 124px}
  .main-tabs{display:none}
  .fab{right:36px}.fab-dial{right:36px}
  /* rail kiri (memakai #bnav yang sama) */
  .rail-logo{display:flex;position:fixed;left:34px;top:34px;width:48px;height:48px;border-radius:16px;align-items:center;justify-content:center;background:var(--ink);color:var(--gold);z-index:51;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .rail-logo svg{width:26px;height:26px}
  .bottom-nav{display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:10px;left:20px;right:auto;top:20px;bottom:20px;width:76px;padding:96px 12px 16px;border:1px solid var(--line);border-radius:38px;background:var(--fill);overflow:visible}
  .bnav-btn{flex:0 0 auto;width:52px;height:52px;min-width:0;padding:0;border-radius:16px;color:var(--on-fill);justify-content:center;overflow:visible}
  .bottom-nav .bnav-btn{overflow:visible}
  .bnav-btn:hover{background:rgba(255,255,255,.24)}
  .bnav-btn.active{background:var(--ink);color:var(--gold)}
  .bnav-icon{width:22px;height:22px}
  .bnav-btn span{position:absolute;width:1px;height:1px;margin:-1px;max-width:none;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  html[data-glass="1"] .bottom-nav{left:20px;right:auto;top:20px;bottom:20px;width:76px;border-radius:38px;padding:96px 12px 16px;border:1px solid var(--glass-edge)}
  html[data-glass="1"] .bnav-btn{color:var(--paper-dim)}
  html[data-glass="1"] .bnav-btn:hover{background:var(--act-bg)}
  html[data-glass="1"] .bnav-btn.active{background:var(--act-bg);color:var(--act-tx)}
  /* header: breadcrumb kecil di atas judul, tombol dalam pill di kanan */
  header.masthead{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"crumb right" "title right";align-items:center;column-gap:16px;row-gap:2px;padding:4px 0 22px;border-bottom:0}
  .masthead-top{display:contents}
  .updated{grid-area:crumb;margin:0;align-self:end}
  .mh-kiri{grid-area:title;align-self:start}
  .masthead-right{grid-area:right;padding:6px 10px;background:var(--ink-raised);border:1px solid var(--line);border-radius:999px}
  html[data-glass="1"] .masthead-right{background:var(--glass);border-color:var(--glass-edge);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
  .brand{font-size:34px}
  .panel{margin-top:0}
  body:not([data-hal="beranda"]) #app{max-width:1180px}
  /* Beranda: grid dashboard 12 kolom */
  body[data-hal="beranda"] .wrap{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:20px;row-gap:0;align-items:start;align-content:start}
  body[data-hal="beranda"] .wrap>.peringatan{grid-column:1/-1;grid-row:1}
  body[data-hal="beranda"] header.masthead{grid-column:1/-1;grid-row:2}
  body[data-hal="beranda"] #app{display:contents}
  body[data-hal="beranda"] #app>.info-contoh{grid-column:1/-1;grid-row:3;margin:0 0 20px}
  body[data-hal="beranda"] #heroCard{grid-column:1/7;grid-row:4/6;margin:0 0 20px;align-self:stretch;display:flex;flex-direction:column}
  body[data-hal="beranda"] #heroCard .stats{margin-top:auto}
  body[data-hal="beranda"] #heroCard>.hero{margin-bottom:14px}
  body[data-hal="beranda"] #app>[data-bx]{margin:0 0 20px;min-width:0}
  body[data-hal="beranda"] #app>[data-bx="kas"]{grid-column:7/10;grid-row:4}
  body[data-hal="beranda"] #app>[data-bx="banding"]{grid-column:7/10;grid-row:5}
  body[data-hal="beranda"] #app>[data-bx="tx"]{grid-column:10/13;grid-row:4/6;align-self:stretch}
  body[data-hal="beranda"] #app>[data-bx="perhatian"],body[data-hal="beranda"] #app>[data-bx="siklus"]{grid-column:span 6;grid-row:6}
  body[data-hal="beranda"] #app>[data-bx="grafik"]{grid-column:1/-1;grid-row:7}
  /* Grafik Beranda: dua kolom, tinggi grafik dibatasi */
  .dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;align-items:start}
  .dash-grid>.dash{min-width:0}
  .dash-grid>.dash:last-child:nth-child(odd){grid-column:1/-1}
  .dash-grid .dash svg[viewBox="0 0 300 150"]{max-height:250px}
}
/* Desktop sempit (1100–1359px): kolom tengah dan kanan digabung agar kartu tidak terlalu tinggi */
@media (min-width:1100px) and (max-width:1359px){
  body[data-hal="beranda"] #heroCard{grid-column:1/8}
  body[data-hal="beranda"] #app>[data-bx="kas"],body[data-hal="beranda"] #app>[data-bx="banding"]{grid-column:8/13}
  body[data-hal="beranda"] #app>[data-bx="perhatian"],body[data-hal="beranda"] #app>[data-bx="tx"]{grid-column:span 6;grid-row:6;align-self:start}
  body[data-hal="beranda"] #app>[data-bx="siklus"]{grid-column:1/-1;grid-row:7}
  body[data-hal="beranda"] #app>[data-bx="grafik"]{grid-row:8}
}

@media (min-width:1360px){
  body[data-hal="beranda"] #app:not(:has(>[data-bx="kas"]))>[data-bx="tx"]{grid-column:7/13}
}

  body[data-hal="beranda"] .sk-kartu{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:18px 16px 14px;border:1px solid var(--line-soft);border-radius:18px;background:var(--ink);text-align:center}

/* ---------- Layout desktop, Tahap 0-D (v0.1.082): halaman selain Beranda ---------- */
@media screen and (min-width:1100px){

  .sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-top:14px}

  /* Detail siklus: Ringkasan dan Jadwal di kiri, Panen dan Transaksi di kanan */

  /* Transaksi: filter di samping (menempel saat menggulir), hasil di kanan */
  body[data-hal="transaksi"] #app{display:grid;grid-template-columns:minmax(300px,340px) minmax(0,1fr);column-gap:20px;align-items:start}
  body[data-hal="transaksi"] #app>*{grid-column:1}
  body[data-hal="transaksi"] #app>#txHasil{grid-column:2;grid-row:1/span 6}
  body[data-hal="transaksi"] #app>section:first-child{position:sticky;top:20px}
  /* Laporan: ringkasan | banding, tren | komposisi, rincian | simulasi */
  body[data-hal="laporan"] #app{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:20px;align-items:start}
  body[data-hal="laporan"] #app>*{grid-column:1/-1;min-width:0}
  body[data-hal="laporan"] #app>.lap-aksi{grid-row:1}
  body[data-hal="laporan"] #app>.lap-filter{grid-row:2}
  body[data-hal="laporan"] #app>[data-bx="kpi"]{grid-column:1/6;grid-row:3}
  body[data-hal="laporan"] #app>[data-bx="banding"]{grid-column:6/13;grid-row:3}
  body[data-hal="laporan"] #app>[data-bx="tren"]{grid-column:1/8;grid-row:4}
  body[data-hal="laporan"] #app>[data-bx="komp"]{grid-column:8/13;grid-row:4}
  body[data-hal="laporan"] #app>.lap-rinci{grid-column:1/8;grid-row:5}
  body[data-hal="laporan"] #app>.lap-sim{grid-column:8/13;grid-row:5}
  body[data-hal="laporan"] section.dash svg{max-height:340px}
  /* Setelan dan Lainnya: dua kolom */
  body[data-hal="setelan"] #app,body[data-hal="lainnya"] #app{column-count:2;column-gap:20px}
  body[data-hal="setelan"] #app>section,body[data-hal="lainnya"] #app>section{break-inside:avoid;-webkit-column-break-inside:avoid}
}

<script>
/* Buku Kebun — Fase 3–4: laporan, dashboard, cetak laba-rugi, R/C, HPP, BEP, harga jual minimum (v0.1.014) */
const Analisa = {
  dim: 'siklus', per: 'semua',
  PER: [['bulan', 'Bulan ini'], ['tahun', 'Tahun ini'], ['semua', 'Semua']],
  DIM: [['siklus', 'Siklus'], ['komoditas', 'Komoditas'], ['unit', 'Unit']],
  masuk(tgl) {
    if (this.per === 'bulan') return tgl.slice(0, 7) === bulanIni();
    if (this.per === 'tahun') return tgl.slice(0, 4) === bulanIni().slice(0, 4);
    return true;
  },
  kunci(sid) {
    const s = Siklus.cari(sid);
    if (!s) return ['-', 'Tanpa siklus', ''];
    if (this.dim === 'siklus') return [s.id, Siklus.nama(s.id), s.mulai];
    if (this.dim === 'komoditas') { const k = Siklus.kom(s.komoditasId); return [s.komoditasId, k ? k.nama : '?', k ? k.satuan : '']; }
    const u = Siklus.unit(s.unitId); return [s.unitId, u ? u.nama : '?', ''];
  },
  hitung() {
    const g = {}, ambil = (sid) => {
      const [id, nama] = this.kunci(sid);
      return g[id] || (g[id] = { nama, modal: 0, hasil: 0, nonPanen: 0, alat: 0, tetap: 0, vari: 0, qty: 0, sat: new Set() });
    };
    App.aktif().filter((t) => this.masuk(t.tanggal)).forEach((t) => {
      const r = ambil(t.siklusId);
      if (t.jenis === 'masuk') { r.hasil += t.jumlah; if (t.kategoriId === 'jual-bibit' || t.kategoriId === 'subsidi') r.nonPanen += t.jumlah; }
      else { r.modal += t.jumlah; if (t.kategoriId === 'alat') r.alat += t.jumlah; if (t.sifatBiaya === 'tetap') r.tetap += t.jumlah; else r.vari += t.jumlah; }
    });
    Siklus.d().panen.filter((p) => !p.terhapus && this.masuk(p.tanggal)).forEach((p) => {
      const s = Siklus.cari(p.siklusId); if (!s) return;
      const r = ambil(p.siklusId); r.qty += Math.max(0, p.kuantitasKotor - p.susut);
      const k = Siklus.kom(s.komoditasId); if (k && k.satuan) r.sat.add(k.satuan);
    });
    const mg = Math.min(90, Math.max(1, Number(Setelan.get('margin')) || 30)) / 100;
    return Object.values(g).map((r) => {
      r.untung = r.hasil - r.modal;
      r.rc = r.modal ? r.hasil / r.modal : null;
      r.margin = r.hasil ? r.untung / r.hasil : null;
      r.satuan = r.sat.size === 1 ? [...r.sat][0] : 'satuan';
      r.hpp = r.qty ? (r.modal - r.alat) / r.qty : null; // pembelian alat tidak masuk HPP
      r.harga = r.qty && r.hasil - r.nonPanen > 0 ? (r.hasil - r.nonPanen) / r.qty : null; // penjualan bibit dan bantuan tidak ikut
      r.hmin = r.hpp ? r.hpp / (1 - mg) : null;
      const v = r.qty ? r.vari / r.qty : 0;
      r.bep = (r.harga && r.harga > v && r.qty) ? r.tetap / (r.harga - v) : null; // titik impas (satuan)
      r.mg = mg; return r;
    }).sort((a, b) => b.untung - a.untung);
  },
  chip(arr, cur, att) { return '<div class="seg sm" style="justify-content:flex-start;margin:6px 0">' + arr.map((x) => '<button type="button" class="btn' + (cur === x[0] ? ' on' : '') + '" data-' + att + '="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>'; },
  kartu(r, i) {
    const f = (n) => n === null ? '—' : rp(Math.round(n)), u = r.untung >= 0;
    const baris = (a, b) => '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>';
    return '<details class="lap-kartu"><summary><span class="lk-n">' + (i === 0 && r.untung > 0 ? '★ ' : '') + esc(r.nama) + '</span><span class="lk-v"><b class="' + (u ? 'up' : 'down') + '">' + (u ? '+' : '') + rp(r.untung) + '</b><span class="mu">R/C ' + (r.rc === null ? '—' : fmtRC(r.rc)) + '</span></span></summary><div class="lk-isi">' +

      L.map((r, i) => '<tr><td>' + (i === 0 && r.untung > 0 ? '★ ' : '') + esc(r.nama) + '</td>' + n(rp(r.modal)) + n(rp(r.hasil)) + n('<b>' + (r.untung > 0 ? '+' : '') + rp(r.untung) + '</b>') + n(r.rc === null ? '—' : fmtRC(r.rc)) +

  /* Kurva kubik monoton (Fritsch–Butland, ujung pchip): mulus (kemiringan kontinu di tiap titik), melewati semua titik data,

  kurva(P) {
    const n = P.length, f = (v) => (Math.round(v * 100) / 100), M = 'M' + f(P[0][0]) + ' ' + f(P[0][1]);

    for (let i = 0; i < n - 1; i++) { h[i] = (P[i + 1][0] - P[i][0]) || 1e-6; m[i] = (P[i + 1][1] - P[i][1]) / h[i]; }
    const t = new Array(n);
    if (n === 2) { t[0] = t[1] = m[0]; }
    else {
      for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : 3 * (h[i - 1] + h[i]) / ((2 * h[i] + h[i - 1]) / m[i - 1] + (h[i] + 2 * h[i - 1]) / m[i]);

        let d = ((2 * h0 + h1) * m0 - h0 * m1) / (h0 + h1);
        if (d * m0 <= 0) d = 0; else if (m0 * m1 <= 0 && Math.abs(d) > 3 * Math.abs(m0)) d = 3 * m0;

      t[n - 1] = ujung(h[n - 2], h[n - 3], m[n - 2], m[n - 3]);

    }
    return d;
  },
  vGrafik() {

    const mx = Math.max(1, ...T.map((r) => Math.max(r.m, r.h))), tinggi = (v) => Y1 - v / mx * (Y1 - Y0);
    const px = (i) => X0 + (T.length === 1 ? 0 : i * (X1 - X0) / (T.length - 1));
    const H = T.map((r, i) => [px(i), tinggi(r.h)]), M = T.map((r, i) => [px(i), tinggi(r.m)]);
    this._pts = T.map((r, i) => ({ x: px(i), yh: H[i][1], ym: M[i][1], n: r.n + ' ' + r.thn, h: r.h, m: r.m }));

    const kH = this.kurva(H), area = kH + ' L' + X1 + ' ' + Y1 + ' L' + X0 + ' ' + Y1 + ' Z';
    const tot = T.reduce((a, r) => ({ h: a.h + r.h, m: a.m + r.m }), { h: 0, m: 0 }), un = tot.h - tot.m;
    const tabel = '<div class="gulir"><table class="lg-tab"><tr><th>Bulan</th><th>Hasil</th><th>Modal</th><th>Untung</th></tr>' + T.map((r) => '<tr><td>' + r.n + ' ' + r.thn + '</td><td>' + rp(r.h) + '</td><td>' + rp(r.m) + '</td><td class="' + (r.h >= r.m ? 'up' : 'down') + '">' + rp(r.h - r.m) + '</td></tr>').join('') + '</table></div>';
    return '<section class="dash" data-bx="tren"><h2>Tren hasil / modal</h2>' + this.chip([[6, '6 bulan'], [12, '12 bulan']], this.rentang, 'lr') +

      '<div class="lg-wrap"><svg class="lg-svg" viewBox="0 0 ' + W + ' 176" width="100%" role="img" aria-label="Tren hasil dan modal"><defs><linearGradient id="lgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--fill)" stop-opacity=".45"/><stop offset="1" stop-color="var(--fill)" stop-opacity="0"/></linearGradient></defs>' +
      grid + '<path d="' + area + '" fill="url(#lgA)"/><path d="' + kH + '" fill="none" stroke="var(--fill)" stroke-width="2.2" stroke-linecap="round"/><path d="' + this.kurva(M) + '" fill="none" stroke="var(--loss)" stroke-width="2.2" stroke-linecap="round"/>' + sumbu +
      '<line class="lg-x" y1="' + Y0 + '" y2="' + Y1 + '" stroke="var(--paper-faint)" stroke-dasharray="2 3" visibility="hidden"/><circle class="lg-dh" r="3.6" fill="var(--fill)" stroke="var(--ink)" visibility="hidden"/><circle class="lg-dm" r="3.6" fill="var(--loss)" stroke="var(--ink)" visibility="hidden"/></svg><div class="lg-tip" hidden></div></div>' +
      '<p class="note lg-leg"><span style="color:var(--fill)">●</span> Hasil &nbsp; <span style="color:var(--loss)">●</span> Modal · sentuh grafik untuk melihat angka</p>' +
      '<details class="lg-detail"><summary>Tabel angka grafik</summary>' + tabel + '</details></section>';

  sentuh(e) {

    App.go('laporan', true); return true;
  }
};

</script>
<script>
/* Buku Kebun — Fase 5: anggaran, arus kas, aset, utang/piutang (v0.1.015; tombol Bayar dan cicilan v0.1.049; semua isian lewat modal FAB v0.1.055) */

<script>
/* Buku Kebun — cadangan otomatis di browser (v0.1.019) */

      (a.length ? '<button type="button" class="btn danger" data-cad="hapus">Hapus semua cadangan</button>' : '') + '</div>';
  }

  function konfirmasi(tombol, kunci, teks, jalan) {

    tx(null, 175, 'keluar', 'alat', 380000, 'Pompa air 125 W'); tx(null, 140, 'keluar', 'alat', 150000, 'Sprayer 2 liter'); tx(null, 100, 'keluar', 'alat', 85000, 'Timbangan digital');
    tx(null, 2, 'keluar', 'alat', 60000, 'Gunting panen'); tx(s4, 0, 'keluar', 'kemasan', 25000, 'Plastik klip'); tx(s5, 1, 'keluar', 'pestisida', 35000, 'Pestisida nabati');
    tx(null, 150, 'masuk', 'subsidi', 300000, 'Bantuan pupuk dari kelompok tani'); tx(null, 50, 'masuk', 'jual-bibit', 150000, 'Bibit cabai 30 polybag');

  banner() {
    if (!this.ada()) return '';
    return '<section class="info-contoh"><div class="ic-row"><div><strong>Data contoh</strong><div class="note">Tiruan untuk mencoba fitur. Catatan Anda tidak ikut terhapus.</div></div>' +
      '<button type="button" class="btn" data-do="hapus-contoh">Hapus</button></div></section>';
  },
  hapus(el) {

    const D = App.data, sisaSik = new Set(D.siklus.filter((s) => s.contoh).map((s) => s.id));
    ['unit', 'komoditas', 'siklus', 'aset', 'utang'].forEach((k) => { D[k] = D[k].filter((x) => !x.contoh); });
    D.panen = D.panen.filter((p) => !p.contoh && !sisaSik.has(p.siklusId));
    D.jurnal = (D.jurnal || []).filter((j) => !j.contoh && !sisaSik.has(j.siklusId));
    D.transaksi = D.transaksi.filter((t) => !t.contoh);
    D.transaksi.forEach((t) => { if (t.siklusId && sisaSik.has(t.siklusId)) { t.siklusId = null; t.diubah = nowIso(); } });
    if (D.pengaturan.saldoAwalContoh) { D.pengaturan.saldoAwal = 0; delete D.pengaturan.saldoAwalContoh; }
    App.simpan(); App.go(App.tab, true); App.toast('Data contoh dihapus');
  }
};

<script>
/* Buku Kebun — geser ke kiri untuk hapus transaksi, dengan Urungkan (v0.1.032) */
const Geser = {
  r: null, x0: 0, y0: 0, dx: 0, arah: '', baru: 0,
  tutup() { document.querySelectorAll('.tx.geser').forEach((e) => { e.classList.remove('geser'); e.style.transform = ''; }); },
  hapus(id) {
    const t = App.data.transaksi.find((x) => x.id === id); if (!t || t.terhapus) return;
    if (Utang.tahan(t)) { this.tutup(); return; }
    t.terhapus = true; t.diubah = nowIso(); Utang.ikut(t, true); App.simpan(); App.go(App.tab, true);
    App.toast('Transaksi dihapus', { label: 'Urungkan', fn: () => { t.terhapus = false; t.diubah = nowIso(); Utang.ikut(t, false); App.simpan(); App.go(App.tab, true); } });
  },
  mulai(e) {
    const r = e.target.closest && e.target.closest('.tx[data-edit]');
    if (!r || e.target.closest('.tx-hapus')) { if (!(e.target.closest && e.target.closest('.tx-hapus'))) this.tutup(); this.r = null; return; }
    if (!r.classList.contains('geser')) this.tutup();
    if (!r.querySelector('.tx-hapus')) { const b = document.createElement('button'); b.type = 'button'; b.className = 'tx-hapus'; b.dataset.hapus = r.dataset.edit; b.textContent = 'Hapus'; r.appendChild(b); }
    const p = e.touches[0]; this.r = r; this.x0 = p.clientX; this.y0 = p.clientY; this.dx = 0; this.arah = ''; this.awal = r.classList.contains('geser') ? -96 : 0;
  },
  gerak(e) {
    if (!this.r) return; const p = e.touches[0], dx = p.clientX - this.x0, dy = p.clientY - this.y0;
    if (!this.arah && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) this.arah = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    if (this.arah !== 'h') return;
    this.dx = dx; this.r.classList.add('menggeser'); this.r.style.transition = 'none';
    this.r.style.transform = 'translateX(' + Math.min(0, Math.max(-96, this.awal + dx)) + 'px)';
  },
  selesai() {
    const r = this.r; if (!r) return; this.r = null;
    r.style.transition = ''; r.classList.remove('menggeser');
    if (this.arah === 'h') { this.baru = Date.now(); const buka = this.awal + this.dx < -48; r.classList.toggle('geser', buka); r.style.transform = ''; }
  }
};
document.addEventListener('touchstart', (e) => Geser.mulai(e), { passive: true });
document.addEventListener('touchmove', (e) => Geser.gerak(e), { passive: true });
document.addEventListener('touchend', () => Geser.selesai());
document.addEventListener('touchcancel', () => Geser.selesai());
document.addEventListener('click', (e) => {
  const h = e.target.closest && e.target.closest('.tx-hapus'); if (h) { e.stopPropagation(); Geser.hapus(h.dataset.hapus); return; }
  const r = e.target.closest && e.target.closest('.tx.geser');
  if (Date.now() - Geser.baru < 350 || r) { e.stopPropagation(); e.preventDefault(); if (r) Geser.tutup(); }
}, true);

</script>

<script>
/* Buku Kebun — pembayaran Tunai / Belum dibayar / Sebagian, tombol Bayar + cicilan, dan perhitungan kas (v0.1.049, docs/UTANG.md)
   Transaksi selalu menyimpan nilai penuh (untung, HPP, laporan memakai nilai ini).
   Bagian yang belum dibayar menjadi catatan utang/piutang tertaut (utang.transaksiId); pembayarannya di utang.bayar.
   Kas = bagian tunai transaksi + pembayaran utang/piutang, bukan jumlah semua transaksi. */
const Utang = {
  MODE: [['tunai', 'Tunai (lunas)'], ['belum', 'Belum dibayar'], ['sebagian', 'Sebagian dibayar']],
  d0() { return { bayar: 'tunai', muka: 0, pihak: '', tempo: '', kunci: false }; },
  semua(t) { return App.data.utang.filter((u) => u.transaksiId === t.id); },
  tertaut(t) { return App.data.utang.find((u) => u.transaksiId === t.id && !u.terhapus) || null; },
  dibayar(u) { return (u.bayar || []).reduce((a, p) => a + p.jumlah, 0); },
  sisa(u) { return u.transaksiId ? Math.max(0, u.jumlah - this.dibayar(u)) : (u.lunas ? 0 : u.jumlah); },
  ada(u) { return !!(u.bayar && u.bayar.length); },
  /* isi draft form dari utang tertaut (mode, uang muka, pihak, tempo, terkunci bila sudah ada pembayaran) */
  dari(t) {
    const u = this.tertaut(t); if (!u) return this.d0();
    const muka = Math.max(0, t.jumlah - u.jumlah);
    return { bayar: muka > 0 ? 'sebagian' : 'belum', muka, pihak: u.pihak || '', tempo: u.jatuhTempo || '', kunci: this.ada(u) };
  },
  /* periksa isian pembayaran; kembalikan pesan galat atau '' */
  cek(jumlah, s, u) {
    if (s.kunci) return u && jumlah < u.jumlah ? 'Jumlah tidak boleh lebih kecil dari utang yang tercatat (' + rp(u.jumlah) + ')' : '';
    if (s.bayar === 'tunai') return '';
    if (!String(s.pihak || '').trim()) return 'Isi nama pihak (pemasok atau pembeli)';
    if (s.bayar === 'sebagian' && !(s.muka > 0 && s.muka < jumlah)) return 'Uang muka harus lebih dari 0 dan kurang dari jumlah';
    return '';
  },
  /* samakan catatan utang dengan transaksi t setelah disimpan */
  sinkron(t, s) {
    const D = App.data, u = this.tertaut(t), jenis = t.jenis === 'keluar' ? 'utang' : 'piutang';
    if (s.kunci && u) { u.jenis = jenis; u.diubah = nowIso(); return; }
    const sisa = s.bayar === 'tunai' ? 0 : s.bayar === 'belum' ? t.jumlah : t.jumlah - s.muka;
    if (sisa > 0) {
      const f = { jenis, pihak: String(s.pihak).trim(), jumlah: sisa, jatuhTempo: s.tempo || '', lunas: false, diubah: nowIso() };
      const lama = u || this.semua(t).find((x) => x.terhapus && !this.ada(x)); // pulihkan catatan lama agar tidak kembar
      if (lama) Object.assign(lama, f, { terhapus: false });
      else D.utang.push(Object.assign({ id: uid('u'), transaksiId: t.id, bayar: [], dibuat: nowIso(), terhapus: false }, f));
    } else if (u) { u.terhapus = true; u.diubah = nowIso(); }
  },
  /* hapus/pulihkan utang tertaut bersama transaksinya */
  ikut(t, hapus) { this.semua(t).forEach((u) => { u.terhapus = hapus; u.diubah = nowIso(); }); },
  /* utang tertaut yang sudah ada pembayarannya menahan penghapusan transaksi */
  tahan(t) {
    const u = this.tertaut(t);
    if (u && this.ada(u)) { App.toast('Sudah ada pembayaran — buka lagi dulu di Rencana → Utang/piutang'); return true; }
    return false;
  },
  /* ---------- pembayaran / cicilan (tahap 2, v0.1.049) ----------
     Pembayaran = { id, tanggal, jumlah } di utang.bayar. Hanya menggerakkan kas, bukan transaksi Modal/Hasil baru.
     Lunas otomatis saat sisa nol; hapus pembayaran membuka lagi. */
  tx(u) { return App.data.transaksi.find((x) => x.id === u.transaksiId) || null; },
  segar(u) { u.lunas = this.sisa(u) <= 0; u.diubah = nowIso(); },
  /* tanggal bayar paling akhir yang boleh (hari ini, atau tanggal transaksi bila di masa depan) */
  tglMaks(u) { const t = this.tx(u), h = isoHari(); return t && t.tanggal > h ? t.tanggal : h; },
  /* periksa isian pembayaran; kembalikan pesan galat atau '' */
  cekBayar(u, jumlah, tgl) {
    const t = this.tx(u), sisa = this.sisa(u);
    if (!(jumlah > 0)) return 'Isi jumlah pembayaran lebih dari 0';
    if (jumlah > sisa) return 'Jumlah melebihi sisa (' + rp(sisa) + ')';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl || '')) return 'Isi tanggal bayar';
    if (t && tgl < t.tanggal) return 'Tanggal bayar sebelum tanggal transaksi (' + Setelan.tgl(t.tanggal) + ')';
    if (tgl > this.tglMaks(u)) return 'Tanggal bayar tidak boleh di masa depan';
    return '';
  },
  catatBayar(u, jumlah, tgl) {
    (u.bayar = u.bayar || []).push({ id: uid('b'), tanggal: tgl, jumlah: jumlah });
    u.bayar.sort((a, b) => String(a.tanggal).localeCompare(b.tanggal));
    this.segar(u);
  },
  /* hapus satu pembayaran; kembalikan catatannya agar bisa dipulihkan lewat Urungkan */
  hapusBayar(u, bid) {
    const i = (u.bayar || []).findIndex((p) => p.id === bid); if (i < 0) return null;
    const rec = u.bayar.splice(i, 1)[0]; this.segar(u); return rec;
  },
  pulihBayar(u, rec) {
    (u.bayar = u.bayar || []).push(rec); u.bayar.sort((a, b) => String(a.tanggal).localeCompare(b.tanggal)); this.segar(u);
  },

  /* ---------- jendela Bayar ---------- */
  dlg: null,
  dlgBuka(u) {
    const t = this.tx(u); if (Modal.m || !t || this.sisa(u) <= 0) return;
    const sisa = this.sisa(u), byr = this.dibayar(u), keluar = u.jenis === 'utang';
    const row = (a, b) => '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>';
    this.dlg = { id: u.id };
    Modal.buka({
      judulId: 'ubJudul', fokus: 'ub_jumlah', tutupLatar: false,
      html: '<div class="dm-kepala"><div><div class="dm-jenis">' + (keluar ? 'Bayar utang' : 'Terima pembayaran piutang') + '</div><h2 class="dm-judul" id="ubJudul">' + esc(u.pihak) + '</h2></div>' +
        '<button type="button" class="dm-x" data-ub="tutup" aria-label="Tutup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
        '<div class="dm-isi">' + row('Jumlah ' + u.jenis, rp(u.jumlah)) + (byr ? row('Sudah dibayar', rp(byr)) : '') + row('Sisa', '<strong>' + rp(sisa) + '</strong>') +
        '<label for="ub_jumlah">' + (keluar ? 'Dibayar sekarang (Rp)' : 'Diterima sekarang (Rp)') + '</label><input id="ub_jumlah" data-rp inputmode="numeric" autocomplete="off" placeholder="0" value="' + fmtInput(sisa) + '">' +
        '<div class="seg sm" style="justify-content:flex-start;margin-top:8px"><button type="button" class="btn" data-ub="semua">Semua sisa</button></div>' +
        '<label for="ub_tgl">Tanggal ' + (keluar ? 'bayar' : 'terima') + '</label><input type="date" id="ub_tgl" min="' + esc(t.tanggal) + '" max="' + esc(this.tglMaks(u)) + '" value="' + esc(this.tglMaks(u)) + '">' +
        '<p class="note" style="margin-top:8px">Bisa dicicil: isi sebagian saja, sisanya tetap tercatat. Pembayaran hanya menggerakkan kas, tidak mengubah untung atau HPP.</p></div>' +
        '<div class="dm-aksi"><button type="button" class="btn gold" data-ub="simpan">Simpan pembayaran</button><button type="button" class="btn" data-ub="tutup" style="width:100%">Batal</button></div>',
      klik: (e) => {
        const b = e.target.closest('[data-ub]'); if (!b) return; const a = b.dataset.ub;
        if (a === 'tutup') Modal.tutup();
        else if (a === 'semua') { const i = document.getElementById('ub_jumlah'); i.value = fmtInput(this.sisa(u)); i.focus(); }
        else if (a === 'simpan') this.dlgSimpan(u);
      },
      simpan: () => this.dlgSimpan(u),
      onTutup: () => { this.dlg = null; }
    });
  },
  dlgTutup(tanpaFokus) { Modal.tutup(tanpaFokus); },
  dlgSimpan(u) {
    const g = (i) => document.getElementById(i).value, j = angka(g('ub_jumlah')), tgl = g('ub_tgl'), gal = this.cekBayar(u, j, tgl);
    if (gal) { Modal.galat(gal); return; }
    this.catatBayar(u, j, tgl);
    const sisa = this.sisa(u);
    Modal.tutup(true); App.simpan(); App.go('rencana', true); Modal.pulihFokus();
    App.toast(sisa <= 0 ? 'Pembayaran tersimpan — lunas' : 'Pembayaran tersimpan — sisa ' + rp(sisa));
  },

  /* ---------- kas: uang yang benar-benar bergerak ---------- */
  peristiwa() {
    const out = [];
    App.aktif().forEach((t) => {
      const u = this.tertaut(t), tunai = t.jumlah - (u ? Math.min(u.jumlah, t.jumlah) : 0);
      out.push({ tgl: t.tanggal, n: (t.jenis === 'masuk' ? 1 : -1) * tunai });
      if (u) (u.bayar || []).forEach((p) => out.push({ tgl: p.tanggal, n: (u.jenis === 'piutang' ? 1 : -1) * p.jumlah }));
    });
    return out;
  },
  saldoAwal() { return Number(App.data.pengaturan.saldoAwal) || 0; },
  saldo() { return this.saldoAwal() + this.peristiwa().reduce((a, e) => a + e.n, 0); },
  saldoSd(k) { return this.saldoAwal() + this.peristiwa().filter((e) => e.tgl.slice(0, 7) <= k).reduce((a, e) => a + e.n, 0); },
  net(k) { return this.peristiwa().filter((e) => e.tgl.slice(0, 7) === k).reduce((a, e) => a + e.n, 0); },

  /* ---------- tampilan: kotak pembayaran di form ---------- */
  /* pre: awalan id ('f' atau 'p'); pihakId: id isian pihak yang sudah ada di form (panen: p_pembeli) atau '' bila perlu isian pihak sendiri */
  kotak(s, pre, lbPihak, pihakId) {
    if (s.kunci) return '<p class="note" style="margin-top:12px">Utang/piutang transaksi ini sudah ada pembayarannya. Ubah lewat Rencana → Utang/piutang (Buka lagi) bila perlu.</p>';
    const o = this.MODE.map((m) => '<option value="' + m[0] + '"' + (s.bayar === m[0] ? ' selected' : '') + '>' + m[1] + '</option>').join('');
    let h = '<label for="' + pre + '_bayar">Pembayaran</label><select id="' + pre + '_bayar">' + o + '</select>';
    if (s.bayar === 'tunai') return h;
    if (s.bayar === 'sebagian') h += '<label for="' + pre + '_muka">Dibayar di muka (Rp)</label><input id="' + pre + '_muka" data-rp inputmode="numeric" autocomplete="off" placeholder="0" value="' + fmtInput(s.muka) + '">';
    if (!pihakId) h += '<label for="' + pre + '_pihak">' + lbPihak + '</label><input id="' + pre + '_pihak" maxlength="60" value="' + esc(s.pihak) + '">';
    h += '<label for="' + pre + '_tempo">Jatuh tempo (opsional)</label><input type="date" id="' + pre + '_tempo" value="' + esc(s.tempo) + '">';
    return h + '<p class="note" style="margin-top:8px">Nilai penuh tetap dihitung di untung dan HPP. Kas hanya berubah sebesar yang dibayar. Sisanya masuk Rencana → Utang/piutang.</p>';
  },
  /* baca isian kotak dari form ke objek s (nilai lama dipertahankan bila elemen tidak ada) */
  baca(s, pre) {
    const g = (i) => document.getElementById(pre + '_' + i);
    if (g('bayar')) s.bayar = g('bayar').value;
    if (g('muka')) s.muka = angka(g('muka').value); else if (s.bayar !== 'sebagian') s.muka = 0;
    if (g('pihak')) s.pihak = g('pihak').value;
    if (g('tempo')) s.tempo = g('tempo').value;
    return s;
  }
};

</script>
<script>
/* Buku Kebun — rute web: tiap halaman punya alamat #nama yang bisa dibuka langsung, dimuat ulang, dan dibagikan (v0.1.077, docs/RUTE.md)
   Hanya "#nama" dengan huruf, angka, dan tanda hubung (tanpa "#/jalur"), supaya cocok dengan penampil artefak dan hosting statis.
   Halaman tetap dikelola App.go; modul ini hanya menerjemahkan keadaan aplikasi ke hash dan sebaliknya. */
const Rute = {
  nid(id) { return String(id).replace(/_/g, '-'); },
  aman(id) { return /^[A-Za-z0-9_-]+$/.test(String(id)); },
  cari(arr, n) { return arr.find((x) => !x.terhapus && this.aman(x.id) && this.nid(x.id) === n) || null; },

  /* keadaan aplikasi saat ini → nama rute (tanpa tanda #) */
  hash() {
    const t = App.tab;
    if (t === 'laporan') return 'laporan';
    if (t === 'rencana') return 'rencana-' + Rencana.sub;
    if (t === 'master') return Siklus.msub === 'kom' ? 'komoditas' : 'unit';
    if (t === 'siklus') return Siklus.sub && Siklus.sub !== 'berjalan' ? 'siklus-' + Siklus.sub : 'siklus';
    if (t === 'siklus-detail' || t === 'siklus-form' || t === 'panen') {
      const id = t === 'siklus-form' && Siklus.sf && !Siklus.sf.id ? '' : Siklus.sid;
      if (t === 'siklus-form' && !id) return 'siklus-baru';
      if (!id || !this.aman(id)) return 'siklus';
      return (t === 'panen' && Siklus.pd && !Siklus.pd.id ? 'panen-' : 'siklus-') + this.nid(id);
    }
    if (t === 'jurnal') { const id = Siklus.sid; return id && this.aman(id) ? 'jurnal-' + this.nid(id) : 'siklus'; }
    if (t === 'catat') {
      const d = App.draft; if (!d) return 'transaksi';
      return d.id && this.aman(d.id) ? 'transaksi-' + this.nid(d.id) : 'catat-' + (d.jenis === 'masuk' ? 'hasil' : 'modal');
    }
    return t || 'beranda';
  },

  /* nama rute → membuka halaman; true bila dikenali */
  buka(h) {
    h = String(h || '').replace(/^#/, '');
    if (!h) return false;
    const D = App.data, tetap = ['beranda', 'transaksi', 'lainnya', 'setelan', 'laporan'];
    if (tetap.includes(h)) { App.go(h); return true; }
    let m;
    if ((m = /^laporan-(grafik|rincian)$/.exec(h))) { App.go('laporan'); return true; } // alamat lama (sub-tab) → satu halaman
    if ((m = /^rencana-(\w+)$/.exec(h)) && Rencana.SUB.some((x) => x[0] === m[1])) { Rencana.sub = m[1]; App.go('rencana'); return true; }
    if (h === 'unit' || h === 'komoditas') { Siklus.msub = h === 'unit' ? 'unit' : 'kom'; App.go('master'); return true; }
    if (h === 'siklus') { Siklus.sub = 'berjalan'; App.go('siklus'); return true; }
    if (h === 'siklus-selesai' || h === 'siklus-agenda' || h === 'siklus-jurnal') { Siklus.sub = h.slice(7); App.go('siklus'); return true; }
    if (h === 'siklus-baru') { Siklus.sf = Siklus.sfBaru(); App.go('siklus-form'); return true; }
    if (h === 'catat-modal' || h === 'catat-hasil') { App.draft = { jenis: h === 'catat-hasil' ? 'masuk' : 'keluar' }; App.baru(); return true; }
    if ((m = /^jurnal-(.+)$/.exec(h))) { const s = this.cari(D.siklus, m[1]); if (s) { Siklus.sid = s.id; App.go('jurnal'); return true; } }
    if ((m = /^siklus-(.+)$/.exec(h))) { const s = this.cari(D.siklus, m[1]); if (s) { Siklus.sid = s.id; App.go('siklus-detail'); return true; } }
    if ((m = /^panen-(.+)$/.exec(h))) {
      const s = this.cari(D.siklus, m[1]);
      if (s) { Siklus.sid = s.id; if (s.status === 'berjalan') Siklus.aksi('catat-panen', { dataset: {} }); else App.go('siklus-detail'); return true; }
    }
    if ((m = /^transaksi-(.+)$/.exec(h))) { const t = this.cari(D.transaksi, m[1]); if (t) { App.ubahTx(t.id); return true; } }
    return false;
  },

  /* dipanggil App.go setelah halaman tergambar: samakan alamat di bilah alamat tanpa menambah riwayat */
  sinkron() {
    const h = '#' + this.hash();
    if (location.hash === h) return;
    try { history.replaceState(history.state, '', h); } catch (e) { /* alamat tidak bisa diubah (mis. dibuka dalam bingkai) */ }
  },

  /* halaman pertama: ikuti alamat bila dikenali, kalau tidak Beranda */
  awal() {
    let ok = false;
    try { ok = this.buka(location.hash); } catch (e) { ok = false; }
    if (!ok) App.go('beranda');
  },

  /* alamat diubah dari luar (tempel tautan, ubah manual) tanpa lewat riwayat aplikasi */
  pasang() {
    window.addEventListener('hashchange', () => {
      if (Modal.m || location.hash === '#' + this.hash()) return;
      if (!this.buka(location.hash)) this.sinkron();
    });
  }
};

<script>
/* Buku Kebun — jadwal kegiatan per siklus: pupuk, semprot, dsb., sekali atau berulang (v0.1.051, docs/JADWAL.md)
   Disimpan di siklus.jadwal = [{ id, nama, tanggal, ulang, selesai, terakhir }]; ulang = tiap N hari (0 = sekali). */
const Jadwal = {
  tambahHari(iso, n) { const [y, m, d] = iso.split('-').map(Number); return isoHari(new Date(y, m - 1, d + n)); },
  selisih(iso) { const [y, m, d] = iso.split('-').map(Number), n = new Date(); return Math.round((new Date(y, m - 1, d) - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5); },
  daftar(s) { return (s.jadwal || []).slice().sort((a, b) => (!!a.selesai - !!b.selesai) || String(a.tanggal).localeCompare(b.tanggal)); },
  /* teks status: lewat / hari ini / sekian hari lagi */
  teksN(n) { return n < 0 ? 'lewat ' + (-n) + ' hari' : n === 0 ? 'hari ini' : n + ' hari lagi'; },
  teks(j) { return this.teksN(this.selisih(j.tanggal)); },
  /* Agenda lintas siklus (v0.1.068): kegiatan belum selesai + perkiraan panen dari siklus berjalan, urut dari yang terdekat */
  itemAgenda(daftar) {
    const out = [];
    daftar.filter((s) => s.status === 'berjalan').forEach((s) => {
      (s.jadwal || []).filter((j) => !j.selesai).forEach((j) => out.push({ tipe: 'kegiatan', s: s, j: j, tgl: j.tanggal, n: this.selisih(j.tanggal) }));
      const pp = Siklus.panenPerkiraan(s); if (pp) out.push({ tipe: 'panen', s: s, tgl: pp.tgl, n: pp.sisa });
    });
    return out.sort((a, b) => a.n - b.n || (a.tipe === b.tipe ? 0 : a.tipe === 'kegiatan' ? -1 : 1) || Siklus.nama(a.s.id).localeCompare(Siklus.nama(b.s.id)));
  },
  GRUP: [['Terlambat', (n) => n < 0], ['Hari ini', (n) => n === 0], ['7 hari ke depan', (n) => n >= 1 && n <= 7], ['8–30 hari ke depan', (n) => n >= 8 && n <= 30], ['Lebih dari 30 hari', (n) => n > 30]],
  agenda(daftar) {
    const L = this.itemAgenda(daftar);
    if (!L.length) return '<p class="note" style="margin-top:14px">Belum ada kegiatan terjadwal atau perkiraan panen. Buka siklus berjalan, lalu ketuk tombol + dan pilih Tambah jadwal kegiatan. Perkiraan panen muncul bila komoditas punya umur panen.</p>';
    return '<p class="note" style="margin-top:12px">Kegiatan dan perkiraan panen dari semua siklus berjalan. Ketuk baris untuk membuka siklusnya; ✓ menandai kegiatan sudah dikerjakan.</p>' +
      this.GRUP.map((g) => {
        const isi = L.filter((x) => g[1](x.n)); if (!isi.length) return '';
        return '<h2 class="ag-grup' + (g[0] === 'Terlambat' ? ' down' : '') + '">' + g[0] + ' (' + isi.length + ')</h2>' + isi.map((x) => {
          const status = '<span class="' + (x.n < 0 ? 'down' : '') + '">' + this.teksN(x.n) + '</span>';
          const judul = x.tipe === 'panen' ? 'Perkiraan panen' : esc(x.j.nama);
          const ket = esc(Siklus.nama(x.s.id)) + (Tahap.ringkas(x.s) ? ' · ' + esc(Tahap.ringkas(x.s)) : '') + ' · ' + Setelan.tgl(x.tgl) + ' · ' + status + (x.tipe === 'kegiatan' && x.j.ulang > 0 ? ' · tiap ' + x.j.ulang + ' hari' : '');
          return '<div class="ag-row"><button type="button" class="ag-main" data-do="buka-siklus" data-id="' + x.s.id + '" aria-label="' + (x.tipe === 'panen' ? 'Perkiraan panen ' : 'Kegiatan ' + esc(x.j.nama) + ', ') + esc(Siklus.nama(x.s.id)) + ', ' + this.teksN(x.n) + '. Buka siklus"><strong>' + (x.tipe === 'panen' ? '🌾 ' : '') + judul + '</strong><span class="note">' + ket + '</span></button>' +
            (x.tipe === 'kegiatan' ? '<button type="button" class="btn ag-ok" data-do="agenda-selesai" data-sid="' + x.s.id + '" data-id="' + x.j.id + '" aria-label="Tandai sudah dikerjakan: ' + esc(x.j.nama) + ', ' + esc(Siklus.nama(x.s.id)) + '">✓</button>' : '') + '</div>';
        }).join('');
      }).join('');
  },
  /* kegiatan yang perlu diingatkan di Beranda: siklus berjalan, belum selesai, jatuh tempo dalam 3 hari atau sudah lewat */
  mendekat() {
    const out = [];
    Siklus.daftar().filter((s) => s.status === 'berjalan').forEach((s) => (s.jadwal || []).filter((j) => !j.selesai && this.selisih(j.tanggal) <= 3).forEach((j) => out.push({ s: s, j: j, n: this.selisih(j.tanggal) })));
    return out.sort((a, b) => a.n - b.n);
  },
  v(s) {
    const jalan = s.status === 'berjalan', L = this.daftar(s);
    if (!jalan && !L.length) return '';
    const baris = (j) => { const n = this.selisih(j.tanggal), telat = !j.selesai && n < 0;
      return '<button type="button" class="ang-baris" style="opacity:' + (j.selesai ? '.55' : '1') + '" data-do="jadwal-detail" data-id="' + j.id + '" aria-haspopup="dialog" aria-label="Detail kegiatan ' + esc(j.nama) + '"><div class="bar-top"><strong>' + esc(j.nama) + '</strong><span class="' + (telat ? 'down' : 'mu') + '">' + (j.selesai ? 'selesai' : this.teks(j)) + '</span></div>' +
        '<div class="note">' + (j.selesai ? 'Selesai ' + Setelan.tgl(j.terakhir || j.tanggal) : Setelan.tgl(j.tanggal)) + (j.ulang > 0 ? ' · tiap ' + j.ulang + ' hari' : ' · sekali') + (j.terakhir && !j.selesai ? ' · terakhir ' + Setelan.tgl(j.terakhir) : '') + '</div></button>'; };
    const aktif = L.filter((j) => !j.selesai), beres = L.filter((j) => j.selesai);
    return '<section><h2>Jadwal kegiatan</h2>' + (aktif.length ? aktif.map(baris).join('') : '<p class="note">' + (L.length ? 'Tidak ada kegiatan yang menunggu.' : 'Belum ada jadwal.' + (jalan ? ' Ketuk tombol + untuk menambah pengingat pupuk, semprot, atau kegiatan lain.' : '')) + '</p>') +
      (beres.length ? '<details class="lg-detail"><summary>Sudah selesai (' + beres.length + ')</summary>' + beres.map(baris).join('') + '</details>' : '') + (L.length ? '<p class="note">Ketuk kegiatan untuk detail' + (jalan ? ', mengubah, atau menghapus' : '') + '.</p>' : '') + '</section>';
  },
  aksi(a, el) {
    if (a === 'agenda-selesai') { // dari Agenda: tetap di daftar siklus, tanpa membuka detail
      const lama = Siklus.sid; Siklus.sid = el.dataset.sid; this.dariAgenda = true;
      try { this.aksi('jadwal-selesai', el); } finally { this.dariAgenda = false; Siklus.sid = lama; }
      return true;
    }
    if (!/^jadwal-/.test(a)) return false;
    const s = Siklus.cari(Siklus.sid); if (!s) return true;
    const rute = this.dariAgenda ? 'siklus' : 'siklus-detail';
    const simpan = () => { s.diubah = nowIso(); App.simpan(); App.go(rute, true); };
    const j = (s.jadwal || []).find((x) => x.id === el.dataset.id); if (!j) return true;
    if (a === 'jadwal-selesai') {
      const lama = JSON.stringify(j), hari = isoHari();
      j.terakhir = hari;
      if (j.ulang > 0) j.tanggal = this.tambahHari(hari, j.ulang); else j.selesai = true;
      /* riwayat kegiatan (v0.1.089): satu entri jurnal jenis 'kegiatan' per penandaan; Urungkan ikut menghapusnya */
      const n = nowIso(), rk = { id: uid('jr'), siklusId: s.id, tanggal: hari < s.mulai ? s.mulai : hari, jenis: 'kegiatan', judul: j.nama, isi: '', dibuat: n, diubah: n, terhapus: false };
      Jurnal.semua().push(rk);
      simpan();
      App.toast(j.selesai ? 'Kegiatan selesai' : 'Dijadwalkan lagi ' + Setelan.tgl(j.tanggal), [{ label: 'Urungkan', fn: () => { Object.assign(j, JSON.parse(lama)); const i = Jurnal.semua().indexOf(rk); if (i >= 0) Jurnal.semua().splice(i, 1); s.diubah = nowIso(); App.simpan(); App.go(rute, true); } },
        { label: 'Tambah catatan', fn: () => { Siklus.sid = s.id; Rencana.dlgBuka('jurnal', rk.id); } }]); /* v0.1.100 */
    } else if (a === 'jadwal-hapus') {
      const i = s.jadwal.indexOf(j); s.jadwal.splice(i, 1); simpan();
      App.toast('Kegiatan dihapus', { label: 'Urungkan', fn: () => { s.jadwal.splice(i, 0, j); s.diubah = nowIso(); App.simpan(); App.go(rute, true); } });
    }
    return true;
  }
};

</script>
<script>
/* Buku Kebun — modal detail Jadwal kegiatan dan Panen di detail siklus (v0.1.060)
   Memakai mesin modal Rencana (Rencana.dlgBuka); entri didaftarkan ke Rencana.FORM. Dokumen: docs/JADWAL.md, docs/SIKLUS.md */
const Dsk = {
  aksi(a, el) {
    if (a === 'panen-detail') { Rencana.dlgBuka('panenDetail', el.dataset.id); return true; }
    if (a === 'jadwal-detail') { Rencana.dlgBuka('jadwalDetail', el.dataset.id); return true; }
    return false;
  },
  jd(id) { const s = Siklus.cari(Siklus.sid); return s ? (s.jadwal || []).find((j) => j.id === id) || null : null; },
  pn(id) { return Siklus.d().panen.find((p) => p.id === id && !p.terhapus) || null; }
};
Object.assign(Rencana.FORM, {
  jadwal: { jenis: 'Jadwal kegiatan', judul: 'Tambah kegiatan', judulUbah: 'Ubah kegiatan', simpan: 'Simpan kegiatan', tab: 'siklus-detail', fokus: 'rm_jn',
    isi() { return Rencana.lab('rm_jn', 'Kegiatan', '<input id="rm_jn" maxlength="60" autocomplete="off" placeholder="mis. Pupuk NPK, semprot hama">') +
      Rencana.lab('rm_jt', 'Tanggal', '<input type="date" id="rm_jt" value="' + isoHari() + '">') +
      Rencana.lab('rm_ju', 'Ulangi tiap (hari, kosongkan bila sekali)', '<input id="rm_ju" inputmode="numeric" maxlength="3" placeholder="mis. 14">'); },
    isiEd(id, el) { const j = Dsk.jd(id); if (!j) return; el.querySelector('#rm_jn').value = j.nama; el.querySelector('#rm_jt').value = j.tanggal; el.querySelector('#rm_ju').value = j.ulang > 0 ? j.ulang : ''; },
    ok(v, id) {
      const s = Siklus.cari(Siklus.sid); if (!s) return 'Siklus tidak ditemukan.';
      const nama = v('rm_jn').trim(), tgl = v('rm_jt'), u = v('rm_ju').trim(), ulang = u === '' ? 0 : Number(u);
      if (!nama) return 'Isi nama kegiatan.';
      if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl)) return 'Isi tanggal.';
      if (!Number.isInteger(ulang) || ulang < 0 || ulang > 365) return 'Ulangi tiap 1 sampai 365 hari, atau kosongkan.';
      const j = id && Dsk.jd(id);
      if (j) Object.assign(j, { nama: nama, tanggal: tgl, ulang: ulang }); else (s.jadwal = s.jadwal || []).push({ id: uid('j'), nama: nama, tanggal: tgl, ulang: ulang, selesai: false, terakhir: '' });
      s.diubah = nowIso(); return { toast: j ? 'Kegiatan diperbarui' : 'Kegiatan ditambahkan' };
    } },
  jadwalDetail: { jenis: 'Jadwal kegiatan', judul: 'Detail kegiatan', ada(id) { return !!Dsk.jd(id); }, judulFn(id) { const j = Dsk.jd(id); return j ? esc(j.nama) : 'Detail kegiatan'; },
    isi(id) {
      const j = Dsk.jd(id), telat = !j.selesai && Jadwal.selisih(j.tanggal) < 0;
      return Rencana.baris('Status', j.selesai ? 'selesai' : '<span class="' + (telat ? 'down' : '') + '">' + Jadwal.teks(j) + '</span>') + Rencana.baris(j.selesai ? 'Tanggal terakhir' : 'Tanggal', Setelan.tgl(j.selesai ? (j.terakhir || j.tanggal) : j.tanggal)) +
        Rencana.baris('Pengulangan', j.ulang > 0 ? 'tiap ' + j.ulang + ' hari' : 'sekali') + (j.terakhir && !j.selesai ? Rencana.baris('Terakhir dikerjakan', Setelan.tgl(j.terakhir)) : '');
    },
    tombol(id) {
      const s = Siklus.cari(Siklus.sid), j = Dsk.jd(id), jalan = s && s.status === 'berjalan';
      return (jalan && !j.selesai ? Rencana.bt('selesai', 'Sudah dikerjakan', 'gold') : '') + (jalan ? Rencana.bt('ubah', 'Ubah', '') : '') + Rencana.bt('hapus', 'Hapus', 'danger') + Rencana.bt('tutup', 'Tutup', '');
    },
    aksi(a, id) {
      if (a === 'ubah') { Rencana.dlgTutup(true); Rencana.dlgBuka('jadwal', id); }
      else if (a === 'selesai') { Rencana.dlgTutup(true); Jadwal.aksi('jadwal-selesai', { dataset: { id: id } }); }
      else if (a === 'hapus') { Rencana.dlgTutup(true); Jadwal.aksi('jadwal-hapus', { dataset: { id: id } }); }
    } },
  panenDetail: { jenis: 'Panen', judul: 'Detail panen', ada(id) { return !!Dsk.pn(id); }, judulFn(id) { const p = Dsk.pn(id); return p ? 'Panen ' + Setelan.tgl(p.tanggal) : 'Detail panen'; },
    isi(id) {
      const p = Dsk.pn(id), s = Siklus.cari(Siklus.sid), k = s && Siklus.kom(s.komoditasId), sat = k ? ' ' + esc(k.satuan) : '';
      return Rencana.baris('Hasil kotor', fmtN(p.kuantitasKotor) + sat) + Rencana.baris('Susut / reject', fmtN(p.susut) + sat) + Rencana.baris('Bersih', '<strong>' + fmtN(p.kuantitasKotor - p.susut) + sat + '</strong>') +
        Rencana.baris('Harga jual', p.hargaPerSatuan ? rp(p.hargaPerSatuan) + (k ? '/' + esc(k.satuan) : '') : '—') + Rencana.baris('Pembeli', p.pembeli ? esc(p.pembeli) : '—');
    },
    tombol() { const s = Siklus.cari(Siklus.sid); return (s && s.status === 'berjalan' ? Rencana.bt('ubah', 'Ubah panen', 'gold') + Rencana.bt('hapus', 'Hapus panen', 'danger') : '') + Rencana.bt('tutup', 'Tutup', ''); },
    aksi(a, id) {
      if (a === 'ubah') { Rencana.dlgTutup(true); Siklus.aksi('ubah-panen', { dataset: { id: id } }); return; }
      if (a !== 'hapus') return;

<script>
/* Buku Kebun — Catatan cepat Jurnal: chip satu ketukan yang langsung membuat catatan kegiatan hari ini (v0.1.100, docs/JURNAL.md bagian 6)
   Entri = jurnal jenis 'kegiatan' dengan cepat:true (judul = nama kegiatan, tanggal = hari ini). Tidak memengaruhi uang atau laporan.
   Chip mengikuti jenis komoditas siklus. Toast memberi Urungkan dan Tambah detail (membuka formulir Ubah catatan untuk isi atau foto). */
const Cepat = {
  TABEL: {
    Umum: ['Siram', 'Pupuk', 'Semprot', 'Penyiangan', 'Pindah tanam'],
    'Sayur daun': ['Siram', 'Pupuk', 'Semprot', 'Penyiangan', 'Pindah tanam'],
    Cabai: ['Siram', 'Pupuk', 'Semprot', 'Penyiangan', 'Pindah tanam'],
    Tomat: ['Siram', 'Pupuk', 'Semprot', 'Pasang ajir', 'Pangkas tunas'],
    Lele: ['Beri pakan', 'Ganti air', 'Cek kualitas air', 'Sortir', 'Probiotik'],
    'Ayam petelur': ['Beri pakan', 'Ganti air minum', 'Bersihkan kandang', 'Vaksin', 'Vitamin']

  _t: { k: '', n: 0 },
  daftar(s) { const k = Siklus.kom(s.komoditasId), tp = k && Siklus.templateUntuk(k.nama); return (tp && this.TABEL[tp.label]) || this.TABEL.Umum; },
  /* hanya siklus berjalan yang sudah mulai (tanggal catatan tidak boleh sebelum mulai atau di masa depan) */

      '<div class="seg sm rc-chips" role="group" aria-label="Catat cepat kegiatan" style="justify-content:flex-start;margin:0 0 6px">' +
      this.daftar(s).map((n) => '<button type="button" class="btn" data-do="jurnal-cepat" data-sid="' + s.id + '" data-k="' + esc(n) + '">' + esc(n) + '</button>').join('') +

<script>
/* Buku Kebun — Linimasa siklus, Jurnal Tahap 2 (v0.1.089, docs/JURNAL.md §7)
   Satu halaman kronologis per siklus (tab `jurnal`, rute #jurnal-<id>): catatan jurnal + peristiwa turunan
   (mulai, selesai, transaksi, panen). Peristiwa turunan hanya dibaca dari data yang ada, tidak disalin; ketuk membuka aslinya. */
const Linimasa = {
  sid: null, f: 'semua', urut: 'baru', n: 100,
  FILTER: [['semua', 'Semua'], ['catatan', 'Catatan'], ['uang', 'Uang'], ['panen', 'Panen'], ['kegiatan', 'Kegiatan']],
  BATAS: 100,

  siap(s) { if (this.sid !== s.id) { this.sid = s.id; this.f = 'semua'; this.urut = 'baru'; this.n = this.BATAS; } },
  grup(k) { return k === 'mulai' || k === 'selesai' ? 'semua' : k; },

  /* semua peristiwa siklus; rank: mulai 0, entri 1, selesai 2 (urutan dalam hari yang sama) */
  peristiwa(s) {
    const E = [], sat = (Siklus.kom(s.komoditasId) || {}).satuan || '';
    E.push({ k: 'mulai', tgl: s.mulai, rank: 0, dibuat: '' });
    if (s.status === 'selesai' && s.selesai) E.push({ k: 'selesai', tgl: s.selesai, rank: 2, dibuat: '' });
    Jurnal.of(s.id).forEach((j) => E.push({ k: j.jenis === 'kegiatan' ? 'kegiatan' : 'catatan', tgl: j.tanggal, rank: 1, dibuat: String(j.dibuat || ''), j: j }));
    App.aktif().filter((t) => t.siklusId === s.id).forEach((t) => E.push({ k: 'uang', tgl: t.tanggal, rank: 1, dibuat: String(t.dibuat || ''), t: t }));
    Siklus.panenOf(s.id).forEach((p) => E.push({ k: 'panen', tgl: p.tanggal, rank: 1, dibuat: String(p.dibuat || ''), p: p, sat: sat }));
    const mul = this.urut === 'lama' ? 1 : -1;
    return E.sort((a, b) => mul * (a.tgl.localeCompare(b.tgl) || a.rank - b.rank || a.dibuat.localeCompare(b.dibuat)));
  },
  tampil(E) { return this.f === 'semua' ? E : E.filter((e) => e.k === this.f); },
  minggu(s, tgl) { const h = Jurnal.hariKe(s, tgl); return h < 1 ? 0 : Math.ceil(h / 7); },
  rentang(s, m) { // tanggal awal–akhir minggu ke-m

    const f = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  /* teks satu peristiwa: { ikon, judul, ket, nilai, kelas, ket2 } */
  isi(s, e) {
    if (e.k === 'mulai') return { ikon: '🌱', judul: 'Siklus dimulai', ket: '', turunan: true };

    }
    if (e.k === 'panen') {
      const p = e.p;
      return { ikon: '🧺', judul: 'Panen ' + fmtN(p.kuantitasKotor - p.susut) + ' ' + e.sat + ' bersih', ket: (p.susut ? 'susut ' + fmtN(p.susut) : '') + (p.pembeli ? (p.susut ? ' · ' : '') + p.pembeli : ''), turunan: true, panen: p.id, label: 'Panen' };
    }
    const j = e.j;
    const ket = j.judul && j.isi ? String(j.isi).replace(/\s+/g, ' ').slice(0, 90) + (String(j.isi).length > 90 ? '…' : '') : '';
    return { ikon: j.jenis === 'kegiatan' ? '✓' : j.jenis === 'tahap' ? '❖' : j.jenis === 'kejadian' ? '⚠' : j.jenis === 'ukuran' ? '↕' : j.evaluasi ? '★' : '✎', judul: Jurnal.judul(j), ket: ket, jurnal: j.id, label: j.jenis === 'kegiatan' ? 'Kegiatan' : j.jenis === 'tahap' ? 'Tahap' : j.jenis === 'kejadian' ? 'Kejadian' : j.jenis === 'ukuran' ? 'Ukuran' : j.evaluasi ? 'Evaluasi' : 'Catatan' };
