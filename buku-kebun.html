    return (att ? '<div class="tx lm-baris' + (x.turunan ? ' lm-turun' : '') + '"' + att + ' role="button" tabindex="0">' + inner + '</div>'
      : '<div class="tx lm-baris lm-turun lm-diam">' + inner + '</div>') + gal;
  },
  daftar(s, L) {
    let h = '', last = null;
    L.slice(0, this.n).forEach((e) => {
      const m = this.minggu(s, e.tgl);
      if (m !== last) { last = m; h += '<h3 class="lm-minggu">' + (m === 0 ? 'Sebelum mulai' : 'Minggu ke-' + m + ' <span class="note">· ' + this.rentang(s, m) + '</span>') + '</h3>'; }
      h += this.baris(s, e);
    });
    return h;
  },

  v() {
    const s = Siklus.cari(Siklus.sid);
    if (!s) return Siklus.vList();
    this.siap(s);
    const E = this.peristiwa(s), L = this.tampil(E), jalan = s.status === 'berjalan';
    const hit = (k) => E.filter((e) => e.k === k).length;
    const chip = this.FILTER.map((c) => '<button type="button" class="btn' + (this.f === c[0] ? ' gold' : '') + '" data-do="lm-f" data-f="' + c[0] + '" aria-pressed="' + (this.f === c[0]) + '">' + c[1] + '</button>').join('');
    const r = Siklus.ringkas(s.id), u = r.hasil - r.modal;
    const kiri = '<div class="dt-kiri"><section><div class="sc-head"><h2 style="margin:0">Ringkasan</h2><span class="badge' + (jalan ? ' live' : '') + '">' + (jalan ? 'berjalan' : 'selesai') + '</span></div>' +
      '<p class="note" style="margin:8px 0 0">Mulai ' + Setelan.tgl(s.mulai) + (jalan ? ' · hari ' + Siklus.hari(s) : ' · selesai ' + Setelan.tgl(s.selesai) + ' (' + Siklus.hari(s) + ' hari)') + '</p>' +
      '<div class="row"><span class="mu">Catatan</span><span>' + hit('catatan') + '</span></div><div class="row"><span class="mu">Kegiatan</span><span>' + hit('kegiatan') + '</span></div>' +
      '<div class="row"><span class="mu">Transaksi</span><span>' + hit('uang') + '</span></div><div class="row"><span class="mu">Panen</span><span>' + hit('panen') + '</span></div>' +
      '<div class="row"><span class="mu">' + (u < 0 ? 'Rugi' : 'Untung') + '</span><span class="' + (u < 0 ? 'down' : 'up') + '">' + rp(u) + '</span></div>' +
      '<button type="button" class="btn" data-go="siklus-detail" style="width:100%;margin-top:12px;min-height:44px">Kembali ke detail siklus</button></section></div>';
    const kanan = '<div class="dt-kanan"><section><div class="sc-head"><h2 style="margin:0">Linimasa</h2>' +
      '<div class="lap-aksi no-print" style="margin:0"><button type="button" class="ikon-btn" data-an="cetak" aria-label="Cetak linimasa atau simpan PDF">' + Analisa.IKON.cetak + '<span>Cetak</span></button></div></div>' +
      Cepat.chips(s) + '<div class="seg sm lm-filter no-print" role="group" aria-label="Saring linimasa">' + chip + '</div>' +
      '<div class="seg sm lm-urut no-print" style="margin-top:8px"><button type="button" class="btn" data-do="lm-urut" aria-label="Urutan: ' + (this.urut === 'baru' ? 'terbaru dulu' : 'terlama dulu') + '. Ketuk untuk membalik">' + (this.urut === 'baru' ? '↓ Terbaru' : '↑ Terlama') + '</button></div>' +
      (L.length ? this.daftar(s, L) + (L.length > this.n ? '<button type="button" class="btn" data-do="lm-lagi" style="width:100%;margin-top:12px;min-height:44px">Tampilkan lebih banyak (sisa ' + (L.length - this.n) + ')</button>' : '')
        : '<p class="note">Belum ada ' + (this.f === 'semua' ? 'peristiwa' : this.FILTER.find((c) => c[0] === this.f)[1].toLowerCase()) + '.</p>') +
      '<p class="note">Baris berikon redup berasal dari transaksi, panen, atau siklus; ketuk untuk membuka aslinya.' + (jalan ? ' Ketuk tombol + untuk mencatat jurnal.' : '') + '</p></section></div>';
    return kanan + kiri; // di HP linimasa dulu; di desktop kolom diatur CSS
  },

  /* dokumen cetak polos linimasa (urutan lama → baru, semua peristiwa) */
  cetakDoc() {
    const s = Siklus.cari(Siklus.sid), urut = this.urut; this.urut = 'lama';
    const E = this.peristiwa(s); this.urut = urut;
    const k = Siklus.kom(s.komoditasId) || {};
    let baris = '';
    E.forEach((e) => {
      const x = this.isi(s, e), h = Jurnal.hariKe(s, e.tgl);
      baris += '<tr><td>' + Setelan.tgl(e.tgl) + '</td><td>' + (h >= 1 ? h : '—') + '</td><td>' + (x.label || (e.k === 'mulai' ? 'Mulai' : 'Selesai')) + '</td><td>' + esc(x.judul) + (e.j && e.j.isi ? '<br>' + esc(e.j.isi).replace(/\n/g, '<br>') : x.ket ? '<br>' + esc(x.ket) : '') + '</td><td class="n">' + (x.nilai || '') + '</td></tr>';
    });
    return '<div class="ct-kop"><h1>Jurnal Siklus</h1><p class="ct-sub">' + esc(Siklus.nama(s.id)) + '</p><table class="ct-meta"><tr><th>Komoditas</th><td>' + esc(k.nama || '—') + '</td><th>Dicetak</th><td>' + Setelan.tgl(isoHari()) + '</td></tr>' +
      '<tr><th>Mulai</th><td>' + Setelan.tgl(s.mulai) + '</td><th>Aplikasi</th><td>Buku Kebun v' + VERSI + '</td></tr></table></div>' +
      '<div class="ct-bag"><table class="ct-tab"><tr><th>Tanggal</th><th>Hari</th><th>Jenis</th><th>Keterangan</th><th class="n">Nilai</th></tr>' + baris + '</table></div>';
  },

  aksi(a, el) {
    const ulang = () => { const y = window.scrollY; App.go('jurnal', true); window.scrollTo(0, y); };
    if (a === 'lm-f') { this.f = el.dataset.f; this.n = this.BATAS; ulang(); const b = document.querySelector('.lm-filter [data-f="' + this.f + '"]'); if (b) b.focus(); return true; }
    if (a === 'lm-urut') { this.urut = this.urut === 'baru' ? 'lama' : 'baru'; this.n = this.BATAS; ulang(); const b = document.querySelector('[data-do="lm-urut"]'); if (b) b.focus(); return true; }
    if (a === 'lm-lagi') { this.n += this.BATAS; ulang(); return true; }
    if (a === 'jurnal-linimasa') { App.go('jurnal'); return true; }
    return false;
  }
};

<script>
/* Buku Kebun — Tahap pertumbuhan (Fase 6E Tahap 3, v0.1.090): daftar bawaan per komoditas, tahap sekarang, saran, bilah (docs/JURNAL.md bagian 6) */
const Tahap = {
  /* [kode, nama, persen umur panen saat tahap dimulai] */
  TABEL: {
    'Sayur daun': { umur: 30, t: [['persiapan', 'Persiapan lahan', 0], ['semai', 'Semai', 7], ['pindah', 'Pindah tanam', 30], ['vegetatif', 'Pertumbuhan daun', 45], ['siap', 'Siap panen', 80], ['panen', 'Panen', 100]] },
    'Cabai': { umur: 120, t: [['persiapan', 'Persiapan lahan', 0], ['semai', 'Semai', 4], ['pindah', 'Pindah tanam', 25], ['vegetatif', 'Vegetatif', 38], ['berbunga', 'Berbunga', 55], ['berbuah', 'Berbuah', 70], ['panen', 'Panen', 85]] },
    'Tomat': { umur: 90, t: [['persiapan', 'Persiapan lahan', 0], ['semai', 'Semai', 4], ['pindah', 'Pindah tanam', 22], ['vegetatif', 'Vegetatif', 33], ['berbunga', 'Berbunga', 50], ['berbuah', 'Berbuah', 62], ['panen', 'Panen', 80]] },
    'Lele': { umur: 90, t: [['persiapan', 'Persiapan kolam', 0], ['tebar', 'Tebar benih', 3], ['dederan', 'Pendederan', 10], ['pembesaran', 'Pembesaran', 40], ['siap', 'Siap panen', 90], ['panen', 'Panen', 100]] },
    'Ayam petelur': { umur: 120, t: [['persiapan', 'Persiapan kandang', 0], ['doc', 'DOC masuk', 4], ['starter', 'Starter', 8], ['grower', 'Grower', 35], ['praproduksi', 'Pra-produksi', 75], ['produksi', 'Produksi telur', 90]] },
    'Umum': { umur: 0, t: [['persiapan', 'Persiapan', 0], ['tanam', 'Tanam / tebar', 5], ['tumbuh', 'Pertumbuhan', 30], ['siap', 'Siap panen', 80], ['panen', 'Panen', 100]] }
  },
  /* daftar tahap untuk satu siklus: templat komoditas (atau Umum), nama dari komoditas.tahap bila diubah */
  paket(s) { return this.paketKom(Siklus.kom(s.komoditasId)); },
  paketKom(k) {
    const tp = k && Siklus.templateUntuk(k.nama), m = (tp && this.TABEL[tp.label]) || this.TABEL.Umum;
    const umur = (k && k.umurPanenHari) || m.umur || 0, ganti = (k && k.tahap) || {};
    return { nama: tp && this.TABEL[tp.label] ? tp.label : 'Umum', umur: umur, daftar: m.t.map((x) => ({ kode: x[0], asli: x[1], nama: ganti[x[0]] || x[1], pct: x[2], hari: umur ? Math.max(1, Math.round(x[2] * umur / 100)) : null })) };
  },
  /* lipatan "Nama tahap" di formulir ubah komoditas; kosongkan isian untuk memakai nama bawaan */
  formNama(kid) {
    const k = Siklus.kom(kid); if (!k) return '';
    const p = this.paketKom(k), ganti = k.tahap || {};
    return '<details class="lap-det" style="margin-top:12px"><summary style="font-size:16px">Nama tahap pertumbuhan</summary><p class="note" style="margin-top:0">Daftar ' + esc(p.nama) + '. Ganti nama sesuai kebiasaan Anda; kosongkan untuk memakai nama bawaan. Urutan dan kode tetap.</p>' +
      p.daftar.map((t) => '<label for="th_' + t.kode + '">' + esc(t.asli) + '</label><input id="th_' + t.kode + '" data-th="' + t.kode + '" data-def="' + esc(t.asli) + '" maxlength="30" autocomplete="off" value="' + esc(ganti[t.kode] || '') + '" placeholder="' + esc(t.asli) + '">').join('') + '</details>';
  },
  /* baca isian nama tahap dari formulir; mengembalikan peta kode → nama (hanya yang berbeda dari bawaan) atau null bila formulir tidak memuatnya */
  bacaNama() {
    const L = document.querySelectorAll('input[data-th]'); if (!L.length) return null;
    const m = {}; L.forEach((e) => { const v = e.value.trim().replace(/\s+/g, ' ').slice(0, 30); if (v && v !== e.dataset.def) m[e.dataset.th] = v; }); return m;
  },
  nama(j) { const s = Siklus.cari(j.siklusId), t = s && this.paket(s).daftar.find((x) => x.kode === j.tahap); return t ? t.nama : (j.tahap || 'Tahap'); },
  /* tahap terakhir yang dicatat (menurut tanggal) */
  sekarang(s) {
    const j = Jurnal.of(s.id).find((x) => x.jenis === 'tahap'); if (!j) return null;
    const hr = Jurnal.hariKe(s, isoHari()) - Jurnal.hariKe(s, j.tanggal);
    return { kode: j.tahap, nama: this.nama(j), tanggal: j.tanggal, hari: Math.max(0, hr) };
  },
  /* saran saja, tidak otomatis: tahap yang menurut hari ke-N seharusnya sudah mulai, atau tahap berikutnya */
  saran(s) {
    const p = this.paket(s), cur = this.sekarang(s), ci = cur ? p.daftar.findIndex((x) => x.kode === cur.kode) : -1;
    const hari = Jurnal.hariKe(s, isoHari()); let ti = -1;
    if (p.umur) p.daftar.forEach((x, i) => { if (x.hari <= hari) ti = i; });
    if (ti > ci) return Object.assign({ mendesak: true }, p.daftar[ti]);
    return ci + 1 < p.daftar.length ? Object.assign({ mendesak: false }, p.daftar[ci + 1]) : null;
  },
  ringkas(s) { const c = s.status === 'berjalan' && this.sekarang(s); return c ? 'Tahap ' + c.nama : ''; },
  bilah(s) {
    const p = this.paket(s), cur = this.sekarang(s), ci = cur ? p.daftar.findIndex((x) => x.kode === cur.kode) : -1, hari = Jurnal.hariKe(s, isoHari());
    const seg = p.daftar.map((x, i) => '<i class="' + (i < ci ? 'sl' : i === ci ? 'sn' : '') + '" style="flex:' + Math.max(2, (i + 1 < p.daftar.length ? p.daftar[i + 1].pct : 100) - x.pct) + '" title="' + esc(x.nama) + '"></i>').join('');
    const pos = p.umur ? '<b style="left:' + Math.min(100, Math.round(hari / p.umur * 100)) + '%" title="Hari ini (hari ' + hari + ')"></b>' : '';
    return '<div class="th-bar" role="img" aria-label="' + (cur ? 'Tahap ' + esc(cur.nama) + ', ' + (ci + 1) + ' dari ' + p.daftar.length : 'Belum ada tahap dicatat') + '">' + seg + pos + '</div>';
  },
  /* bagian "Tahap" di detail siklus */
  v(s) {
    const jalan = s.status === 'berjalan', c = this.sekarang(s), sg = jalan && this.saran(s);
    if (!jalan && !c) return '';
    return '<section><div class="sc-head"><h2 style="margin:0">Tahap</h2>' + (jalan ? '<button type="button" class="btn" data-do="tahap-catat" style="padding:7px 12px;font-size:12px;min-height:40px">Catat tahap</button>' : '') + '</div>' +
      (c ? '<div class="tx-n" style="margin-top:10px">' + esc(c.nama) + '</div><div class="note">sejak ' + Setelan.tgl(c.tanggal) + ' · ' + (c.hari ? c.hari + ' hari' : 'hari ini') + '</div>' : '<p class="note">Belum ada tahap dicatat. Ketuk Catat tahap saat tanaman berpindah tahap (semai, pindah tanam, berbunga, dan seterusnya).</p>') +
      this.bilah(s) +
      (sg ? '<p class="note">' + (sg.mendesak ? 'Saran: menurut umur siklus, tahap <b>' + esc(sg.nama) + '</b> seharusnya sudah mulai (sekitar hari ' + sg.hari + ').' : 'Berikutnya: <b>' + esc(sg.nama) + '</b>' + (sg.hari ? ' (sekitar hari ' + sg.hari + ')' : '') + '.') + ' Hanya saran; tahap dicatat oleh Anda.</p>' : '') + '</section>';
  },
  aksi(a) { if (a === 'tahap-catat') { Rencana.dlgBuka('tahap'); return true; } return false; },
  simpan(v, id) {
    const s = Siklus.cari(Siklus.sid); if (!s) return 'Siklus tidak ditemukan.';
    const j = id ? Jurnal.cari(id) : null; if (id && !j) return 'Catatan tidak ditemukan.';
    if (!Jurnal.boleh(s, j)) return 'Siklus sudah selesai. Buka kembali untuk mengubah tahap.';
    const g = Jurnal.cek(s, v('rm_jt')); if (g) return g;
    const kode = v('rm_tk'), isi = v('rm_ji').trim();
    if (!this.paket(s).daftar.some((x) => x.kode === kode)) return 'Pilih tahap.';
    if (isi.length > 2000) return 'Catatan paling banyak 2.000 karakter.';
    const n = nowIso();
    if (j) Object.assign(j, { tanggal: v('rm_jt'), tahap: kode, isi: isi, diubah: n });
    else Jurnal.semua().push({ id: uid('jr'), siklusId: s.id, tanggal: v('rm_jt'), jenis: 'tahap', tahap: kode, judul: '', isi: isi, dibuat: n, diubah: n, terhapus: false });
    s.diubah = n; return { toast: j ? 'Tahap diperbarui' : 'Tahap tersimpan' };
  }
};
Object.assign(Rencana.FORM, {
  tahap: { jenis: 'Jurnal siklus', judul: 'Catat tahap', judulUbah: 'Ubah tahap', simpan: 'Simpan tahap', tab: 'siklus-detail', fokus: 'rm_tk',
    isi() {
      const s = Siklus.cari(Siklus.sid), sg = Tahap.saran(s);
      const opt = Tahap.paket(s).daftar.map((t) => '<option value="' + t.kode + '"' + (sg && sg.kode === t.kode ? ' selected' : '') + '>' + esc(t.nama) + (t.hari ? ' (±hari ' + t.hari + ')' : '') + '</option>').join('');
      return Rencana.lab('rm_jt', 'Tanggal', '<input type="date" id="rm_jt" value="' + isoHari() + '">') + Rencana.lab('rm_tk', 'Tahap', '<select id="rm_tk">' + opt + '</select>') +
        Rencana.lab('rm_ji', 'Catatan (opsional)', '<textarea id="rm_ji" rows="3" maxlength="2000" placeholder="mis. Bibit dipindah ke bedeng 2"></textarea>');
    },
    isiEd(id, el) { const j = Jurnal.cari(id); if (!j) return; el.querySelector('#rm_jt').value = j.tanggal; el.querySelector('#rm_tk').value = j.tahap || ''; el.querySelector('#rm_ji').value = j.isi || ''; },
    ok(v, id) { return Tahap.simpan(v, id); } }
});

</script>
<script>
/* Buku Kebun — Kejadian dan ukuran di jurnal siklus (Fase 6E Tahap 5, v0.1.093; docs/JURNAL.md)
   Jenis `kejadian` (field `kejadian`: hama|penyakit|cuaca|perawatan|lainnya) dan `ukuran` (field `ukuran`: {nama, nilai, satuan}). */
const Kejadian = {
  JENIS: [['hama', 'Hama'], ['penyakit', 'Penyakit'], ['cuaca', 'Cuaca'], ['perawatan', 'Perawatan'], ['lainnya', 'Lainnya']],
  nama(k) { const x = this.JENIS.find((a) => a[0] === k); return x ? x[1] : 'Kejadian'; },
  fmt(n) { return Number(n).toLocaleString('id-ID', { maximumFractionDigits: 2 }); },
  teks(j) { return j.jenis === 'ukuran' && j.ukuran ? j.ukuran.nama + ' ' + this.fmt(j.ukuran.nilai) + (j.ukuran.satuan ? ' ' + j.ukuran.satuan : '') : ''; },
  /* judul baris jurnal/linimasa */
  judul(j) {
    if (j.jenis === 'ukuran') return this.teks(j) || 'Ukuran';
    const l = String(j.isi || '').split('\n')[0].slice(0, 50); return this.nama(j.kejadian) + (l ? ': ' + l : '');
  },
  /* label jenis entri jurnal untuk ekspor dan tampilan */
  label(j) { return j.evaluasi ? 'Evaluasi' : { kegiatan: 'Kegiatan', tahap: 'Tahap', kejadian: 'Kejadian', ukuran: 'Ukuran' }[j.jenis] || 'Catatan'; },
  rincian(j) { return j.jenis === 'tahap' ? Tahap.nama(j) : j.jenis === 'kejadian' ? this.nama(j.kejadian) : ''; },
  /* satu baris per entri: [siklus, tanggal ISO, hari ke, jenis, rincian, judul, isi, nilai ukuran, satuan, jumlah foto]; dipakai Excel dan CSV */
  barisJurnal() {
    const out = []; Siklus.daftar().slice().sort((a, b) => Siklus.nama(a.id).localeCompare(Siklus.nama(b.id))).forEach((s) => Jurnal.of(s.id).slice().reverse().forEach((j) =>
      out.push([Siklus.nama(s.id), j.tanggal, Jurnal.hariKe(s, j.tanggal), this.label(j), this.rincian(j), Jurnal.judul(j), j.isi || '', j.jenis === 'ukuran' && j.ukuran ? j.ukuran.nilai : '', j.jenis === 'ukuran' && j.ukuran ? j.ukuran.satuan || '' : '', (j.foto || []).length])));
    return out;
  },
  csvJurnal() {
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    return ['siklus,tanggal,hari_ke,jenis,rincian,judul,isi,nilai,satuan,foto'].concat(this.barisJurnal().map((r) => [q(r[0]), r[1], r[2], q(r[3]), q(r[4]), q(r[5]), q(r[6]), r[7], q(r[8]), r[9]].join(','))).join('\n');
  },
  eksporCsvJurnal() {
    const csv = this.csvJurnal(), n = csv.split('\n').length - 1; if (!n) return 0;
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' })); a.download = 'buku-kebun-jurnal-' + isoHari() + '.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return n;
  },
  daftar(s, jenis) { return Jurnal.of(s.id).filter((j) => j.jenis === jenis); },
  /* transaksi siklus pada tanggal yang sama (hubungan ke uang) */
  uangHari(j) { return App.aktif().filter((t) => t.siklusId === j.siklusId && t.tanggal === j.tanggal); },
  detail(j) {
    if (j.jenis === 'ukuran') return '<div class="tx-n" style="margin-bottom:8px">' + esc(this.teks(j)) + '</div>';
    if (j.jenis !== 'kejadian') return '';
    const T = this.uangHari(j);
    return '<div style="margin-bottom:8px"><span class="badge">' + esc(this.nama(j.kejadian)) + '</span></div>' +
      '<div class="note" style="margin:10px 0 4px">Uang pada tanggal yang sama</div>' +
      (T.length ? T.map((t) => '<div class="row"><span>' + esc(App.namaKat(t.kategoriId)) + '</span><span class="' + (t.jenis === 'masuk' ? 'up' : 'down') + '">' + (t.jenis === 'masuk' ? '+' : '−') + rp(t.jumlah) + '</span></div>').join('') : '<p class="note" style="margin:0">Tidak ada transaksi siklus ini pada tanggal tersebut.</p>');
  },
  /* grafik mini: nilai ukuran terhadap hari ke-N, satu garis per nama (maks. 3 nama) */
  grafik(s) {
    const g = {}; this.daftar(s, 'ukuran').forEach((j) => { if (!j.ukuran) return; const k = String(j.ukuran.nama).trim().toLowerCase(); (g[k] = g[k] || { nama: j.ukuran.nama, sat: j.ukuran.satuan, P: [] }).P.push({ h: Jurnal.hariKe(s, j.tanggal), v: j.ukuran.nilai }); });
    return Object.values(g).slice(0, 3).map((x) => {
      x.P.sort((a, b) => a.h - b.h); const akhir = x.P[x.P.length - 1], head = '<div class="row"><span>' + esc(x.nama) + '</span><span class="mu">terakhir ' + this.fmt(akhir.v) + (x.sat ? ' ' + esc(x.sat) : '') + ' · hari ' + akhir.h + '</span></div>';
      if (x.P.length < 2) return head + '<p class="note" style="margin:0">Catat satu ukuran lagi untuk melihat grafik.</p>';
      const W = 320, H = 90, X0 = 8, X1 = 312, h0 = x.P[0].h, h1 = akhir.h || 1, mx = Math.max(...x.P.map((p) => p.v)) || 1;
      const pts = x.P.map((p) => [X0 + (h1 === h0 ? 0 : (p.h - h0) / (h1 - h0) * (X1 - X0)), H - 8 - p.v / mx * (H - 20)]);
      return head + '<svg viewBox="0 0 ' + W + ' ' + (H + 14) + '" width="100%" role="img" aria-label="Grafik ' + esc(x.nama) + ' hari ' + h0 + ' sampai ' + h1 + '"><path d="' + Analisa.kurva(pts) + '" fill="none" stroke="var(--fill)" stroke-width="2.2" stroke-linecap="round"/>' +
        pts.map((p) => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="var(--fill)"/>').join('') +
        '<text x="' + X0 + '" y="' + (H + 11) + '" font-size="9" fill="var(--paper-faint)">hari ' + h0 + '</text><text x="' + X1 + '" y="' + (H + 11) + '" text-anchor="end" font-size="9" fill="var(--paper-faint)">hari ' + h1 + '</text></svg>';
    }).join('<div style="height:8px"></div>');
  },
  v(s) {
    const jalan = s.status === 'berjalan', K = this.daftar(s, 'kejadian'), U = this.daftar(s, 'ukuran');
    if (!jalan && !K.length && !U.length) return '';
    const hit = this.JENIS.map((a) => [a[1], K.filter((j) => j.kejadian === a[0]).length]).filter((a) => a[1]);
    const tombol = jalan ? '<div class="seg" style="margin:10px 0 4px"><button type="button" class="btn" data-do="kejadian-catat">Catat kejadian</button><button type="button" class="btn" data-do="ukuran-catat">Catat ukuran</button></div>' : '';
    return '<section><h2 style="margin:0 0 4px">Kejadian dan ukuran</h2>' + tombol +
      (K.length ? '<div class="note" style="margin-top:8px">' + hit.map((a) => esc(a[0]) + ' ' + a[1]).join(' · ') + '</div><div class="note">Terakhir: ' + esc(this.judul(K[0])) + ' · ' + Setelan.tgl(K[0].tanggal) + '</div>' : '<p class="note">Belum ada kejadian (hama, penyakit, cuaca, perawatan).</p>') +
      (U.length ? '<div style="margin-top:12px">' + this.grafik(s) + '</div>' : '<p class="note">Belum ada ukuran (mis. tinggi tanaman, bobot ikan).</p>') +
      '<p class="note">Ketuk catatan di Jurnal atau linimasa untuk detail dan mengubah.</p></section>';
  },
  aksi(a) { if (a === 'kejadian-catat') { Rencana.dlgBuka('kejadian'); return true; } if (a === 'ukuran-catat') { Rencana.dlgBuka('ukuran'); return true; } return false; },
  /* simpan bersama; bentuk dibuat oleh `isiEntri` */
  simpan(v, id, jenis) {
    const s = Siklus.cari(Siklus.sid); if (!s) return 'Siklus tidak ditemukan.';
    const j = id ? Jurnal.cari(id) : null; if (id && !j) return 'Catatan tidak ditemukan.';
    if (!Jurnal.boleh(s, j)) return 'Siklus sudah selesai. Buka kembali untuk mengubah.';
    const g = Jurnal.cek(s, v('rm_jt')); if (g) return g;
    const f = { tanggal: v('rm_jt'), jenis: jenis, diubah: nowIso() };
    if (jenis === 'kejadian') {
      const isi = v('rm_ji').trim(); if (!this.JENIS.some((a) => a[0] === v('rm_kj'))) return 'Pilih jenis kejadian.'; if (isi.length > 2000) return 'Catatan paling banyak 2.000 karakter.';
      Object.assign(f, { kejadian: v('rm_kj'), isi: isi, judul: '' });
    } else {
      const nama = v('rm_un').trim().replace(/\s+/g, ' '), sat = v('rm_us').trim(), nilai = Number(String(v('rm_uv')).trim().replace(',', '.'));
      if (!nama) return 'Isi nama ukuran, mis. Tinggi.'; if (nama.length > 30) return 'Nama ukuran paling banyak 30 karakter.';
      if (!isFinite(nilai) || String(v('rm_uv')).trim() === '' || nilai < 0) return 'Isi nilai ukuran berupa angka (0 atau lebih).';
      if (sat.length > 10) return 'Satuan paling banyak 10 karakter.';
      Object.assign(f, { ukuran: { nama: nama, nilai: nilai, satuan: sat }, isi: '', judul: '' });

    s.diubah = nowIso(); return { toast: (jenis === 'kejadian' ? 'Kejadian' : 'Ukuran') + (j ? ' diperbarui' : ' tersimpan') };
  },
  namaUkuran(s) { return [...new Set(this.daftar(s, 'ukuran').filter((j) => j.ukuran).map((j) => j.ukuran.nama))]; }
};
Object.assign(Rencana.FORM, {
  kejadian: { jenis: 'Jurnal siklus', judul: 'Catat kejadian', judulUbah: 'Ubah kejadian', simpan: 'Simpan kejadian', tab: 'siklus-detail', fokus: 'rm_ji',
    isi() {
      return Rencana.lab('rm_jt', 'Tanggal', '<input type="date" id="rm_jt" value="' + isoHari() + '">') +
        Rencana.lab('rm_kj', 'Jenis', '<select id="rm_kj">' + Kejadian.JENIS.map((a) => '<option value="' + a[0] + '">' + a[1] + '</option>').join('') + '</select>') +
        Rencana.lab('rm_ji', 'Catatan (opsional)', '<textarea id="rm_ji" rows="3" maxlength="2000" placeholder="mis. Kutu daun di bedeng 2, disemprot"></textarea>');
    },
    isiEd(id, el) { const j = Jurnal.cari(id); if (!j) return; el.querySelector('#rm_jt').value = j.tanggal; el.querySelector('#rm_kj').value = j.kejadian || 'lainnya'; el.querySelector('#rm_ji').value = j.isi || ''; },
    ok(v, id) { return Kejadian.simpan(v, id, 'kejadian'); } },
  ukuran: { jenis: 'Jurnal siklus', judul: 'Catat ukuran', judulUbah: 'Ubah ukuran', simpan: 'Simpan ukuran', tab: 'siklus-detail', fokus: 'rm_un',
    isi() {
      const s = Siklus.cari(Siklus.sid), N = s ? Kejadian.namaUkuran(s) : [];
      return Rencana.lab('rm_jt', 'Tanggal', '<input type="date" id="rm_jt" value="' + isoHari() + '">') +
        Rencana.lab('rm_un', 'Nama ukuran', '<input id="rm_un" maxlength="30" autocomplete="off" list="rm_unl" placeholder="mis. Tinggi tanaman"><datalist id="rm_unl">' + N.map((n) => '<option value="' + esc(n) + '">').join('') + '</datalist>') +
        Rencana.lab('rm_uv', 'Nilai', '<input id="rm_uv" inputmode="decimal" autocomplete="off" placeholder="mis. 35">') +
        Rencana.lab('rm_us', 'Satuan (opsional)', '<input id="rm_us" maxlength="10" autocomplete="off" placeholder="mis. cm, g, kg">');
    },
    isiEd(id, el) { const j = Jurnal.cari(id); if (!j || !j.ukuran) return; el.querySelector('#rm_jt').value = j.tanggal; el.querySelector('#rm_un').value = j.ukuran.nama; el.querySelector('#rm_uv').value = String(j.ukuran.nilai).replace('.', ','); el.querySelector('#rm_us').value = j.ukuran.satuan || ''; },
    ok(v, id) { return Kejadian.simpan(v, id, 'ukuran'); } }
});

<script>
/* Buku Kebun — Laporan perjalanan siklus (Fase 6E Tahap 6, v0.1.103, docs/JURNAL.md bagian 7)
   Dokumen cetak polos satu siklus: ringkasan uang, tahap, catatan, kejadian, ukuran, panen, foto kecil (opsional).
   Dibuat dari detail siklus; memakai #cetak-lap seperti laporan lain (Analisa.cetakPasang melewatinya selama aktif). */
const Perjalanan = {
  aktif: false, urls: [], _cf: null,

  fotoJumlah(s) { return Jurnal.of(s.id).reduce((a, j) => a + (j.foto || []).length, 0); },
  /* tombol di bagian Ringkasan detail siklus */
  tombol(s) {
    const n = this.fotoJumlah(s) && typeof Foto !== 'undefined' && Foto.ada();
    return '<div class="seg no-print" style="margin-top:10px"><button type="button" class="btn" data-do="perjalanan-cetak" aria-label="Cetak laporan perjalanan siklus atau simpan PDF">Cetak perjalanan</button>' +
      (n ? '<button type="button" class="btn" data-do="perjalanan-cetak" data-foto="1" aria-label="Cetak laporan perjalanan siklus dengan foto">Dengan foto</button>' : '') + '</div>';
  },

  hari(s, tgl) { const h = Jurnal.hariKe(s, tgl); return h >= 1 ? h : '—'; },
  tab(kepala, baris, kls) {
    return '<table class="ct-tab' + (kls ? ' ' + kls : '') + '"><thead><tr>' + kepala.map((k) => '<th' + (k[1] ? ' class="n"' : '') + '>' + k[0] + '</th>').join('') + '</tr></thead><tbody>' + baris.join('') + '</tbody></table>';
  },
  bag(judul, isi) { return isi ? '<div class="ct-bag"><h2>' + judul + '</h2>' + isi + '</div>' : ''; },
  teks(j) { return esc(Jurnal.judul(j)) + (j.isi && j.judul ? '<br>' + esc(j.isi).replace(/\n/g, '<br>') : j.isi && !j.judul && String(j.isi).split('\n').length > 1 ? '<br>' + esc(String(j.isi).split('\n').slice(1).join('\n')).replace(/\n/g, '<br>') : ''); },
  foto(j, dgn) { return dgn && (j.foto || []).length ? '<div class="ct-foto">' + j.foto.map((id) => '<img alt="" data-foto="' + id + '">').join('') + '</div>' : ''; },

  /* isi dokumen; dgn = sertakan foto kecil */
  dok(s, dgn) {
    const k = Siklus.kom(s.komoditasId) || {}, sat = k.satuan || '', r = Siklus.ringkas(s.id), J = Jurnal.of(s.id).slice().reverse(), u = r.hasil - r.modal;
    const kv = (a, b) => '<tr><th>' + a + '</th><td class="n">' + b + '</td></tr>';
    const hari = Siklus.hari(s);
    /* uang */
    const kat = {}; r.tx.filter((t) => t.jenis === 'keluar').forEach((t) => { const n = App.namaKat(t.kategoriId); kat[n] = (kat[n] || 0) + t.jumlah; });
    const katBaris = Object.keys(kat).sort((a, b) => kat[b] - kat[a]).map((n) => '<tr><td>' + esc(n) + '</td><td class="n">' + rp(kat[n]) + '</td><td class="n">' + (r.modal ? Math.round(kat[n] / r.modal * 100) + '%' : '') + '</td></tr>');
    const uang = '<table class="ct-tab ct-kv">' + kv(u < 0 ? 'Rugi' : 'Untung', '<b>' + rp(u) + '</b>') + kv('Modal', rp(r.modal)) + kv('Hasil', rp(r.hasil)) + kv('R/C ratio', r.modal ? fmtRC(r.hasil / r.modal) : '—') +
      kv('Panen bersih', fmtN(r.bersih) + ' ' + esc(sat)) + (r.bersih > 0 && r.modal ? kv('Modal per ' + esc(sat), rp(Math.round(r.modal / r.bersih))) : '') + '</table>' +
      (katBaris.length ? '<h2 style="margin-top:9pt">Modal per kategori</h2>' + this.tab([['Kategori'], ['Jumlah', 1], ['Bagian', 1]], katBaris) : '');
    /* tahap */
    const T = J.filter((j) => j.jenis === 'tahap'), akhir = s.selesai || isoHari();
    const tahap = T.length ? this.tab([['Tahap'], ['Tanggal'], ['Hari ke', 1], ['Lama (hari)', 1]], T.map((j, i) => {
      const nx = T[i + 1], lama = Jurnal.hariKe(s, nx ? nx.tanggal : akhir) - Jurnal.hariKe(s, j.tanggal);
      return '<tr><td>' + esc(Tahap.nama(j)) + (j.isi ? '<br><span class="ct-cat">' + esc(j.isi) + '</span>' : '') + '</td><td>' + Setelan.tgl(j.tanggal) + '</td><td class="n">' + this.hari(s, j.tanggal) + '</td><td class="n">' + Math.max(0, lama) + (nx || s.status === 'selesai' ? '' : '*') + '</td></tr>' + (this.foto(j, dgn) ? '<tr><td colspan="4">' + this.foto(j, dgn) + '</td></tr>' : '');
    })) + (s.status === 'selesai' ? '' : '<p class="ct-cat">* tahap masih berjalan sampai ' + Setelan.tgl(akhir) + '</p>') : '';
    /* catatan, evaluasi */
    const C = J.filter((j) => j.jenis === 'catatan' && !j.evaluasi), ev = J.find((j) => j.evaluasi);
    const baris = (j, extra) => '<tr><td>' + Setelan.tgl(j.tanggal) + '</td><td class="n">' + this.hari(s, j.tanggal) + '</td><td>' + this.teks(j) + this.foto(j, dgn) + (extra || '') + '</td></tr>';
    const catatan = C.length ? this.tab([['Tanggal'], ['Hari', 1], ['Catatan']], C.map((j) => baris(j))) : '';
    const evaluasi = ev ? '<p style="margin:0 0 3pt;font-size:8.5pt;color:#333">' + Setelan.tgl(ev.tanggal) + ' · hari ' + this.hari(s, ev.tanggal) + '</p><div style="white-space:pre-wrap;overflow-wrap:anywhere">' + esc(ev.isi || '') + '</div>' + this.foto(ev, dgn) : '';
    /* kejadian */
    const K = J.filter((j) => j.jenis === 'kejadian');
    const kejadian = K.length ? this.tab([['Tanggal'], ['Hari', 1], ['Jenis'], ['Keterangan']], K.map((j) => '<tr><td>' + Setelan.tgl(j.tanggal) + '</td><td class="n">' + this.hari(s, j.tanggal) + '</td><td>' + esc(Kejadian.rincian(j)) + '</td><td>' + this.teks(j) + this.foto(j, dgn) + '</td></tr>')) : '';
    /* ukuran: per nama, dari awal ke akhir */
    const Uk = J.filter((j) => j.jenis === 'ukuran' && j.ukuran);
    const per = {}; Uk.forEach((j) => { (per[j.ukuran.nama] = per[j.ukuran.nama] || []).push(j); });
    const ukuran = Object.keys(per).length ? this.tab([['Ukuran'], ['Pengukuran', 1], ['Pertama'], ['Terakhir'], ['Perubahan', 1]], Object.keys(per).map((n) => {
      const L = per[n], a = L[0], b = L[L.length - 1], sa = a.ukuran.satuan ? ' ' + esc(a.ukuran.satuan) : '', d = b.ukuran.nilai - a.ukuran.nilai;
      return '<tr><td>' + esc(n) + '</td><td class="n">' + L.length + '</td><td>' + Kejadian.fmt(a.ukuran.nilai) + sa + '<br><span class="ct-cat">hari ' + this.hari(s, a.tanggal) + '</span></td><td>' + Kejadian.fmt(b.ukuran.nilai) + sa + '<br><span class="ct-cat">hari ' + this.hari(s, b.tanggal) + '</span></td><td class="n">' + (L.length > 1 ? (d > 0 ? '+' : d < 0 ? '−' : '') + Kejadian.fmt(Math.abs(d)) + sa : '—') + '</td></tr>';
    })) : '';
    /* panen */
    const P = Siklus.panenOf(s.id).slice().reverse();
    const panen = P.length ? this.tab([['Tanggal'], ['Hari', 1], ['Kotor', 1], ['Susut', 1], ['Bersih', 1], ['Harga/' + esc(sat), 1], ['Pembeli']], P.map((p) =>
      '<tr><td>' + Setelan.tgl(p.tanggal) + '</td><td class="n">' + this.hari(s, p.tanggal) + '</td><td class="n">' + fmtN(p.kuantitasKotor) + '</td><td class="n">' + fmtN(p.susut) + '</td><td class="n">' + fmtN(p.kuantitasKotor - p.susut) + '</td><td class="n">' + (p.hargaPerSatuan ? rp(p.hargaPerSatuan) : '—') + '</td><td>' + esc(p.pembeli || '') + '</td></tr>')) : '';
    /* kegiatan */
    const G = J.filter((j) => j.jenis === 'kegiatan');
    const keg = G.length ? '<p class="ct-cat" style="font-size:9pt">' + G.length + ' kali: ' + G.map((j) => esc(Jurnal.judul(j)) + ' (' + Setelan.tgl(j.tanggal) + ')').join('; ') + '</p>' : '';
    const kop = '<div class="ct-kop"><h1>Laporan Perjalanan Siklus</h1><p class="ct-sub">' + esc(Siklus.nama(s.id)) + '</p><table class="ct-meta"><tr><th>Status</th><td>' + (s.status === 'berjalan' ? 'Berjalan, hari ke-' + hari : 'Selesai, ' + hari + ' hari') + '</td><th>Dicetak</th><td>' + Setelan.tgl(isoHari()) + '</td></tr>' +
      '<tr><th>Mulai</th><td>' + Setelan.tgl(s.mulai) + (s.status === 'selesai' && s.selesai ? ' – ' + Setelan.tgl(s.selesai) : '') + '</td><th>Aplikasi</th><td>Buku Kebun v' + VERSI + '</td></tr></table></div>';
    return kop + this.bag('Ringkasan uang', uang) + this.bag('Tahap pertumbuhan', tahap) + this.bag('Catatan', catatan) + this.bag('Kejadian', kejadian) + this.bag('Ukuran', ukuran) + this.bag('Panen', panen) + this.bag('Kegiatan dikerjakan', keg) +
      this.bag('Evaluasi', evaluasi) + (s.catatan ? this.bag('Catatan siklus', '<div style="white-space:pre-wrap">' + esc(s.catatan) + '</div>') : '');
  },

  /* muat foto jadi gambar sementara, lalu cetak setelah semua gambar siap */
  async cetak(dgn) {
    const s = Siklus.cari(Siklus.sid); if (!s) return;
    this.lepas();
    const d = document.createElement('div'); d.id = 'cetak-lap'; d.className = 'ct-semua'; d.innerHTML = this.dok(s, dgn);
    document.body.appendChild(d); document.documentElement.classList.add('cetak-lap'); this.aktif = true;
    const L = [...d.querySelectorAll('img[data-foto]')];
    await Promise.all(L.map((im) => Nota.ambil(im.dataset.foto).then((r) => new Promise((ok) => {
      if (!r) { im.remove(); return ok(); }
      const u = URL.createObjectURL(r.blob); this.urls.push(u); im.onload = im.onerror = () => ok(); im.src = u;
    })).catch(() => im.remove())));
    window.print();
  },
  lepas() {
    this.urls.forEach((u) => URL.revokeObjectURL(u)); this.urls = []; this.aktif = false;
    const d = document.getElementById('cetak-lap'); if (d) d.remove(); document.documentElement.classList.remove('cetak-lap');
  },
  aksi(a, el) {
    if (a !== 'perjalanan-cetak') return false;
    const lb = el.textContent;
    if (Samar.aktif() && !this._cf) { // Tersembunyi: kertas memuat angka lengkap, minta ketukan kedua
      el.textContent = 'Ketuk lagi'; App.toast('Angka akan tercetak lengkap — ketuk sekali lagi');
      this._cf = setTimeout(() => { this._cf = null; if (el.isConnected) el.textContent = lb; }, 4000); return true;
    }
    clearTimeout(this._cf); this._cf = null;
    this.cetak(!!el.dataset.foto); return true;
  }
};

<script>
/* Buku Kebun — Pengalaman lintas siklus (Fase 6E Tahap 6, v0.1.103, docs/JURNAL.md bagian 7)
   Dari siklus SELESAI satu komoditas: panen pertama rata-rata hari ke-N dan lama rata-rata tiap tahap,
   dibandingkan dengan umur panen komoditas. Hanya saran; umur panen diubah bila pengguna mengetuk tombolnya. */
const Pengalaman = {
  /* panen pertama (hari ke-N) dan lama tiap tahap untuk satu siklus selesai */
  satu(s) {
    const P = Siklus.panenOf(s.id).slice().sort((a, b) => a.tanggal.localeCompare(b.tanggal));
    if (!P.length) return null;
    const hp = Jurnal.hariKe(s, P[0].tanggal), T = Jurnal.of(s.id).filter((j) => j.jenis === 'tahap').slice().sort((a, b) => a.tanggal.localeCompare(b.tanggal) || String(a.dibuat).localeCompare(String(b.dibuat)));
    const akhir = Jurnal.hariKe(s, s.selesai || P[0].tanggal), lama = {};
    T.forEach((j, i) => { const sd = T[i + 1] ? Jurnal.hariKe(s, T[i + 1].tanggal) : Math.max(hp, 0) || akhir; lama[j.tahap] = (lama[j.tahap] || 0) + Math.max(0, sd - Jurnal.hariKe(s, j.tanggal)); });
    return { hp: hp, lama: lama };
  },
  untuk(k) {
    const R = Siklus.daftar().filter((s) => s.komoditasId === k.id && s.status === 'selesai').map((s) => this.satu(s)).filter((r) => r && r.hp >= 1);
    if (!R.length) return null;
    const rata = (a) => Math.round(a.reduce((x, y) => x + y, 0) / a.length), tahap = {};
    R.forEach((r) => Object.keys(r.lama).forEach((kd) => (tahap[kd] = tahap[kd] || []).push(r.lama[kd])));
    const daftar = Tahap.paketKom(k).daftar.filter((t) => tahap[t.kode]).map((t) => ({ nama: t.nama, hari: rata(tahap[t.kode]), n: tahap[t.kode].length }));
    return { n: R.length, hp: rata(R.map((r) => r.hp)), min: Math.min.apply(null, R.map((r) => r.hp)), maks: Math.max.apply(null, R.map((r) => r.hp)), tahap: daftar };
  },
  /* blok di modal detail komoditas */
  v(k) {
    const p = this.untuk(k); if (!p) return '';
    const u = k.umurPanenHari, d = u ? p.hp - u : null, baris = (a, b) => '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>';
    return '<div class="dm-sub">Pengalaman ' + p.n + ' siklus selesai</div>' +
      baris('Panen pertama rata-rata', 'hari ke-' + p.hp + (p.n > 1 ? ' <span class="note">(' + p.min + '–' + p.maks + ')</span>' : '')) +
      (u ? baris('Umur panen sekarang', '±' + u + ' hari' + (d ? ' · <span class="' + (d > 0 ? 'down' : 'up') + '">' + (d > 0 ? 'lebih lambat ' : 'lebih cepat ') + Math.abs(d) + ' hari</span>' : ' · sama')) : '') +
      p.tahap.map((t) => baris(esc(t.nama), 'rata-rata ' + t.hari + ' hari' + (p.n > 1 ? ' <span class="note">(' + t.n + ' siklus)</span>' : ''))).join('') +

<script>
/* Buku Kebun — Umpan Jurnal lintas siklus (Fase 6E Tahap 7, v0.1.104, docs/JURNAL.md)
   Chip "Jurnal" di tab Siklus: semua entri jurnal dari siklus yang lolos saringan Unit/Komoditas, terbaru dulu,
   dengan pencarian kata kunci dan saringan jenis. Ketuk entri membuka modal detail seperti di linimasa. */
const Umpan = {

  JENIS: [['semua', 'Semua'], ['catatan', 'Catatan'], ['tahap', 'Tahap'], ['kejadian', 'Kejadian'], ['ukuran', 'Ukuran'], ['kegiatan', 'Kegiatan']],

  semua(base) {
    const out = [];

  },
  baris(e) {

      Setelan.tgl(j.tanggal) + ' · hari ' + h + ' · <span class="lm-tag">' + x.label + '</span></div><div class="tx-n">' + esc(x.judul) + '</div>' + (ket && ket !== x.judul ? '<div class="note">' + esc(ket) + '</div>' : '') +
      '<div class="note">' + esc(Siklus.nama(e.s.id)) + '</div></div></div>';

  hasil(base) {

  aksi(a, el) {

<script>
/* Buku Kebun — katalog harga pasar (input manual) dan pembanding harga (v0.1.052, docs/HARGA.md)
   Disimpan di komoditas.hargaPasar = [{ id, tanggal, harga, sumber }]; harga per satuan komoditas. */
const Harga = {
  pilih: '',
  daftar(k) { return (k.hargaPasar || []).slice().sort((a, b) => String(b.tanggal).localeCompare(a.tanggal)); },
  terakhir(k) { return k ? this.daftar(k)[0] || null : null; },
  /* perubahan harga terakhir terhadap sebelumnya: { pct } atau null */
  ubah(k) { const L = this.daftar(k); return L.length > 1 && L[1].harga ? { pct: Math.round((L[0].harga - L[1].harga) / L[1].harga * 100) } : null; },
  /* harga jual rata-rata sendiri (tertimbang jumlah panen bersih) untuk panen berharga 90 hari terakhir */
  sendiri(kid) {
    const batas = Jadwal.tambahHari(isoHari(), -90); let q = 0, nilai = 0;
    App.data.panen.filter((p) => !p.terhapus && p.hargaPerSatuan > 0 && p.tanggal >= batas).forEach((p) => {
      const s = Siklus.cari(p.siklusId); if (!s || s.komoditasId !== kid) return;
      const b = Math.max(0, p.kuantitasKotor - p.susut); q += b; nilai += b * p.hargaPerSatuan;
    });
    return q ? nilai / q : null;
  },
  pembanding(k) {
    const t = this.terakhir(k), h = this.sendiri(k.id); if (!t || !h) return '';
    const pct = Math.round((h - t.harga) / t.harga * 100);
    return this.baris('Harga jualmu (90 hari)', rp(Math.round(h)) + '/' + esc(k.satuan)) +
      this.baris('Dibanding pasar', pct === 0 ? 'sama' : '<span class="' + (pct > 0 ? 'up' : 'down') + '">' + Math.abs(pct) + '% ' + (pct > 0 ? 'di atas' : 'di bawah') + ' pasar</span>');
  },
  /* garis tren harga (maks. 12 catatan terakhir, urut waktu) */
  tren(L) {
    if (L.length < 2) return '';
    const P = L.slice(0, 12).reverse(), hs = P.map((p) => p.harga), mn = Math.min(...hs), mx = Math.max(...hs), n = P.length - 1;
    return '<svg class="kas-spark" viewBox="0 0 300 40" preserveAspectRatio="none" role="img" aria-label="Tren harga pasar ' + P.length + ' catatan terakhir"><polyline points="' + P.map((p, i) => (2 + i / n * 296).toFixed(1) + ',' + (37 - (p.harga - mn) / ((mx - mn) || 1) * 34).toFixed(1)).join(' ') + '"/></svg>';
  },
  baris(a, b) { return '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>'; },
  v() {
    const K = Siklus.koms();
    if (!K.length) return '<section><p class="note">Belum ada komoditas. Tambahkan dulu di menu Unit.</p></section>';
    const k = K.find((x) => x.id === this.pilih) || K[0]; this.pilih = k.id;
    const L = this.daftar(k), t = L[0], u = this.ubah(k);
    const opsi = K.map((x) => '<option value="' + x.id + '"' + (x.id === k.id ? ' selected' : '') + '>' + esc(x.nama) + '</option>').join('');
    const row = (p) => '<button type="button" class="ang-baris" data-rc="harga-detail" data-id="' + k.id + '|' + p.id + '" aria-label="Detail harga ' + Setelan.tgl(p.tanggal) + ' ' + rp(p.harga) + '"><div class="bar-top"><strong>' + rp(p.harga) + '/' + esc(k.satuan) + '</strong><span class="mu">' + Setelan.tgl(p.tanggal) + (p.sumber ? ' · ' + esc(p.sumber) : '') + '</span></div></button>';
    const hist = L.slice(0, 5).map(row).join(''), sisa = L.slice(5).map(row).join('');
    return '<section><p class="note">Catat harga pasar sendiri (manual) lewat tombol + untuk membandingkan dengan harga jualmu.</p>' +
      '<label for="hp_kom">Komoditas</label><select id="hp_kom" data-hk>' + opsi + '</select>' +
      (t ? '<div style="margin-top:12px">' + this.baris('Harga pasar terakhir', '<strong>' + rp(t.harga) + '/' + esc(k.satuan) + '</strong>') + this.baris('Dicatat', Setelan.tgl(t.tanggal) + (t.sumber ? ' · ' + esc(t.sumber) : '')) +
        (u ? this.baris('Dari catatan sebelumnya', u.pct === 0 ? 'tetap' : '<span class="' + (u.pct > 0 ? 'up' : 'down') + '">' + (u.pct > 0 ? '▲ ' : '▼ ') + Math.abs(u.pct) + '%</span>') : '') + this.pembanding(k) + '</div>' : '<p class="note" style="margin-top:12px">Belum ada harga pasar untuk ' + esc(k.nama) + '. Ketuk tombol + untuk mencatat.</p>') + '</section>' +
      (L.length ? '<section><h2>Riwayat</h2>' + this.tren(L) + '<div>' + hist + '</div>' + (sisa ? '<details class="lg-detail"><summary>Lihat semua (' + L.length + ')</summary><div>' + sisa + '</div></details>' : '') + '</section>' : '');
  },
  cek(h, tgl) {
    if (!(h > 0)) return 'Isi harga pasar lebih dari 0.';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl)) return 'Isi tanggal.';
    if (tgl > isoHari()) return 'Tanggal tidak boleh di masa depan.';
    return '';
  },
  /* simpan satu harga pasar; kembalikan pesan galat atau '' (dipanggil dari modal FAB, v0.1.055) */
  simpan(k, h, tgl, sumber) {
    const e = this.cek(h, tgl); if (e) return e;
    (k.hargaPasar = k.hargaPasar || []).push({ id: uid('h'), tanggal: tgl, harga: h, sumber: sumber });
    k.diubah = nowIso(); return '';
  },
  /* id gabungan "idKomoditas|idHarga" (v0.1.062) */
  cari(gid) {
    const [kid, hid] = String(gid).split('|'), k = Siklus.kom(kid), p = k && (k.hargaPasar || []).find((x) => x.id === hid);
    return p ? { k: k, p: p } : null;
  },
  edit(gid, h, tgl, sumber) {
    const r = this.cari(gid); if (!r) return 'Catatan harga tidak ditemukan.';
    const e = this.cek(h, tgl); if (e) return e;
    Object.assign(r.p, { harga: h, tanggal: tgl, sumber: sumber }); r.k.diubah = nowIso(); return '';
  },
  hapus(gid) {
    const r = this.cari(gid); if (!r) return;
    const i = r.k.hargaPasar.indexOf(r.p), rec = r.k.hargaPasar.splice(i, 1)[0], k = r.k; k.diubah = nowIso();
    Rencana.dlgTutup(true); App.simpan(); App.go('rencana', true); Modal.pulihFokus();
    App.toast('Harga pasar dihapus', { label: 'Urungkan', fn: () => { k.hargaPasar.push(rec); k.diubah = nowIso(); App.simpan(); App.go('rencana', true); } });
  }
};

<script>
/* Buku Kebun — kalkulator kelayakan usaha: NPV, IRR, balik modal, PI (v0.1.053, docs/KELAYAKAN.md)
   Model sederhana: investasi awal, arus kas bersih tetap per periode, nilai sisa di akhir. Tidak memakai data transaksi kecuali tombol isi cepat. */
const Kelayakan = {
  s: null,
  BAWAAN: { invest: '', net: '', n: '12', sisa: '', d: '12', unit: 'bulan' },
  muat() { if (!this.s) this.s = Object.assign({}, this.BAWAAN, App.data.pengaturan.kelayakan || {}); return this.s; },
  /* hitung dari angka mentah; kembalikan { galat } atau hasil */
  hitung(x) {
    const inv = Number(x.invest) || 0, net = Number(x.net) || 0, n = Number(x.n) || 0, sisa = Number(x.sisa) || 0, d = Number(x.d);
    if (!(inv > 0)) return { galat: 'Isi investasi awal lebih dari 0.' };
    if (!Number.isInteger(n) || n < 1 || n > 120) return { galat: 'Jumlah periode 1 sampai 120.' };
    if (!(d >= 0 && d <= 100)) return { galat: 'Diskonto per tahun 0 sampai 100%.' };
    const bln = x.unit !== 'tahun', r = bln ? Math.pow(1 + d / 100, 1 / 12) - 1 : d / 100;
    const cf = [-inv]; for (let t = 1; t <= n; t++) cf.push(net + (t === n ? sisa : 0));
    const npv = (rate) => cf.reduce((a, c, t) => a + c / Math.pow(1 + rate, t), 0);
    let irr = null, lo = -0.99, hi = 10;
    if (npv(lo) * npv(hi) < 0) { for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (npv(lo) * npv(m) <= 0) hi = m; else lo = m; } irr = (lo + hi) / 2; }
    let kum = -inv, balik = null;
    for (let t = 1; t <= n && balik === null; t++) { const baru = kum + cf[t]; if (baru >= 0 && cf[t] > 0) balik = t - 1 + (-kum) / cf[t]; kum = baru; }
    const total = cf.slice(1).reduce((a, c) => a + c, 0), v = npv(r);
    return { npv: v, irr: irr, irrTahun: irr === null ? null : (bln ? Math.pow(1 + irr, 12) - 1 : irr), balik: balik, pi: (v + inv) / inv, total: total, r: r, n: n, bln: bln, inv: inv, layak: v > 0 };
  },
  hasil(x) {
    const h = this.hitung(x); if (h.galat) return '<p class="note">' + esc(h.galat) + '</p>';
    const u = h.bln ? 'bulan' : 'tahun', baris = (a, b) => '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>', pct = (n) => (Math.round(n * 1000) / 10).toLocaleString('id-ID') + '%';
    return '<div class="row"><strong class="' + (h.layak ? 'up' : 'down') + '">' + (h.layak ? 'Layak' : 'Belum layak') + '</strong><span class="mu">' + (h.layak ? 'NPV positif' : 'NPV nol atau negatif') + '</span></div>' +
      baris('NPV (nilai sekarang bersih)', '<span class="' + (h.layak ? 'up' : 'down') + '">' + rp(Math.round(h.npv)) + '</span>') +
      baris('IRR per tahun', h.irrTahun === null ? 'tidak dapat dihitung' : pct(h.irrTahun)) +
      baris('Balik modal', h.balik === null ? 'tidak dalam ' + h.n + ' ' + u : (Math.round(h.balik * 10) / 10).toLocaleString('id-ID') + ' ' + u) +
      baris('Indeks profitabilitas (PI)', (Math.round(h.pi * 100) / 100).toLocaleString('id-ID')) +
      baris('Total arus kas masuk', rp(Math.round(h.total))) +
      '<p class="note">Layak bila NPV positif, yaitu IRR di atas diskonto. Diskonto ' + pct(h.r) + ' per ' + u + '. Model sederhana: arus kas dianggap tetap tiap periode.</p>';
  },
  v() {
    const s = this.muat(), f = (k) => s[k] === '' ? '' : fmtInput(Number(s[k]) || 0), unit = s.unit === 'tahun' ? 'tahun' : 'bulan';
    const inp = (id, lab, k, ph) => '<label for="kl_' + id + '">' + lab + '</label><input id="kl_' + id + '" data-kl="' + k + '" data-rp inputmode="numeric" autocomplete="off" placeholder="' + ph + '" value="' + f(k) + '">';
    return '<section><p class="note">Hitung apakah sebuah usaha atau investasi (mis. kolam, greenhouse, alat) layak dijalankan. Angka di sini tidak mengubah catatan keuanganmu.</p>' +
      '<div class="seg sm" style="justify-content:flex-start;margin:6px 0">' + [['bulan', 'Periode bulanan'], ['tahun', 'Periode tahunan']].map((x) => '<button type="button" class="btn' + (unit === x[0] ? ' on' : '') + '" data-rc="kl-unit" data-id="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>' +
      inp('invest', 'Investasi awal (Rp)', 'invest', '0') + inp('net', 'Arus kas bersih per ' + unit + ' (Rp)', 'net', '0') + inp('n', 'Jumlah ' + unit, 'n', '12') + inp('sisa', 'Nilai sisa di akhir (Rp, opsional)', 'sisa', '0') + '<label for="kl_d">Diskonto per tahun (%)</label><input id="kl_d" data-kl="d" inputmode="decimal" autocomplete="off" placeholder="12" value="' + esc(s.d) + '">' +
      '<div class="seg" style="margin-top:8px"><button type="button" class="btn" data-rc="kl-isi">Isi arus kas dari rata-rata 3 bulan</button></div></section>' +
      '<section><h2>Hasil</h2><div id="kl_hasil" aria-live="polite">' + this.hasil(s) + '</div></section>';
  },
  simpan() { App.data.pengaturan.kelayakan = Object.assign({}, this.s); App.simpan(); },
  /* dipanggil dari Rencana.klik */
  aksi(a, b) {
    const s = this.muat();
    if (a === 'kl-unit') { s.unit = b.dataset.id === 'tahun' ? 'tahun' : 'bulan'; }
    else if (a === 'kl-isi') { s.net = String(Math.round(Rencana.rata3())); s.unit = 'bulan'; if (!Number(s.net)) App.toast('Belum ada arus kas 3 bulan terakhir — isi manual'); }
    this.simpan(); App.go('rencana', true); return true;
  },
  masuk(e) {
    const i = e.target.closest && e.target.closest('[data-kl]'); if (!i) return;
    const s = this.muat(), k = i.dataset.kl;
    s[k] = k === 'd' ? i.value.replace(/[^\d.,]/g, '').replace(',', '.') : (i.value.trim() === '' ? '' : String(angka(i.value)));
    const h = document.getElementById('kl_hasil'); if (h) h.innerHTML = this.hasil(s);
    clearTimeout(this.t); this.t = setTimeout(() => this.simpan(), 600);
  }
};
document.addEventListener('input', (e) => Kelayakan.masuk(e));

</script>
<script>

const Xlsx = {
  /* ---------- ZIP (metode simpan, tanpa kompresi) ---------- */

  crc(b) {

<script>
/* Buku Kebun — Pratinjau impor data (v0.1.102, docs/IMPOR.md)
   Impor JSON (cadangan), CSV (transaksi), dan ZIP foto tidak lagi langsung berjalan: isi berkas dianalisis dulu (tanpa mengubah data),
   ditampilkan di modal (Modal, docs/MODAL.md), baru dijalankan setelah "Impor". Berhasil: toast ringkasan (+ Urungkan untuk JSON dan CSV). */
const Impor = {
  MAKSJSON: 20 * 1048576, MAKSCSV: 5 * 1048576,
  KOL: [['transaksi', 'Transaksi'], ['siklus', 'Siklus'], ['panen', 'Panen'], ['jurnal', 'Jurnal'], ['unit', 'Unit'], ['komoditas', 'Komoditas'], ['aset', 'Aset'], ['utang', 'Utang/piutang'], ['kategori', 'Kategori']],
  kb(n) { return n >= 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; },
  baris(a, b) { return '<div class="row"><span class="mu">' + a + '</span><span style="text-align:right">' + b + '</span></div>'; },
  berkas(i) { return i && i.nama ? this.baris('Berkas', esc(i.nama) + (i.ukuran ? ' · ' + this.kb(i.ukuran) : '')) : this.baris('Sumber', 'teks yang ditempel'); },
  galat(teks, lapor) { if (lapor) lapor(teks); App.toast(teks); },
  /* jendela pratinjau; o = { kicker, judul, isi (html), ok: { teks, fn } | null, fokus } */
  tampil(o) {
    if (Modal.m) { App.toast('Tutup jendela yang terbuka dulu'); return false; }
    return !!Modal.buka({ judulId: 'imJudul', tutupLatar: false, fokus: o.fokus || (o.ok ? 'imOk' : 'imBatal'),
      html: '<div class="dm-kepala"><div><div class="dm-jenis">' + o.kicker + '</div><h2 class="dm-judul" id="imJudul">' + o.judul + '</h2></div>' +
        '<button type="button" class="dm-x" data-im="tutup" aria-label="Tutup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
        '<div class="dm-isi">' + o.isi + '</div><div class="dm-aksi">' + (o.ok ? '<button type="button" class="btn gold" id="imOk" data-im="ok">' + o.ok.teks + '</button>' : '') +
        '<button type="button" class="btn" id="imBatal" data-im="tutup" style="width:100%">' + (o.ok ? 'Batal' : 'Tutup') + '</button></div>',
      klik: (e) => { const x = e.target.closest('[data-im]'); if (!x) return; if (x.dataset.im === 'tutup') Modal.tutup(); else if (o.ok) { Modal.tutup(true); o.ok.fn(); } } });
  },
  /* ---------- JSON: mengganti seluruh data ---------- */
  json(teks, info, lapor) {
    info = info || {};
    let o; try { o = JSON.parse(teks); } catch (e) { return this.galat('JSON tidak valid.', lapor); }
    const kunci = this.KOL.map((x) => x[0]);
    if (!o || typeof o !== 'object' || Array.isArray(o) || !kunci.some((k) => k in o)) return this.galat('Format tidak dikenali: ini bukan berkas ekspor Buku Kebun. Data tidak diubah.', lapor);
    const r = Store.dari(o), D = App.data, n = (d, k) => (d[k] || []).filter((x) => !x.terhapus).length;
    let tf = 0, tk = 0;
    const kini = [], file = [];
    const grid = this.KOL.map((x) => { const a = n(D, x[0]), b = n(r.data, x[0]); tk += a; tf += b; kini.push(a); file.push(b);
      return '<span>' + x[1] + '</span><span style="text-align:right">' + fmtN(a) + '</span><span style="text-align:right" class="' + (b < a ? 'down' : '') + '">' + fmtN(b) + '</span>'; }).join('');
    const terbaru = (d) => (d.transaksi || []).filter((t) => !t.terhapus).map((t) => t.tanggal).concat((d.jurnal || []).filter((j) => !j.terhapus).map((j) => j.tanggal)).sort().pop();
    const t1 = terbaru(D), t2 = terbaru(r.data);
    const isi = '<p class="note" style="margin:0 0 10px"><strong>Impor mengganti seluruh data</strong> di browser ini dengan isi berkas. Salinan data sekarang disimpan otomatis di Cadangan otomatis dan bisa diurungkan setelah impor.</p>' +
      this.berkas(info) + this.baris('Catatan terbaru', 'sekarang ' + (t1 ? Setelan.tgl(t1) : '—') + ' · berkas ' + (t2 ? Setelan.tgl(t2) : '—')) +

      (!tf ? '<p class="note down" style="margin-top:12px">Berkas ini tidak berisi data. Mengimpor akan mengosongkan data sekarang.</p>' : '') +

      const lama = App.data, h = App.pasangData(o);

      const pesan = 'Impor berhasil' + (ring ? ': ' + ring : '') + (h.dibuang ? ' (' + h.dibuang + ' bagian dilewati)' : '');
      if (lapor) lapor(pesan + '. Salinan data sebelumnya ada di Cadangan otomatis.');
      App.toast(pesan, { label: 'Urungkan', fn: () => { App.pasangData(lama); if (lapor) lapor('Impor diurungkan.'); App.toast('Impor diurungkan'); } });
    } } });
  },
  /* ---------- CSV: menambah transaksi ---------- */
  csv(a, info, lapor) {
    const sampel = a.baris.slice(0, 5).map((r) => '<div class="tx" style="cursor:default"><div class="tx-l"><div class="tx-n">' + esc(r.nama || '(tanpa kategori)') + '</div><div class="note">' + Setelan.tgl(r.tgl) + (r.catatan ? ' · ' + esc(r.catatan.slice(0, 40)) : '') + '</div></div><div class="tx-a ' + (r.jenis === 'masuk' ? 'up' : 'down') + '">' + (r.jenis === 'masuk' ? '+' : '−') + rp(r.jml) + '</div></div>').join('');
    const isi = this.berkas(info) + this.baris('Baris terbaca', fmtN(a.total)) + this.baris('Akan diimpor', '<strong>' + fmtN(a.baris.length) + ' transaksi</strong>') +
      (a.lewat ? this.baris('Dilewati', '<span class="down">' + fmtN(a.lewat) + ' baris</span>') : '') +
      (a.baris.length ? this.baris('Rentang tanggal', Setelan.tgl(a.dari) + ' – ' + Setelan.tgl(a.sampai)) + this.baris('Modal (keluar)', '<span class="down">' + rp(a.keluar) + '</span>') + this.baris('Hasil (masuk)', '<span class="up">' + rp(a.masuk) + '</span>') : '') +
      (a.kategoriBaru.length ? this.baris('Kategori baru', esc(a.kategoriBaru.join(', '))) : '') +
      (a.tanpaKategori ? this.baris('Tanpa kategori', fmtN(a.tanpaKategori) + ' baris (masuk ke kategori terakhir)') : '') +
      (a.kembar ? '<p class="note down" style="margin-top:12px">' + fmtN(a.kembar) + ' baris sama persis dengan transaksi yang sudah ada. Impor sekali lagi akan menggandakannya.</p>' : '') +
      (a.lewat ? '<p class="note" style="margin-top:12px">Baris dilewati bila tanggal bukan YYYY-MM-DD, jenis bukan masuk/keluar, atau jumlah tidak lebih dari 0.</p>' : '') +
      (sampel ? '<div class="dm-sub" style="font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-faint);margin:16px 0 2px">Contoh baris</div>' + sampel : '') +
      '<p class="note" style="margin-top:12px">Transaksi ditambahkan tanpa siklus; data yang ada tidak diganti.</p>';
    if (!a.baris.length) return this.tampil({ kicker: 'Impor CSV', judul: 'Tidak ada yang bisa diimpor', isi: isi, ok: null });
    return this.tampil({ kicker: 'Impor CSV', judul: 'Pratinjau impor', isi: isi, fokus: 'imOk', ok: { teks: 'Impor ' + fmtN(a.baris.length) + ' transaksi', fn: () => {
      const h = App.terapkanCsv(a), pesan = fmtN(h.ids.length) + ' transaksi diimpor' + (a.lewat ? ', ' + a.lewat + ' baris dilewati' : '');
      if (lapor) lapor(pesan + '.');
      App.toast('Impor berhasil: ' + pesan, { label: 'Urungkan', fn: () => { App.batalkanCsv(h); if (lapor) lapor('Impor diurungkan.'); App.toast('Impor diurungkan'); } });
    } } });
  },
  /* ---------- ZIP foto: menambah foto ---------- */
  foto(k, info, jalankan) {
    const isi = this.berkas(info) + this.baris('Foto di berkas', fmtN(k.baru + k.ada + k.lewat)) + this.baris('Akan dipulihkan', '<strong>' + fmtN(k.baru) + ' foto</strong>') +
      (k.ada ? this.baris('Sudah ada (dilewati)', fmtN(k.ada)) : '') + (k.lewat ? this.baris('Tidak valid (dilewati)', '<span class="down">' + fmtN(k.lewat) + '</span>') : '') +
      '<p class="note" style="margin-top:12px">Foto yang sudah ada di perangkat ini tidak diganti.</p>';
    return this.tampil({ kicker: 'Pulihkan foto dari ZIP', judul: 'Pratinjau pemulihan', isi: isi, fokus: 'imOk', ok: { teks: 'Pulihkan ' + fmtN(k.baru) + ' foto', fn: jalankan } });
  }
};

<script>
/* Buku Kebun — Foto jurnal siklus, lokal (v0.1.092, Fase 6E Tahap 4, docs/JURNAL.md)
   Memakai penyimpanan IndexedDB milik modul Nota (basis data "tani-nota"): foto dikecilkan (1280 px, JPEG) lalu disimpan sebagai blob.
   Catatan jurnal hanya menyimpan rujukan id foto di `jurnal.foto` (maks. 4, id berawalan f_). Foto tidak ikut ekspor JSON, cadangan otomatis,
   maupun sinkron cloud; di perangkat yang tidak punya fotonya, tampil penanda "tidak ada di perangkat ini". */
const Foto = {
  MAKS: 4, d: null,
  ada() { return typeof Nota !== 'undefined' && Nota.tersedia(); },

  /* ---------- draf formulir catatan ---------- */
  mulai(awal) { this.d = { awal: (awal || []).slice(), ids: (awal || []).slice(), baru: [], simpan: false, sibuk: 0 }; },
  ids() { return this.d ? this.d.ids.slice() : []; },
  /* catatan sudah tersimpan: foto lama yang dilepas dari catatan dihapus dari penyimpanan */
  disimpan() { const d = this.d; if (!d) return; d.simpan = true; d.awal.forEach((id) => { if (!d.ids.includes(id)) Nota.hapus(id); }); },
  /* modal ditutup: bila catatan tidak disimpan, foto yang baru dipilih dibuang */
  buang() { const d = this.d; this.d = null; if (!d || d.simpan) return; d.baru.forEach((id) => Nota.hapus(id)); },
  kotak() {
    return '<label for="f_jfoto">Foto (opsional, maksimal ' + this.MAKS + ')</label><div class="fj-box" id="fjBox" aria-live="polite"></div>' +
      '<input type="file" id="f_jfoto" accept="image/*" multiple hidden>';
  },
  isiBox() {
    const box = document.getElementById('fjBox'), d = this.d; if (!box || !d) return;
    if (!this.ada()) { box.innerHTML = '<p class="note">Foto tidak tersedia di browser ini.</p>'; return; }
    const t = d.ids.map((id, i) => '<div class="fj-t"><div class="fj-tb"><img alt="Foto ' + (i + 1) + '" data-foto="' + id + '"></div>' +
      '<button type="button" class="fj-x" data-rm="foto-lepas" data-id="' + id + '" aria-label="Hapus foto ' + (i + 1) + '">×</button></div>').join('');
    box.innerHTML = t + (d.ids.length < this.MAKS ? '<button type="button" class="btn nota-btn fj-tambah" data-rm="foto-pilih">' + (d.ids.length ? 'Tambah foto' : 'Ambil / pilih foto') + '</button>' : '') +
      '<p class="note">' + d.ids.length + ' dari ' + this.MAKS + ' foto · disimpan di browser ini</p>' + (d.sibuk ? '<p class="note" role="status">Memproses foto…</p>' : '');
    this.muat(box);
  },
  pilih(inp) {
    const d = this.d, fs = Array.prototype.slice.call(inp.files || []); inp.value = '';
    if (!d || !fs.length) return;
    const sisa = this.MAKS - d.ids.length;
    if (sisa <= 0) { App.toast('Maksimal ' + this.MAKS + ' foto'); return; }
    if (fs.length > sisa) App.toast('Hanya ' + sisa + ' foto lagi yang muat (maksimal ' + this.MAKS + ')');
    d.sibuk += 1; this.isiBox();
    fs.slice(0, sisa).reduce((p, f) => p.then(() => Nota.kecilkan(f)
      .then((b) => { const id = uid('f'); return Nota.simpan({ id: id, blob: b, tipe: b.type, ukuran: b.size, ms: Date.now() }).then(() => id); })
      .then((id) => { if (this.d !== d) { Nota.hapus(id); return; } d.ids.push(id); d.baru.push(id); this.isiBox(); })
      .catch((e) => { App.toast(Nota.galat(e)); })), Promise.resolve())
      .then(() => { if (this.d === d) { d.sibuk -= 1; this.isiBox(); } });
  },
  lepas(id) {
    const d = this.d; if (!d) return;

    if (d.baru.includes(id)) { d.baru = d.baru.filter((x) => x !== id); Nota.hapus(id); }

  },

  /* ---------- gambar kecil (galeri, detail, formulir) ---------- */
  muat(root) {
    if (!root || !this.ada()) return;
    root.querySelectorAll('img[data-foto]:not([data-ok])').forEach((im) => {
      im.dataset.ok = '1';
      Nota.ambil(im.dataset.foto).then((r) => {
        if (!im.isConnected) return;

      }).catch(() => { if (im.isConnected) this.hilang(im); });

  },
  hilang(im) {
    const p = im.parentNode; if (!p) return;
    p.classList.add('fj-hilang'); p.setAttribute('title', 'Foto tidak ada di perangkat ini (foto tidak ikut ekspor, cadangan, atau sinkron)');
    p.querySelectorAll('img').forEach((x) => x.remove());

  },
  /* deretan gambar kecil yang membuka penampil; attr = atribut aksi tiap tombol */
  galeri(j, attr, kelas) {

      '<button type="button" class="fj-th" ' + attr + ' data-id="' + j.id + '" data-i="' + i + '" aria-label="Lihat foto ' + (i + 1) + ' dari ' + L.length + '"><img alt="" data-foto="' + id + '"></button>').join('') + '</div>';
  },
  /* catatan dihapus: foto ikut dihapus setelah jendela Urungkan lewat; mengembalikan fungsi pembatal */
  hapusNanti(j) {
    const ids = (j.foto || []).slice(); if (!ids.length || !this.ada()) return () => {};

  },

  lihat(ids, i) {

      const t = ++tok;
      Nota.ambil(ids[k]).then((r) => {
        const im = document.getElementById('flImg'), hl = document.getElementById('flHilang'); if (t !== tok || !im) return;

      }).catch(() => { const hl = document.getElementById('flHilang'); if (t === tok && hl) { document.getElementById('flImg').hidden = true; hl.hidden = false; } });

    let el = null;
    const kd = (e) => { if (!Modal.m || Modal.m.el !== el) return; if (e.key === 'ArrowRight') { e.preventDefault(); ganti(1); } else if (e.key === 'ArrowLeft') { e.preventDefault(); ganti(-1); } };
    el = Modal.buka({ judulId: 'flJudul', fokus: 'flTutup', lapis: 'nota-lihat foto-lihat', kartu: 'nota-kartu', tutupLatar: true,
      html: '<h2 id="flJudul" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Foto catatan jurnal</h2>' +
        '<div class="fl-stage" id="flStage"><img id="flImg" alt="Foto catatan"><p class="fl-hilang" id="flHilang" hidden>Foto ini tidak ada di perangkat ini. Foto tidak ikut ekspor, cadangan, atau sinkron.</p></div>' +
        '<div class="fl-bar">' + (n > 1 ? '<button type="button" class="btn" data-fv="prev" aria-label="Foto sebelumnya">‹</button>' : '') + '<span class="fl-no" id="flNo" role="status" aria-live="polite"></span>' +

const Samar = {
  asli: new WeakMap(), ada: new Set(), mo: null, cetakan: false,
  RE: /[−-]?Rp[\s\u00a0]?\d[\d.,]*(?:[\s\u00a0]?(?:juta|jt|miliar|rb))?/g,
  aktif() { return !this.cetakan && !!Setelan.get('sembunyi') && !App.buka; },
  samarkan(n) {
    const v = n.nodeValue; this.RE.lastIndex = 0;
    if (!this.RE.test(v)) return; this.RE.lastIndex = 0;
    this.asli.set(n, v); this.ada.add(n); n.nodeValue = v.replace(this.RE, 'Rp ••••••');

  sapu(root) {

  pulihkan() { this.ada.forEach((n) => { if (n.isConnected && this.asli.has(n)) n.nodeValue = this.asli.get(n); }); this.ada.clear(); },
  terapkan() { if (this.aktif()) { this.sapu($('app')); const m = document.querySelector('.dm-lapis'); if (m) this.sapu(m); } else this.pulihkan(); },
  cetak(ya) { this.cetakan = ya; this.terapkan(); },

    if (this.LEAF.includes(this.tab) && prev && prev.t === t && (prev.sid || null) === (Siklus.sid || null)) { try { history.back(); return true; } catch (e) { /* lanjut dorong */ } }

      '<label for="k_jenis">Jenis</label><select id="k_jenis"><option value="keluar">Modal (keluar)</option><option value="masuk">Hasil (masuk)</option></select>' +
      '<button class="btn gold" data-do="tambah-kat">Tambah kategori</button></section>' +
      '<section><h2>Ekspor Excel</h2><p class="note">Satu berkas .xlsx berisi lembar Siklus, Transaksi, Panen, Utang dan piutang, Aset, Harga pasar, Jadwal, dan Jurnal (catatan, tahap, kejadian, ukuran). Untung dan R/C memakai rumus Excel. Cadangan yang bisa dipulihkan tetap JSON di Setelan.</p>' +
      '<button class="btn" data-do="ekspor-xlsx" style="width:100%;margin-top:12px">Ekspor Excel (.xlsx)</button><button class="btn" data-do="ekspor-csv-jurnal" style="width:100%;margin-top:8px">Ekspor CSV jurnal</button><div class="note" id="xlsMsg" role="status" aria-live="polite" style="margin-top:8px"></div></section>' +
      '<section><h2>Ekspor &amp; impor CSV</h2><p class="note">Kolom: tanggal, jenis (keluar/masuk), kategori, siklus, jumlah, catatan. Cadangan penuh (JSON) ada di Setelan. Sebelum diimpor, pratinjau ditampilkan dulu.</p>' +
      '<div class="seg tiga" style="margin-top:12px"><button class="btn" data-do="ekspor-csv">Ekspor CSV</button><button class="btn" data-do="impor-csv">Impor teks</button>' +
      '<button class="btn" data-do="berkas-csv">Pilih berkas</button></div>' +
      '<input type="file" id="csvFile" accept=".csv,text/csv" hidden>' +
      '<textarea id="csvBox" class="settings-text" rows="6" aria-label="Data CSV" placeholder="Hasil ekspor muncul di sini; tempel CSV untuk impor"></textarea>' +
      '<div class="note" id="csvMsg" role="status" aria-live="polite" style="margin-top:8px"></div></section>' +
      '';
  },

  /* ---------- aksi ---------- */
  toast(t, aksi) {
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = t; el.setAttribute('role', 'status');
    const ada = document.querySelectorAll('.toast').length; if (ada) el.style.marginBottom = ada * 52 + 'px'; /* toast bersamaan bertumpuk, tidak saling menimpa (v0.1.101) */
    const L = aksi ? (Array.isArray(aksi) ? aksi : [aksi]) : []; /* satu tombol atau beberapa (v0.1.100) */
    L.forEach((a) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'toast-btn'; b.textContent = a.label; b.onclick = () => { el.remove(); a.fn(); }; el.appendChild(b); });
    document.body.appendChild(el); setTimeout(() => el.remove(), L.length > 1 ? 6500 : L.length ? 5000 : 1800);
  },
  aksi(a, el) {
    if (a === 'tukar-tgl') { const f = this.filter, x = f.dari; f.dari = f.sampai; f.sampai = x; this.go('transaksi', true); return; }
    if (Nota.aksi(a)) return;
    if (a === 'tx-lagi') { this.batasTx += 100; const el = $('txHasil'); if (el) el.innerHTML = this.hasilTx(); return; }
    if (Siklus.aksi(a, el)) return;
    if (a === 'jenis-keluar' || a === 'jenis-masuk') {
      const d = this.bacaForm(); d.jenis = a.slice(6); d.kat = this.lastKat[d.jenis] || this.kategori(d.jenis)[0].id;
      this.go('catat', true);
    } else if (a === 'batal') { Nota.buang(this.draft); this.draft = null; this.go(this.balik || 'beranda'); }
    else if (a === 'simpan' || a === 'simpan-baru') this.simpanTx(a === 'simpan-baru');
    else if (a === 'dup-tx') {
      const d = this.bacaForm(); Nota.buang(d); this.draft = Object.assign({}, d, { id: null, tanggal: isoHari(), nota: null, notaLama: null, kunci: false }); this.hapusMinta = null;
      this.toast('Disalin sebagai transaksi baru — ubah bila perlu, lalu Simpan'); this.go('catat', true);
    } else if (a === 'hapus-tx') {
      const t = this.data.transaksi.find((x) => x.id === this.draft.id);
      if (!t || Utang.tahan(t)) return;
      t.terhapus = true; t.diubah = nowIso(); Utang.ikut(t, true); this.simpan();
      this.hapusMinta = null; this.draft = null; this.go(this.balik || 'beranda');
      this.toast('Transaksi dihapus', { label: 'Urungkan', fn: () => { t.terhapus = false; t.diubah = nowIso(); Utang.ikut(t, false); this.simpan(); this.go(this.tab, true); } });
    }
    else if (a === 'tambah-kat') this.tambahKat();
    else if (a === 'hapus-kat') {
      const k = this.data.kategori.find((x) => x.id === el.dataset.id);
      if (k) { k.terhapus = true; this.simpan(); this.go('lainnya', true); }
    }
    else if (a === 'ekspor-xlsx') { try { const n = Xlsx.unduh(); $('xlsMsg').textContent = 'Berkas Excel dibuat: ' + n + ' lembar berisi data.'; } catch (err) { $('xlsMsg').textContent = 'Ekspor Excel gagal. Coba ekspor CSV atau cadangan JSON.'; } }
    else if (a === 'ekspor-csv') this.eksporCsv();
    else if (a === 'ekspor-csv-jurnal') { const n = Kejadian.eksporCsvJurnal(); $('xlsMsg').textContent = n ? n + ' catatan jurnal diekspor ke CSV.' : 'Belum ada catatan jurnal untuk diekspor.'; }
    else if (a === 'impor-csv') this.imporCsv();
    else if (a === 'berkas-csv') $('csvFile').click();
    else if (a === 'contoh') this.contoh();
    else if (a === 'hapus-contoh') Contoh.hapus(el);
  },
  simpanTx(lagi) {
    const d = this.bacaForm();
    if (d.jumlah <= 0) { this.toast('Isi jumlah lebih dari 0'); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.tanggal)) { this.toast('Isi tanggal'); return; }
    const tLama = d.id && this.data.transaksi.find((x) => x.id === d.id), gal = Utang.cek(d.jumlah, d, tLama && Utang.tertaut(tLama));
    if (gal) { this.toast(gal); return; }
    const kat = this.semuaKat().find((k) => k.id === d.kat);
    const sifat = d.jenis === 'keluar' ? (kat && kat.sifatBiaya) || 'variabel' : null;
    let tx;
    if (d.id) {
      const t = tx = this.data.transaksi.find((x) => x.id === d.id);
      Object.assign(t, { tanggal: d.tanggal, jenis: d.jenis, kategoriId: d.kat, jumlah: d.jumlah, sifatBiaya: sifat, catatan: d.catatan, siklusId: d.siklus || null, notaId: d.nota || null, diubah: nowIso() });
    } else {
      this.data.transaksi.push(tx = { id: uid('t'), tanggal: d.tanggal, jenis: d.jenis, kategoriId: d.kat, jumlah: d.jumlah, siklusId: d.siklus || null,
        sifatBiaya: sifat, catatan: d.catatan, notaId: d.nota || null, dibuat: nowIso(), diubah: nowIso(), terhapus: false });
    }
    Utang.sinkron(tx, d);
    this.lastKat[d.jenis] = d.kat;
    if (d.notaLama && d.notaLama !== d.nota) Nota.hapus(d.notaLama);
    this.simpan();
    if (lagi) {
      this.draft = { id: null, jenis: d.jenis, jumlah: 0, kat: d.kat, tanggal: d.tanggal, catatan: '', siklus: d.siklus, nota: null, notaLama: null, ...Utang.d0() };
      this.toast('Transaksi tersimpan'); this.go('catat', true);
      const j = $('f_jumlah'); if (j) j.focus();
    } else { this.draft = null; this.toast(d.id ? 'Transaksi diperbarui' : 'Transaksi tersimpan'); this.go(['transaksi', 'siklus-detail', 'jurnal'].includes(this.balik) ? this.balik : 'beranda'); }
  },
  tambahKat() {
    const nama = $('k_nama').value.trim(), jenis = $('k_jenis').value;
    if (!nama) { this.toast('Isi nama kategori'); return; }
    if (this.kategori(jenis).some((k) => k.nama.toLowerCase() === nama.toLowerCase())) { this.toast('Kategori sudah ada'); return; }
    this.data.kategori.push({ id: uid('c'), nama, jenis, sifatBiaya: jenis === 'keluar' ? 'variabel' : null, bawaan: false, terhapus: false });
    this.simpan(); this.toast('Kategori ditambahkan'); this.go('lainnya', true);
  },

  /* ---------- CSV ---------- */
  eksporCsv() {
    const q = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
    const baris = ['tanggal,jenis,kategori,siklus,jumlah,catatan'].concat(
      this.aktif().slice().sort((a, b) => a.tanggal.localeCompare(b.tanggal)).map((t) =>
        [t.tanggal, t.jenis, q(this.namaKat(t.kategoriId)), q(t.siklusId || ''), t.jumlah, q(t.catatan)].join(',')));
    const csv = baris.join('\n');
    $('csvBox').value = csv;
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
      a.download = 'buku-kebun-transaksi-' + isoHari() + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) {}
    $('csvMsg').textContent = this.aktif().length + ' transaksi diekspor. Jika unduhan tidak mulai, salin teks di kotak.';
  },
  urai(teks) {
    const rows = []; let r = [], f = '', q = false;
    teks = teks.replace(/^\ufeff/, '');
    for (let i = 0; i < teks.length; i++) {
      const c = teks[i];
      if (q) { if (c === '"') { if (teks[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { r.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && teks[i + 1] === '\n') i++; r.push(f); f = ''; if (r.some((x) => x.trim())) rows.push(r); r = []; }
      else f += c;
    }
    r.push(f); if (r.some((x) => x.trim())) rows.push(r);
    return rows;
  },
  /* mengganti seluruh data dengan isi berkas (impor JSON, Urungkan impor); data lama dicadangkan otomatis */
  pasangData(o) { const r = Store.dari(o); Cadangan.catat('Sebelum impor', true); this.data = r.data; this.simpan(true); this.go(this.tab, true); return r; },
  /* impor CSV (v0.1.102): analisa dulu tanpa mengubah data, tampilkan pratinjau (Impor.csv), baru terapkan */
  analisaCsv(teks) {
    const rows = this.urai(teks || '');
    if (rows.length < 2) return { galat: 'CSV kosong atau tanpa baris data.' };
    const h = rows[0].map((x) => x.trim().toLowerCase()), ix = (n) => h.indexOf(n);
    if (ix('tanggal') < 0 || ix('jenis') < 0 || ix('jumlah') < 0) return { galat: 'Kolom tanggal, jenis, dan jumlah wajib ada.' };
    const data = rows.slice(1).filter((r) => r.some((c) => String(c).trim()));
    const a = { baris: [], lewat: 0, total: data.length, masuk: 0, keluar: 0, dari: '', sampai: '', kategoriBaru: [], tanpaKategori: 0, kembar: 0 }, baru = {};
    const ada = new Set(this.aktif().map((t) => [t.tanggal, t.jenis, t.jumlah, t.catatan || ''].join('|')));
    data.forEach((r) => {
      const tgl = (r[ix('tanggal')] || '').trim(), jenis = (r[ix('jenis')] || '').trim().toLowerCase(), jml = angka(r[ix('jumlah')]);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl) || (jenis !== 'keluar' && jenis !== 'masuk') || jml <= 0) { a.lewat++; return; }
      const nama = ix('kategori') >= 0 ? (r[ix('kategori')] || '').trim() : '', catatan = ix('catatan') >= 0 ? (r[ix('catatan')] || '').trim() : '';
      a.baris.push({ tgl: tgl, jenis: jenis, jml: jml, nama: nama, catatan: catatan }); a[jenis === 'masuk' ? 'masuk' : 'keluar'] += jml;
      if (!a.dari || tgl < a.dari) a.dari = tgl; if (!a.sampai || tgl > a.sampai) a.sampai = tgl;
      if (!nama) a.tanpaKategori++; else if (!this.kategori(jenis).some((x) => x.nama.toLowerCase() === nama.toLowerCase())) baru[jenis + '|' + nama.toLowerCase()] = nama;
      if (ada.has([tgl, jenis, jml, catatan].join('|'))) a.kembar++;
    });
    a.kategoriBaru = Object.keys(baru).map((k) => baru[k]);
    return a;
  },
  terapkanCsv(a) {
    const ids = [], kat = [];
    a.baris.forEach((r) => {
      let k = this.kategori(r.jenis).find((x) => x.nama.toLowerCase() === r.nama.toLowerCase());
      if (!k && r.nama) { k = { id: uid('c'), nama: r.nama, jenis: r.jenis, sifatBiaya: r.jenis === 'keluar' ? 'variabel' : null, bawaan: false, terhapus: false }; this.data.kategori.push(k); kat.push(k.id); }
      if (!k) k = this.kategori(r.jenis).slice(-1)[0];
      const t = { id: uid('t'), tanggal: r.tgl, jenis: r.jenis, kategoriId: k.id, jumlah: r.jml, siklusId: null,
        sifatBiaya: r.jenis === 'keluar' ? k.sifatBiaya || 'variabel' : null, catatan: r.catatan, dibuat: nowIso(), diubah: nowIso(), terhapus: false };
      this.data.transaksi.push(t); ids.push(t.id);
    });
    this.simpan(); this.ringkas();
    return { ids: ids, kat: kat };
  },
  batalkanCsv(h) { // Urungkan: hapus lunak transaksi dan kategori yang baru dibuat oleh impor itu
    const n = nowIso();
    this.data.transaksi.forEach((t) => { if (h.ids.includes(t.id)) { t.terhapus = true; t.diubah = n; } });
    this.data.kategori.forEach((k) => { if (h.kat.includes(k.id)) { k.terhapus = true; k.diubah = n; } });
    this.simpan(); this.ringkas(); this.go(this.tab, true);
  },
  imporCsv(info) {
    const a = this.analisaCsv($('csvBox').value || ''), pesan = (t) => { const e = $('csvMsg'); if (e) e.textContent = t; };
    if (a.galat) { pesan(a.galat); this.toast(a.galat); return; }
    Impor.csv(a, info, pesan);
  },
  contoh() { Contoh.isi(); }
};

document.addEventListener('DOMContentLoaded', () => App.init());

</script>
