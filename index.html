    const bar = V.map((x, i) => { const h = Math.max(1, Math.abs(x[1]) / mx * 38), up = x[1] >= 0;
      return '<rect class="' + (up ? 'kas-up' : 'kas-down') + '" x="' + (i * w + 4).toFixed(1) + '" y="' + (up ? 44 - h : 44).toFixed(1) + '" width="' + (w - 8).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2"' + (x[2] ? ' opacity=".4"' : '') + '/>' +
        '<text class="kas-lbl" x="' + (i * w + w / 2).toFixed(1) + '" y="97" text-anchor="middle">' + this.BLN[+x[0].slice(5, 7) - 1] + '</text>'; }).join('');

  },
  v_kas() {
    const r = this.rata3(), B = [-5, -4, -3, -2, -1, 0].map((n) => this.bulanKe(n));

<script>
/* Tani Keuangan — cadangan otomatis di browser (v0.1.019) */

  var KUNCI = 'tani.cadangan', MAKS = 7, JEDA = 5 * 60 * 1000;
  var h = { ambil: function () { return {}; }, pulih: function () {}, segar: function () {} };
  var yakin = null, tunda = null;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hariIni() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function baca() { try { var a = JSON.parse(Penyimpanan.get(KUNCI) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function tulis(a) {
    while (a.length) {
      try { Penyimpanan.set(KUNCI, JSON.stringify(a)); return true; } catch (e) { a.pop(); }
    }
    try { Penyimpanan.del(KUNCI); } catch (e) {}

  }
  function aktif(l) { return (l || []).filter(function (x) { return !x.terhapus; }).length; }

  function milik(l) { return (l || []).filter(function (x) { return !x.terhapus && !x.contoh; }).length; }

    return !milik(d.transaksi) && !milik(d.siklus) && !milik(d.unit) && !milik(d.aset) && !milik(d.utang) && !milik(d.komoditas);

    return '<div class="sec-head"><h2>Cadangan otomatis</h2><div class="note">Maksimal ' + MAKS + ' salinan di browser ini: satu per hari, ditambah salinan sebelum impor, hapus, atau pemulihan. Ikut hilang bila data browser dibersihkan, jadi tetap ekspor berkala.</div></div>' +
      daftar +
      '<div class="seg sm" style="margin-top:8px"><button type="button" class="btn" data-cad="sekarang">Cadangkan sekarang</button>' +
      (a.length ? '<button type="button" class="btn danger" data-cad="hapus">Hapus semua cadangan</button>' : '') + '</div>';
  }

  function konfirmasi(tombol, kunci, teks, jalan) {
    if (yakin && yakin.kunci === kunci) { clearTimeout(yakin.t); yakin = null; jalan(); return; }
    if (yakin) { clearTimeout(yakin.t); yakin = null; }

  }

  function html() {

  /* null = FAB disembunyikan; { nama, aksi } = satu ketukan; { nama, pilih: [[label, fungsi]] } = pilihan melayang */

/* Tani Keuangan — geser ke kiri untuk hapus transaksi, dengan Urungkan (v0.1.032) */
const Geser = {
  r: null, x0: 0, y0: 0, dx: 0, arah: '', baru: 0,
  tutup() { document.querySelectorAll('.tx.geser').forEach((e) => { e.classList.remove('geser'); e.style.transform = ''; }); },
  hapus(id) {

    if (Utang.tahan(t)) { this.tutup(); return; }
    t.terhapus = true; t.diubah = nowIso(); Utang.ikut(t, true); App.simpan(); App.go(App.tab, true);
    App.toast('Transaksi dihapus', { label: 'Urungkan', fn: () => { t.terhapus = false; t.diubah = nowIso(); Utang.ikut(t, false); App.simpan(); App.go(App.tab, true); } });
  },
  mulai(e) {
    const r = e.target.closest && e.target.closest('.tx[data-edit]');
    if (!r || e.target.closest('.tx-hapus')) { if (!(e.target.closest && e.target.closest('.tx-hapus'))) this.tutup(); this.r = null; return; }
    if (!r.classList.contains('geser')) this.tutup();
    if (!r.querySelector('.tx-hapus')) { const b = document.createElement('button'); b.type = 'button'; b.className = 'tx-hapus'; b.dataset.hapus = r.dataset.edit; b.textContent = 'Hapus'; r.appendChild(b); }
    const p = e.touches[0]; this.r = r; this.x0 = p.clientX; this.y0 = p.clientY; this.dx = 0; this.arah = ''; this.awal = r.classList.contains('geser') ? -96 : 0;
  },
  gerak(e) {
    if (!this.r) return; const p = e.touches[0], dx = p.clientX - this.x0, dy = p.clientY - this.y0;
    if (!this.arah && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) this.arah = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    if (this.arah !== 'h') return;
    this.dx = dx; this.r.classList.add('menggeser'); this.r.style.transition = 'none';
    this.r.style.transform = 'translateX(' + Math.min(0, Math.max(-96, this.awal + dx)) + 'px)';
  },
  selesai() {
    const r = this.r; if (!r) return; this.r = null;
    r.style.transition = ''; r.classList.remove('menggeser');
    if (this.arah === 'h') { this.baru = Date.now(); const buka = this.awal + this.dx < -48; r.classList.toggle('geser', buka); r.style.transform = ''; }
  }
};
document.addEventListener('touchstart', (e) => Geser.mulai(e), { passive: true });
document.addEventListener('touchmove', (e) => Geser.gerak(e), { passive: true });
document.addEventListener('touchend', () => Geser.selesai());
document.addEventListener('touchcancel', () => Geser.selesai());
document.addEventListener('click', (e) => {
  const h = e.target.closest && e.target.closest('.tx-hapus'); if (h) { e.stopPropagation(); Geser.hapus(h.dataset.hapus); return; }
  const r = e.target.closest && e.target.closest('.tx.geser');
  if (Date.now() - Geser.baru < 350 || r) { e.stopPropagation(); e.preventDefault(); if (r) Geser.tutup(); }
}, true);

<script>
/* Tani Keuangan — pembayaran Tunai / Belum dibayar / Sebagian, tombol Bayar + cicilan, dan perhitungan kas (v0.1.049, docs/UTANG.md)
   Transaksi selalu menyimpan nilai penuh (untung, HPP, laporan memakai nilai ini).
   Bagian yang belum dibayar menjadi catatan utang/piutang tertaut (utang.transaksiId); pembayarannya di utang.bayar.
   Kas = bagian tunai transaksi + pembayaran utang/piutang, bukan jumlah semua transaksi. */
const Utang = {
  MODE: [['tunai', 'Tunai (lunas)'], ['belum', 'Belum dibayar'], ['sebagian', 'Sebagian dibayar']],
  d0() { return { bayar: 'tunai', muka: 0, pihak: '', tempo: '', kunci: false }; },
  semua(t) { return App.data.utang.filter((u) => u.transaksiId === t.id); },
  tertaut(t) { return App.data.utang.find((u) => u.transaksiId === t.id && !u.terhapus) || null; },
  dibayar(u) { return (u.bayar || []).reduce((a, p) => a + p.jumlah, 0); },
  sisa(u) { return u.transaksiId ? Math.max(0, u.jumlah - this.dibayar(u)) : (u.lunas ? 0 : u.jumlah); },
  ada(u) { return !!(u.bayar && u.bayar.length); },
  /* isi draft form dari utang tertaut (mode, uang muka, pihak, tempo, terkunci bila sudah ada pembayaran) */
  dari(t) {
    const u = this.tertaut(t); if (!u) return this.d0();
    const muka = Math.max(0, t.jumlah - u.jumlah);
    return { bayar: muka > 0 ? 'sebagian' : 'belum', muka, pihak: u.pihak || '', tempo: u.jatuhTempo || '', kunci: this.ada(u) };
  },
  /* periksa isian pembayaran; kembalikan pesan galat atau '' */
  cek(jumlah, s, u) {
    if (s.kunci) return u && jumlah < u.jumlah ? 'Jumlah tidak boleh lebih kecil dari utang yang tercatat (' + rp(u.jumlah) + ')' : '';
    if (s.bayar === 'tunai') return '';
    if (!String(s.pihak || '').trim()) return 'Isi nama pihak (pemasok atau pembeli)';
    if (s.bayar === 'sebagian' && !(s.muka > 0 && s.muka < jumlah)) return 'Uang muka harus lebih dari 0 dan kurang dari jumlah';
    return '';
  },
  /* samakan catatan utang dengan transaksi t setelah disimpan */
  sinkron(t, s) {
    const D = App.data, u = this.tertaut(t), jenis = t.jenis === 'keluar' ? 'utang' : 'piutang';
    if (s.kunci && u) { u.jenis = jenis; u.diubah = nowIso(); return; }
    const sisa = s.bayar === 'tunai' ? 0 : s.bayar === 'belum' ? t.jumlah : t.jumlah - s.muka;
    if (sisa > 0) {
      const f = { jenis, pihak: String(s.pihak).trim(), jumlah: sisa, jatuhTempo: s.tempo || '', lunas: false, diubah: nowIso() };
      const lama = u || this.semua(t).find((x) => x.terhapus && !this.ada(x)); // pulihkan catatan lama agar tidak kembar
      if (lama) Object.assign(lama, f, { terhapus: false });
      else D.utang.push(Object.assign({ id: uid('u'), transaksiId: t.id, bayar: [], dibuat: nowIso(), terhapus: false }, f));
    } else if (u) { u.terhapus = true; u.diubah = nowIso(); }
  },
  /* hapus/pulihkan utang tertaut bersama transaksinya */
  ikut(t, hapus) { this.semua(t).forEach((u) => { u.terhapus = hapus; u.diubah = nowIso(); }); },
  /* utang tertaut yang sudah ada pembayarannya menahan penghapusan transaksi */
  tahan(t) {
    const u = this.tertaut(t);
    if (u && this.ada(u)) { App.toast('Sudah ada pembayaran. Buka lagi dulu di Rencana → Utang/piutang'); return true; }
    return false;
  },
  /* ---------- pembayaran / cicilan (tahap 2, v0.1.049) ----------
     Pembayaran = { id, tanggal, jumlah } di utang.bayar. Hanya menggerakkan kas, bukan transaksi Modal/Hasil baru.
     Lunas otomatis saat sisa nol; hapus pembayaran membuka lagi. */
  tx(u) { return App.data.transaksi.find((x) => x.id === u.transaksiId) || null; },
  segar(u) { u.lunas = this.sisa(u) <= 0; u.diubah = nowIso(); },
  /* tanggal bayar paling akhir yang boleh (hari ini, atau tanggal transaksi bila di masa depan) */
  tglMaks(u) { const t = this.tx(u), h = isoHari(); return t && t.tanggal > h ? t.tanggal : h; },
  /* periksa isian pembayaran; kembalikan pesan galat atau '' */
  cekBayar(u, jumlah, tgl) {
    const t = this.tx(u), sisa = this.sisa(u);
    if (!(jumlah > 0)) return 'Isi jumlah pembayaran lebih dari 0';
    if (jumlah > sisa) return 'Jumlah melebihi sisa (' + rp(sisa) + ')';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl || '')) return 'Isi tanggal bayar';
    if (t && tgl < t.tanggal) return 'Tanggal bayar sebelum tanggal transaksi (' + Setelan.tgl(t.tanggal) + ')';
    if (tgl > this.tglMaks(u)) return 'Tanggal bayar tidak boleh di masa depan';
    return '';
  },
  catatBayar(u, jumlah, tgl) {
    (u.bayar = u.bayar || []).push({ id: uid('b'), tanggal: tgl, jumlah: jumlah });
    u.bayar.sort((a, b) => String(a.tanggal).localeCompare(b.tanggal));
    this.segar(u);
  },
  /* hapus satu pembayaran; kembalikan catatannya agar bisa dipulihkan lewat Urungkan */
  hapusBayar(u, bid) {
    const i = (u.bayar || []).findIndex((p) => p.id === bid); if (i < 0) return null;
    const rec = u.bayar.splice(i, 1)[0]; this.segar(u); return rec;
  },
  pulihBayar(u, rec) {
    (u.bayar = u.bayar || []).push(rec); u.bayar.sort((a, b) => String(a.tanggal).localeCompare(b.tanggal)); this.segar(u);
  },

  /* ---------- jendela Bayar ---------- */
  dlg: null,
  dlgBuka(u) {
    const t = this.tx(u); if (Modal.m || !t || this.sisa(u) <= 0) return;
    const sisa = this.sisa(u), byr = this.dibayar(u), keluar = u.jenis === 'utang';
    const row = (a, b) => '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>';
    this.dlg = { id: u.id };
    Modal.buka({
      judulId: 'ubJudul', fokus: 'ub_jumlah', tutupLatar: false,
      html: '<div class="dm-kepala"><div><div class="dm-jenis">' + (keluar ? 'Bayar utang' : 'Terima pembayaran piutang') + '</div><h2 class="dm-judul" id="ubJudul">' + esc(u.pihak) + '</h2></div>' +
        '<button type="button" class="dm-x" data-ub="tutup" aria-label="Tutup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
        '<div class="dm-isi">' + row('Jumlah ' + u.jenis, rp(u.jumlah)) + (byr ? row('Sudah dibayar', rp(byr)) : '') + row('Sisa', '<strong>' + rp(sisa) + '</strong>') +
        '<label for="ub_jumlah">' + (keluar ? 'Dibayar sekarang (Rp)' : 'Diterima sekarang (Rp)') + '</label><input id="ub_jumlah" data-rp inputmode="numeric" autocomplete="off" placeholder="0" value="' + fmtInput(sisa) + '">' +
        '<div class="seg sm" style="justify-content:flex-start;margin-top:8px"><button type="button" class="btn" data-ub="semua">Semua sisa</button></div>' +
        '<label for="ub_tgl">Tanggal ' + (keluar ? 'bayar' : 'terima') + '</label><input type="date" id="ub_tgl" min="' + esc(t.tanggal) + '" max="' + esc(this.tglMaks(u)) + '" value="' + esc(this.tglMaks(u)) + '">' +
        '<p class="note" style="margin-top:8px">Bisa dicicil: isi sebagian saja, sisanya tetap tercatat. Pembayaran hanya menggerakkan kas, tidak mengubah untung atau HPP.</p></div>' +
        '<div class="dm-aksi"><button type="button" class="btn gold" data-ub="simpan">Simpan pembayaran</button><button type="button" class="btn" data-ub="tutup" style="width:100%">Batal</button></div>',
      klik: (e) => {
        const b = e.target.closest('[data-ub]'); if (!b) return; const a = b.dataset.ub;
        if (a === 'tutup') Modal.tutup();
        else if (a === 'semua') { const i = document.getElementById('ub_jumlah'); i.value = fmtInput(this.sisa(u)); i.focus(); }
        else if (a === 'simpan') this.dlgSimpan(u);
      },
      simpan: () => this.dlgSimpan(u),
      onTutup: () => { this.dlg = null; }
    });
  },
  dlgTutup(tanpaFokus) { Modal.tutup(tanpaFokus); },
  dlgSimpan(u) {
    const g = (i) => document.getElementById(i).value, j = angka(g('ub_jumlah')), tgl = g('ub_tgl'), gal = this.cekBayar(u, j, tgl);
    if (gal) { Modal.galat(gal); return; }
    this.catatBayar(u, j, tgl);
    const sisa = this.sisa(u);
    Modal.tutup(true); App.simpan(); App.go('rencana', true); Modal.pulihFokus();
    App.toast(sisa <= 0 ? 'Lunas. Pembayaran tersimpan' : 'Pembayaran tersimpan, sisa ' + rp(sisa));
  },

  /* ---------- kas: uang yang benar-benar bergerak ---------- */
  peristiwa() {
    const out = [];
    App.aktif().forEach((t) => {
      const u = this.tertaut(t), tunai = t.jumlah - (u ? Math.min(u.jumlah, t.jumlah) : 0);
      out.push({ tgl: t.tanggal, n: (t.jenis === 'masuk' ? 1 : -1) * tunai });
      if (u) (u.bayar || []).forEach((p) => out.push({ tgl: p.tanggal, n: (u.jenis === 'piutang' ? 1 : -1) * p.jumlah }));
    });
    return out;
  },
  saldoAwal() { return Number(App.data.pengaturan.saldoAwal) || 0; },
  saldo() { return this.saldoAwal() + this.peristiwa().reduce((a, e) => a + e.n, 0); },
  saldoSd(k) { return this.saldoAwal() + this.peristiwa().filter((e) => e.tgl.slice(0, 7) <= k).reduce((a, e) => a + e.n, 0); },
  net(k) { return this.peristiwa().filter((e) => e.tgl.slice(0, 7) === k).reduce((a, e) => a + e.n, 0); },

  /* ---------- tampilan: kotak pembayaran di form ---------- */
  /* pre: awalan id ('f' atau 'p'); pihakId: id isian pihak yang sudah ada di form (panen: p_pembeli) atau '' bila perlu isian pihak sendiri */
  kotak(s, pre, lbPihak, pihakId) {
    if (s.kunci) return '<p class="note" style="margin-top:12px">Utang/piutang transaksi ini sudah ada pembayarannya. Ubah lewat Rencana → Utang/piutang (Buka lagi) bila perlu.</p>';
    const o = this.MODE.map((m) => '<option value="' + m[0] + '"' + (s.bayar === m[0] ? ' selected' : '') + '>' + m[1] + '</option>').join('');
    let h = '<label for="' + pre + '_bayar">Pembayaran</label><select id="' + pre + '_bayar">' + o + '</select>';
    if (s.bayar === 'tunai') return h;
    if (s.bayar === 'sebagian') h += '<label for="' + pre + '_muka">Dibayar di muka (Rp)</label><input id="' + pre + '_muka" data-rp inputmode="numeric" autocomplete="off" placeholder="0" value="' + fmtInput(s.muka) + '">';
    if (!pihakId) h += '<label for="' + pre + '_pihak">' + lbPihak + '</label><input id="' + pre + '_pihak" maxlength="60" value="' + esc(s.pihak) + '">';
    h += '<label for="' + pre + '_tempo">Jatuh tempo (opsional)</label><input type="date" id="' + pre + '_tempo" value="' + esc(s.tempo) + '">';
    return h + '<p class="note" style="margin-top:8px">Nilai penuh tetap dihitung di untung dan HPP. Kas hanya berubah sebesar yang dibayar. Sisanya masuk Rencana → Utang/piutang.</p>';
  },
  /* baca isian kotak dari form ke objek s (nilai lama dipertahankan bila elemen tidak ada) */
  baca(s, pre) {
    const g = (i) => document.getElementById(pre + '_' + i);
    if (g('bayar')) s.bayar = g('bayar').value;
    if (g('muka')) s.muka = angka(g('muka').value); else if (s.bayar !== 'sebagian') s.muka = 0;
    if (g('pihak')) s.pihak = g('pihak').value;
    if (g('tempo')) s.tempo = g('tempo').value;
    return s;
  }
};

</script>
<script>
/* Tani Keuangan — jadwal kegiatan per siklus: pupuk, semprot, dsb., sekali atau berulang (v0.1.051, docs/JADWAL.md)
   Disimpan di siklus.jadwal = [{ id, nama, tanggal, ulang, selesai, terakhir }]; ulang = tiap N hari (0 = sekali). */
const Jadwal = {
  tambahHari(iso, n) { const [y, m, d] = iso.split('-').map(Number); return isoHari(new Date(y, m - 1, d + n)); },
  selisih(iso) { const [y, m, d] = iso.split('-').map(Number), n = new Date(); return Math.round((new Date(y, m - 1, d) - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5); },
  daftar(s) { return (s.jadwal || []).slice().sort((a, b) => (!!a.selesai - !!b.selesai) || String(a.tanggal).localeCompare(b.tanggal)); },
  /* teks status: lewat / hari ini / sekian hari lagi */
  teks(j) { const n = this.selisih(j.tanggal); return n < 0 ? 'lewat ' + (-n) + ' hari' : n === 0 ? 'hari ini' : n + ' hari lagi'; },
  /* kegiatan yang perlu diingatkan di Beranda: siklus berjalan, belum selesai, jatuh tempo dalam 3 hari atau sudah lewat */
  mendekat() {
    const out = [];
    Siklus.daftar().filter((s) => s.status === 'berjalan').forEach((s) => (s.jadwal || []).filter((j) => !j.selesai && this.selisih(j.tanggal) <= 3).forEach((j) => out.push({ s: s, j: j, n: this.selisih(j.tanggal) })));
    return out.sort((a, b) => a.n - b.n);
  },
  v(s) {
    const jalan = s.status === 'berjalan', L = this.daftar(s);
    if (!jalan && !L.length) return '';
    const baris = (j) => { const n = this.selisih(j.tanggal), telat = !j.selesai && n < 0;
      return '<button type="button" class="ang-baris" style="opacity:' + (j.selesai ? '.55' : '1') + '" data-do="jadwal-detail" data-id="' + j.id + '" aria-haspopup="dialog" aria-label="Detail kegiatan ' + esc(j.nama) + '"><div class="bar-top"><strong>' + esc(j.nama) + '</strong><span class="' + (telat ? 'down' : 'mu') + '">' + (j.selesai ? 'selesai' : this.teks(j)) + '</span></div>' +
        '<div class="note">' + (j.selesai ? 'Selesai ' + Setelan.tgl(j.terakhir || j.tanggal) : Setelan.tgl(j.tanggal)) + (j.ulang > 0 ? ' · tiap ' + j.ulang + ' hari' : ' · sekali') + (j.terakhir && !j.selesai ? ' · terakhir ' + Setelan.tgl(j.terakhir) : '') + '</div></button>'; };
    const aktif = L.filter((j) => !j.selesai), beres = L.filter((j) => j.selesai);
    return '<section><h2>Jadwal kegiatan</h2>' + (aktif.length ? aktif.map(baris).join('') : '<p class="note">' + (L.length ? 'Tidak ada kegiatan yang menunggu.' : 'Belum ada jadwal.' + (jalan ? ' Ketuk tombol + untuk menambah pengingat pupuk, semprot, atau kegiatan lain.' : '')) + '</p>') +
      (beres.length ? '<details class="lg-detail"><summary>Sudah selesai (' + beres.length + ')</summary>' + beres.map(baris).join('') + '</details>' : '') + (L.length ? '<p class="note">Ketuk kegiatan untuk detail' + (jalan ? ', mengubah, atau menghapus' : '') + '.</p>' : '') + '</section>';
  },
  aksi(a, el) {
    if (!/^jadwal-/.test(a)) return false;
    const s = Siklus.cari(Siklus.sid); if (!s) return true;
    const simpan = () => { s.diubah = nowIso(); App.simpan(); App.go('siklus-detail', true); };
    const j = (s.jadwal || []).find((x) => x.id === el.dataset.id); if (!j) return true;
    if (a === 'jadwal-selesai') {
      const lama = JSON.stringify(j), hari = isoHari();
      j.terakhir = hari;
      if (j.ulang > 0) j.tanggal = this.tambahHari(hari, j.ulang); else j.selesai = true;
      simpan();
      App.toast(j.selesai ? 'Kegiatan selesai' : 'Dijadwalkan lagi ' + Setelan.tgl(j.tanggal), { label: 'Urungkan', fn: () => { Object.assign(j, JSON.parse(lama)); s.diubah = nowIso(); App.simpan(); App.go('siklus-detail', true); } });
    } else if (a === 'jadwal-hapus') {
      const i = s.jadwal.indexOf(j); s.jadwal.splice(i, 1); simpan();
      App.toast('Kegiatan dihapus', { label: 'Urungkan', fn: () => { s.jadwal.splice(i, 0, j); s.diubah = nowIso(); App.simpan(); App.go('siklus-detail', true); } });
    }
    return true;
  }
};

</script>
<script>
/* Tani Keuangan — modal detail Jadwal kegiatan dan Panen di detail siklus (v0.1.060)
   Memakai mesin modal Rencana (Rencana.dlgBuka); entri didaftarkan ke Rencana.FORM. Dokumen: docs/JADWAL.md, docs/SIKLUS.md */
const Dsk = {
  aksi(a, el) {
    if (a === 'panen-detail') { Rencana.dlgBuka('panenDetail', el.dataset.id); return true; }
    if (a === 'jadwal-detail') { Rencana.dlgBuka('jadwalDetail', el.dataset.id); return true; }
    return false;
  },
  jd(id) { const s = Siklus.cari(Siklus.sid); return s ? (s.jadwal || []).find((j) => j.id === id) || null : null; },
  pn(id) { return Siklus.d().panen.find((p) => p.id === id && !p.terhapus) || null; }
};
Object.assign(Rencana.FORM, {
  jadwal: { jenis: 'Jadwal kegiatan', judul: 'Tambah kegiatan', judulUbah: 'Ubah kegiatan', simpan: 'Simpan kegiatan', tab: 'siklus-detail', fokus: 'rm_jn',
    isi() { return Rencana.lab('rm_jn', 'Kegiatan', '<input id="rm_jn" maxlength="60" autocomplete="off" placeholder="mis. Pupuk NPK, semprot hama">') +
      Rencana.lab('rm_jt', 'Tanggal', '<input type="date" id="rm_jt" value="' + isoHari() + '">') +
      Rencana.lab('rm_ju', 'Ulangi tiap (hari, kosongkan bila sekali)', '<input id="rm_ju" inputmode="numeric" maxlength="3" placeholder="mis. 14">'); },
    isiEd(id, el) { const j = Dsk.jd(id); if (!j) return; el.querySelector('#rm_jn').value = j.nama; el.querySelector('#rm_jt').value = j.tanggal; el.querySelector('#rm_ju').value = j.ulang > 0 ? j.ulang : ''; },
    ok(v, id) {
      const s = Siklus.cari(Siklus.sid); if (!s) return 'Siklus tidak ditemukan.';
      const nama = v('rm_jn').trim(), tgl = v('rm_jt'), u = v('rm_ju').trim(), ulang = u === '' ? 0 : Number(u);
      if (!nama) return 'Isi nama kegiatan.';
      if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl)) return 'Isi tanggal.';
      if (!Number.isInteger(ulang) || ulang < 0 || ulang > 365) return 'Ulangi tiap 1 sampai 365 hari, atau kosongkan.';
      const j = id && Dsk.jd(id);
      if (j) Object.assign(j, { nama: nama, tanggal: tgl, ulang: ulang }); else (s.jadwal = s.jadwal || []).push({ id: uid('j'), nama: nama, tanggal: tgl, ulang: ulang, selesai: false, terakhir: '' });
      s.diubah = nowIso(); return { toast: j ? 'Kegiatan diperbarui' : 'Kegiatan ditambahkan' };
    } },
  jadwalDetail: { jenis: 'Jadwal kegiatan', judul: 'Detail kegiatan', ada(id) { return !!Dsk.jd(id); }, judulFn(id) { const j = Dsk.jd(id); return j ? esc(j.nama) : 'Detail kegiatan'; },
    isi(id) {
      const j = Dsk.jd(id), telat = !j.selesai && Jadwal.selisih(j.tanggal) < 0;
      return Rencana.baris('Status', j.selesai ? 'selesai' : '<span class="' + (telat ? 'down' : '') + '">' + Jadwal.teks(j) + '</span>') + Rencana.baris(j.selesai ? 'Tanggal terakhir' : 'Tanggal', Setelan.tgl(j.selesai ? (j.terakhir || j.tanggal) : j.tanggal)) +
        Rencana.baris('Pengulangan', j.ulang > 0 ? 'tiap ' + j.ulang + ' hari' : 'sekali') + (j.terakhir && !j.selesai ? Rencana.baris('Terakhir dikerjakan', Setelan.tgl(j.terakhir)) : '');
    },
    tombol(id) {
      const s = Siklus.cari(Siklus.sid), j = Dsk.jd(id), jalan = s && s.status === 'berjalan';
      return (jalan && !j.selesai ? Rencana.bt('selesai', 'Sudah dikerjakan', 'gold') : '') + (jalan ? Rencana.bt('ubah', 'Ubah', '') : '') + Rencana.bt('hapus', 'Hapus', 'danger') + Rencana.bt('tutup', 'Tutup', '');
    },
    aksi(a, id) {
      if (a === 'ubah') { Rencana.dlgTutup(true); Rencana.dlgBuka('jadwal', id); }
      else if (a === 'selesai') { Rencana.dlgTutup(true); Jadwal.aksi('jadwal-selesai', { dataset: { id: id } }); }
      else if (a === 'hapus') { Rencana.dlgTutup(true); Jadwal.aksi('jadwal-hapus', { dataset: { id: id } }); }
    } },
  panenDetail: { jenis: 'Panen', judul: 'Detail panen', ada(id) { return !!Dsk.pn(id); }, judulFn(id) { const p = Dsk.pn(id); return p ? 'Panen ' + Setelan.tgl(p.tanggal) : 'Detail panen'; },
    isi(id) {
      const p = Dsk.pn(id), s = Siklus.cari(Siklus.sid), k = s && Siklus.kom(s.komoditasId), sat = k ? ' ' + esc(k.satuan) : '';

        Rencana.baris('Harga jual', p.hargaPerSatuan ? rp(p.hargaPerSatuan) + (k ? '/' + esc(k.satuan) : '') : '—') + Rencana.baris('Pembeli', p.pembeli ? esc(p.pembeli) : '—');
    },
    tombol() { const s = Siklus.cari(Siklus.sid); return (s && s.status === 'berjalan' ? Rencana.bt('ubah', 'Ubah panen', 'gold') + Rencana.bt('hapus', 'Hapus panen', 'danger') : '') + Rencana.bt('tutup', 'Tutup', ''); },
    aksi(a, id) {

      const D = Siklus.d(), p = Dsk.pn(id), t = p && p.transaksiId && D.transaksi.find((x) => x.id === p.transaksiId), tIkut = !!(t && !t.terhapus);
      if (!p || (tIkut && Utang.tahan(t))) return;
      p.terhapus = true; p.diubah = nowIso(); if (tIkut) { t.terhapus = true; t.diubah = nowIso(); Utang.ikut(t, true); }
      Rencana.dlgTutup(true); App.simpan(); App.go('siklus-detail', true); Modal.pulihFokus();
      App.toast('Panen dihapus', { label: 'Urungkan', fn: () => { p.terhapus = false; p.diubah = nowIso(); if (tIkut) { t.terhapus = false; t.diubah = nowIso(); Utang.ikut(t, false); } App.simpan(); if (App.tab === 'siklus-detail') App.go('siklus-detail', true); } });
    } }
});

<script>
/* Tani Keuangan — katalog harga pasar (input manual) dan pembanding harga (v0.1.052, docs/HARGA.md)
   Disimpan di komoditas.hargaPasar = [{ id, tanggal, harga, sumber }]; harga per satuan komoditas. */
const Harga = {
  pilih: '',
  daftar(k) { return (k.hargaPasar || []).slice().sort((a, b) => String(b.tanggal).localeCompare(a.tanggal)); },
  terakhir(k) { return k ? this.daftar(k)[0] || null : null; },
  /* perubahan harga terakhir terhadap sebelumnya: { pct } atau null */
  ubah(k) { const L = this.daftar(k); return L.length > 1 && L[1].harga ? { pct: Math.round((L[0].harga - L[1].harga) / L[1].harga * 100) } : null; },
  /* harga jual rata-rata sendiri (tertimbang jumlah panen bersih) untuk panen berharga 90 hari terakhir */
  sendiri(kid) {
    const batas = Jadwal.tambahHari(isoHari(), -90); let q = 0, nilai = 0;
    App.data.panen.filter((p) => !p.terhapus && p.hargaPerSatuan > 0 && p.tanggal >= batas).forEach((p) => {
      const s = Siklus.cari(p.siklusId); if (!s || s.komoditasId !== kid) return;
      const b = Math.max(0, p.kuantitasKotor - p.susut); q += b; nilai += b * p.hargaPerSatuan;
    });
    return q ? nilai / q : null;
  },
  pembanding(k) {
    const t = this.terakhir(k), h = this.sendiri(k.id); if (!t || !h) return '';
    const pct = Math.round((h - t.harga) / t.harga * 100);
    return this.baris('Harga jualmu (90 hari)', rp(Math.round(h)) + '/' + esc(k.satuan)) +
      this.baris('Dibanding pasar', pct === 0 ? 'sama' : '<span class="' + (pct > 0 ? 'up' : 'down') + '">' + Math.abs(pct) + '% ' + (pct > 0 ? 'di atas' : 'di bawah') + ' pasar</span>');
  },
  /* garis tren harga (maks. 12 catatan terakhir, urut waktu) */
  tren(L) {
    if (L.length < 2) return '';
    const P = L.slice(0, 12).reverse(), hs = P.map((p) => p.harga), mn = Math.min(...hs), mx = Math.max(...hs), n = P.length - 1;
    return '<svg class="kas-spark" viewBox="0 0 300 40" preserveAspectRatio="none" role="img" aria-label="Tren harga pasar ' + P.length + ' catatan terakhir"><polyline points="' + P.map((p, i) => (2 + i / n * 296).toFixed(1) + ',' + (37 - (p.harga - mn) / ((mx - mn) || 1) * 34).toFixed(1)).join(' ') + '"/></svg>';
  },
  baris(a, b) { return '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>'; },
  v() {
    const K = Siklus.koms();
    if (!K.length) return '<section><p class="note">Belum ada komoditas. Tambahkan dulu di tab Unit.</p></section>';
    const k = K.find((x) => x.id === this.pilih) || K[0]; this.pilih = k.id;
    const L = this.daftar(k), t = L[0], u = this.ubah(k);
    const opsi = K.map((x) => '<option value="' + x.id + '"' + (x.id === k.id ? ' selected' : '') + '>' + esc(x.nama) + '</option>').join('');
    const row = (p) => '<button type="button" class="ang-baris" data-rc="harga-detail" data-id="' + k.id + '|' + p.id + '" aria-label="Detail harga ' + Setelan.tgl(p.tanggal) + ' ' + rp(p.harga) + '"><div class="bar-top"><strong>' + rp(p.harga) + '/' + esc(k.satuan) + '</strong><span class="mu">' + Setelan.tgl(p.tanggal) + (p.sumber ? ' · ' + esc(p.sumber) : '') + '</span></div></button>';
    const hist = L.slice(0, 5).map(row).join(''), sisa = L.slice(5).map(row).join('');
    return '<section><p class="note">Catat harga pasar sendiri (manual) lewat tombol + untuk membandingkan dengan harga jualmu.</p>' +
      '<label for="hp_kom">Komoditas</label><select id="hp_kom" data-hk>' + opsi + '</select>' +
      (t ? '<div style="margin-top:12px">' + this.baris('Harga pasar terakhir', '<strong>' + rp(t.harga) + '/' + esc(k.satuan) + '</strong>') + this.baris('Dicatat', Setelan.tgl(t.tanggal) + (t.sumber ? ' · ' + esc(t.sumber) : '')) +
        (u ? this.baris('Dari catatan sebelumnya', u.pct === 0 ? 'tetap' : '<span class="' + (u.pct > 0 ? 'up' : 'down') + '">' + (u.pct > 0 ? '▲ ' : '▼ ') + Math.abs(u.pct) + '%</span>') : '') + this.pembanding(k) + '</div>' : '<p class="note" style="margin-top:12px">Belum ada harga pasar untuk ' + esc(k.nama) + '. Ketuk tombol + untuk mencatat.</p>') + '</section>' +
      (L.length ? '<section><h2>Riwayat</h2>' + this.tren(L) + '<div>' + hist + '</div>' + (sisa ? '<details class="lg-detail"><summary>Lihat semua (' + L.length + ')</summary><div>' + sisa + '</div></details>' : '') + '</section>' : '');
  },
  cek(h, tgl) {
    if (!(h > 0)) return 'Isi harga pasar lebih dari 0.';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl)) return 'Isi tanggal.';
    if (tgl > isoHari()) return 'Tanggal tidak boleh di masa depan.';
    return '';
  },
  /* simpan satu harga pasar; kembalikan pesan galat atau '' (dipanggil dari modal FAB, v0.1.055) */
  simpan(k, h, tgl, sumber) {
    const e = this.cek(h, tgl); if (e) return e;
    (k.hargaPasar = k.hargaPasar || []).push({ id: uid('h'), tanggal: tgl, harga: h, sumber: sumber });
    k.diubah = nowIso(); return '';
  },
  /* id gabungan "idKomoditas|idHarga" (v0.1.062) */
  cari(gid) {
    const [kid, hid] = String(gid).split('|'), k = Siklus.kom(kid), p = k && (k.hargaPasar || []).find((x) => x.id === hid);
    return p ? { k: k, p: p } : null;
  },
  edit(gid, h, tgl, sumber) {
    const r = this.cari(gid); if (!r) return 'Catatan harga tidak ditemukan.';
    const e = this.cek(h, tgl); if (e) return e;
    Object.assign(r.p, { harga: h, tanggal: tgl, sumber: sumber }); r.k.diubah = nowIso(); return '';
  },
  hapus(gid) {
    const r = this.cari(gid); if (!r) return;
    const i = r.k.hargaPasar.indexOf(r.p), rec = r.k.hargaPasar.splice(i, 1)[0], k = r.k; k.diubah = nowIso();
    Rencana.dlgTutup(true); App.simpan(); App.go('rencana', true); Modal.pulihFokus();
    App.toast('Harga pasar dihapus', { label: 'Urungkan', fn: () => { k.hargaPasar.push(rec); k.diubah = nowIso(); App.simpan(); App.go('rencana', true); } });
  }
};

</script>
<script>
/* Tani Keuangan — kalkulator kelayakan usaha: NPV, IRR, balik modal, PI (v0.1.053, docs/KELAYAKAN.md)
   Model sederhana: investasi awal, arus kas bersih tetap per periode, nilai sisa di akhir. Tidak memakai data transaksi kecuali tombol isi cepat. */
const Kelayakan = {
  s: null,
  BAWAAN: { invest: '', net: '', n: '12', sisa: '', d: '12', unit: 'bulan' },
  muat() { if (!this.s) this.s = Object.assign({}, this.BAWAAN, App.data.pengaturan.kelayakan || {}); return this.s; },
  /* hitung dari angka mentah; kembalikan { galat } atau hasil */
  hitung(x) {
    const inv = Number(x.invest) || 0, net = Number(x.net) || 0, n = Number(x.n) || 0, sisa = Number(x.sisa) || 0, d = Number(x.d);
    if (!(inv > 0)) return { galat: 'Isi investasi awal lebih dari 0.' };
    if (!Number.isInteger(n) || n < 1 || n > 120) return { galat: 'Jumlah periode 1 sampai 120.' };
    if (!(d >= 0 && d <= 100)) return { galat: 'Diskonto per tahun 0 sampai 100%.' };
    const bln = x.unit !== 'tahun', r = bln ? Math.pow(1 + d / 100, 1 / 12) - 1 : d / 100;
    const cf = [-inv]; for (let t = 1; t <= n; t++) cf.push(net + (t === n ? sisa : 0));
    const npv = (rate) => cf.reduce((a, c, t) => a + c / Math.pow(1 + rate, t), 0);
    let irr = null, lo = -0.99, hi = 10;
    if (npv(lo) * npv(hi) < 0) { for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (npv(lo) * npv(m) <= 0) hi = m; else lo = m; } irr = (lo + hi) / 2; }
    let kum = -inv, balik = null;
    for (let t = 1; t <= n && balik === null; t++) { const baru = kum + cf[t]; if (baru >= 0 && cf[t] > 0) balik = t - 1 + (-kum) / cf[t]; kum = baru; }
    const total = cf.slice(1).reduce((a, c) => a + c, 0), v = npv(r);
    return { npv: v, irr: irr, irrTahun: irr === null ? null : (bln ? Math.pow(1 + irr, 12) - 1 : irr), balik: balik, pi: (v + inv) / inv, total: total, r: r, n: n, bln: bln, inv: inv, layak: v > 0 };
  },
  hasil(x) {
    const h = this.hitung(x); if (h.galat) return '<p class="note">' + esc(h.galat) + '</p>';
    const u = h.bln ? 'bulan' : 'tahun', baris = (a, b) => '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>', pct = (n) => (Math.round(n * 1000) / 10).toLocaleString('id-ID') + '%';
    return '<div class="row"><strong class="' + (h.layak ? 'up' : 'down') + '">' + (h.layak ? 'Layak' : 'Belum layak') + '</strong><span class="mu">' + (h.layak ? 'NPV positif' : 'NPV nol atau negatif') + '</span></div>' +
      baris('NPV (nilai sekarang bersih)', '<span class="' + (h.layak ? 'up' : 'down') + '">' + rp(Math.round(h.npv)) + '</span>') +
      baris('IRR per tahun', h.irrTahun === null ? 'tidak dapat dihitung' : pct(h.irrTahun)) +
      baris('Balik modal', h.balik === null ? 'tidak dalam ' + h.n + ' ' + u : (Math.round(h.balik * 10) / 10).toLocaleString('id-ID') + ' ' + u) +
      baris('Indeks profitabilitas (PI)', (Math.round(h.pi * 100) / 100).toLocaleString('id-ID')) +
      baris('Total arus kas masuk', rp(Math.round(h.total))) +
      '<p class="note">Layak bila NPV positif, yaitu IRR di atas diskonto. Diskonto ' + pct(h.r) + ' per ' + u + '. Model sederhana: arus kas dianggap tetap tiap periode.</p>';
  },
  v() {
    const s = this.muat(), f = (k) => s[k] === '' ? '' : fmtInput(Number(s[k]) || 0), unit = s.unit === 'tahun' ? 'tahun' : 'bulan';
    const inp = (id, lab, k, ph) => '<label for="kl_' + id + '">' + lab + '</label><input id="kl_' + id + '" data-kl="' + k + '" data-rp inputmode="numeric" autocomplete="off" placeholder="' + ph + '" value="' + f(k) + '">';
    return '<section><p class="note">Hitung apakah sebuah usaha atau investasi (mis. kolam, greenhouse, alat) layak dijalankan. Angka di sini tidak mengubah catatan keuanganmu.</p>' +
      '<div class="seg sm" style="justify-content:flex-start;margin:6px 0">' + [['bulan', 'Periode bulanan'], ['tahun', 'Periode tahunan']].map((x) => '<button type="button" class="btn' + (unit === x[0] ? ' on' : '') + '" data-rc="kl-unit" data-id="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>' +
      inp('invest', 'Investasi awal (Rp)', 'invest', '0') + inp('net', 'Arus kas bersih per ' + unit + ' (Rp)', 'net', '0') + inp('n', 'Jumlah ' + unit, 'n', '12') + inp('sisa', 'Nilai sisa di akhir (Rp, opsional)', 'sisa', '0') + '<label for="kl_d">Diskonto per tahun (%)</label><input id="kl_d" data-kl="d" inputmode="decimal" autocomplete="off" placeholder="12" value="' + esc(s.d) + '">' +
      '<div class="seg" style="margin-top:8px"><button type="button" class="btn" data-rc="kl-isi">Isi arus kas dari rata-rata 3 bulan</button></div></section>' +
      '<section><h2>Hasil</h2><div id="kl_hasil" aria-live="polite">' + this.hasil(s) + '</div></section>';
  },
  simpan() { App.data.pengaturan.kelayakan = Object.assign({}, this.s); App.simpan(); },
  /* dipanggil dari Rencana.klik */
  aksi(a, b) {
    const s = this.muat();
    if (a === 'kl-unit') { s.unit = b.dataset.id === 'tahun' ? 'tahun' : 'bulan'; }
    else if (a === 'kl-isi') { s.net = String(Math.round(Rencana.rata3())); s.unit = 'bulan'; if (!Number(s.net)) App.toast('Belum ada arus kas 3 bulan terakhir. Isi manual.'); }
    this.simpan(); App.go('rencana', true); return true;
  },
  masuk(e) {
    const i = e.target.closest && e.target.closest('[data-kl]'); if (!i) return;
    const s = this.muat(), k = i.dataset.kl;
    s[k] = k === 'd' ? i.value.replace(/[^\d.,]/g, '').replace(',', '.') : (i.value.trim() === '' ? '' : String(angka(i.value)));
    const h = document.getElementById('kl_hasil'); if (h) h.innerHTML = this.hasil(s);
    clearTimeout(this.t); this.t = setTimeout(() => this.simpan(), 600);
  }
};
document.addEventListener('input', (e) => Kelayakan.masuk(e));

</script>

  sah(k, x) {

    if (k === 'transaksi') return /^\d{4}-\d{2}-\d{2}/.test(x.tanggal || '') && n(x.jumlah) && (x.jenis === 'masuk' || x.jenis === 'keluar');

const Samar = {
  asli: new WeakMap(), ada: new Set(), mo: null, cetakan: false,
  RE: /[−-]?Rp[\s\u00a0]?\d[\d.,]*(?:[\s\u00a0]?(?:juta|jt|miliar|rb))?/g,
  aktif() { return !this.cetakan && !!Setelan.get('sembunyi') && !App.buka; },
  samarkan(n) {
    const v = n.nodeValue; this.RE.lastIndex = 0;
    if (!this.RE.test(v)) return; this.RE.lastIndex = 0;
    this.asli.set(n, v); this.ada.add(n); n.nodeValue = v.replace(this.RE, 'Rp ••••••');
  },
  sapu(root) {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), L = []; let n;

    L.forEach((x) => this.samarkan(x));
  },
  pulihkan() { this.ada.forEach((n) => { if (n.isConnected && this.asli.has(n)) n.nodeValue = this.asli.get(n); }); this.ada.clear(); },
  terapkan() { if (this.aktif()) { this.sapu($('app')); const m = document.querySelector('.dm-lapis'); if (m) this.sapu(m); } else this.pulihkan(); },
  cetak(ya) { this.cetakan = ya; this.terapkan(); },
  pasang(root) {

};

    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.tanggal)) { this.toast('Isi tanggal'); return; }
    const tLama = d.id && this.data.transaksi.find((x) => x.id === d.id), gal = Utang.cek(d.jumlah, d, tLama && Utang.tertaut(tLama));
    if (gal) { this.toast(gal); return; }
    const kat = this.semuaKat().find((k) => k.id === d.kat);
    const sifat = d.jenis === 'keluar' ? (kat && kat.sifatBiaya) || 'variabel' : null;
    let tx;
    if (d.id) {
      const t = tx = this.data.transaksi.find((x) => x.id === d.id);
      Object.assign(t, { tanggal: d.tanggal, jenis: d.jenis, kategoriId: d.kat, jumlah: d.jumlah, sifatBiaya: sifat, catatan: d.catatan, siklusId: d.siklus || null, notaId: d.nota || null, diubah: nowIso() });
    } else {
      this.data.transaksi.push(tx = { id: uid('t'), tanggal: d.tanggal, jenis: d.jenis, kategoriId: d.kat, jumlah: d.jumlah, siklusId: d.siklus || null,
        sifatBiaya: sifat, catatan: d.catatan, notaId: d.nota || null, dibuat: nowIso(), diubah: nowIso(), terhapus: false });
    }
    Utang.sinkron(tx, d);
    this.lastKat[d.jenis] = d.kat;
    if (d.notaLama && d.notaLama !== d.nota) Nota.hapus(d.notaLama);
    this.simpan();
    if (lagi) {
      this.draft = { id: null, jenis: d.jenis, jumlah: 0, kat: d.kat, tanggal: d.tanggal, catatan: '', siklus: d.siklus, nota: null, notaLama: null, ...Utang.d0() };
      this.toast('Transaksi tersimpan'); this.go('catat', true);
      const j = $('f_jumlah'); if (j) j.focus();
    } else { this.draft = null; this.toast(d.id ? 'Transaksi diperbarui' : 'Transaksi tersimpan'); this.go(['transaksi', 'siklus-detail'].includes(this.balik) ? this.balik : 'beranda'); }
  },
  tambahKat() {
    const nama = $('k_nama').value.trim(), jenis = $('k_jenis').value;
    if (!nama) { this.toast('Isi nama kategori'); return; }
    if (this.kategori(jenis).some((k) => k.nama.toLowerCase() === nama.toLowerCase())) { this.toast('Kategori sudah ada'); return; }
    this.data.kategori.push({ id: uid('c'), nama, jenis, sifatBiaya: jenis === 'keluar' ? 'variabel' : null, bawaan: false, terhapus: false });
    this.simpan(); this.toast('Kategori ditambahkan'); this.go('lainnya', true);
  },

  /* ---------- CSV ---------- */
  eksporCsv() {
    const q = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
    const baris = ['tanggal,jenis,kategori,siklus,jumlah,catatan'].concat(
      this.aktif().slice().sort((a, b) => a.tanggal.localeCompare(b.tanggal)).map((t) =>
        [t.tanggal, t.jenis, q(this.namaKat(t.kategoriId)), q(t.siklusId || ''), t.jumlah, q(t.catatan)].join(',')));
    const csv = baris.join('\n');
    $('csvBox').value = csv;
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
      a.download = 'tani-transaksi-' + isoHari() + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) {}
    $('csvMsg').textContent = this.aktif().length + ' transaksi diekspor. Jika unduhan tidak mulai, salin teks di kotak.';
  },
  urai(teks) {
    const rows = []; let r = [], f = '', q = false;
    teks = teks.replace(/^\ufeff/, '');
    for (let i = 0; i < teks.length; i++) {
      const c = teks[i];
      if (q) { if (c === '"') { if (teks[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { r.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && teks[i + 1] === '\n') i++; r.push(f); f = ''; if (r.some((x) => x.trim())) rows.push(r); r = []; }
      else f += c;
    }
    r.push(f); if (r.some((x) => x.trim())) rows.push(r);
    return rows;
  },
  imporCsv() {
    const rows = this.urai($('csvBox').value || '');
    if (rows.length < 2) { $('csvMsg').textContent = 'CSV kosong atau tanpa baris data.'; return; }
    const h = rows[0].map((x) => x.trim().toLowerCase()), ix = (n) => h.indexOf(n);
    if (ix('tanggal') < 0 || ix('jenis') < 0 || ix('jumlah') < 0) { $('csvMsg').textContent = 'Kolom tanggal, jenis, dan jumlah wajib ada.'; return; }
    let ok = 0, lewat = 0;
    rows.slice(1).forEach((r) => {
      const tgl = (r[ix('tanggal')] || '').trim(), jenis = (r[ix('jenis')] || '').trim().toLowerCase(), jml = angka(r[ix('jumlah')]);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl) || (jenis !== 'keluar' && jenis !== 'masuk') || jml <= 0) { lewat++; return; }
      const nama = ix('kategori') >= 0 ? (r[ix('kategori')] || '').trim() : '';
      let k = this.kategori(jenis).find((x) => x.nama.toLowerCase() === nama.toLowerCase());
      if (!k && nama) { k = { id: uid('c'), nama, jenis, sifatBiaya: jenis === 'keluar' ? 'variabel' : null, bawaan: false, terhapus: false }; this.data.kategori.push(k); }
      if (!k) k = this.kategori(jenis).slice(-1)[0];
      this.data.transaksi.push({ id: uid('t'), tanggal: tgl, jenis, kategoriId: k.id, jumlah: jml, siklusId: null,
        sifatBiaya: jenis === 'keluar' ? k.sifatBiaya || 'variabel' : null, catatan: ix('catatan') >= 0 ? (r[ix('catatan')] || '').trim() : '',
        dibuat: nowIso(), diubah: nowIso(), terhapus: false });
      ok++;
    });
    this.simpan(); this.ringkas();
    $('csvMsg').textContent = ok + ' transaksi diimpor' + (lewat ? ', ' + lewat + ' baris dilewati (format tidak sesuai)' : '') + '.';
  },
  contoh() { Contoh.isi(); }
};

document.addEventListener('DOMContentLoaded', () => App.init());

</script>
