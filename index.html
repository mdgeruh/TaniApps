<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4C9">
<title>Tani Keuangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Tani Keuangan — struktur gaya Jurnal Trading, palet Hijau Padi (#FFF4C9 #C7E78B #81AE64 #709053) */
:root{--ink:#FFF4C9;--ink-raised:#FFFAE2;--paper:#243019;--paper-dim:#485C33;--paper-faint:#58703F;--gold:#4E6F35;--gold-dim:#709053;--fill:#81AE64;--fill-hi:#C7E78B;--on-fill:#1F2A16;--act-bg:#C7E78B;--act-tx:#1F2A16;--gain:#2B7A3B;--loss:#B0452F;--line:#D3C88C;--line-soft:#E8DDA8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html[data-theme="dark"]{--ink:#161D12;--ink-raised:#1F2918;--paper:#FFF4C9;--paper-dim:#C4C09A;--paper-faint:#A3A07E;--gold:#C7E78B;--gold-dim:#81AE64;--fill:#81AE64;--fill-hi:#C7E78B;--on-fill:#14200E;--act-bg:#1F2918;--act-tx:#C7E78B;--gain:#8FD08A;--loss:#E07A62;--line:#34422A;--line-soft:#27331F;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--ink);transition:background .2s}
body{margin:0;background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
::selection{background:var(--fill-hi);color:var(--on-fill)}
.wrap{max-width:920px;margin:0 auto;padding:0 20px 96px}
header.masthead{padding:30px 0 20px;border-bottom:1px solid var(--line)}
.masthead-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:22px;letter-spacing:.01em}
.brand em{font-style:italic;color:var(--gold);font-weight:500}
.updated{font-size:12px;color:var(--paper-faint);margin-top:10px}
.theme-toggle{background:none;border:1px solid var(--line);color:var(--paper-dim);width:30px;height:30px;font-size:14px;cursor:pointer;line-height:1}
.theme-toggle:hover{color:var(--gold);border-color:var(--gold)}
.hero{padding:26px 4px 6px}
.hero-label{font-size:12px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
.hero-number{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(36px,9vw,64px);line-height:1;color:var(--gold);letter-spacing:-.01em}
.hero-sub{font-size:13px;color:var(--paper-dim);margin-top:8px}
.up{color:var(--gain)}.down{color:var(--loss)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--line-soft)}
.stat{padding:14px 10px;border-left:1px solid var(--line-soft);min-width:0}
.stat:first-child{border-left:0;padding-left:0}
.stat-lbl{font-size:10.5px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;line-height:1.25}
.stat-val{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:17px;word-break:break-word;line-height:1.2}
.main-tabs{display:flex;gap:2px;margin:22px 0 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.main-tabs::-webkit-scrollbar{display:none}
.main-tab-btn{background:none;border:0;color:var(--paper-dim);font:inherit;font-size:12.5px;letter-spacing:.02em;padding:12px 18px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.main-tab-btn:hover{color:var(--paper)}
.main-tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:2px}
.bnav-btn{background:none;border:0;color:var(--paper-faint);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;flex:1;min-width:0;font:inherit;font-size:9.5px;transition:color .15s,background .15s}
.bnav-btn.active{color:var(--act-tx);background:var(--act-bg)}
.bnav-icon{width:19px;height:19px}
@media (max-width:720px){.main-tabs{display:none}.bottom-nav{display:flex}}
.panel{margin-top:20px}
section{padding:22px 20px;margin-bottom:16px;background:var(--ink-raised);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
@media (max-width:600px){section{padding:18px 14px;border-radius:12px}}
h2{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:20px;margin:0 0 14px;color:var(--paper)}
.note{font-size:12px;color:var(--paper-faint)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13px}
.row:first-of-type{border-top:0}
.row .mu{color:var(--paper-dim)}
.row-tuju{cursor:pointer;align-items:center;min-height:44px}.row-tuju:hover>span:first-child{color:var(--gold)}.row-tuju:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:block;font-size:10.5px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 5px}
input,select{width:100%;font:inherit;font-size:13px;padding:10px 11px;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:8px}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
.seg{display:flex;gap:8px}
.btn{font:inherit;font-size:13px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--paper-dim);cursor:pointer;flex:1}
.btn:hover{color:var(--gold);border-color:var(--gold)}
.btn.on{color:var(--gold);border-color:var(--gold);background:var(--ink)}
.btn.gold{background:var(--fill);color:var(--on-fill);border-color:var(--fill);font-weight:600;width:100%;margin-top:18px}
.btn.gold:hover{color:var(--on-fill);opacity:.9}
.sc{cursor:pointer}
.sc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sc-name{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:500}
.badge{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--paper-faint);border:1px solid var(--line);padding:1px 7px}
.badge.live{color:var(--gold);border-color:var(--gold)}
.det{margin-top:12px;padding-top:6px;border-top:1px solid var(--line-soft)}
.tblwrap{overflow-x:auto}
table.ledger{width:100%;border-collapse:collapse;font-size:12.5px}
table.ledger th{font-size:10.5px;font-weight:500;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em;text-align:right;padding:8px;border-bottom:1px solid var(--line)}
table.ledger td{padding:8px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
table.ledger th:first-child,table.ledger td:first-child{text-align:left}
table.ledger tbody tr:hover{background:var(--ink)}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--fill);color:var(--on-fill);padding:8px 16px;font-size:12.5px;z-index:60}
.fab{position:fixed;right:max(20px,calc((100vw - 920px)/2 + 20px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--fill);color:var(--on-fill);box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;z-index:55;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .15s}
.fab:hover{opacity:.92}.fab:active{transform:scale(.94)}
.fab:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.fab svg{width:26px;height:26px}
.fab[hidden]{display:none}
.fab svg{transition:transform .18s}.fab.open svg{transform:rotate(45deg)}
.fab-scrim{position:fixed;inset:0;z-index:54;background:rgba(0,0,0,.28)}
.fab-dial{position:fixed;right:max(20px,calc((100vw - 920px)/2 + 20px));bottom:calc(144px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-scrim[hidden],.fab-dial[hidden]{display:none}
.fab-item{border:0;border-radius:24px;padding:12px 18px;background:var(--fill);color:var(--on-fill);font:inherit;font-size:14px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;white-space:nowrap}
.fab-item:active{transform:scale(.96)}.fab-item:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (min-width:721px){.fab{bottom:28px}.fab-dial{bottom:96px}}
/* ---------- Setelan ---------- */
body{zoom:var(--zoom,1)}
html[data-scheme="emas"]{--ink:#F3EDE0;--ink-raised:#E8E0CC;--paper:#2B2415;--paper-dim:#6B6046;--paper-faint:#6F654F;--gold:#9C7526;--gold-dim:#B08F4E;--fill:#C9A24B;--fill-hi:#E8D9A8;--on-fill:#2B2415;--act-bg:#E8E0CC;--act-tx:#2B2415;--gain:#4F7548;--loss:#9C4530;--line:#D9CFB4;--line-soft:#E3DAC3}
html[data-scheme="emas"][data-theme="dark"]{--ink:#1B1712;--ink-raised:#231E17;--paper:#EDE6D6;--paper-dim:#9C907B;--paper-faint:#8D836F;--gold:#C9A24B;--gold-dim:#8C744E;--fill:#C9A24B;--fill-hi:#C9A24B;--on-fill:#1B1712;--act-bg:#231E17;--act-tx:#C9A24B;--gain:#84AB7C;--loss:#C06B54;--line:#3A3226;--line-soft:#2A251C;color-scheme:dark}
.masthead-right{display:flex;align-items:center;gap:10px}
.theme-toggle.active{color:var(--gold);border-color:var(--gold)}
.eye{background:none;border:0;color:var(--paper-faint);cursor:pointer;font-size:13px;padding:2px 4px;margin-left:4px}
.eye:hover{color:var(--gold)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 14px;flex-wrap:wrap;margin-bottom:6px}
.sec-head h2{margin:0}
.sec-head .note{max-width:38ch;text-align:right}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line-soft)}
.sec-head+.settings-row{border-top:0}
.settings-desc{min-width:0}
.settings-desc strong{display:block;font-size:13px;font-weight:500}
.settings-desc span{display:block;font-size:12px;color:var(--paper-faint);margin-top:2px;max-width:46ch}
.seg.sm{flex-wrap:wrap;justify-content:flex-end}
.seg.sm .btn,.settings-row>.btn{flex:0 0 auto;padding:7px 12px;font-size:12px}
.settings-input{width:84px;text-align:right}
.settings-text{width:100%;min-height:96px;margin-top:6px;font:inherit;font-size:11.5px;padding:10px 11px;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:8px;resize:vertical}
.settings-text:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.danger:hover{color:var(--loss);opacity:.85}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
@media (max-width:600px){.settings-row{flex-direction:column;align-items:stretch;gap:10px}.seg.sm{justify-content:flex-start}.settings-input{width:100%;text-align:left}.sec-head .note{text-align:left;max-width:none}}
/* ---------- Efek kaca (sakelar di Setelan; berlaku untuk semua skema dan mode) ---------- */
html[data-glass="1"]{--glass:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));--glass-edge:rgba(255,255,255,.18);--glass-shadow:0 12px 40px rgba(0,0,0,.30);--glass-nav:rgba(22,29,18,.78);--glass-input:rgba(255,255,255,.07);--glass-th:rgba(0,0,0,.30);background:none}
html[data-glass="1"]:not([data-theme="dark"]){--glass:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.42));--glass-edge:rgba(255,255,255,.85);--glass-shadow:0 12px 36px rgba(60,80,40,.14);--glass-nav:rgba(255,255,255,.62);--glass-input:rgba(255,255,255,.6);--glass-th:rgba(255,255,255,.7)}
@supports (background:color-mix(in srgb,red 50%,transparent)){
  html[data-glass="1"]{--glass-nav:color-mix(in srgb,var(--ink) 80%,transparent)}
  html[data-glass="1"]:not([data-theme="dark"]){--glass-nav:color-mix(in srgb,var(--ink) 62%,transparent)}
  html[data-glass="1"] body{background:
    radial-gradient(1000px 720px at 78% 2%,color-mix(in srgb,var(--fill) 38%,transparent),transparent 64%),
    radial-gradient(860px 780px at 2% 96%,color-mix(in srgb,var(--gold-dim) 34%,transparent),transparent 66%),
    radial-gradient(760px 560px at 46% 50%,color-mix(in srgb,var(--fill) 12%,transparent),transparent 74%),
    var(--ink);background-attachment:fixed}
  html[data-glass="1"]:not([data-theme="dark"]) body{background:
    radial-gradient(1000px 720px at 78% 2%,color-mix(in srgb,var(--fill) 42%,transparent),transparent 64%),
    radial-gradient(860px 780px at 2% 96%,color-mix(in srgb,var(--gold-dim) 30%,transparent),transparent 66%),
    radial-gradient(760px 560px at 46% 50%,color-mix(in srgb,var(--fill-hi) 40%,transparent),transparent 74%),
    var(--ink);background-attachment:fixed}
}
html[data-glass="1"] body{background:var(--ink);background-attachment:fixed}
html[data-glass="1"] section{background:var(--glass);border:1px solid var(--glass-edge);border-radius:26px;-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-edge)}
html[data-glass="1"] input,html[data-glass="1"] select,html[data-glass="1"] textarea{background:var(--glass-input);border-radius:12px}
html[data-glass="1"] .btn,html[data-glass="1"] .theme-toggle,html[data-glass="1"] .badge{border-radius:999px}
html[data-glass="1"] .bottom-nav{background:var(--glass-nav);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border-top:1px solid var(--glass-edge)}
html[data-glass="1"] .main-tabs{border-bottom-color:var(--glass-edge)}
html[data-glass="1"] table.ledger th{background:var(--glass-th)}
html[data-glass="1"] .fab{box-shadow:var(--glass-shadow)}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  html[data-glass="1"] section{background:var(--ink-raised);backdrop-filter:none}
  html[data-glass="1"] .bottom-nav{background:var(--ink)}
}
/* ---------- Transaksi (v0.1.007) ---------- */
.tx{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-soft);cursor:pointer}
h2+.tx{border-top:0}
.tx:hover .tx-n{color:var(--gold)}
.tx:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tx-l{min-width:0}
.tx-n{font-size:13px}
.tx-l .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.tx-a{font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:500;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sum span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.sum strong{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:15px;word-break:break-word}
.bar-row{margin:12px 0 0}
.bar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.bar-top .mu{color:var(--paper-dim)}
.bar{height:8px;background:var(--ink);border:1px solid var(--line-soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fill)}
input[type=date]{min-height:40px}
.bnav-icon,.tab-icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tab-icon{width:15px;height:15px;vertical-align:-3px;margin-right:7px}
.main-tab-btn{display:inline-flex;align-items:center}
.main-tab-btn .tab-icon{vertical-align:baseline}
/* ---------- Siklus (v0.1.008) ---------- */
.sc-card{padding:13px 0;border-top:1px solid var(--line-soft);cursor:pointer}
.sc-card:first-of-type{border-top:0}
.sc-card:hover .sc-name{color:var(--gold)}
.sc-card .note{margin-top:4px}
.seg+.sc-card{margin-top:8px}
/* ---------- Form kustom (v0.1.009) ---------- */
input{-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:var(--paper-faint);opacity:.75}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cx{position:relative}
.cx-native{display:none!important}
.cx-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:40px;padding:10px 11px;font:inherit;font-size:13px;text-align:left;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s}
.cx-btn:hover{border-color:var(--gold-dim)}
.cx-btn:focus-visible,.cx-btn[aria-expanded="true"]{outline:2px solid var(--gold);outline-offset:1px}
.cx-val{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-val.ph{color:var(--paper-faint)}
.cx-ic{width:16px;height:16px;flex:none;fill:none;stroke:var(--paper-dim);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cx-btn[aria-expanded="true"] .cx-ic{stroke:var(--gold)}
.cx-back{position:fixed;inset:0;z-index:99}
.cx-back.dim{background:rgba(20,28,14,.4)}
.cx-pop{position:fixed;z-index:100;box-sizing:border-box;max-width:calc(100vw - 16px);max-height:min(340px,60vh);overflow:auto;padding:6px;background:var(--ink-raised);color:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.28);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5}
.cx-pop.cal:not(.sheet){width:296px;max-height:none;padding:12px}
.cx-pop.sheet{left:0;right:0;bottom:0;top:auto;max-width:none;max-height:74vh;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;border-bottom:0}
.cx-pop.sheet::before{content:"";display:block;width:38px;height:4px;margin:0 auto 10px;border-radius:2px;background:var(--line)}
.cx-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;outline:none}
.cx-opt:hover,.cx-opt:focus{background:var(--act-bg)}
.cx-opt.sel{color:var(--gold);font-weight:500}
.cx-ck{width:15px;height:15px;flex:none;fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cx-grp{padding:10px 12px 4px;font-size:10.5px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em}
.cx-cal-h{display:flex;align-items:center;justify-content:space-between;gap:2px;margin-bottom:8px}
.cx-cal-t{flex:1;text-align:center;font-family:'Fraunces',Georgia,serif;font-size:16px}
.cx-nav{width:34px;height:34px;border:0;border-radius:8px;background:none;color:var(--paper-dim);font:inherit;font-size:16px;cursor:pointer}
.cx-nav:hover{background:var(--act-bg);color:var(--gold)}
.cx-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cx-wd{padding:6px 0;text-align:center;font-size:10.5px;color:var(--paper-faint);text-transform:uppercase}
.cx-day{height:38px;border:0;border-radius:10px;background:none;color:var(--paper);font:inherit;font-size:13px;cursor:pointer}
.cx-day:hover{background:var(--act-bg)}
.cx-day.today{box-shadow:inset 0 0 0 1px var(--gold-dim)}
.cx-day.sel{background:var(--fill);color:var(--on-fill);font-weight:600}
.cx-foot{display:flex;gap:8px;margin-top:10px}
.cx-foot .btn{flex:1}
html[data-glass="1"] .cx-btn{background:var(--glass-input);border-radius:12px}
html[data-glass="1"] .cx-pop:not(.sheet){border-radius:18px}

/* v0.1.010 — peringatan penyimpanan terbatas */
.peringatan{margin:8px 0 12px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--loss);border-radius:10px;background:var(--ink-raised);color:var(--paper);font-size:.82rem;line-height:1.45}
.peringatan[hidden]{display:none}
.info-contoh{margin:0 0 12px;padding:12px;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;background:var(--ink-raised);font-size:.85rem;line-height:1.5}
.info-contoh .note{margin-top:2px}

/* v0.1.011 — laporan */
.lap-kartu .sec-head{align-items:baseline;gap:10px}.lap-kartu .sec-head h2{margin:0}.up{color:var(--gain)}.down{color:var(--loss)}

/* v0.1.012 — cetak */
@media print{.bottom-nav,.fab,.fab-dial,.fab-scrim,.main-tabs,.theme-toggle,.eye,.no-print,.peringatan,#toast,.seg.sm{display:none!important}html,body{background:#fff!important;color:#000!important}section{break-inside:avoid;box-shadow:none!important}.wrap{max-width:none}}

/* v0.1.013 — grafik garis */
.lg-wrap{position:relative}.lg-svg{touch-action:pan-y;display:block}.lg-tip{position:absolute;top:6px;transform:translateX(-50%);background:var(--ink-raised);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11px;line-height:1.5;white-space:nowrap;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.15)}.lg-tip[hidden]{display:none}
.lg-stat{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}.lg-stat strong{font-size:14px}.lg-stat .note{font-size:10px;letter-spacing:.06em}
.lg-detail{margin-top:8px;font-size:12px}.lg-detail summary{cursor:pointer;color:var(--paper-dim)}.lg-tab{width:100%;border-collapse:collapse;margin-top:8px}.lg-tab th,.lg-tab td{text-align:right;padding:5px 4px;border-top:1px solid var(--line-soft)}.lg-tab th:first-child,.lg-tab td:first-child{text-align:left}

/* v0.1.017 — hero hanya di Beranda */
.hero[hidden],.stats[hidden]{display:none}

/* v0.1.023 sinkron cloud */
.sk-f{display:block;margin-top:10px}.sk-f span{display:block;font-size:12px;color:var(--paper-faint);margin-bottom:4px}.sk-f input{width:100%;font:inherit;font-size:13px;padding:10px 11px;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:8px}.sk-f input:focus{outline:2px solid var(--gold);outline-offset:1px}

/* v0.1.024 penyempurnaan UX */
.theme-toggle{width:40px;height:40px}
.eye{padding:10px 12px;margin:-10px -4px -10px 0;min-width:40px;min-height:40px}
.lg-detail summary{padding:11px 0}
.seg .btn{min-width:40px}
.gulir{overflow-x:auto;max-width:100%}.lg-tab th,.lg-tab td{white-space:nowrap}
.btn{min-height:40px}
.seg.sm .btn,.settings-row>.btn{padding:10px 12px;min-height:40px}
.fab.turun{transform:translateY(160px);opacity:0;pointer-events:none}
@media (max-width:720px){.wrap{padding-bottom:150px}}
.lipat>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px}
.lipat>summary::-webkit-details-marker{display:none}
.lipat>summary h2{margin:0}
.lipat>summary::after{content:'▾';color:var(--paper-faint);transition:transform .15s}
.lipat:not([open])>summary::after{transform:rotate(-90deg)}
.lipat>summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lipat-n{margin:4px 0 8px}
.lipat.luar{margin-bottom:16px}
.lipat.luar>summary{padding:10px 20px;background:var(--ink-raised);border:1px solid var(--line);border-radius:14px}
.lipat.luar[open]>summary{margin-bottom:16px}
.fl-bar{margin-top:10px}.fl-bar .btn{width:100%}
.cari{margin-bottom:4px}
.ic-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.ic-row .btn{flex:0 0 auto}
.bar-ang{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden;margin-top:8px}.bar-ang i{display:block;height:100%;background:var(--fill)}.bar-ang.w i{background:#d9a21b}.bar-ang.x i{background:var(--loss)}

/* v0.1.025 kartu hero di Beranda */
.hero-card{position:relative;overflow:hidden;margin-top:18px;padding:22px 20px 6px;background:var(--ink-raised);border-left:4px solid var(--fill)}
@supports (background:color-mix(in srgb,red 10%,blue)){.hero-card{background:linear-gradient(155deg,var(--ink-raised) 35%,color-mix(in srgb,var(--fill) 26%,var(--ink-raised)))}}
.hero-card[hidden]{display:none}
.hero-card .hero{padding:0}
.hero-card .hero-number.rugi{color:var(--loss)}
.hero-delta{font-size:12px;color:var(--paper-dim);margin-top:6px;min-height:1px}
.hero-delta:empty{display:none}
.hero-spark{display:block;width:100%;height:40px;margin-top:14px}
.hero-spark[hidden]{display:none}
.hs-nol{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
.hs-garis{fill:none;stroke:var(--fill);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hero-card .stats{margin-top:14px}
@media (max-width:600px){.hero-card{padding:18px 14px 4px;margin-top:14px}}

/* v0.1.026 judul halaman aktif */
.judul-hal{margin:22px 0 14px}
.judul-hal[hidden]{display:none}
.judul-hal h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(26px,6.5vw,34px);line-height:1.15;margin:0;color:var(--paper);overflow-wrap:anywhere}
.judul-induk{display:inline-block;background:none;border:0;padding:8px 0;margin:-8px 0 0;font:inherit;font-size:12px;letter-spacing:.04em;color:var(--paper-faint);cursor:pointer;min-height:40px}
.judul-induk:hover{color:var(--gold)}
.judul-induk[hidden]{display:none}
.judul-hal:not([hidden])+.panel{margin-top:0}
@media print{.judul-induk{display:none}}

/* v0.1.032 — geser untuk hapus */
.tx{position:relative;touch-action:pan-y;transition:transform .15s ease}
.tx.geser{transform:translateX(-96px)}
.tx-hapus{position:absolute;left:100%;top:0;bottom:0;width:96px;border:0;background:var(--loss);color:#fff;font:inherit;font-size:13px;visibility:hidden;cursor:pointer}
.tx.geser .tx-hapus,.tx.menggeser .tx-hapus{visibility:visible}
.toast-btn{margin-left:14px;background:transparent;border:0;color:inherit;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:4px 2px}
@media print{.tx-hapus{display:none!important}}

/* v0.1.033 — tab laporan bergaya map + tombol ikon */
.lap-aksi{display:flex;justify-content:flex-end;gap:8px;margin:0 0 12px}
.ikon-btn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--paper-dim);cursor:pointer}
.ikon-btn svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ikon-btn:hover,.ikon-btn:focus-visible{color:var(--gold);border-color:var(--gold)}
.lap-tabs{display:flex;position:relative;z-index:1;margin-bottom:-1px}
.lap-tab{flex:1;min-height:46px;font:inherit;font-size:13px;color:var(--paper-dim);background:color-mix(in srgb,var(--ink-raised) 55%,var(--ink));border:1px solid var(--line);border-left-width:0;border-radius:0;cursor:pointer}
.lap-tab:first-child{border-left-width:1px;border-top-left-radius:10px}
.lap-tab:last-child{border-top-right-radius:10px}
.lap-tab.on{background:var(--ink-raised);color:var(--paper);font-weight:700;border-top:2px solid var(--gold);border-bottom-color:var(--ink-raised)}
.lap-tab:focus-visible{outline:2px solid var(--gold);outline-offset:-3px}
.lap-panel{border:1px solid var(--line);background:var(--ink-raised);border-radius:0 0 12px 12px;margin-bottom:16px}
.lap-panel>section,html[data-glass="1"] .lap-panel>section{background:transparent;border:0;border-top:1px solid var(--line-soft);border-radius:0;box-shadow:none;margin:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.lap-panel>section:first-child{border-top:0}
@media print{.lap-panel{border:0}}
/* ---------- Panduan cepat (v0.1.034) ---------- */
.pd-lapis{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.52)}
.pd-kartu{width:100%;max-width:440px;max-height:92vh;overflow-y:auto;background:var(--ink-raised);color:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:24px 20px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media (min-width:721px){.pd-lapis{align-items:center}.pd-kartu{border-bottom:1px solid var(--line);border-radius:18px;padding-bottom:20px}}
@media (prefers-reduced-motion:no-preference){.pd-lapis{animation:pdMasuk .2s ease-out}@keyframes pdMasuk{from{opacity:0}to{opacity:1}}}
.pd-ik{width:52px;height:52px;border-radius:50%;background:var(--act-bg);color:var(--act-tx);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.pd-ik svg{width:26px;height:26px}
.pd-no{font-size:10.5px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em}
.pd-judul{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:22px;line-height:1.25;margin:6px 0 10px}
.pd-isi{font-size:13px;line-height:1.65;color:var(--paper-dim);margin:0 0 10px}
.pd-titik{display:flex;gap:6px;margin:16px 0 18px}
.pd-t{width:8px;height:8px;border-radius:4px;background:var(--line)}
.pd-t.on{width:22px;background:var(--gold)}
.pd-aksi{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pd-kiri{display:flex;gap:8px}
.pd-kartu .btn{flex:0 0 auto;min-height:40px;padding:8px 16px}
.pd-kartu .btn.gold{width:auto;margin-top:0}
html[data-glass="1"] .pd-kartu{background:var(--ink-raised);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border-color:var(--glass-edge)}
@supports (background:color-mix(in srgb,red 50%,transparent)){html[data-glass="1"] .pd-kartu{background:color-mix(in srgb,var(--ink-raised) 95%,transparent)}}
@media print{.pd-lapis{display:none!important}}
/* v0.1.036: tiga tombol CSV tetap satu baris; turun baris utuh bila layar sangat sempit */
.seg.tiga{flex-wrap:wrap}
.seg.tiga .btn{flex:1 1 auto;white-space:nowrap;padding-left:8px;padding-right:8px;font-size:12px}

/* Foto nota (v0.1.037) */
.nota-box{margin-top:6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.nota-box .note{flex:1 1 100%;margin:0}
.nota-btn{flex:0 0 auto;min-height:40px}
.nota-thumb{padding:0;border:1px solid var(--line);background:var(--ink-raised);width:96px;height:96px;overflow:hidden;cursor:pointer;display:block;border-radius:8px;flex:0 0 auto}
.nota-thumb:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.nota-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.nota-thumb.samar img{filter:blur(14px)}
.nota-aksi{display:flex;flex-direction:column;gap:8px}
.nota-ikon{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--gold-dim)}
.nota-lihat{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.nota-lihat img{max-width:100%;max-height:calc(100% - 64px);object-fit:contain;background:#fff}
.nota-lihat .btn{flex:0 0 auto;min-height:44px;min-width:120px;background:var(--ink);color:var(--paper)}
@media print{.nota-box,.nota-lihat{display:none}}

/* Fase 7 — aksesibilitas (v0.1.038) */
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.lewati{position:absolute;min-height:44px;box-sizing:border-box;display:flex;align-items:center;left:8px;top:-60px;z-index:100;background:var(--fill);color:var(--on-fill);padding:10px 16px;font-size:13px;font-weight:600;text-decoration:none;border-radius:8px}
.lewati:focus{top:calc(8px + env(safe-area-inset-top,0px))}
#app:focus{outline:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* CRUD siklus, unit, komoditas (v0.1.039) */
.m-row{align-items:center}
.m-tap{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-height:40px;cursor:pointer;overflow-wrap:anywhere}
.m-tap:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.m-row .btn{align-self:center}
.m-edit{background:var(--ink);box-shadow:inset 3px 0 0 var(--gold);padding-left:8px}
.m-arsip .m-tap{opacity:.7}
.m-tap .badge{flex:0 0 auto}

/* Tab Unit (v0.1.041): enam menu bawah tetap muat di layar sempit */
@media (max-width:360px){.bnav-btn{font-size:9px;padding:6px 0}}
#app>.seg{margin-bottom:14px}
/* Modal detail unit & komoditas (v0.1.040) */
.dm-lapis{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.52)}
.dm-kartu{width:100%;max-width:440px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--ink-raised);color:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.dm-kartu:focus{outline:none}
.dm-kepala{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 20px 12px}
.dm-jenis{font-size:10.5px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em}
.dm-judul{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:22px;line-height:1.25;margin:4px 0 0;overflow-wrap:anywhere}
.dm-x{flex:0 0 auto;width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--paper-dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dm-x:hover,.dm-x:focus-visible{color:var(--gold);border-color:var(--gold)}
.dm-x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.dm-isi{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 20px 8px;-webkit-overflow-scrolling:touch}
.dm-isi .row>span:last-child{text-align:right}
.dm-sum{margin-top:14px}
.dm-sub{font-size:10.5px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 2px}
.dm-aksi{flex:0 0 auto;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-soft)}
.dm-aksi .btn{min-height:44px}
.dm-aksi .btn.gold{margin-top:0;margin-bottom:10px}
.m-chev{margin-left:auto;color:var(--paper-faint);font-size:18px;line-height:1}
@media (min-width:721px){.dm-lapis{align-items:center}.dm-kartu{border-bottom:1px solid var(--line);border-radius:18px}}
@media (prefers-reduced-motion:no-preference){.dm-lapis{animation:dmMasuk .2s ease-out}.dm-kartu{animation:dmNaik .22s ease-out}@keyframes dmMasuk{from{opacity:0}to{opacity:1}}@keyframes dmNaik{from{transform:translateY(28px)}to{transform:none}}}
html[data-glass="1"] .dm-kartu{-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border-color:var(--glass-edge)}
@media print{.dm-lapis{display:none!important}}

/* Saringan Siklus (v0.1.042): kolom grid boleh menyempit, teks panjang dipotong */
.two>*{min-width:0}
.two .cx-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Form unit/komoditas di modal (v0.1.043): toast tampil di atas modal */
.toast{z-index:120}
.dm-isi .seg.sm .btn{min-height:40px}
body:has(.dm-lapis) .toast{bottom:auto;top:calc(16px + env(safe-area-inset-top,0px))}
.byr{margin-top:6px;border-top:1px solid var(--line-soft)}.byr-baris{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line-soft);font-size:13px}.byr-baris>span:nth-child(2){margin-left:auto}.byr-x{flex:0 0 auto;padding:6px 12px;font-size:12px;min-height:40px}
@media print{.byr-x{display:none!important}}

.rc-chips{display:flex;flex-wrap:nowrap;overflow-x:auto;position:relative;scrollbar-width:none;-webkit-overflow-scrolling:touch}.rc-chips::-webkit-scrollbar{display:none}.rc-chips .btn{flex:0 0 auto;white-space:nowrap}
.ang-baris{display:block;width:100%;min-height:44px;text-align:left;background:none;border:0;border-top:1px solid var(--line-soft);padding:12px 0;color:inherit;font:inherit;cursor:pointer}.ang-baris:hover,.ang-baris:focus-visible{background:var(--line-soft)}.ang-baris .bar-ang{margin:6px 0}
.kas-grafik{display:block;width:100%;height:auto;margin:4px 0}.kas-up{fill:var(--gain)}.kas-down{fill:var(--loss)}.kas-lbl{fill:var(--paper-faint);font-size:8px}.kas-zero{stroke:var(--line);stroke-width:1}.kas-spark{display:block;width:100%;height:40px;margin:4px 0 8px;fill:none;stroke:var(--gold);stroke-width:1.6;vector-effect:non-scaling-stroke}.kas-spark polyline{vector-effect:non-scaling-stroke}.lencana{display:inline-block;margin-left:6px;padding:0 7px;font-size:10.5px;line-height:18px;border:1px solid var(--loss);border-radius:99px;color:var(--loss)}

/* v0.1.063 — komponen baris daftar bersama: .tx, .ang-baris, .m-row (docs/STYLE.md) */
:root{--baris-min:48px}
.tx,.ang-baris,.m-row{min-height:var(--baris-min);padding-top:12px;padding-bottom:12px;border-top:1px solid var(--line-soft);transition:background .12s,transform .15s ease}
.tx:hover,.ang-baris:hover,.m-row:hover,.tx:active,.ang-baris:active,.m-row:active{background:var(--line-soft)}
.tx:hover .tx-n{color:inherit}
.tx:focus-visible,.ang-baris:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;background:var(--line-soft)}
.m-tap:focus-visible{outline-offset:-2px}
h2+.tx,h2+.ang-baris,h2+.m-row{border-top:0}
.tx,.ang-baris{position:relative;padding-right:22px}
.tx::after,.ang-baris::after{content:'›';position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:20px;line-height:1;color:var(--paper-faint);pointer-events:none}
@media print{.tx::after,.ang-baris::after{display:none}}

</style>

<script>
/* Tani Keuangan — penyimpanan aman: localStorage; bila diblokir (mis. dibuka lewat content://), pakai memori + window.name */

/* Tani Keuangan — status buka/tutup bagian yang bisa dilipat (v0.1.024) */

var Setelan = (function () {

  function row(a, b, c) {

  function head(t, n) { return '<div class="sec-head"><h2>' + t + '</h2><div class="note">' + n + '</div></div>'; }

    var tampil = head('Tampilan', 'Mode, skema warna, dan ukuran. Tersimpan di browser ini, tidak ikut ekspor data.') +

      row('Hapus semua data', 'Menghapus transaksi dan siklus di browser ini. Salinan cadangan otomatis dan data cloud tidak ikut terhapus. Bila sinkron cloud aktif, data akan kembali dari cloud: hapus juga data cloud di bagian Sinkron cloud.', '<button type="button" class="btn danger" data-act="hapus">Hapus semua data</button>');
    var tentang = head('Tentang', '') +
      row('Versi', 'Tani Keuangan, keuangan pertanian rumahan.', '<strong>v' + h.versi + '</strong>') +
      (typeof Panduan !== 'undefined' ? Panduan.html() : '') +
      (typeof Pwa !== 'undefined' ? Pwa.html() : '');
    var cad = typeof Cadangan !== 'undefined' ? '<section>' + Cadangan.html() + '</section>' : '';
    var sink = typeof Sinkron !== 'undefined' ? '<section>' + Sinkron.html() + '</section>' : '';
    function lipat(k, s, def) {
      var m = s.match(/^<section>([\s\S]*?)<div class="sec-head"><h2>([\s\S]*?)<\/h2>(<div class="note"[^>]*>[\s\S]*?<\/div>)<\/div>([\s\S]*)<\/section>$/);
      if (!m) return s;
      return '<section><details class="lipat" data-lipat="st-' + k + '"' + (Lipat.buka('st-' + k, def) ? ' open' : '') + '><summary><h2>' + m[2] + '</h2></summary>' + m[3].replace('class="note"', 'class="note lipat-n"') + m[1] + m[4] + '</details></section>';
    }
    return lipat('tampil', '<section>' + tampil + '</section>', true) + lipat('pref', '<section>' + pref + '</section>', true) + lipat('data', '<section>' + data + '</section>', false) +

  }
  function pesan(t) { var e = document.getElementById('dataMsg'); if (e) e.textContent = t; }
  function ekspor() {

    try {
      var a = document.createElement('a');

      document.body.appendChild(a); a.click(); a.remove();

  }
  function impor() {

    try { o = JSON.parse(box.value); } catch (e) { pesan('JSON tidak valid.'); return; }

    var r = h.pasang(o);

  }
  function bind(root) {
    root.addEventListener('click', function (e) {
      var b = e.target.closest('[data-set]');
      if (b) {

        ubah(k, v); return;
      }

      else if (x === 'ekspor') ekspor();
      else if (x === 'impor') impor();
      else if (x === 'berkas') document.getElementById('fileImp').click();
      else if (x === 'nota-hapus') {
        if (konfirmasi2) { clearTimeout(konfirmasi2); konfirmasi2 = null; Nota.kosongkan().then(function () { pesan('Semua foto nota dihapus.'); Nota.isiInfo(); a.textContent = 'Hapus semua foto'; }).catch(function () { pesan('Foto tidak bisa dihapus.'); }); }
        else {
          a.textContent = 'Ketuk lagi untuk menghapus';

        }
      }
      else if (x === 'hapus') {
        if (konfirmasi) { clearTimeout(konfirmasi); konfirmasi = null; h.hapus(); pesan('Semua data dihapus.'); }
        else {
          a.textContent = 'Ketuk lagi untuk menghapus';
          konfirmasi = setTimeout(function () { konfirmasi = null; a.textContent = 'Hapus semua data'; }, 4000);
        }

    });
    root.addEventListener('change', function (e) {
      if (e.target.id === 'margin') {

  }
  function init(hooks) {
    Object.assign(h, hooks || {});
    muat(); terapkan();
    if (window.matchMedia) {
      var mq = matchMedia('(prefers-color-scheme: dark)');
      var f = function () { if (s.mode === 'auto') { terapkan(); h.ubah('mode'); } };
      if (mq.addEventListener) mq.addEventListener('change', f);
    }
  }
  return { init: init, render: render, bind: bind, ubah: ubah, tgl: tgl, get: function (k) { return s[k]; }, efektif: efektif };
})();

<script>
/* Tani Keuangan — form kustom: dropdown dan pemilih tanggal (v0.1.009).

var Form = (function () {
  var BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  var HARI = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
  var CHEV = '<svg class="cx-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  var CAL = '<svg class="cx-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>';
  var CK = '<svg class="cx-ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';

    var items = Array.prototype.slice.call(pop.querySelectorAll('.cx-opt')), i = items.indexOf(document.activeElement);
    if (!items.length) return;

    back = e('div', 'cx-back' + (sheet ? ' dim' : ''));
    back.addEventListener('click', tutup);
    pop = e('div', 'cx-pop' + (sheet ? ' sheet' : '') + (kelas ? ' ' + kelas : ''));
    isi(pop);
    document.documentElement.appendChild(back); document.documentElement.appendChild(pop);
    btn.setAttribute('aria-expanded', 'true');
    if (!sheet) {
      var r = btn.getBoundingClientRect();

      pop.style.left = Math.max(8, left) + 'px'; pop.style.top = top + 'px';
    }
    var f = pop.querySelector('.sel') || pop.querySelector('.cx-opt') || pop.querySelector('.cx-day');
    if (f) { f.focus(); if (f.scrollIntoView) f.scrollIntoView({ block: 'nearest' }); }

    window.addEventListener('scroll', onScroll, true);
  }

    var w = e('div', 'cx');

    el.classList.add('cx-native'); el.tabIndex = -1; el.setAttribute('aria-hidden', 'true'); el.dataset.cx = '1';

  }
  function ubahNilai(el) { el.dispatchEvent(new Event('change', { bubbles: true })); }

  function pilih(sel) {
    var btn = e('button', 'cx-btn'); btn.type = 'button'; btn.setAttribute('aria-haspopup', 'listbox'); btn.setAttribute('aria-expanded', 'false');

  }

  function tanggal(inp) {
    var btn = e('button', 'cx-btn'); btn.type = 'button'; btn.setAttribute('aria-haspopup', 'dialog'); btn.setAttribute('aria-expanded', 'false');
    function isi() { btn.innerHTML = '<span class="cx-val' + (inp.value ? '' : ' ph') + '">' + (inp.value ? h(Setelan.tgl(inp.value)) : 'Pilih tanggal') + '</span>' + CAL; }
    isi(); bungkus(inp, btn);
    function pilihTgl(v) { inp.value = v; isi(); tutup(); ubahNilai(inp); }
    btn.addEventListener('click', function () {

          for (var i = 0; i < awal; i++) g.appendChild(e('span'));

            b.type = 'button'; b.dataset.v = v; b.setAttribute('aria-label', d + ' ' + BULAN[m] + ' ' + y);
            if (v === inp.value) b.setAttribute('aria-pressed', 'true');

            g.appendChild(b);
          }
          p.appendChild(g);
          var ft = e('div', 'cx-foot');
          var bi = e('button', 'btn', 'Hari ini'); bi.type = 'button'; bi.addEventListener('click', function () { pilihTgl(hariIni()); }); ft.appendChild(bi);
          if (inp.dataset.f) { var bh = e('button', 'btn', 'Hapus'); bh.type = 'button'; bh.addEventListener('click', function () { pilihTgl(''); }); ft.appendChild(bh); }
          p.appendChild(ft);
          var f = p.querySelector('.cx-day.sel') || p.querySelector('.cx-day.today') || p.querySelector('.cx-day');

          b.addEventListener('click', function () { var t = y * 12 + m + x[1]; y = Math.floor(t / 12); m = t % 12; gambar(); });

      }, 'cal');
    });
  }

  function upgrade(root) {
    tutup();
    Array.prototype.forEach.call(root.querySelectorAll('select:not([data-cx])'), pilih);
    Array.prototype.forEach.call(root.querySelectorAll('input[type=date]:not([data-cx])'), tanggal);
  }
  return { upgrade: upgrade, tutup: tutup };

<script>
/* Tani Keuangan — mesin modal bersama (v0.1.061, docs/MODAL.md)
   Satu mesin untuk semua jendela: Rencana (formulir dan detail), Siklus (unit/komoditas), Bayar utang.
   Menangani: role dialog, kunci gulir, Esc, jebakan Tab, Enter menyimpan, klik latar, format Rupiah, penyamaran angka (Samar),
   pesan galat di dalam modal, pengembalian fokus, dan satu entri riwayat browser (tombol kembali menutup modal). */
const Modal = {
  m: null, hist: false, tunda: null, abaikan: false, dariPop: false, akhir: null,
  /* o: { html, judulId, fokus (id), pemicu, tutupLatar (true | false | fungsi), klik(e), ubah(e), simpan(), antes(el), onTutup(), cadangan() } */
  buka(o) {
    if (this.m) return null;
    const pemicu = o.pemicu || document.activeElement, el = document.createElement('div');
    el.className = 'dm-lapis'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); if (o.judulId) el.setAttribute('aria-labelledby', o.judulId);
    el.innerHTML = '<div class="dm-kartu" tabindex="-1">' + (o.html || '') + '</div>';
    if (o.antes) o.antes(el);
    document.body.appendChild(el); if (typeof Form !== 'undefined') Form.upgrade(el);
    const m = this.m = { el: el, o: o, pemicu: pemicu, sel: this.selektor(pemicu), kunci: document.body.style.overflow };
    document.body.style.overflow = 'hidden';
    el.addEventListener('click', (e) => {
      if (e.target === el) { const t = o.tutupLatar; if (t === undefined || t === true || (typeof t === 'function' && t())) this.tutup(); return; }
      if (o.klik) o.klik(e);
    });
    el.addEventListener('input', (e) => {
      if (e.target.dataset.rp === undefined) return;
      if (e.data && /[^\d.\s]/.test(e.data)) App.toast(e.data === ',' ? 'Rupiah bulat, tanpa desimal' : 'Hanya angka');
      e.target.value = fmtInput(angkaKetik(e.target.value));
    });
    el.addEventListener('change', (e) => { if (o.ubah) o.ubah(e); });
    m.kd = (e) => {
      if (this.m !== m) return;
      if (e.key === 'Escape') { e.preventDefault(); this.tutup(); }
      else if (e.key === 'Enter' && o.simpan && e.target.tagName === 'INPUT') { e.preventDefault(); o.simpan(); }
      else if (e.key === 'Tab') {
        const q = [...el.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')]; if (!q.length) return;
        const a = q[0], z = q[q.length - 1];
        if (e.shiftKey && (document.activeElement === a || document.activeElement === el.firstChild)) { e.preventDefault(); z.focus(); }
        else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
      }
    };
    document.addEventListener('keydown', m.kd);
    if (typeof Samar !== 'undefined' && Samar.aktif()) Samar.sapu(el);
    this.dorong();
    const i = o.fokus && el.querySelector('#' + o.fokus); if (i) { i.focus(); if (i.select && i.value) i.select(); } else el.firstChild.focus();
    return el;
  },
  /* tanpaFokus: jangan kembalikan fokus (pemanggil memanggil pulihFokus setelah menggambar ulang halaman) */
  tutup(tanpaFokus) {
    const m = this.m; if (!m) return;
    this.m = null; m.el.remove(); document.body.style.overflow = m.kunci; document.removeEventListener('keydown', m.kd);
    this.akhir = { pemicu: m.pemicu, sel: m.sel, cad: m.o.cadangan };
    if (m.o.onTutup) m.o.onTutup();
    if (!this.dariPop) this.balikRiwayat();
    if (!tanpaFokus) this.pulihFokus();
  },
  /* pesan galat di dalam modal (modal tetap terbuka) */
  galat(teks) {
    if (!this.m) { App.toast(teks); return; }
    const c = this.m.el.querySelector('.dm-isi') || this.m.el.firstChild; let p = c.querySelector('#mdMsg');
    if (!p) { p = document.createElement('p'); p.id = 'mdMsg'; p.className = 'note down'; p.setAttribute('role', 'alert'); c.appendChild(p); }
    p.textContent = teks;
  },
  selektor(e) {
    if (!e || !e.getAttribute) return '';
    if (e.id) return '#' + e.id;
    const a = e.dataset && (e.dataset.rc ? ['rc', e.dataset.rc] : e.dataset.do ? ['do', e.dataset.do] : null);
    return a && e.dataset.id ? '[data-' + a[0] + '="' + a[1] + '"][data-id="' + e.dataset.id + '"]' : '';
  },
  /* fokus ke pemicu; bila sudah tergambar ulang, cari lagi lewat selektornya; terakhir ke tombol + atau isi halaman */
  pulihFokus() {
    const a = this.akhir; if (!a || this.m) return;
    let e = a.pemicu && document.body.contains(a.pemicu) ? a.pemicu : null;
    if (!e && a.sel) e = document.querySelector(a.sel);
    if (!e && a.cad) e = a.cad();
    if (!e && a.pemicu && a.pemicu.className && /fab/.test(a.pemicu.className)) e = document.getElementById('fab');
    if (!e) { e = document.getElementById('app'); if (e && !e.hasAttribute('tabindex')) e.setAttribute('tabindex', '-1'); }
    if (e && e.focus) e.focus({ preventScroll: true });
    this.akhir = null;
  },
  /* ---- riwayat: modal terbuka = satu entri; bila modal baru dibuka seketika setelah yang lama ditutup, entrinya dipakai ulang ---- */
  dorong() {
    if (this.tunda) { clearTimeout(this.tunda); this.tunda = null; return; }
    try { history.pushState({ r: App.ri || 0, modal: 1 }, ''); this.hist = true; } catch (e) { this.hist = false; }
  },
  balikRiwayat() {
    if (!this.hist) return;
    this.tunda = setTimeout(() => { this.tunda = null; this.hist = false; this.abaikan = true; try { history.back(); } catch (e) { this.abaikan = false; } }, 0);
  },
  /* dipanggil App saat popstate; true bila sudah ditangani di sini */
  popstate() {
    if (this.abaikan) { this.abaikan = false; return true; }
    if (this.m) { this.hist = false; this.dariPop = true; try { this.tutup(); } finally { this.dariPop = false; } return true; }
    return false;
  }
};

</script>
<script>

const TEMPLATE_KOM = [
  { label: 'Sayur daun', kunci: ['bayam', 'kangkung', 'sawi', 'selada', 'sayur'], satuan: 'ikat', umur: 30, komponen: [['Benih / Bibit', 10], ['Pupuk / Nutrisi', 25], ['Pestisida / Obat', 10], ['Media Tanam / Polybag', 15], ['Tenaga Kerja', 30], ['Kemasan & Pengiriman', 10]] },

  { label: 'Ayam petelur', kunci: ['ayam', 'petelur'], satuan: 'butir', umur: 120, komponen: [['Benih / Bibit', 12], ['Pakan', 70], ['Pestisida / Obat', 5], ['Air / Listrik', 5], ['Tenaga Kerja', 8]] }
];
/* Tani Keuangan — Fase 2: unit, komoditas, siklus, panen (v0.1.008) */
const JENIS_UNIT = [['kebun', 'Kebun / lahan'], ['hidroponik', 'Hidroponik'], ['kolam', 'Kolam'], ['kandang', 'Kandang'], ['lainnya', 'Lainnya']];
const num = (s) => { const n = parseFloat(String(s || '').replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtN = (n) => (Math.round(n * 100) / 100).toLocaleString('id-ID');
const Siklus = {
  sid: null, sub: 'berjalan', msub: 'unit', fu: '', fk: '', pd: null, minta: null, sf: null, mf: null,
  d() { return App.data; },
  unit(id) { return this.d().unit.find((x) => x.id === id); },
  kom(id) { return this.d().komoditas.find((x) => x.id === id); },

  koms(semua) { return this.d().komoditas.filter((x) => !x.terhapus && (semua || !x.arsip)); },
  pakai(f, id) { return this.daftar().filter((s) => s[f] === id).length; },
  norm(t) { return String(t || '').trim().replace(/\s+/g, ' ').toLowerCase(); },
  kembar(list, nama, id) { const n = this.norm(nama); return list.some((x) => x.id !== id && this.norm(x.nama) === n); },
  mfBaru() { return { unit: { id: null, nama: '', jenis: 'kebun', ukur: '', sat: '' }, kom: { id: null, nama: '', sat: '', umur: '' } }; },
  sfBaru() { // isian awal siklus baru: unit dan komoditas dari siklus terakhir (bila masih aktif)
    const l = this.daftar().slice().sort((a, b) => String(b.dibuat || '').localeCompare(String(a.dibuat || '')))[0];
    const u = l && this.units().find((x) => x.id === l.unitId), k = l && this.koms().find((x) => x.id === l.komoditasId);
    return { id: null, unit: u ? u.id : '', kom: k ? k.id : '', mulai: isoHari(), selesai: '', cat: '' };
  },
  saring(k, v) { this[k === 'unit' ? 'fu' : 'fk'] = v; App.go('siklus', true); },
  pindah(t, dari) { // dipanggil App.go: keadaan sementara dibersihkan saat halaman berganti
    if (t !== dari) { this.minta = null; this.dmTutup(true, true); }
    if (t !== 'siklus-form') this.sf = null;
    if (t === 'master' && dari !== 'master') this.mf = this.mfBaru();
  },
  bacaMaster() { // simpan isian form unit/komoditas (bila tampil di modal) sebelum digambar ulang
    if (!this.mf) this.mf = this.mfBaru();
    const g = (i) => ($(i) ? $(i).value : '');
    if ($('m_unama')) Object.assign(this.mf.unit, { nama: g('m_unama'), jenis: g('m_ujenis') || 'kebun', ukur: g('m_uukur'), sat: g('m_usat') });
    if ($('m_knama')) Object.assign(this.mf.kom, { nama: g('m_knama'), sat: g('m_ksat'), umur: g('m_kumur') });
  },
  gulir(id) { const e = $(id); if (!e) return; const r = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; e.scrollIntoView({ block: 'center', behavior: r ? 'auto' : 'smooth' }); },
  daftar() { return this.d().siklus.filter((s) => !s.terhapus); },
  cari(id) { return this.d().siklus.find((x) => x.id === id && !x.terhapus); },
  nama(id) { const s = this.cari(id); if (!s) return ''; const k = this.kom(s.komoditasId), u = this.unit(s.unitId); return (k ? k.nama : '?') + ' · ' + (u ? u.nama : '?'); },
  panenOf(id) { return this.d().panen.filter((p) => !p.terhapus && p.siklusId === id).sort((a, b) => b.tanggal.localeCompare(a.tanggal)); },
  ringkas(id) {
    const tx = App.aktif().filter((t) => t.siklusId === id);
    return { modal: App.jumlah(tx, 'keluar'), hasil: App.jumlah(tx, 'masuk'), tx: tx,
             bersih: this.panenOf(id).reduce((a, p) => a + p.kuantitasKotor - p.susut, 0) };
  },
  panenPerkiraan(s) { // perkiraan panen = mulai + umur panen komoditas (hanya siklus berjalan)
    const k = this.kom(s.komoditasId); if (!k || !k.umurPanenHari || s.status !== 'berjalan') return null;
    const [y, m, d] = s.mulai.split('-').map(Number), t = new Date(y, m - 1, d + k.umurPanenHari), n = new Date();
    return { tgl: isoHari(t), sisa: Math.round((t - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5) };
  },
  templateUntuk(nama) { const n = String(nama || '').toLowerCase(); return TEMPLATE_KOM.find((t) => t.kunci.some((k) => n.includes(k))) || null; },
  hari(s) {
    const a = new Date(s.mulai + 'T00:00:00'), b = new Date((s.status === 'selesai' && s.selesai ? s.selesai : isoHari()) + 'T00:00:00');
    return Math.max(1, Math.round((b - a) / 864e5) + 1);
  },
  opsi(list, pilih, f) { return list.map((x) => '<option value="' + x.id + '"' + (x.id === pilih ? ' selected' : '') + '>' + esc(f(x)) + '</option>').join(''); },

  /* ---------- tampilan ---------- */
  vList() {
    const ada = this.daftar(), fu = this.fu && this.unit(this.fu) ? this.fu : '', fk = this.fk && this.kom(this.fk) ? this.fk : '';
    const base = ada.filter((s) => (!fu || s.unitId === fu) && (!fk || s.komoditasId === fk));
    const tampil = base.filter((s) => s.status === this.sub).sort((a, b) => { if (this.sub === 'berjalan') { const x = this.panenPerkiraan(a), y = this.panenPerkiraan(b); return (x ? x.sisa : 1e9) - (y ? y.sisa : 1e9) || b.mulai.localeCompare(a.mulai); } return b.mulai.localeCompare(a.mulai); });
    return '<section><div class="seg">' + [['berjalan', 'Berjalan'], ['selesai', 'Selesai']].map((x) =>
      '<button type="button" class="btn' + (this.sub === x[0] ? ' on' : '') + '" data-do="siklus-tab" data-val="' + x[0] + '">' + x[1] + ' (' + base.filter((s) => s.status === x[0]).length + ')</button>').join('') + '</div>' +
      (ada.length > 3 ? '<div class="two"><div><label for="sf_u">Unit</label><select id="sf_u" data-sfl="unit"><option value="">Semua unit</option>' + this.opsi(this.units(true).filter((u) => ada.some((s) => s.unitId === u.id)), fu, (u) => u.nama) + '</select></div>' +
        '<div><label for="sf_k">Komoditas</label><select id="sf_k" data-sfl="kom"><option value="">Semua komoditas</option>' + this.opsi(this.koms(true).filter((k) => ada.some((s) => s.komoditasId === k.id)), fk, (k) => k.nama) + '</select></div></div>' : '') +
      (tampil.length > 1 ? (() => { const m = tampil.reduce((a, s) => { const r = this.ringkas(s.id); a.m += r.modal; a.h += r.hasil; return a; }, { m: 0, h: 0 }), u = m.h - m.m;
        return '<div class="sum" style="margin-top:14px"><div><span class="note">Modal</span><strong class="down">' + rp(m.m) + '</strong></div><div><span class="note">Hasil</span><strong class="up">' + rp(m.h) + '</strong></div><div><span class="note">' + (u < 0 ? 'Rugi' : 'Untung') + '</span><strong class="' + (u < 0 ? 'down' : 'up') + '">' + rp(u) + '</strong></div></div><p class="note" style="margin:6px 0 4px">Total ' + tampil.length + ' siklus ' + this.sub + (fu || fk ? ' (disaring)' : '') + '</p>'; })() : '') +
      (tampil.length ? tampil.map((s) => {
        const r = this.ringkas(s.id), k = this.kom(s.komoditasId), pp = this.panenPerkiraan(s);
        return '<div class="sc-card" data-do="buka-siklus" data-id="' + s.id + '" role="button" tabindex="0"><div class="sc-head"><span class="sc-name">' + esc(this.nama(s.id)) + '</span>' +
          '<span class="badge' + (s.status === 'berjalan' ? ' live' : '') + '">' + (s.status === 'berjalan' ? 'hari ' + this.hari(s) + (k && k.umurPanenHari ? '/' + k.umurPanenHari : '') : 'selesai') + '</span></div>' +
          '<div class="note">Mulai ' + Setelan.tgl(s.mulai) + ' · Modal ' + rp(r.modal) + ' · Hasil ' + rp(r.hasil) + (s.status === 'berjalan' && r.hasil ? ' · ' + (r.hasil - r.modal < 0 ? 'Rugi ' : 'Untung ') + rp(Math.abs(r.hasil - r.modal)) : '') + '</div>' +
          (pp ? '<div class="note">' + (pp.sisa >= 0 ? 'Perkiraan panen ' + Setelan.tgl(pp.tgl) + ' · ' + (pp.sisa === 0 ? 'hari ini' : pp.sisa + ' hari lagi') : '<span class="down">Lewat perkiraan panen ' + Setelan.tgl(pp.tgl) + ' · terlambat ' + (-pp.sisa) + ' hari</span>') + '</div>' : '') +
          (s.anggaran ? (() => { const p = Math.round(r.modal / s.anggaran * 100); return '<div class="bar-ang' + (p > 100 ? ' x' : p >= 90 ? ' w' : '') + '" role="img" aria-label="Modal ' + p + ' persen dari anggaran"><i style="width:' + Math.min(100, p) + '%"></i></div><div class="note">Anggaran ' + rp(s.anggaran) + ' · terpakai ' + p + '%</div>'; })() : '') + '</div>';
      }).join('') : '<p class="note" style="margin-top:14px">' + (ada.length ? 'Tidak ada siklus ' + this.sub + (fu || fk ? ' untuk saringan ini' : '') + '.' : 'Belum ada siklus. Siapkan unit dan komoditas, lalu ketuk tombol + untuk memulai siklus pertama.') + '</p>') +
      (this.units().length && this.koms().length ? '' : '<button class="btn" data-go="master" style="width:100%;margin-top:10px">Siapkan unit &amp; komoditas</button>') + '</section>';
  },
  vForm() {
    const f = this.sf || (this.sf = this.sfBaru()), ubah = !!f.id, s = ubah ? this.cari(f.id) : null;
    if (ubah && !s) { this.sf = null; return this.vList(); }
    if (!ubah && (!this.units().length || !this.koms().length))
      return '<section><p class="note">' + (this.units(true).length && this.koms(true).length ? 'Semua unit atau komoditas sedang diarsipkan. Pulihkan atau tambahkan yang baru dulu.' : 'Tambahkan dulu minimal satu unit/lahan dan satu komoditas.') + '</p>' +
        '<button class="btn gold" data-go="master">Buka halaman Unit</button><button class="btn" data-go="siklus" style="width:100%;margin-top:10px">Batal</button></section>';
    const lu = ubah ? this.units(true).filter((x) => !x.arsip || x.id === f.unit) : this.units(), lk = ubah ? this.koms(true).filter((x) => !x.arsip || x.id === f.kom) : this.koms();

      '<label for="s_unit">Unit / lahan</label><select id="s_unit">' + this.opsi(lu, f.unit, (u) => u.nama + (u.arsip ? ' (arsip)' : '')) + '</select>' +
      '<label for="s_kom">Komoditas</label><select id="s_kom">' + this.opsi(lk, f.kom, (k) => k.nama + (k.arsip ? ' (arsip)' : '')) + '</select>' +
      '<label for="s_mulai">Tanggal mulai</label><input type="date" id="s_mulai" value="' + (f.mulai || isoHari()) + '">' +
      (ubah && s.status === 'selesai' ? '<label for="s_selesai">Tanggal selesai</label><input type="date" id="s_selesai" value="' + (f.selesai || s.selesai || isoHari()) + '">' : '') +
      '<label for="s_cat">Catatan (opsional)</label><input id="s_cat" maxlength="120" value="' + esc(f.cat || '') + '" placeholder="mis. bibit dari toko tani">' +

      '<button class="btn gold" data-do="simpan-siklus">' + (ubah ? 'Simpan perubahan' : 'Mulai siklus') + '</button><button class="btn" data-go="' + (ubah ? 'siklus-detail' : 'siklus') + '" style="width:100%;margin-top:10px">Batal</button></section>';
  },
  vDetail() {
    const s = this.cari(this.sid);
    if (!s) return this.vList();
    const r = this.ringkas(s.id), k = this.kom(s.komoditasId), sat = k ? k.satuan : '', jalan = s.status === 'berjalan', u = r.hasil - r.modal;
    const panen = this.panenOf(s.id).map((p) => '<div class="tx"' + ' data-do="panen-detail" data-id="' + p.id + '" role="button" tabindex="0" aria-haspopup="dialog"' + '><div class="tx-l"><div class="tx-n">' +
      fmtN(p.kuantitasKotor - p.susut) + ' ' + esc(sat) + ' bersih</div><div class="note">' + Setelan.tgl(p.tanggal) + ' · susut ' + fmtN(p.susut) + (p.pembeli ? ' · ' + esc(p.pembeli) : '') + '</div></div>' +
      '<div class="tx-a">' + (p.hargaPerSatuan ? rp(p.hargaPerSatuan) + '/' + esc(sat) : '—') + '</div></div>').join('');
    return '<section><div class="sc-head"><h2 style="margin:0">Ringkasan</h2><span class="badge' + (jalan ? ' live' : '') + '">' + (jalan ? 'berjalan' : 'selesai') + '</span></div>' +
      '<p class="note" style="margin:8px 0 0">Mulai ' + Setelan.tgl(s.mulai) + (jalan ? ' · hari ' + this.hari(s) + (k && k.umurPanenHari ? ' dari ±' + k.umurPanenHari : '') : ' · selesai ' + Setelan.tgl(s.selesai) + ' (' + this.hari(s) + ' hari)') + (s.catatan ? ' · ' + esc(s.catatan) : '') + '</p>' +
      '<div class="sum" style="margin-top:14px"><div><span class="note">Modal</span><strong class="down">' + rp(r.modal) + '</strong></div><div><span class="note">Hasil</span><strong class="up">' + rp(r.hasil) + '</strong></div>' +
      '<div><span class="note">' + (u < 0 ? 'Rugi' : 'Untung') + '</span><strong class="' + (u < 0 ? 'down' : 'up') + '">' + rp(u) + '</strong></div></div>' +

<script>
/* Tani Keuangan — Fase 3–4: laporan, dashboard, cetak laba-rugi, R/C, HPP, BEP, harga jual minimum (v0.1.014) */
const Analisa = {
  dim: 'siklus', per: 'semua',
  PER: [['bulan', 'Bulan ini'], ['tahun', 'Tahun ini'], ['semua', 'Semua']],
  DIM: [['siklus', 'Siklus'], ['komoditas', 'Komoditas'], ['unit', 'Unit']],
  masuk(tgl) {
    if (this.per === 'bulan') return tgl.slice(0, 7) === bulanIni();
    if (this.per === 'tahun') return tgl.slice(0, 4) === bulanIni().slice(0, 4);
    return true;
  },
  kunci(sid) {
    const s = Siklus.cari(sid);
    if (!s) return ['-', 'Tanpa siklus', ''];
    if (this.dim === 'siklus') return [s.id, Siklus.nama(s.id), s.mulai];
    if (this.dim === 'komoditas') { const k = Siklus.kom(s.komoditasId); return [s.komoditasId, k ? k.nama : '?', k ? k.satuan : '']; }
    const u = Siklus.unit(s.unitId); return [s.unitId, u ? u.nama : '?', ''];
  },
  hitung() {
    const g = {}, ambil = (sid) => {
      const [id, nama] = this.kunci(sid);
      return g[id] || (g[id] = { nama, modal: 0, hasil: 0, nonPanen: 0, alat: 0, tetap: 0, vari: 0, qty: 0, sat: new Set() });
    };
    App.aktif().filter((t) => this.masuk(t.tanggal)).forEach((t) => {
      const r = ambil(t.siklusId);
      if (t.jenis === 'masuk') { r.hasil += t.jumlah; if (t.kategoriId === 'jual-bibit' || t.kategoriId === 'subsidi') r.nonPanen += t.jumlah; }
      else { r.modal += t.jumlah; if (t.kategoriId === 'alat') r.alat += t.jumlah; if (t.sifatBiaya === 'tetap') r.tetap += t.jumlah; else r.vari += t.jumlah; }
    });
    Siklus.d().panen.filter((p) => !p.terhapus && this.masuk(p.tanggal)).forEach((p) => {
      const s = Siklus.cari(p.siklusId); if (!s) return;
      const r = ambil(p.siklusId); r.qty += Math.max(0, p.kuantitasKotor - p.susut);
      const k = Siklus.kom(s.komoditasId); if (k && k.satuan) r.sat.add(k.satuan);
    });
    const mg = Math.min(90, Math.max(1, Number(Setelan.get('margin')) || 30)) / 100;
    return Object.values(g).map((r) => {
      r.untung = r.hasil - r.modal;
      r.rc = r.modal ? r.hasil / r.modal : null;
      r.margin = r.hasil ? r.untung / r.hasil : null;
      r.satuan = r.sat.size === 1 ? [...r.sat][0] : 'satuan';
      r.hpp = r.qty ? (r.modal - r.alat) / r.qty : null; // pembelian alat tidak masuk HPP
      r.harga = r.qty && r.hasil - r.nonPanen > 0 ? (r.hasil - r.nonPanen) / r.qty : null; // penjualan bibit dan bantuan tidak ikut
      r.hmin = r.hpp ? r.hpp / (1 - mg) : null;
      const v = r.qty ? r.vari / r.qty : 0;
      r.bep = (r.harga && r.harga > v && r.qty) ? r.tetap / (r.harga - v) : null; // titik impas (satuan)
      r.mg = mg; return r;
    }).sort((a, b) => b.untung - a.untung);
  },
  chip(arr, cur, att) { return '<div class="seg sm" style="justify-content:flex-start;margin:6px 0">' + arr.map((x) => '<button type="button" class="btn' + (cur === x[0] ? ' on' : '') + '" data-' + att + '="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>'; },
  kartu(r, i) {
    const f = (n) => n === null ? '—' : rp(Math.round(n)), u = r.untung >= 0;
    const baris = (a, b) => '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>';
    return '<section class="lap-kartu"><div class="sec-head"><h2>' + (i === 0 && r.untung > 0 ? '★ ' : '') + esc(r.nama) + '</h2><span class="tx-a ' + (u ? 'up' : 'down') + '">' + (u ? '+' : '') + rp(r.untung).replace('Rp ', 'Rp\u00a0') + '</span></div>' +

  vBanding() {

  simH: -10, simB: 0,

  },
  vLaporanIsi() {
    const L = this.hitung(), T = L.reduce((a, r) => ({ m: a.m + r.modal, h: a.h + r.hasil }), { m: 0, h: 0 }), un = T.h - T.m;

    if (this.sub === 'rincian') return kepala + '<section>' + filter + '<p class="note">Urut dari untung terbesar. HPP = modal (di luar pembelian alat) ÷ panen bersih; harga rata-rata tidak menghitung penjualan bibit dan bantuan; BEP dihitung dari biaya tetap, harga rata-rata, dan biaya variabel per satuan.</p></section>' +
      (L.length ? L.map((r, i) => this.kartu(r, i)).join('') : '<section><p class="note">Belum ada transaksi pada periode ini. Catat modal/hasil atau isi data contoh di Beranda.</p></section>');
    return kepala + '<section>' + filter +
      '<div class="row"><span class="mu">Untung / rugi</span><strong class="' + (un >= 0 ? 'up' : 'down') + '">' + rp(un) + '</strong></div>' +
      '<div class="row"><span class="mu">R/C ratio</span><span>' + (T.m ? fmtRC(T.h / T.m) : '—') + '</span></div>' +
      '<div class="row"><span class="mu">Modal / Hasil</span><span>' + rp(T.m) + ' / ' + rp(T.h) + '</span></div></section>' + this.vBanding() + this.vSimulasi();
  },
  /* ---------- Fase 4: dashboard, cetak, Excel ---------- */
  tren() {
    const d = new Date(), out = [];
    for (let i = 5; i >= 0; i--) {
      const x = new Date(d.getFullYear(), d.getMonth() - i, 1), k = isoHari(x).slice(0, 7);

      out.push({ n: ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][x.getMonth()], m: App.jumlah(tx, 'keluar'), h: App.jumlah(tx, 'masuk') });
    }

  },
  svgTren() {
    const T = this.tren(), mx = Math.max(1, ...T.map((r) => Math.max(r.m, r.h))), H = 110, w = 50;
    const bar = (v, x, c) => '<rect x="' + x + '" y="' + (H - v / mx * H + 8) + '" width="18" height="' + Math.max(v ? 2 : 0, v / mx * H) + '" rx="3" fill="var(' + c + ')"/>';
    return '<svg viewBox="0 0 320 146" width="100%" role="img" aria-label="Tren modal dan hasil 6 bulan">' + T.map((r, i) => bar(r.m, i * w + 6, '--loss') + bar(r.h, i * w + 26, '--fill') +
      '<text x="' + (i * w + 25) + '" y="140" text-anchor="middle" font-size="10" fill="var(--paper-faint)">' + r.n + '</text>').join('') + '</svg>' +
      '<p class="note"><span style="color:var(--loss)">■</span> Modal &nbsp; <span style="color:var(--fill)">■</span> Hasil · 6 bulan terakhir</p>';
  },
  komposisi() {
    const per = {}; let tot = 0;
    App.aktif().filter((t) => t.jenis === 'keluar' && this.masuk(t.tanggal)).forEach((t) => { per[t.kategoriId] = (per[t.kategoriId] || 0) + t.jumlah; tot += t.jumlah; });
    if (!tot) return '<p class="note">Belum ada modal pada periode ini.</p>';
    return Object.keys(per).sort((a, b) => per[b] - per[a]).slice(0, 6).map((k) => { const p = Math.round(per[k] / tot * 100);
      return '<div class="bar-row"><div class="bar-top"><span>' + esc(App.namaKat(k)) + '</span><span class="mu">' + p + '% · ' + rp(per[k]) + '</span></div><div class="bar"><i style="width:' + p + '%"></i></div></div>'; }).join('');
  },
  topKom() {
    const keep = this.dim; this.dim = 'komoditas'; const L = this.hitung().filter((r) => r.nama !== 'Tanpa siklus').slice(0, 3); this.dim = keep;
    if (!L.length) return '<p class="note">Belum ada komoditas bersiklus pada periode ini.</p>';

  cetak() { window.print(); },
  eksporXls() {
    const L = this.hitung(), n = (v) => v === null ? '' : Math.round(v * 100) / 100;
    const h = '<table border="1"><tr><th>Nama</th><th>Modal</th><th>Hasil</th><th>Untung</th><th>R/C</th><th>Panen bersih</th><th>HPP</th><th>Harga rata-rata</th><th>Harga min</th><th>BEP (satuan)</th></tr>' +
      L.map((r) => '<tr><td>' + esc(r.nama) + '</td>' + [r.modal, r.hasil, r.untung, r.rc, r.qty, r.hpp, r.harga, r.hmin, r.bep].map((v) => '<td>' + n(v) + '</td>').join('') + '</tr>').join('') + '</table>';
    const blob = new Blob(['\ufeff<html><head><meta charset="utf-8"></head><body>' + h + '</body></html>'], { type: 'application/vnd.ms-excel' });

    document.body.appendChild(a); a.click(); a.remove();
  },
  /* ---------- grafik garis halus + tooltip (v0.1.014) ---------- */
  rentang: 6, _pts: [],
  bulanN(n) {
    const d = new Date(), B = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'], out = [];
    for (let i = n - 1; i >= 0; i--) {
      const x = new Date(d.getFullYear(), d.getMonth() - i, 1), k = isoHari(x).slice(0, 7);

  },
  ringkasAngka(n) { n = Math.abs(n); return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace('.', ',') + ' jt' : n >= 1e3 ? Math.round(n / 1e3) + ' rb' : String(Math.round(n)); },
  kurva(P) { // bezier halus tanpa melampaui titik
    let d = 'M' + P[0][0] + ' ' + P[0][1];
    for (let i = 0; i < P.length - 1; i++) {
      const a = P[i], b = P[i + 1], p0 = P[i - 1] || a, p3 = P[i + 2] || b, lo = Math.min(a[1], b[1]), hi = Math.max(a[1], b[1]);
      const c = (v) => Math.min(hi, Math.max(lo, v));
      d += ' C' + (a[0] + (b[0] - p0[0]) / 6).toFixed(1) + ' ' + c(a[1] + (b[1] - p0[1]) / 6).toFixed(1) + ' ' + (b[0] - (p3[0] - a[0]) / 6).toFixed(1) + ' ' + c(b[1] - (p3[1] - a[1]) / 6).toFixed(1) + ' ' + b[0] + ' ' + b[1];
    }
    return d;
  },
  vGrafik() {

    const mx = Math.max(1, ...T.map((r) => Math.max(r.m, r.h))), tinggi = (v) => Y1 - v / mx * (Y1 - Y0);
    const px = (i) => X0 + (T.length === 1 ? 0 : i * (X1 - X0) / (T.length - 1));
    const H = T.map((r, i) => [px(i), tinggi(r.h)]), M = T.map((r, i) => [px(i), tinggi(r.m)]);
    this._pts = T.map((r, i) => ({ x: px(i), yh: H[i][1], ym: M[i][1], n: r.n + ' ' + r.thn, h: r.h, m: r.m }));
    const grid = [0, 1, 2, 3].map((i) => { const v = mx * i / 3, y = tinggi(v);
      return '<line x1="' + X0 + '" x2="' + X1 + '" y1="' + y + '" y2="' + y + '" stroke="var(--line-soft)"/><text x="' + (X0 - 5) + '" y="' + (y + 3) + '" text-anchor="end" font-size="9" fill="var(--paper-faint)">' + this.ringkasAngka(v) + '</text>'; }).join('');
    const langkah = Math.ceil(T.length / 6);
    const sumbu = T.map((r, i) => i % langkah === 0 ? '<text x="' + px(i) + '" y="168" text-anchor="middle" font-size="9" fill="var(--paper-faint)">' + r.n + '</text>' : '').join('');
    const kH = this.kurva(H), area = kH + ' L' + X1 + ' ' + Y1 + ' L' + X0 + ' ' + Y1 + ' Z';
    const tot = T.reduce((a, r) => ({ h: a.h + r.h, m: a.m + r.m }), { h: 0, m: 0 }), un = tot.h - tot.m;
    const tabel = '<div class="gulir"><table class="lg-tab"><tr><th>Bulan</th><th>Hasil</th><th>Modal</th><th>Untung</th></tr>' + T.map((r) => '<tr><td>' + r.n + ' ' + r.thn + '</td><td>' + rp(r.h) + '</td><td>' + rp(r.m) + '</td><td class="' + (r.h >= r.m ? 'up' : 'down') + '">' + rp(r.h - r.m) + '</td></tr>').join('') + '</table></div>';
    return '<section class="dash"><h2>Tren hasil / modal</h2>' + this.chip([[6, '6 bulan'], [12, '12 bulan']], this.rentang, 'lr') +
      '<div class="lg-stat"><div><div class="note">UNTUNG BERSIH</div><strong class="' + (un >= 0 ? 'up' : 'down') + '">' + rp(un) + '</strong></div><div><div class="note">TOTAL HASIL</div><strong>' + rp(tot.h) + '</strong></div><div><div class="note">TOTAL MODAL</div><strong>' + rp(tot.m) + '</strong></div></div>' +
      '<div class="lg-wrap"><svg class="lg-svg" viewBox="0 0 ' + W + ' 176" width="100%" role="img" aria-label="Tren hasil dan modal"><defs><linearGradient id="lgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--fill)" stop-opacity=".45"/><stop offset="1" stop-color="var(--fill)" stop-opacity="0"/></linearGradient></defs>' +
      grid + '<path d="' + area + '" fill="url(#lgA)"/><path d="' + kH + '" fill="none" stroke="var(--fill)" stroke-width="2.2" stroke-linecap="round"/><path d="' + this.kurva(M) + '" fill="none" stroke="var(--loss)" stroke-width="2.2" stroke-linecap="round"/>' + sumbu +
      '<line class="lg-x" y1="' + Y0 + '" y2="' + Y1 + '" stroke="var(--paper-faint)" stroke-dasharray="2 3" visibility="hidden"/><circle class="lg-dh" r="3.6" fill="var(--fill)" stroke="var(--ink)" visibility="hidden"/><circle class="lg-dm" r="3.6" fill="var(--loss)" stroke="var(--ink)" visibility="hidden"/></svg><div class="lg-tip" hidden></div></div>' +
      '<p class="note lg-leg"><span style="color:var(--fill)">●</span> Hasil &nbsp; <span style="color:var(--loss)">●</span> Modal · sentuh grafik untuk melihat angka</p>' +
      '<details class="lg-detail"><summary>Tabel angka grafik</summary>' + tabel + '</details></section>';
  },
  sentuh(e) {
    const svg = e.target.closest && e.target.closest('.lg-svg'); if (!svg || !this._pts.length) return;
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * 320;
    let k = 0; this._pts.forEach((p, i) => { if (Math.abs(p.x - vx) < Math.abs(this._pts[k].x - vx)) k = i; });
    const p = this._pts[k], q = (c) => svg.querySelector(c), tip = svg.parentNode.querySelector('.lg-tip');
    const x = q('.lg-x'); x.setAttribute('x1', p.x); x.setAttribute('x2', p.x); x.setAttribute('visibility', 'visible');
    [['.lg-dh', p.yh], ['.lg-dm', p.ym]].forEach((a) => { const c = q(a[0]); c.setAttribute('cx', p.x); c.setAttribute('cy', a[1]); c.setAttribute('visibility', 'visible'); });
    tip.hidden = false;
    tip.innerHTML = '<b>' + p.n + '</b><br><span style="color:var(--fill)">Hasil: ' + rp(p.h) + '</span><br><span style="color:var(--loss)">Modal: ' + rp(p.m) + '</span>';
    const pct = p.x / 320 * 100; tip.style.left = Math.min(Math.max(pct, 24), 76) + '%';

  klik(e) {

    App.go('laporan', true); return true;
  }

document.addEventListener('pointerdown', (e) => Analisa.sentuh(e));
document.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons || e.pressure) Analisa.sentuh(e); });

</script>
<script>
/* Tani Keuangan — Fase 5: anggaran, arus kas, aset, utang/piutang (v0.1.015; tombol Bayar dan cicilan v0.1.049; semua isian lewat modal FAB v0.1.055) */
const Rencana = {
  sub: 'anggaran',
  SUB: [['anggaran', 'Anggaran'], ['kas', 'Arus kas'], ['aset', 'Aset'], ['utang', 'Utang/piutang'], ['harga', 'Harga pasar'], ['kelayakan', 'Kelayakan']],
  d() { return App.data; },
  bulanKe(n) { const x = new Date(); x.setDate(1); x.setMonth(x.getMonth() + n); return isoHari(x).slice(0, 7); },
  net(k) { return Utang.net(k); },
  saldoAwal() { return Number(App.data.pengaturan.saldoAwal) || 0; },
  BLN: ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],
  namaBln(k) { return this.BLN[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4); },
  saldoSd(k) { return Utang.saldoSd(k); },
  rata3() { const a = [-3, -2, -1].map((n) => this.bulanKe(n)).filter((k) => App.aktif().some((t) => t.tanggal.slice(0, 7) === k)); return a.length ? a.reduce((s, k) => s + this.net(k), 0) / a.length : 0; },
  mulai(a) { const [y, m] = a.tanggalBeli.split('-').map(Number), n = new Date(); return Math.max(0, Math.min(a.umurBulan, (n.getFullYear() - y) * 12 + n.getMonth() + 1 - m)); },
  baris(a, b) { return '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>'; },
  ringkas() {
    const U = this.d().utang.filter((u) => !u.terhapus && !u.lunas), tot = (j) => U.filter((u) => u.jenis === j).reduce((s, u) => s + Utang.sisa(u), 0);
    const S = Siklus.daftar().filter((s) => s.anggaran > 0), ang = S.reduce((a, s) => a + s.anggaran, 0), real = S.reduce((a, s) => a + Siklus.ringkas(s.id).modal, 0), sal = Utang.saldo();
    return '<section><div class="sum"><div><span class="note">Saldo kas</span><strong class="' + (sal < 0 ? 'down' : 'up') + '">' + rp(sal) + '</strong></div><div><span class="note">Utang</span><strong class="down">' + rp(tot('utang')) + '</strong></div><div><span class="note">Piutang</span><strong class="up">' + rp(tot('piutang')) + '</strong></div></div>' +
      (ang ? '<p class="note" style="margin:8px 0 0">Anggaran terpakai ' + Math.round(real / ang * 100) + '% (' + rp(real) + ' dari ' + rp(ang) + ')</p>' : '') + '</section>';
  },
  gulirChip() { requestAnimationFrame(() => { const c = document.querySelector('.rc-chips'), a = c && c.querySelector('.on'); if (a) c.scrollLeft = a.offsetLeft - (c.clientWidth - a.offsetWidth) / 2; }); },
  v() { Utang._memo = Utang.peristiwa(); try { return this.v0(); } finally { Utang._memo = null; } },
  v0() {

    const chips = '<div class="seg sm rc-chips" style="justify-content:flex-start;margin:6px 0">' + this.SUB.map((x) => '<button type="button" class="btn' + (this.sub === x[0] ? ' on' : '') + '" data-rcs="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>';

  v_anggaran() {

      (x.ang ? '<div class="bar-ang' + (x.p > 100 ? ' x' : x.p >= 90 ? ' w' : '') + '"><i style="width:' + Math.min(100, x.p) + '%"></i></div><div class="note">' + rp(x.r) + ' / ' + rp(x.ang) + '</div>' : '<div class="note">Modal terpakai ' + rp(x.r) + '</div>') + '</button>';

  },
  v_harga() { return Harga.v(); },
  v_kelayakan() { return Kelayakan.v(); },
  grafikKas(B, P, r) {
