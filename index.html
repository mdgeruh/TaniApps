<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4C9">
<title>Tani Keuangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Tani Keuangan — struktur gaya Jurnal Trading, palet Hijau Padi (#FFF4C9 #C7E78B #81AE64 #709053) */
:root{--ink:#FFF4C9;--ink-raised:#FFFAE2;--paper:#243019;--paper-dim:#485C33;--paper-faint:#58703F;--gold:#4E6F35;--gold-dim:#709053;--fill:#81AE64;--fill-hi:#C7E78B;--on-fill:#1F2A16;--act-bg:#C7E78B;--act-tx:#1F2A16;--gain:#2B7A3B;--loss:#B0452F;--line:#D3C88C;--line-soft:#E8DDA8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html[data-theme="dark"]{--ink:#161D12;--ink-raised:#1F2918;--paper:#FFF4C9;--paper-dim:#C4C09A;--paper-faint:#A3A07E;--gold:#C7E78B;--gold-dim:#81AE64;--fill:#81AE64;--fill-hi:#C7E78B;--on-fill:#14200E;--act-bg:#1F2918;--act-tx:#C7E78B;--gain:#8FD08A;--loss:#E07A62;--line:#34422A;--line-soft:#27331F;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--ink);transition:background .2s}
body{margin:0;background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
::selection{background:var(--fill-hi);color:var(--on-fill)}
.wrap{max-width:920px;margin:0 auto;padding:0 20px 96px}
header.masthead{padding:30px 0 20px;border-bottom:1px solid var(--line)}
.masthead-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:22px;letter-spacing:.01em}
.brand em{font-style:italic;color:var(--gold);font-weight:500}
.updated{font-size:12px;color:var(--paper-faint);margin-top:10px}
.theme-toggle{background:none;border:1px solid var(--line);color:var(--paper-dim);width:30px;height:30px;font-size:14px;cursor:pointer;line-height:1}
.theme-toggle:hover{color:var(--gold);border-color:var(--gold)}
.hero{padding:26px 4px 6px}
.hero-label{font-size:12px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
.hero-number{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(36px,9vw,64px);line-height:1;color:var(--gold);letter-spacing:-.01em}
.hero-sub{font-size:13px;color:var(--paper-dim);margin-top:8px}
.up{color:var(--gain)}.down{color:var(--loss)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--line-soft)}
.stat{padding:14px 10px;border-left:1px solid var(--line-soft);min-width:0}
.stat:first-child{border-left:0;padding-left:0}
.stat-lbl{font-size:10.5px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;line-height:1.25}
.stat-val{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:17px;word-break:break-word;line-height:1.2}
.main-tabs{display:flex;gap:2px;margin:22px 0 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.main-tabs::-webkit-scrollbar{display:none}
.main-tab-btn{background:none;border:0;color:var(--paper-dim);font:inherit;font-size:12.5px;letter-spacing:.02em;padding:12px 18px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.main-tab-btn:hover{color:var(--paper)}
.main-tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:2px}
.bnav-btn{background:none;border:0;color:var(--paper-faint);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;flex:1;min-width:0;font:inherit;font-size:9.5px;transition:color .15s,background .15s}
.bnav-btn.active{color:var(--act-tx);background:var(--act-bg)}
.bnav-icon{width:19px;height:19px}
@media (max-width:720px){.main-tabs{display:none}.bottom-nav{display:flex}}
.panel{margin-top:20px}
section{padding:22px 20px;margin-bottom:16px;background:var(--ink-raised);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
@media (max-width:600px){section{padding:18px 14px;border-radius:12px}}
h2{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:20px;margin:0 0 14px;color:var(--paper)}
.note{font-size:12px;color:var(--paper-faint)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13px}
.row:first-of-type{border-top:0}
.row .mu{color:var(--paper-dim)}
label{display:block;font-size:10.5px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 5px}
input,select{width:100%;font:inherit;font-size:13px;padding:10px 11px;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:8px}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
.seg{display:flex;gap:8px}
.btn{font:inherit;font-size:13px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--paper-dim);cursor:pointer;flex:1}
.btn:hover{color:var(--gold);border-color:var(--gold)}
.btn.on{color:var(--gold);border-color:var(--gold);background:var(--ink)}
.btn.gold{background:var(--fill);color:var(--on-fill);border-color:var(--fill);font-weight:600;width:100%;margin-top:18px}
.btn.gold:hover{color:var(--on-fill);opacity:.9}
.sc{cursor:pointer}
.sc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sc-name{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:500}
.badge{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--paper-faint);border:1px solid var(--line);padding:1px 7px}
.badge.live{color:var(--gold);border-color:var(--gold)}
.det{margin-top:12px;padding-top:6px;border-top:1px solid var(--line-soft)}
.tblwrap{overflow-x:auto}
table.ledger{width:100%;border-collapse:collapse;font-size:12.5px}
table.ledger th{font-size:10.5px;font-weight:500;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em;text-align:right;padding:8px;border-bottom:1px solid var(--line)}
table.ledger td{padding:8px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
table.ledger th:first-child,table.ledger td:first-child{text-align:left}
table.ledger tbody tr:hover{background:var(--ink)}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--fill);color:var(--on-fill);padding:8px 16px;font-size:12.5px;z-index:60}
.fab{position:fixed;right:max(20px,calc((100vw - 920px)/2 + 20px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--fill);color:var(--on-fill);box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;z-index:55;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .15s}
.fab:hover{opacity:.92}.fab:active{transform:scale(.94)}
.fab:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.fab svg{width:26px;height:26px}
.fab[hidden]{display:none}
.fab svg{transition:transform .18s}.fab.open svg{transform:rotate(45deg)}
.fab-scrim{position:fixed;inset:0;z-index:54;background:rgba(0,0,0,.28)}
.fab-dial{position:fixed;right:max(20px,calc((100vw - 920px)/2 + 20px));bottom:calc(144px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-scrim[hidden],.fab-dial[hidden]{display:none}
.fab-item{border:0;border-radius:24px;padding:12px 18px;background:var(--fill);color:var(--on-fill);font:inherit;font-size:14px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;white-space:nowrap}
.fab-item:active{transform:scale(.96)}.fab-item:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (min-width:721px){.fab{bottom:28px}.fab-dial{bottom:96px}}
/* ---------- Setelan ---------- */
body{zoom:var(--zoom,1)}
html[data-scheme="emas"]{--ink:#F3EDE0;--ink-raised:#E8E0CC;--paper:#2B2415;--paper-dim:#6B6046;--paper-faint:#6F654F;--gold:#9C7526;--gold-dim:#B08F4E;--fill:#C9A24B;--fill-hi:#E8D9A8;--on-fill:#2B2415;--act-bg:#E8E0CC;--act-tx:#2B2415;--gain:#4F7548;--loss:#9C4530;--line:#D9CFB4;--line-soft:#E3DAC3}
html[data-scheme="emas"][data-theme="dark"]{--ink:#1B1712;--ink-raised:#231E17;--paper:#EDE6D6;--paper-dim:#9C907B;--paper-faint:#8D836F;--gold:#C9A24B;--gold-dim:#8C744E;--fill:#C9A24B;--fill-hi:#C9A24B;--on-fill:#1B1712;--act-bg:#231E17;--act-tx:#C9A24B;--gain:#84AB7C;--loss:#C06B54;--line:#3A3226;--line-soft:#2A251C;color-scheme:dark}
.masthead-right{display:flex;align-items:center;gap:10px}
.theme-toggle.active{color:var(--gold);border-color:var(--gold)}
.eye{background:none;border:0;color:var(--paper-faint);cursor:pointer;font-size:13px;padding:2px 4px;margin-left:4px}
.eye:hover{color:var(--gold)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 14px;flex-wrap:wrap;margin-bottom:6px}
.sec-head h2{margin:0}
.sec-head .note{max-width:38ch;text-align:right}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line-soft)}
.sec-head+.settings-row{border-top:0}
.settings-desc{min-width:0}
.settings-desc strong{display:block;font-size:13px;font-weight:500}
.settings-desc span{display:block;font-size:12px;color:var(--paper-faint);margin-top:2px;max-width:46ch}
.seg.sm{flex-wrap:wrap;justify-content:flex-end}
.seg.sm .btn,.settings-row>.btn{flex:0 0 auto;padding:7px 12px;font-size:12px}
.settings-input{width:84px;text-align:right}
.settings-text{width:100%;min-height:96px;margin-top:6px;font:inherit;font-size:11.5px;padding:10px 11px;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:8px;resize:vertical}
.settings-text:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.danger:hover{color:var(--loss);opacity:.85}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
@media (max-width:600px){.settings-row{flex-direction:column;align-items:stretch;gap:10px}.seg.sm{justify-content:flex-start}.settings-input{width:100%;text-align:left}.sec-head .note{text-align:left;max-width:none}}
/* ---------- Efek kaca (sakelar di Setelan; berlaku untuk semua skema dan mode) ---------- */
html[data-glass="1"]{--glass:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));--glass-edge:rgba(255,255,255,.18);--glass-shadow:0 12px 40px rgba(0,0,0,.30);--glass-nav:rgba(22,29,18,.78);--glass-input:rgba(255,255,255,.07);--glass-th:rgba(0,0,0,.30);background:none}
html[data-glass="1"]:not([data-theme="dark"]){--glass:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.42));--glass-edge:rgba(255,255,255,.85);--glass-shadow:0 12px 36px rgba(60,80,40,.14);--glass-nav:rgba(255,255,255,.62);--glass-input:rgba(255,255,255,.6);--glass-th:rgba(255,255,255,.7)}
@supports (background:color-mix(in srgb,red 50%,transparent)){
  html[data-glass="1"]{--glass-nav:color-mix(in srgb,var(--ink) 80%,transparent)}
  html[data-glass="1"]:not([data-theme="dark"]){--glass-nav:color-mix(in srgb,var(--ink) 62%,transparent)}
  html[data-glass="1"] body{background:
    radial-gradient(1000px 720px at 78% 2%,color-mix(in srgb,var(--fill) 38%,transparent),transparent 64%),
    radial-gradient(860px 780px at 2% 96%,color-mix(in srgb,var(--gold-dim) 34%,transparent),transparent 66%),
    radial-gradient(760px 560px at 46% 50%,color-mix(in srgb,var(--fill) 12%,transparent),transparent 74%),
    var(--ink);background-attachment:fixed}
  html[data-glass="1"]:not([data-theme="dark"]) body{background:
    radial-gradient(1000px 720px at 78% 2%,color-mix(in srgb,var(--fill) 42%,transparent),transparent 64%),
    radial-gradient(860px 780px at 2% 96%,color-mix(in srgb,var(--gold-dim) 30%,transparent),transparent 66%),
    radial-gradient(760px 560px at 46% 50%,color-mix(in srgb,var(--fill-hi) 40%,transparent),transparent 74%),
    var(--ink);background-attachment:fixed}
}
html[data-glass="1"] body{background:var(--ink);background-attachment:fixed}
html[data-glass="1"] section{background:var(--glass);border:1px solid var(--glass-edge);border-radius:26px;-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-edge)}
html[data-glass="1"] input,html[data-glass="1"] select,html[data-glass="1"] textarea{background:var(--glass-input);border-radius:12px}
html[data-glass="1"] .btn,html[data-glass="1"] .theme-toggle,html[data-glass="1"] .badge{border-radius:999px}
html[data-glass="1"] .bottom-nav{background:var(--glass-nav);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border-top:1px solid var(--glass-edge)}
html[data-glass="1"] .main-tabs{border-bottom-color:var(--glass-edge)}
html[data-glass="1"] table.ledger th{background:var(--glass-th)}
html[data-glass="1"] .fab{box-shadow:var(--glass-shadow)}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  html[data-glass="1"] section{background:var(--ink-raised);backdrop-filter:none}
  html[data-glass="1"] .bottom-nav{background:var(--ink)}
}
/* ---------- Transaksi (v0.1.007) ---------- */
.tx{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-soft);cursor:pointer}
h2+.tx{border-top:0}
.tx:hover .tx-n{color:var(--gold)}
.tx:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tx-l{min-width:0}
.tx-n{font-size:13px}
.tx-l .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.tx-a{font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:500;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sum span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.sum strong{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:15px;word-break:break-word}
.bar-row{margin:12px 0 0}
.bar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.bar-top .mu{color:var(--paper-dim)}
.bar{height:8px;background:var(--ink);border:1px solid var(--line-soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fill)}
input[type=date]{min-height:40px}
.bnav-icon,.tab-icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tab-icon{width:15px;height:15px;vertical-align:-3px;margin-right:7px}
.main-tab-btn{display:inline-flex;align-items:center}
.main-tab-btn .tab-icon{vertical-align:baseline}
/* ---------- Siklus (v0.1.008) ---------- */
.sc-card{padding:13px 0;border-top:1px solid var(--line-soft);cursor:pointer}
.sc-card:first-of-type{border-top:0}
.sc-card:hover .sc-name{color:var(--gold)}
.sc-card .note{margin-top:4px}
.seg+.sc-card{margin-top:8px}
/* ---------- Form kustom (v0.1.009) ---------- */
input{-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:var(--paper-faint);opacity:.75}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cx{position:relative}
.cx-native{display:none!important}
.cx-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:40px;padding:10px 11px;font:inherit;font-size:13px;text-align:left;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s}
.cx-btn:hover{border-color:var(--gold-dim)}
.cx-btn:focus-visible,.cx-btn[aria-expanded="true"]{outline:2px solid var(--gold);outline-offset:1px}
.cx-val{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-val.ph{color:var(--paper-faint)}
.cx-ic{width:16px;height:16px;flex:none;fill:none;stroke:var(--paper-dim);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cx-btn[aria-expanded="true"] .cx-ic{stroke:var(--gold)}
.cx-back{position:fixed;inset:0;z-index:99}
.cx-back.dim{background:rgba(20,28,14,.4)}
.cx-pop{position:fixed;z-index:100;box-sizing:border-box;max-width:calc(100vw - 16px);max-height:min(340px,60vh);overflow:auto;padding:6px;background:var(--ink-raised);color:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.28);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5}
.cx-pop.cal:not(.sheet){width:296px;max-height:none;padding:12px}
.cx-pop.sheet{left:0;right:0;bottom:0;top:auto;max-width:none;max-height:74vh;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;border-bottom:0}
.cx-pop.sheet::before{content:"";display:block;width:38px;height:4px;margin:0 auto 10px;border-radius:2px;background:var(--line)}
.cx-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;outline:none}
.cx-opt:hover,.cx-opt:focus{background:var(--act-bg)}
.cx-opt.sel{color:var(--gold);font-weight:500}
.cx-ck{width:15px;height:15px;flex:none;fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cx-grp{padding:10px 12px 4px;font-size:10.5px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em}
.cx-cal-h{display:flex;align-items:center;justify-content:space-between;gap:2px;margin-bottom:8px}
.cx-cal-t{flex:1;text-align:center;font-family:'Fraunces',Georgia,serif;font-size:16px}
.cx-nav{width:34px;height:34px;border:0;border-radius:8px;background:none;color:var(--paper-dim);font:inherit;font-size:16px;cursor:pointer}
.cx-nav:hover{background:var(--act-bg);color:var(--gold)}
.cx-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cx-wd{padding:6px 0;text-align:center;font-size:10.5px;color:var(--paper-faint);text-transform:uppercase}
.cx-day{height:38px;border:0;border-radius:10px;background:none;color:var(--paper);font:inherit;font-size:13px;cursor:pointer}
.cx-day:hover{background:var(--act-bg)}
.cx-day.today{box-shadow:inset 0 0 0 1px var(--gold-dim)}
.cx-day.sel{background:var(--fill);color:var(--on-fill);font-weight:600}
.cx-foot{display:flex;gap:8px;margin-top:10px}
.cx-foot .btn{flex:1}
html[data-glass="1"] .cx-btn{background:var(--glass-input);border-radius:12px}
html[data-glass="1"] .cx-pop:not(.sheet){border-radius:18px}

/* v0.1.010 — peringatan penyimpanan terbatas */
.peringatan{margin:8px 0 12px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--loss);border-radius:10px;background:var(--ink-raised);color:var(--paper);font-size:.82rem;line-height:1.45}
.peringatan[hidden]{display:none}

const TEMPLATE_KOM = [
  { label: 'Sayur daun', kunci: ['bayam', 'kangkung', 'sawi', 'selada', 'sayur'], satuan: 'ikat', umur: 30, komponen: [['Benih / Bibit', 10], ['Pupuk / Nutrisi', 25], ['Pestisida / Obat', 10], ['Media Tanam / Polybag', 15], ['Tenaga Kerja', 30], ['Kemasan & Pengiriman', 10]] },
  { label: 'Cabai', kunci: ['cabai', 'cabe'], satuan: 'kg', umur: 120, komponen: [['Benih / Bibit', 8], ['Pupuk / Nutrisi', 25], ['Pestisida / Obat', 15], ['Media Tanam / Polybag', 10], ['Tenaga Kerja', 32], ['Air / Listrik', 5], ['Kemasan & Pengiriman', 5]] },
  { label: 'Tomat', kunci: ['tomat'], satuan: 'kg', umur: 90, komponen: [['Benih / Bibit', 8], ['Pupuk / Nutrisi', 27], ['Pestisida / Obat', 15], ['Media Tanam / Polybag', 8], ['Tenaga Kerja', 32], ['Kemasan & Pengiriman', 10]] },
  { label: 'Lele', kunci: ['lele'], satuan: 'kg', umur: 90, komponen: [['Benih / Bibit', 15], ['Pakan', 60], ['Pestisida / Obat', 5], ['Air / Listrik', 8], ['Tenaga Kerja', 12]] },
  { label: 'Ayam petelur', kunci: ['ayam', 'petelur'], satuan: 'butir', umur: 120, komponen: [['Benih / Bibit', 12], ['Pakan', 70], ['Pestisida / Obat', 5], ['Air / Listrik', 5], ['Tenaga Kerja', 8]] }
];
/* Tani Keuangan — Fase 2: unit, komoditas, siklus, panen (v0.1.008) */
const JENIS_UNIT = [['kebun', 'Kebun / lahan'], ['hidroponik', 'Hidroponik'], ['kolam', 'Kolam'], ['kandang', 'Kandang'], ['lainnya', 'Lainnya']];
const num = (s) => { const n = parseFloat(String(s || '').replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : 0; };

  sid: null, sub: 'berjalan', pd: null, minta: null,
  d() { return App.data; },
  unit(id) { return this.d().unit.find((x) => x.id === id); },
  kom(id) { return this.d().komoditas.find((x) => x.id === id); },

  panenOf(id) { return this.d().panen.filter((p) => !p.terhapus && p.siklusId === id).sort((a, b) => b.tanggal.localeCompare(a.tanggal)); },
  ringkas(id) {
    const tx = App.aktif().filter((t) => t.siklusId === id);
    return { modal: App.jumlah(tx, 'keluar'), hasil: App.jumlah(tx, 'masuk'), tx: tx,
             bersih: this.panenOf(id).reduce((a, p) => a + p.kuantitasKotor - p.susut, 0) };
  },
  panenPerkiraan(s) { // perkiraan panen = mulai + umur panen komoditas (hanya siklus berjalan)
    const k = this.kom(s.komoditasId); if (!k || !k.umurPanenHari || s.status !== 'berjalan') return null;
    const [y, m, d] = s.mulai.split('-').map(Number), t = new Date(y, m - 1, d + k.umurPanenHari), n = new Date();

      '<button type="button" class="btn' + (this.sub === x[0] ? ' on' : '') + '" data-do="siklus-tab" data-val="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>' +
      (tampil.length ? tampil.map((s) => {

        return '<div class="sc-card" data-do="buka-siklus" data-id="' + s.id + '" role="button" tabindex="0"><div class="sc-head"><span class="sc-name">' + esc(this.nama(s.id)) + '</span>' +

          '<div class="note">Mulai ' + Setelan.tgl(s.mulai) + ' · Modal ' + rp(r.modal) + ' · Hasil ' + rp(r.hasil) + (s.status === 'berjalan' && r.hasil ? ' · ' + (r.hasil - r.modal < 0 ? 'Rugi ' : 'Untung ') + rp(Math.abs(r.hasil - r.modal)) : '') + '</div>' +
          (pp ? '<div class="note">' + (pp.sisa >= 0 ? 'Perkiraan panen ' + Setelan.tgl(pp.tgl) + ' · ' + (pp.sisa === 0 ? 'hari ini' : pp.sisa + ' hari lagi') : '<span class="down">Lewat perkiraan panen ' + Setelan.tgl(pp.tgl) + ' · terlambat ' + (-pp.sisa) + ' hari</span>') + '</div>' : '') +
          (s.anggaran ? (() => { const p = Math.round(r.modal / s.anggaran * 100); return '<div class="bar-ang' + (p > 100 ? ' x' : p >= 90 ? ' w' : '') + '" role="img" aria-label="Modal ' + p + ' persen dari anggaran"><i style="width:' + Math.min(100, p) + '%"></i></div><div class="note">Anggaran ' + rp(s.anggaran) + ' · terpakai ' + p + '%</div>'; })() : '') + '</div>';
      }).join('') : '<p class="note" style="margin-top:14px">' + (ada.length ? 'Tidak ada siklus ' + this.sub + '.' : 'Belum ada siklus. Siapkan unit dan komoditas, lalu mulai siklus pertama.') + '</p>') +
      '<button class="btn gold" data-do="siklus-baru">Siklus baru</button>' +
      '<button class="btn" data-go="master" style="width:100%;margin-top:10px">Kelola unit &amp; komoditas</button></section>';
  },
  vForm() {
    if (!this.units().length || !this.koms().length)
      return '<section><p class="note">Tambahkan dulu minimal satu unit/lahan dan satu komoditas.</p>' +
        '<button class="btn gold" data-go="master">Kelola unit &amp; komoditas</button><button class="btn" data-go="siklus" style="width:100%;margin-top:10px">Batal</button></section>';
    return '<section>' +
      '<label for="s_unit">Unit / lahan</label><select id="s_unit">' + this.opsi(this.units(), '', (u) => u.nama) + '</select>' +
      '<label for="s_kom">Komoditas</label><select id="s_kom">' + this.opsi(this.koms(), '', (k) => k.nama) + '</select>' +
      '<label for="s_mulai">Tanggal mulai</label><input type="date" id="s_mulai" value="' + isoHari() + '">' +
      '<label for="s_cat">Catatan (opsional)</label><input id="s_cat" maxlength="120" placeholder="mis. bibit dari toko tani">' +
      '<button class="btn gold" data-do="simpan-siklus">Mulai siklus</button><button class="btn" data-go="siklus" style="width:100%;margin-top:10px">Batal</button></section>';
  },
  vDetail() {
    const s = this.cari(this.sid);
    if (!s) return this.vList();
    const r = this.ringkas(s.id), k = this.kom(s.komoditasId), sat = k ? k.satuan : '', jalan = s.status === 'berjalan', u = r.hasil - r.modal;
    const panen = this.panenOf(s.id).map((p) => '<div class="tx"' + (jalan ? ' data-do="ubah-panen" data-id="' + p.id + '" role="button" tabindex="0"' : '') + '><div class="tx-l"><div class="tx-n">' +
      fmtN(p.kuantitasKotor - p.susut) + ' ' + esc(sat) + ' bersih</div><div class="note">' + Setelan.tgl(p.tanggal) + ' · susut ' + fmtN(p.susut) + (p.pembeli ? ' · ' + esc(p.pembeli) : '') + '</div></div>' +
      '<div class="tx-a">' + (p.hargaPerSatuan ? rp(p.hargaPerSatuan) + '/' + esc(sat) : '—') + '</div></div>').join('');
    return '<section><div class="sc-head"><h2 style="margin:0">Ringkasan</h2><span class="badge' + (jalan ? ' live' : '') + '">' + (jalan ? 'berjalan' : 'selesai') + '</span></div>' +
      '<p class="note" style="margin:8px 0 0">Mulai ' + Setelan.tgl(s.mulai) + (jalan ? ' · hari ' + this.hari(s) + (k && k.umurPanenHari ? ' dari ±' + k.umurPanenHari : '') : ' · selesai ' + Setelan.tgl(s.selesai) + ' (' + this.hari(s) + ' hari)') + (s.catatan ? ' · ' + esc(s.catatan) : '') + '</p>' +
      '<div class="sum" style="margin-top:14px"><div><span class="note">Modal</span><strong class="down">' + rp(r.modal) + '</strong></div><div><span class="note">Hasil</span><strong class="up">' + rp(r.hasil) + '</strong></div>' +
      '<div><span class="note">' + (u < 0 ? 'Rugi' : 'Untung') + '</span><strong class="' + (u < 0 ? 'down' : 'up') + '">' + rp(u) + '</strong></div></div>' +
      '<div class="row"><span class="mu">Panen bersih</span><span>' + fmtN(r.bersih) + ' ' + esc(sat) + '</span></div>' +
      (jalan ? '<div class="seg" style="margin-top:12px"><button class="btn" data-do="catat-siklus">Catat transaksi</button><button class="btn" data-do="catat-panen">Catat panen</button></div>' +
        '<button class="btn" data-do="selesai-siklus" style="width:100%;margin-top:10px">Selesaikan siklus</button>'
        : '<p class="note" style="margin-top:12px">Siklus selesai tidak menerima transaksi baru.</p><button class="btn" data-do="buka-lagi" style="width:100%;margin-top:6px">Buka kembali</button>') +
      '<button class="btn danger" data-do="hapus-siklus" style="width:100%;margin-top:10px">' + (this.minta === 'siklus' ? 'Ketuk lagi untuk menghapus' : 'Hapus siklus') + '</button>' +
      '<button class="btn" data-go="siklus" style="width:100%;margin-top:10px">Kembali ke daftar</button></section>' +
      '<section><h2>Panen</h2>' + (panen || '<p class="note">Belum ada panen.</p>') + '</section>' +
      '<section><h2>Transaksi siklus</h2>' + (r.tx.length ? r.tx.sort((a, b) => b.tanggal.localeCompare(a.tanggal)).map((t) => App.barisTx(t)).join('') : '<p class="note">Belum ada transaksi terhubung.</p>') + '</section>';
  },
  vPanen() {
    const s = this.cari(this.sid), k = s && this.kom(s.komoditasId), p = this.pd, sat = k ? k.satuan : '';
    return '<section><p class="note" style="margin-top:0">' + esc(this.nama(this.sid)) + '</p>' +
      '<label for="p_tgl">Tanggal</label><input type="date" id="p_tgl" value="' + p.tanggal + '">' +
      '<div class="two"><div><label for="p_kotor">Hasil kotor (' + esc(sat) + ')</label><input id="p_kotor" inputmode="decimal" value="' + (p.kotor || '') + '"></div>' +
      '<div><label for="p_susut">Susut / reject</label><input id="p_susut" inputmode="decimal" value="' + (p.susut || '') + '" placeholder="0"></div></div>' +
      '<label for="p_harga">Harga jual per ' + esc(sat) + ' (opsional)</label><input id="p_harga" inputmode="numeric" value="' + fmtInput(p.harga) + '" placeholder="0">' +
      '<label for="p_pembeli">Pembeli (opsional)</label><input id="p_pembeli" maxlength="60" value="' + esc(p.pembeli) + '">' +
      '<p class="note" style="margin-top:10px">Jika harga diisi, hasil penjualan otomatis dicatat sebagai transaksi Hasil siklus ini.</p>' +
      '<button class="btn gold" data-do="simpan-panen">Simpan</button><button class="btn" data-go="siklus-detail" style="width:100%;margin-top:10px">Batal</button>' +
      (p.id ? '<button class="btn danger" data-do="hapus-panen" style="width:100%;margin-top:10px">' + (this.minta === 'panen' ? 'Ketuk lagi untuk menghapus' : 'Hapus panen') + '</button>' : '') + '</section>';
  },
  vMaster() {
    const baris = (list, f, aksi) => list.length ? list.map((x) => '<div class="row"><span>' + f(x) + '</span><button class="btn" data-do="' + aksi + '" data-id="' + x.id + '" style="flex:0 0 auto;padding:4px 10px;font-size:12px">Hapus</button></div>').join('') : '<p class="note">Belum ada.</p>';
    return '<section><h2>Unit / lahan</h2>' + baris(this.units(), (u) => esc(u.nama) + ' <span class="mu">· ' + (JENIS_UNIT.find((j) => j[0] === u.jenis) || [0, u.jenis])[1] + (u.ukuran ? ' · ' + fmtN(u.ukuran) + ' ' + esc(u.satuanUkuran || '') : '') + '</span>', 'hapus-unit') +
      '<label for="m_unama">Nama</label><input id="m_unama" maxlength="40" placeholder="mis. Kebun belakang">' +
      '<label for="m_ujenis">Jenis</label><select id="m_ujenis">' + JENIS_UNIT.map((j) => '<option value="' + j[0] + '">' + j[1] + '</option>').join('') + '</select>' +
      '<div class="two"><div><label for="m_uukur">Luas / kapasitas</label><input id="m_uukur" inputmode="decimal"></div><div><label for="m_usat">Satuan</label><input id="m_usat" maxlength="12" placeholder="m², lubang, ekor"></div></div>' +
      '<button class="btn gold" data-do="tambah-unit">Tambah unit</button></section>' +
      '<section><h2>Komoditas</h2>' + baris(this.koms(), (k) => esc(k.nama) + ' <span class="mu">· ' + esc(k.satuan) + (k.umurPanenHari ? ' · ±' + k.umurPanenHari + ' hari' : '') + '</span>', 'hapus-kom') +
      '<p class="note" style="margin-top:12px">Isi cepat dari template (nama, satuan, umur panen; bisa diubah):</p><div class="seg sm" style="justify-content:flex-start;margin:6px 0">' + TEMPLATE_KOM.map((t, i) => '<button type="button" class="btn" data-do="tpl-kom" data-val="' + i + '">' + t.label + '</button>').join('') + '</div>' +
      '<label for="m_knama">Nama</label><input id="m_knama" maxlength="40" placeholder="mis. Cabai rawit">' +
      '<div class="two"><div><label for="m_ksat">Satuan hasil</label><input id="m_ksat" maxlength="12" placeholder="kg, ikat, butir"></div><div><label for="m_kumur">Umur panen (hari)</label><input id="m_kumur" inputmode="numeric"></div></div>' +
      '<button class="btn gold" data-do="tambah-kom">Tambah komoditas</button></section>';
  },

  /* ---------- aksi (true bila ditangani) ---------- */
  aksi(a, el) {
    const D = this.d(), v = (id) => ($(id) ? $(id).value.trim() : '');
    if (a === 'siklus-tab') { this.sub = el.dataset.val; App.go('siklus', true); }
    else if (a === 'buka-siklus') { this.sid = el.dataset.id; this.minta = null; App.go('siklus-detail'); }
    else if (a === 'siklus-baru') App.go('siklus-form');
    else if (a === 'simpan-siklus') {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v('s_mulai'))) { App.toast('Isi tanggal mulai'); return true; }
      const s = { id: uid('s'), unitId: v('s_unit'), komoditasId: v('s_kom'), mulai: v('s_mulai'), selesai: null, status: 'berjalan', catatan: v('s_cat'), dibuat: nowIso(), diubah: nowIso(), terhapus: false };
      D.siklus.push(s); App.simpan(); this.sid = s.id; this.sub = 'berjalan'; App.toast('Siklus dimulai'); App.go('siklus-detail');
    }
    else if (a === 'selesai-siklus' || a === 'buka-lagi') {
      const s = this.cari(this.sid); s.status = a === 'buka-lagi' ? 'berjalan' : 'selesai'; s.selesai = a === 'buka-lagi' ? null : isoHari(); s.diubah = nowIso();
      App.simpan(); App.go('siklus-detail', true);
    }
    else if (a === 'hapus-siklus') {
      const s = this.cari(this.sid), pakai = App.aktif().some((t) => t.siklusId === s.id) || this.panenOf(s.id).length;
      if (pakai) { App.toast('Masih ada transaksi atau panen di siklus ini'); return true; }
      if (this.minta !== 'siklus') { this.minta = 'siklus'; App.go('siklus-detail', true); return true; }
      s.terhapus = true; this.minta = null; App.simpan(); App.toast('Siklus dihapus'); App.go('siklus');
    }
    else if (a === 'catat-siklus') App.baru(this.sid);
    else if (a === 'catat-panen' || a === 'ubah-panen') {
      const p = a === 'ubah-panen' ? D.panen.find((x) => x.id === el.dataset.id) : null;
      this.pd = p ? { id: p.id, tanggal: p.tanggal, kotor: p.kuantitasKotor, susut: p.susut, harga: p.hargaPerSatuan || 0, pembeli: p.pembeli || '' }
                  : { id: null, tanggal: isoHari(), kotor: '', susut: '', harga: 0, pembeli: '' };
      this.minta = null; App.go('panen');
    }
    else if (a === 'simpan-panen') this.simpanPanen();
    else if (a === 'hapus-panen') {
      if (this.minta !== 'panen') { this.minta = 'panen'; App.go('panen', true); return true; }
      const p = D.panen.find((x) => x.id === this.pd.id), t = p.transaksiId && D.transaksi.find((x) => x.id === p.transaksiId);
      p.terhapus = true; p.diubah = nowIso(); if (t) { t.terhapus = true; t.diubah = nowIso(); }
      this.minta = null; App.simpan(); App.toast('Panen dihapus'); App.go('siklus-detail');
    }
    else if (a === 'tambah-unit') {
      if (!v('m_unama')) { App.toast('Isi nama unit'); return true; }
      D.unit.push({ id: uid('u'), nama: v('m_unama'), jenis: v('m_ujenis'), ukuran: num(v('m_uukur')) || null, satuanUkuran: v('m_usat') || null, dibuat: nowIso(), diubah: nowIso(), terhapus: false });
      App.simpan(); App.go('master', true);
    }
    else if (a === 'tpl-kom') {
      const t = TEMPLATE_KOM[Number(el.dataset.val)]; if (!t) return true;
      const set = (i, x) => { const e = document.getElementById(i); if (e) e.value = x; };
      set('m_knama', t.label); set('m_ksat', t.satuan); set('m_kumur', t.umur); App.toast('Template ' + t.label + ' diisi — sesuaikan lalu Tambah'); return true;
    }
    else if (a === 'tambah-kom') {
      if (!v('m_knama') || !v('m_ksat')) { App.toast('Isi nama dan satuan hasil'); return true; }
      D.komoditas.push({ id: uid('k'), nama: v('m_knama'), satuan: v('m_ksat'), umurPanenHari: parseInt(v('m_kumur'), 10) || null, dibuat: nowIso(), diubah: nowIso(), terhapus: false });
      App.simpan(); App.go('master', true);
    }
    else if (a === 'hapus-unit' || a === 'hapus-kom') {
      const f = a === 'hapus-unit' ? 'unitId' : 'komoditasId';
      if (this.daftar().some((s) => s[f] === el.dataset.id)) { App.toast('Masih dipakai siklus'); return true; }
      const x = (a === 'hapus-unit' ? D.unit : D.komoditas).find((y) => y.id === el.dataset.id); x.terhapus = true; App.simpan(); App.go('master', true);
    }
    else return false;
    return true;
  },
  simpanPanen() {
    const D = this.d(), s = this.cari(this.sid), g = (id) => $(id).value;
    const p = { id: this.pd.id, tanggal: g('p_tgl'), kotor: num(g('p_kotor')), susut: num(g('p_susut')), harga: angka(g('p_harga')), pembeli: g('p_pembeli').trim() };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(p.tanggal)) { App.toast('Isi tanggal'); return; }
    if (p.kotor <= 0) { App.toast('Isi hasil kotor lebih dari 0'); return; }
    if (p.susut < 0 || p.susut > p.kotor) { App.toast('Susut tidak boleh melebihi hasil kotor'); return; }
    const k = this.kom(s.komoditasId), sat = k ? k.satuan : '', bersih = p.kotor - p.susut, jml = Math.round(bersih * p.harga);
    let rec = p.id && D.panen.find((x) => x.id === p.id);
    if (!rec) { rec = { id: uid('p'), siklusId: s.id, dibuat: nowIso(), terhapus: false, transaksiId: null }; D.panen.push(rec); }
    Object.assign(rec, { tanggal: p.tanggal, kuantitasKotor: p.kotor, susut: p.susut, hargaPerSatuan: p.harga || null, pembeli: p.pembeli, diubah: nowIso() });
    let t = rec.transaksiId && D.transaksi.find((x) => x.id === rec.transaksiId);
    if (jml > 0) {
      if (!t) { t = { id: uid('t'), jenis: 'masuk', kategoriId: 'jual-panen', sifatBiaya: null, dibuat: nowIso() }; D.transaksi.push(t); rec.transaksiId = t.id; }
      Object.assign(t, { tanggal: p.tanggal, jumlah: jml, siklusId: s.id, catatan: 'Panen ' + fmtN(bersih) + ' ' + sat + (p.pembeli ? ' ke ' + p.pembeli : ''), diubah: nowIso(), terhapus: false });
    } else if (t) { t.terhapus = true; t.diubah = nowIso(); rec.transaksiId = null; }
    App.simpan(); this.pd = null; this.minta = null; App.toast('Panen tersimpan'); App.go('siklus-detail');
  }
};

</script>
<script>
/* Tani Keuangan — Fase 3–4: laporan, dashboard, cetak laba-rugi, R/C, HPP, BEP, harga jual minimum (v0.1.014) */
const Analisa = {
  dim: 'siklus', per: 'semua',
  PER: [['bulan', 'Bulan ini'], ['tahun', 'Tahun ini'], ['semua', 'Semua']],
  DIM: [['siklus', 'Siklus'], ['komoditas', 'Komoditas'], ['unit', 'Unit']],
  masuk(tgl) {
    if (this.per === 'bulan') return tgl.slice(0, 7) === bulanIni();
    if (this.per === 'tahun') return tgl.slice(0, 4) === bulanIni().slice(0, 4);
    return true;
  },
  kunci(sid) {
    const s = Siklus.cari(sid);
    if (!s) return ['-', 'Tanpa siklus', ''];
    if (this.dim === 'siklus') return [s.id, Siklus.nama(s.id), s.mulai];
    if (this.dim === 'komoditas') { const k = Siklus.kom(s.komoditasId); return [s.komoditasId, k ? k.nama : '?', k ? k.satuan : '']; }
    const u = Siklus.unit(s.unitId); return [s.unitId, u ? u.nama : '?', ''];
  },
  hitung() {
    const g = {}, ambil = (sid) => {
      const [id, nama] = this.kunci(sid);
      return g[id] || (g[id] = { nama, modal: 0, hasil: 0, nonPanen: 0, alat: 0, tetap: 0, vari: 0, qty: 0, sat: new Set() });
    };
    App.aktif().filter((t) => this.masuk(t.tanggal)).forEach((t) => {
      const r = ambil(t.siklusId);
      if (t.jenis === 'masuk') { r.hasil += t.jumlah; if (t.kategoriId === 'jual-bibit' || t.kategoriId === 'subsidi') r.nonPanen += t.jumlah; }
      else { r.modal += t.jumlah; if (t.kategoriId === 'alat') r.alat += t.jumlah; if (t.sifatBiaya === 'tetap') r.tetap += t.jumlah; else r.vari += t.jumlah; }
    });
    Siklus.d().panen.filter((p) => !p.terhapus && this.masuk(p.tanggal)).forEach((p) => {
      const s = Siklus.cari(p.siklusId); if (!s) return;
      const r = ambil(p.siklusId); r.qty += Math.max(0, p.kuantitasKotor - p.susut);
      const k = Siklus.kom(s.komoditasId); if (k && k.satuan) r.sat.add(k.satuan);
    });
    const mg = Math.min(90, Math.max(1, Number(Setelan.get('margin')) || 30)) / 100;
    return Object.values(g).map((r) => {
      r.untung = r.hasil - r.modal;
      r.rc = r.modal ? r.hasil / r.modal : null;
      r.margin = r.hasil ? r.untung / r.hasil : null;
      r.satuan = r.sat.size === 1 ? [...r.sat][0] : 'satuan';
      r.hpp = r.qty ? (r.modal - r.alat) / r.qty : null; // pembelian alat tidak masuk HPP
      r.harga = r.qty && r.hasil - r.nonPanen > 0 ? (r.hasil - r.nonPanen) / r.qty : null; // penjualan bibit dan bantuan tidak ikut
      r.hmin = r.hpp ? r.hpp / (1 - mg) : null;
      const v = r.qty ? r.vari / r.qty : 0;
      r.bep = (r.harga && r.harga > v && r.qty) ? r.tetap / (r.harga - v) : null; // titik impas (satuan)
      r.mg = mg; return r;
    }).sort((a, b) => b.untung - a.untung);
  },
  chip(arr, cur, att) { return '<div class="seg sm" style="justify-content:flex-start;margin:6px 0">' + arr.map((x) => '<button type="button" class="btn' + (cur === x[0] ? ' on' : '') + '" data-' + att + '="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>'; },
  kartu(r, i) {
    const f = (n) => n === null ? '—' : rp(Math.round(n)), u = r.untung >= 0;
    const baris = (a, b) => '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>';
    return '<section class="lap-kartu"><div class="sec-head"><h2>' + (i === 0 && r.untung > 0 ? '★ ' : '') + esc(r.nama) + '</h2><span class="tx-a ' + (u ? 'up' : 'down') + '">' + (u ? '+' : '') + rp(r.untung).replace('Rp ', 'Rp\u00a0') + '</span></div>' +
      baris('Modal / Hasil', rp(r.modal) + ' / ' + rp(r.hasil)) +
      baris('R/C ratio', r.rc === null ? '—' : fmtRC(r.rc) + (r.rc >= 1 ? ' (untung)' : ' (rugi)')) +
      baris('Margin', r.margin === null ? '—' : Math.round(r.margin * 100) + '%') +
      baris('Panen bersih', r.qty ? r.qty.toLocaleString('id-ID') + ' ' + esc(r.satuan) : 'belum ada') +
      baris('HPP per ' + esc(r.satuan), f(r.hpp)) +
      baris('Harga jual rata-rata', f(r.harga)) +
      baris('Harga min. (margin ' + Math.round(r.mg * 100) + '%)', f(r.hmin)) +
      baris('Titik impas (BEP)', r.bep === null ? (r.tetap ? 'butuh panen berharga' : 'tak ada biaya tetap') : Math.ceil(r.bep).toLocaleString('id-ID') + ' ' + esc(r.satuan) + ' · ' + rp(Math.round(r.bep * r.harga))) +
      '</section>';
  },
  vBanding() {
    const ke = (n) => { const x = new Date(); x.setDate(1); x.setMonth(x.getMonth() + n); return isoHari(x).slice(0, 7); };
    const per = (k) => { const tx = App.aktif().filter((t) => t.tanggal.slice(0, 7) === k), m = App.jumlah(tx, 'keluar'), h = App.jumlah(tx, 'masuk'); return { m, h, u: h - m, n: tx.length }; };
    const lalu = [-3, -2, -1].map((n) => per(ke(n))).filter((r) => r.n), ini = per(ke(0));
    if (!lalu.length) return '<section><h2>Bulan ini vs rata-rata 3 bulan</h2><p class="note">Belum ada transaksi di 3 bulan sebelumnya sebagai pembanding.</p></section>';
    const avg = (f) => lalu.reduce((s, r) => s + r[f], 0) / lalu.length;
    const baris = (nama, f, baikNaik) => { const a = avg(f), c = ini[f], d = c - a, pct = a ? Math.round(d / Math.abs(a) * 100) : null, baik = (d >= 0) === baikNaik;
      return '<div class="row"><span class="mu">' + nama + '</span><span>' + rp(c) + ' <span class="mu">vs ' + rp(Math.round(a)) + '</span> <span class="' + (d === 0 ? 'mu' : baik ? 'up' : 'down') + '">' + (d === 0 ? 'sama' : (d > 0 ? '▲' : '▼') + (pct === null ? '' : ' ' + Math.abs(pct) + '%')) + '</span></span></div>'; };
    return '<section><h2>Bulan ini vs rata-rata 3 bulan</h2>' + baris('Untung', 'u', true) + baris('Modal', 'm', false) + baris('Hasil', 'h', true) +
      '<p class="note">Rata-rata dari ' + lalu.length + ' bulan sebelumnya yang ada transaksinya. Hijau = membaik (modal turun dianggap baik).</p></section>';
  },
  simH: -10, simB: 0,
  vSimulasi() {
    const L = this.hitung().filter((r) => r.modal || r.hasil), fh = 1 + this.simH / 100, fb = 1 + this.simB / 100;
    if (!L.length) return '';
    const sim = (r) => { const h = r.hasil * fh, m = r.modal * fb; return { h, m, u: h - m, rc: m ? h / m : null }; };
    const T = L.reduce((a, r) => { const x = sim(r); return { u0: a.u0 + r.untung, u: a.u + x.u, h: a.h + x.h, m: a.m + x.m }; }, { u0: 0, u: 0, h: 0, m: 0 });
    const cls = (v) => (v >= 0 ? 'up' : 'down'), fmt = (v) => (v > 0 ? '+' : '') + this.simH;
    return '<section><h2>Simulasi: bagaimana jika…</h2><p class="note">Harga jual berubah</p>' +
      this.chip([[-20, '−20%'], [-10, '−10%'], [0, '0'], [10, '+10%'], [20, '+20%']], this.simH, 'sh') + '<p class="note">Biaya (modal) berubah</p>' +
      this.chip([[-10, '−10%'], [0, '0'], [10, '+10%'], [20, '+20%']], this.simB, 'sb') +
      '<div class="row"><span class="mu">Untung sekarang</span><span class="' + cls(T.u0) + '">' + rp(T.u0) + '</span></div>' +
      '<div class="row"><span class="mu">Untung simulasi</span><strong class="' + cls(T.u) + '">' + rp(Math.round(T.u)) + '</strong></div>' +
      '<div class="row"><span class="mu">R/C simulasi</span><span>' + (T.m ? fmtRC(T.h / T.m) : '—') + '</span></div>' +
      L.slice(0, 6).map((r) => { const x = sim(r), batas = r.hasil ? Math.round((1 - r.modal / r.hasil) * 100) : null;
        return '<div style="margin-top:10px"><strong>' + esc(r.nama) + '</strong><div class="row"><span class="mu">Untung</span><span>' + rp(r.untung) + ' → <span class="' + cls(x.u) + '">' + rp(Math.round(x.u)) + '</span></span></div>' +
          '<div class="row"><span class="mu">Harga boleh turun maks.</span><span>' + (batas === null ? '—' : batas > 0 ? batas + '% sebelum rugi' : '<span class="down">sudah rugi</span>') + '</span></div></div>'; }).join('') +
      '<p class="note">Hitungan sederhana: hasil dan modal dikali persen perubahan (volume dianggap tetap). Mengikuti periode dan pengelompokan di bawah.</p></section>';
  },
  sub: 'ringkasan',
  IKON: {
    cetak: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v6H7z"/></svg>',
    xls: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>'
  },
  vLaporan() {
    const tabs = [['ringkasan', 'Ringkasan'], ['grafik', 'Grafik'], ['rincian', 'Rincian']];
    return '<div class="lap-aksi no-print"><button type="button" class="ikon-btn" data-an="cetak" aria-label="Cetak atau simpan PDF">' + this.IKON.cetak + '<span>Cetak</span></button>' +
      '<button type="button" class="ikon-btn" data-an="xls" aria-label="Ekspor ke Excel">' + this.IKON.xls + '<span>Excel</span></button></div>' +
      '<div class="lap-tabs no-print" role="tablist" aria-label="Bagian laporan">' + tabs.map((t) => '<button type="button" role="tab" class="lap-tab' + (this.sub === t[0] ? ' on' : '') + '" aria-selected="' + (this.sub === t[0]) + '" tabindex="' + (this.sub === t[0] ? 0 : -1) + '" data-lt="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>' +
      '<div class="lap-panel" role="tabpanel">' + this.vLaporanIsi() + '</div>';
  },
  vLaporanIsi() {
    const L = this.hitung(), T = L.reduce((a, r) => ({ m: a.m + r.modal, h: a.h + r.hasil }), { m: 0, h: 0 }), un = T.h - T.m;
    const filter = this.chip(this.PER, this.per, 'lp') + this.chip(this.DIM, this.dim, 'ld');
    const kepala = '';
    if (this.sub === 'grafik') return kepala + this.vDashboard();
    if (this.sub === 'rincian') return kepala + '<section>' + filter + '<p class="note">Urut dari untung terbesar. HPP = modal (di luar pembelian alat) ÷ panen bersih; harga rata-rata tidak menghitung penjualan bibit dan bantuan; BEP dihitung dari biaya tetap, harga rata-rata, dan biaya variabel per satuan.</p></section>' +
      (L.length ? L.map((r, i) => this.kartu(r, i)).join('') : '<section><p class="note">Belum ada transaksi pada periode ini. Catat modal/hasil atau isi data contoh di Beranda.</p></section>');
    return kepala + '<section>' + filter +
      '<div class="row"><span class="mu">Untung / rugi</span><strong class="' + (un >= 0 ? 'up' : 'down') + '">' + rp(un) + '</strong></div>' +
      '<div class="row"><span class="mu">R/C ratio</span><span>' + (T.m ? fmtRC(T.h / T.m) : '—') + '</span></div>' +
      '<div class="row"><span class="mu">Modal / Hasil</span><span>' + rp(T.m) + ' / ' + rp(T.h) + '</span></div></section>' + this.vBanding() + this.vSimulasi();
  },
  /* ---------- Fase 4: dashboard, cetak, Excel ---------- */
  tren() {
    const d = new Date(), out = [];
    for (let i = 5; i >= 0; i--) {
      const x = new Date(d.getFullYear(), d.getMonth() - i, 1), k = isoHari(x).slice(0, 7);
      const tx = App.aktif().filter((t) => t.tanggal.slice(0, 7) === k);
      out.push({ n: ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][x.getMonth()], m: App.jumlah(tx, 'keluar'), h: App.jumlah(tx, 'masuk') });
    }
    return out;
  },
  svgTren() {
    const T = this.tren(), mx = Math.max(1, ...T.map((r) => Math.max(r.m, r.h))), H = 110, w = 50;
    const bar = (v, x, c) => '<rect x="' + x + '" y="' + (H - v / mx * H + 8) + '" width="18" height="' + Math.max(v ? 2 : 0, v / mx * H) + '" rx="3" fill="var(' + c + ')"/>';
    return '<svg viewBox="0 0 320 146" width="100%" role="img" aria-label="Tren modal dan hasil 6 bulan">' + T.map((r, i) => bar(r.m, i * w + 6, '--loss') + bar(r.h, i * w + 26, '--fill') +
      '<text x="' + (i * w + 25) + '" y="140" text-anchor="middle" font-size="10" fill="var(--paper-faint)">' + r.n + '</text>').join('') + '</svg>' +
      '<p class="note"><span style="color:var(--loss)">■</span> Modal &nbsp; <span style="color:var(--fill)">■</span> Hasil · 6 bulan terakhir</p>';
  },
  komposisi() {
    const per = {}; let tot = 0;
    App.aktif().filter((t) => t.jenis === 'keluar' && this.masuk(t.tanggal)).forEach((t) => { per[t.kategoriId] = (per[t.kategoriId] || 0) + t.jumlah; tot += t.jumlah; });
    if (!tot) return '<p class="note">Belum ada modal pada periode ini.</p>';
    return Object.keys(per).sort((a, b) => per[b] - per[a]).slice(0, 6).map((k) => { const p = Math.round(per[k] / tot * 100);
      return '<div class="bar-row"><div class="bar-top"><span>' + esc(App.namaKat(k)) + '</span><span class="mu">' + p + '% · ' + rp(per[k]) + '</span></div><div class="bar"><i style="width:' + p + '%"></i></div></div>'; }).join('');
  },
  topKom() {
    const keep = this.dim; this.dim = 'komoditas'; const L = this.hitung().filter((r) => r.nama !== 'Tanpa siklus').slice(0, 3); this.dim = keep;
    if (!L.length) return '<p class="note">Belum ada komoditas bersiklus pada periode ini.</p>';
    return L.map((r, i) => '<div class="row"><span>' + (i + 1) + '. ' + esc(r.nama) + '</span><strong class="' + (r.untung >= 0 ? 'up' : 'down') + '">' + rp(r.untung) + '</strong></div>').join('');
  },
  vDashboard() {
    return this.vGrafik() + '<section class="dash"><h2>Tren 6 bulan (batang)</h2>' + this.svgTren() + '</section>' +
      '<section class="dash"><h2>Komposisi modal</h2>' + this.komposisi() + '</section>' +
      '<section class="dash"><h2>Komoditas teratas</h2>' + this.topKom() + '</section>';
  },
  cetak() { window.print(); },
  eksporXls() {
    const L = this.hitung(), n = (v) => v === null ? '' : Math.round(v * 100) / 100;
    const h = '<table border="1"><tr><th>Nama</th><th>Modal</th><th>Hasil</th><th>Untung</th><th>R/C</th><th>Panen bersih</th><th>HPP</th><th>Harga rata-rata</th><th>Harga min</th><th>BEP (satuan)</th></tr>' +
      L.map((r) => '<tr><td>' + esc(r.nama) + '</td>' + [r.modal, r.hasil, r.untung, r.rc, r.qty, r.hpp, r.harga, r.hmin, r.bep].map((v) => '<td>' + n(v) + '</td>').join('') + '</tr>').join('') + '</table>';
    const blob = new Blob(['\ufeff<html><head><meta charset="utf-8"></head><body>' + h + '</body></html>'], { type: 'application/vnd.ms-excel' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'laporan-tani-' + this.per + '-' + this.dim + '.xls';
    document.body.appendChild(a); a.click(); a.remove();
  },
  /* ---------- grafik garis halus + tooltip (v0.1.014) ---------- */
  rentang: 6, _pts: [],
  bulanN(n) {
    const d = new Date(), B = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'], out = [];
    for (let i = n - 1; i >= 0; i--) {
      const x = new Date(d.getFullYear(), d.getMonth() - i, 1), k = isoHari(x).slice(0, 7);
      const tx = App.aktif().filter((t) => t.tanggal.slice(0, 7) === k);
      out.push({ n: B[x.getMonth()], thn: x.getFullYear(), m: App.jumlah(tx, 'keluar'), h: App.jumlah(tx, 'masuk') });
    }
    return out;
  },
  ringkasAngka(n) { n = Math.abs(n); return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace('.', ',') + ' jt' : n >= 1e3 ? Math.round(n / 1e3) + ' rb' : String(Math.round(n)); },
  kurva(P) { // bezier halus tanpa melampaui titik
    let d = 'M' + P[0][0] + ' ' + P[0][1];
    for (let i = 0; i < P.length - 1; i++) {
      const a = P[i], b = P[i + 1], p0 = P[i - 1] || a, p3 = P[i + 2] || b, lo = Math.min(a[1], b[1]), hi = Math.max(a[1], b[1]);
      const c = (v) => Math.min(hi, Math.max(lo, v));
      d += ' C' + (a[0] + (b[0] - p0[0]) / 6).toFixed(1) + ' ' + c(a[1] + (b[1] - p0[1]) / 6).toFixed(1) + ' ' + (b[0] - (p3[0] - a[0]) / 6).toFixed(1) + ' ' + c(b[1] - (p3[1] - a[1]) / 6).toFixed(1) + ' ' + b[0] + ' ' + b[1];
    }
    return d;
  },
  vGrafik() {
    const T = this.bulanN(this.rentang), W = 320, X0 = 38, X1 = 308, Y0 = 12, Y1 = 150;
    const mx = Math.max(1, ...T.map((r) => Math.max(r.m, r.h))), tinggi = (v) => Y1 - v / mx * (Y1 - Y0);
    const px = (i) => X0 + (T.length === 1 ? 0 : i * (X1 - X0) / (T.length - 1));
    const H = T.map((r, i) => [px(i), tinggi(r.h)]), M = T.map((r, i) => [px(i), tinggi(r.m)]);
    this._pts = T.map((r, i) => ({ x: px(i), yh: H[i][1], ym: M[i][1], n: r.n + ' ' + r.thn, h: r.h, m: r.m }));
    const grid = [0, 1, 2, 3].map((i) => { const v = mx * i / 3, y = tinggi(v);
      return '<line x1="' + X0 + '" x2="' + X1 + '" y1="' + y + '" y2="' + y + '" stroke="var(--line-soft)"/><text x="' + (X0 - 5) + '" y="' + (y + 3) + '" text-anchor="end" font-size="9" fill="var(--paper-faint)">' + this.ringkasAngka(v) + '</text>'; }).join('');
    const langkah = Math.ceil(T.length / 6);
    const sumbu = T.map((r, i) => i % langkah === 0 ? '<text x="' + px(i) + '" y="168" text-anchor="middle" font-size="9" fill="var(--paper-faint)">' + r.n + '</text>' : '').join('');
    const kH = this.kurva(H), area = kH + ' L' + X1 + ' ' + Y1 + ' L' + X0 + ' ' + Y1 + ' Z';
    const tot = T.reduce((a, r) => ({ h: a.h + r.h, m: a.m + r.m }), { h: 0, m: 0 }), un = tot.h - tot.m;
    const tabel = '<div class="gulir"><table class="lg-tab"><tr><th>Bulan</th><th>Hasil</th><th>Modal</th><th>Untung</th></tr>' + T.map((r) => '<tr><td>' + r.n + ' ' + r.thn + '</td><td>' + rp(r.h) + '</td><td>' + rp(r.m) + '</td><td class="' + (r.h >= r.m ? 'up' : 'down') + '">' + rp(r.h - r.m) + '</td></tr>').join('') + '</table></div>';
    return '<section class="dash"><h2>Tren hasil / modal</h2>' + this.chip([[6, '6 bulan'], [12, '12 bulan']], this.rentang, 'lr') +
      '<div class="lg-stat"><div><div class="note">UNTUNG BERSIH</div><strong class="' + (un >= 0 ? 'up' : 'down') + '">' + rp(un) + '</strong></div><div><div class="note">TOTAL HASIL</div><strong>' + rp(tot.h) + '</strong></div><div><div class="note">TOTAL MODAL</div><strong>' + rp(tot.m) + '</strong></div></div>' +
      '<div class="lg-wrap"><svg class="lg-svg" viewBox="0 0 ' + W + ' 176" width="100%" role="img" aria-label="Tren hasil dan modal"><defs><linearGradient id="lgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--fill)" stop-opacity=".45"/><stop offset="1" stop-color="var(--fill)" stop-opacity="0"/></linearGradient></defs>' +
      grid + '<path d="' + area + '" fill="url(#lgA)"/><path d="' + kH + '" fill="none" stroke="var(--fill)" stroke-width="2.2" stroke-linecap="round"/><path d="' + this.kurva(M) + '" fill="none" stroke="var(--loss)" stroke-width="2.2" stroke-linecap="round"/>' + sumbu +
      '<line class="lg-x" y1="' + Y0 + '" y2="' + Y1 + '" stroke="var(--paper-faint)" stroke-dasharray="2 3" visibility="hidden"/><circle class="lg-dh" r="3.6" fill="var(--fill)" stroke="var(--ink)" visibility="hidden"/><circle class="lg-dm" r="3.6" fill="var(--loss)" stroke="var(--ink)" visibility="hidden"/></svg><div class="lg-tip" hidden></div></div>' +
      '<p class="note lg-leg"><span style="color:var(--fill)">●</span> Hasil &nbsp; <span style="color:var(--loss)">●</span> Modal · sentuh grafik untuk melihat angka</p>' +
      '<details class="lg-detail"><summary>Tabel angka grafik</summary>' + tabel + '</details></section>';
  },
  sentuh(e) {
    const svg = e.target.closest && e.target.closest('.lg-svg'); if (!svg || !this._pts.length) return;
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * 320;
    let k = 0; this._pts.forEach((p, i) => { if (Math.abs(p.x - vx) < Math.abs(this._pts[k].x - vx)) k = i; });
    const p = this._pts[k], q = (c) => svg.querySelector(c), tip = svg.parentNode.querySelector('.lg-tip');
    const x = q('.lg-x'); x.setAttribute('x1', p.x); x.setAttribute('x2', p.x); x.setAttribute('visibility', 'visible');
    [['.lg-dh', p.yh], ['.lg-dm', p.ym]].forEach((a) => { const c = q(a[0]); c.setAttribute('cx', p.x); c.setAttribute('cy', a[1]); c.setAttribute('visibility', 'visible'); });
    tip.hidden = false;
    tip.innerHTML = '<b>' + p.n + '</b><br><span style="color:var(--fill)">Hasil: ' + rp(p.h) + '</span><br><span style="color:var(--loss)">Modal: ' + rp(p.m) + '</span>';
    const pct = p.x / 320 * 100; tip.style.left = Math.min(Math.max(pct, 24), 76) + '%';
  },
  klik(e) {
    const an = e.target.closest('[data-an]'); if (an) { if (an.dataset.an === 'cetak') this.cetak(); else this.eksporXls(); return true; }
    const lr = e.target.closest('[data-lr]'); if (lr) { this.rentang = Number(lr.dataset.lr); App.go(App.tab === 'beranda' ? 'beranda' : 'laporan', true); return true; }
    const lt = e.target.closest('[data-lt]'); if (lt) { this.sub = lt.dataset.lt; App.go('laporan', true); return true; }
    const sh = e.target.closest('[data-sh]'), sbb = e.target.closest('[data-sb]');
    if (sh || sbb) { if (sh) this.simH = Number(sh.dataset.sh); else this.simB = Number(sbb.dataset.sb); App.go('laporan', true); return true; }
    const p = e.target.closest('[data-lp]'), d = e.target.closest('[data-ld]');
    if (p) this.per = p.dataset.lp; else if (d) this.dim = d.dataset.ld; else return false;
    App.go('laporan', true); return true;
  }
};

document.addEventListener('pointerdown', (e) => Analisa.sentuh(e));
document.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons || e.pressure) Analisa.sentuh(e); });

</script>
<script>
/* Tani Keuangan — Fase 5: anggaran, arus kas, aset, utang/piutang (v0.1.015) */
const Rencana = {
  sub: 'anggaran',
  SUB: [['anggaran', 'Anggaran'], ['kas', 'Arus kas'], ['aset', 'Aset'], ['utang', 'Utang/piutang']],
  d() { return App.data; },
  bulanKe(n) { const x = new Date(); x.setDate(1); x.setMonth(x.getMonth() + n); return isoHari(x).slice(0, 7); },
  net(k) { const tx = App.aktif().filter((t) => t.tanggal.slice(0, 7) === k); return App.jumlah(tx, 'masuk') - App.jumlah(tx, 'keluar'); },
  saldoAwal() { return Number(App.data.pengaturan.saldoAwal) || 0; },
  BLN: ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],
  namaBln(k) { return this.BLN[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4); },
  saldoSd(k) { return this.saldoAwal() + App.aktif().filter((t) => t.tanggal.slice(0, 7) <= k).reduce((a, t) => a + (t.jenis === 'masuk' ? t.jumlah : -t.jumlah), 0); },
  rata3() { const a = [-3, -2, -1].map((n) => this.bulanKe(n)).filter((k) => App.aktif().some((t) => t.tanggal.slice(0, 7) === k)); return a.length ? a.reduce((s, k) => s + this.net(k), 0) / a.length : 0; },
  mulai(a) { const [y, m] = a.tanggalBeli.split('-').map(Number), n = new Date(); return Math.max(0, Math.min(a.umurBulan, (n.getFullYear() - y) * 12 + n.getMonth() + 1 - m)); },
  baris(a, b) { return '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>'; },
  v() {
    const chips = '<div class="seg sm" style="justify-content:flex-start;margin:6px 0">' + this.SUB.map((x) => '<button type="button" class="btn' + (this.sub === x[0] ? ' on' : '') + '" data-rcs="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>';
    return '<section>' + chips + '</section>' + this['v_' + this.sub]() +
      '<button class="btn" data-go="lainnya" style="width:100%;margin-top:12px">Kembali</button>';
  },
  v_anggaran() {
    const L = Siklus.daftar();
    if (!L.length) return '<section><p class="note">Belum ada siklus. Buat siklus dulu di tab Siklus.</p></section>';

    s.anggaran = angka(i.value); s.diubah = nowIso(); App.simpan(); App.go('rencana', true);
  }

document.addEventListener('change', (e) => Rencana.ubah(e));

<script>
/* Tani Keuangan — Beranda yang lebih berguna (v0.1.018): perlu perhatian, kas, banding bulan lalu */
const Beranda = {
  m(n) { return '<span data-mask data-val="' + rp(n) + '">' + rp(n) + '</span>'; },
  per(k) { const tx = App.aktif().filter((t) => t.tanggal.slice(0, 7) === k); const m = App.jumlah(tx, 'keluar'), h = App.jumlah(tx, 'masuk'); return { m, h, u: h - m, n: tx.length }; },
  delta(a, b, baikNaik) {
    if (!b && !a) return '<span class="mu">—</span>';
    const d = a - b; if (!d) return '<span class="mu">sama</span>';
    const baik = (d > 0) === baikNaik;
    return '<span class="' + (baik ? 'up' : 'down') + '">' + (d > 0 ? '▲ ' : '▼ ') + Beranda.m(Math.abs(d)) + '</span>';
  },
  perhatian() {
    const out = [], hari = isoHari(), d7 = isoHari(new Date(Date.now() + 7 * 864e5));
    App.data.utang.filter((u) => !u.terhapus && !u.lunas && u.jatuhTempo && u.jatuhTempo <= d7).forEach((u) =>
      out.push((u.jatuhTempo < hari ? '⚠ ' : '⏰ ') + (u.jenis === 'utang' ? 'Utang ke ' : 'Piutang dari ') + esc(u.pihak) + ' ' + rp(u.jumlah) + (u.jatuhTempo < hari ? ' sudah lewat jatuh tempo' : ' jatuh tempo ' + Setelan.tgl(u.jatuhTempo))));
    Siklus.daftar().filter((s) => s.status === 'berjalan' && s.anggaran).forEach((s) => {
      const r = Siklus.ringkas(s.id).modal, p = Math.round(r / s.anggaran * 100);
      if (p >= 90) out.push((p > 100 ? '⚠ ' : '⏰ ') + esc(Siklus.nama(s.id)) + ': modal ' + p + '% dari anggaran');
    });
    const pn = []; Siklus.daftar().forEach((s) => { const pp = Siklus.panenPerkiraan(s); if (!pp || pp.sisa > 7) return;
      pn.push([pp.sisa, pp.sisa < 0 ? '⚠ ' + esc(Siklus.nama(s.id)) + ': lewat perkiraan panen ' + (-pp.sisa) + ' hari' : '⏰ ' + esc(Siklus.nama(s.id)) + ': perkiraan panen ' + (pp.sisa === 0 ? 'hari ini' : pp.sisa + ' hari lagi')]); });
    out.unshift(...pn.sort((x, y) => x[0] - y[0]).map((x) => x[1])); // pengingat panen paling atas
    const tampil = this.semua ? out : out.slice(0, 3);
    return out.length ? '<section><h2>Perlu perhatian</h2>' + tampil.map((t) => '<div class="row"><span>' + t + '</span></div>').join('') +
      (out.length > 3 ? '<button type="button" class="btn" data-bp="1" style="width:100%;margin-top:10px">' + (this.semua ? 'Ringkas' : 'Lihat semua (' + out.length + ')') + '</button>' : '') + '</section>' : '';
  },
  atas() {
    const ini = bulanIni(), lalu = bulanLalu(), a = this.per(ini), b = this.per(lalu);
    const saldo = (Number(App.data.pengaturan.saldoAwal) || 0) + App.aktif().reduce((s, t) => s + (t.jenis === 'masuk' ? t.jumlah : -t.jumlah), 0);
    const U = App.data.utang.filter((u) => !u.terhapus && !u.lunas), tot = (j) => U.filter((u) => u.jenis === j).reduce((s, u) => s + u.jumlah, 0);
    const row = (x, y) => '<div class="row"><span class="mu">' + x + '</span><span>' + y + '</span></div>';
    if (!App.aktif().length) return '';
    return this.perhatian() +
      '<section><h2>Dibanding bulan lalu</h2>' + row('Untung', this.delta(a.u, b.u, true)) + row('Modal', this.delta(a.m, b.m, false)) + row('Hasil', this.delta(a.h, b.h, true)) +
      (b.n ? '' : '<p class="note">Belum ada transaksi bulan lalu sebagai pembanding.</p>') + '</section>' +
      '<section><h2>Posisi kas</h2>' + row('Saldo kas (semua waktu)', '<strong class="' + (saldo >= 0 ? 'up' : 'down') + '">' + this.m(saldo) + '</strong>') +
      (U.length ? row('Utang belum lunas', '<span class="down">' + this.m(tot('utang')) + '</span>') + row('Piutang belum lunas', '<span class="up">' + this.m(tot('piutang')) + '</span>') : '') + '</section>';
  },
  /* ---------- grafik di Beranda (v0.1.021) ---------- */
  untungBulanan() {
    const T = Analisa.bulanN(6).map((r) => ({ n: r.n, u: r.h - r.m }));
    if (!T.some((r) => r.u)) return '';
    const mx = Math.max(1, ...T.map((r) => Math.abs(r.u))), Z = 72, S = 52, w = 50;
    const bars = T.map((r, i) => {
      const h = Math.max(r.u ? 2 : 0, Math.abs(r.u) / mx * S), x = i * w + 14, up = r.u >= 0, y = up ? Z - h : Z;

      '<p class="note"><span style="color:var(--fill)">■</span> Untung &nbsp; <span style="color:var(--loss)">■</span> Rugi · 6 bulan terakhir</p></section>';
  },
  donut(bln) {
    const biaya = bln.filter((t) => t.jenis === 'keluar'), tot = App.jumlah(biaya, 'keluar');
    if (!tot) return '';
    const per = {}; biaya.forEach((t) => { per[t.kategoriId] = (per[t.kategoriId] || 0) + t.jumlah; });
    const ks = Object.keys(per).sort((a, b) => per[b] - per[a]);
    const seg = ks.slice(0, 5).map((k) => ({ n: App.namaKat(k), v: per[k] })), sisa = ks.slice(5).reduce((s, k) => s + per[k], 0);
    if (sisa) seg.push({ n: 'Lainnya', v: sisa });
    const W = ['var(--fill)', 'var(--gold)', 'var(--loss)', 'var(--paper-dim)', 'var(--paper-faint)', 'var(--line)'], C = 2 * Math.PI * 40;
    let off = 0;
    const arcs = seg.map((s, i) => {
      const len = s.v / tot * C, el = '<circle cx="60" cy="60" r="40" fill="none" stroke="' + W[i] + '" stroke-width="18" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 60 60)"><title>' + esc(s.n) + ': ' + Math.round(s.v / tot * 100) + '%</title></circle>';
      off += len; return el;

    const legenda = seg.map((s, i) => '<div class="bar-top" style="margin:7px 0"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:' + W[i] + ';margin-right:6px"></i>' + esc(s.n) + '</span><span class="mu">' + Math.round(s.v / tot * 100) + '%</span></div>').join('');
    return '<section class="dash"><h2>Komposisi modal bulan ini</h2><div style="display:flex;align-items:center;gap:14px"><svg viewBox="0 0 120 120" width="130" height="130" role="img" aria-label="Komposisi modal bulan ini">' + arcs +
      '<text x="60" y="57" text-anchor="middle" font-size="9" fill="var(--paper-faint)">Modal</text><text x="60" y="69" text-anchor="middle" font-size="9" fill="var(--paper-faint)">bulan ini</text></svg>' +
      '<div style="flex:1;min-width:0">' + legenda + '</div></div><p class="note">Total modal bulan ini: ' + this.m(tot) + '</p></section>';
  },
  perKomoditas() {
    const k = { d: Analisa.dim, p: Analisa.per }; let L;
    Analisa.dim = 'komoditas'; Analisa.per = 'semua';
    try { L = Analisa.hitung().filter((r) => r.nama !== 'Tanpa siklus'); } finally { Analisa.dim = k.d; Analisa.per = k.p; }
    L = L.sort((a, b) => b.untung - a.untung).slice(0, 5);

    const mx = Math.max(1, ...L.map((r) => Math.abs(r.untung)));

      const p = Math.max(r.untung ? 3 : 0, Math.round(Math.abs(r.untung) / mx * 100));
      return '<div class="bar-row"><div class="bar-top"><span>' + esc(r.nama) + (r.rc ? ' <span class="mu">· R/C ' + r.rc.toFixed(2).replace('.', ',') + '</span>' : '') + '</span><strong class="' + (r.untung >= 0 ? 'up' : 'down') + '">' + this.m(r.untung) + '</strong></div>' +
        '<div class="bar"><i style="width:' + p + '%;background:var(' + (r.untung >= 0 ? '--fill' : '--loss') + ')"></i></div></div>';

  },
  anggaran() {
    const L = Siklus.daftar().filter((s) => s.status === 'berjalan' && s.anggaran);
    if (!L.length) return '';
    return '<section class="dash"><h2>Modal vs anggaran (siklus berjalan)</h2>' + L.map((s) => {

        '<div class="bar"><i style="width:' + Math.min(p, 100) + '%;background:var(' + (p > 100 ? '--loss' : p >= 90 ? '--gold' : '--fill') + ')"></i></div></div>';
    }).join('') + '</section>';
  },
  grafik(bln) {
    if (!App.aktif().length) return '';

  }
};

<script>

  },
  mulai(e) {
    const r = e.target.closest && e.target.closest('.tx[data-edit]');

    this.r.style.transform = 'translateX(' + Math.min(0, Math.max(-96, this.awal + dx)) + 'px)';
  },

    $('heroNum').className = 'hero-number' + (untung < 0 ? ' rugi' : '');

    $('heroSub').innerHTML = bln.length

      '<label for="f_jumlah">Jumlah (Rp)</label><input id="f_jumlah" inputmode="numeric" autocomplete="off" placeholder="0" value="' + fmtInput(d.jumlah) + '">' +
      '<label for="f_kat">Kategori</label><select id="f_kat">' + this.kategori(d.jenis).map((k) =>
        '<option value="' + k.id + '"' + (d.kat === k.id ? ' selected' : '') + '>' + esc(k.nama) + '</option>').join('') + '</select>' +
      '<label for="f_siklus">Siklus (opsional)</label><select id="f_siklus"><option value="">Tanpa siklus</option>' +
      Siklus.opsi(Siklus.daftar().filter((s) => s.status === 'berjalan' || s.id === d.siklus), d.siklus, (x) => Siklus.nama(x.id)) + '</select>' +
      '<label for="f_tanggal">Tanggal</label><input type="date" id="f_tanggal" value="' + d.tanggal + '">' +
      '<label for="f_catatan">Catatan (opsional)</label><input id="f_catatan" maxlength="120" value="' + esc(d.catatan) + '" placeholder="mis. NPK 5 kg">' +
      Nota.kotak() +
      '<button class="btn gold" data-do="simpan">Simpan</button>' +
      (edit ? '' : '<button class="btn" data-do="simpan-baru" style="width:100%;margin-top:10px">Simpan &amp; catat lagi</button>') +
      (edit ? '<button class="btn" data-do="dup-tx" style="width:100%;margin-top:10px">Duplikat sebagai transaksi baru</button>' : '') +
      '<button class="btn" data-do="batal" style="width:100%;margin-top:10px">Batal</button>' +
      (edit ? '<button class="btn danger" data-do="hapus-tx" style="width:100%;margin-top:10px">' + (this.hapusMinta === d.id ? 'Ketuk lagi untuk menghapus' : 'Hapus transaksi') + '</button>' : '') +
      '</section>';
  },

  /* ---------- tampilan: lainnya ---------- */
  vLainnya() {
    const kustom = this.data.kategori.filter((k) => !k.terhapus);
    return '<section><h2>Kategori sendiri</h2><p class="note">Kategori bawaan tidak bisa dihapus. Tambahkan yang khusus usaha Anda.</p>' +
      (kustom.length ? kustom.map((k) => '<div class="row"><span>' + esc(k.nama) + ' <span class="mu">· ' + (k.jenis === 'keluar' ? 'modal' : 'hasil') + '</span></span>' +
        '<button class="btn" data-do="hapus-kat" data-id="' + k.id + '" style="flex:0 0 auto;padding:4px 10px;font-size:12px">Hapus</button></div>').join('') : '') +
      '<label for="k_nama">Nama kategori</label><input id="k_nama" maxlength="40" placeholder="mis. Bambu penyangga">' +
      '<label for="k_jenis">Jenis</label><select id="k_jenis"><option value="keluar">Modal (keluar)</option><option value="masuk">Hasil (masuk)</option></select>' +
      '<button class="btn gold" data-do="tambah-kat">Tambah kategori</button></section>' +
      '<section><h2>Ekspor &amp; impor CSV</h2><p class="note">Kolom: tanggal, jenis (keluar/masuk), kategori, siklus, jumlah, catatan. Cadangan penuh (JSON) ada di Setelan.</p>' +
      '<div class="seg tiga" style="margin-top:12px"><button class="btn" data-do="ekspor-csv">Ekspor CSV</button><button class="btn" data-do="impor-csv">Impor teks</button>' +
      '<button class="btn" data-do="berkas-csv">Pilih berkas</button></div>' +
      '<input type="file" id="csvFile" accept=".csv,text/csv" hidden>' +
      '<textarea id="csvBox" class="settings-text" rows="6" aria-label="Data CSV" placeholder="Hasil ekspor muncul di sini; tempel CSV untuk impor"></textarea>' +
      '<div class="note" id="csvMsg" role="status" aria-live="polite" style="margin-top:8px"></div></section>' +
      '<section><h2>Rencana keuangan</h2><p class="note">Anggaran per siklus, arus kas dan proyeksi, aset dan penyusutan, balik modal, utang/piutang.</p><button class="btn" data-go="rencana" style="width:100%;margin-top:12px">Buka rencana keuangan</button></section>' +
      '<section><h2>Unit &amp; komoditas</h2><p class="note">Kelola lahan/unit dan jenis komoditas untuk siklus tanam.</p><button class="btn" data-go="master" style="width:100%;margin-top:12px">Kelola unit &amp; komoditas</button></section>' +
      '';
  },

  /* ---------- aksi ---------- */
  toast(t, aksi) {
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = t; el.setAttribute('role', 'status');
    if (aksi) { const b = document.createElement('button'); b.type = 'button'; b.className = 'toast-btn'; b.textContent = aksi.label; b.onclick = () => { el.remove(); aksi.fn(); }; el.appendChild(b); }
    document.body.appendChild(el); setTimeout(() => el.remove(), aksi ? 5000 : 1800);
  },
  aksi(a, el) {
    if (a === 'tukar-tgl') { const f = this.filter, x = f.dari; f.dari = f.sampai; f.sampai = x; this.go('transaksi', true); return; }
    if (Nota.aksi(a)) return;
    if (a === 'tx-lagi') { this.batasTx += 100; const el = $('txHasil'); if (el) el.innerHTML = this.hasilTx(); return; }
    if (Siklus.aksi(a, el)) return;
    if (a === 'jenis-keluar' || a === 'jenis-masuk') {
      const d = this.bacaForm(); d.jenis = a.slice(6); d.kat = this.lastKat[d.jenis] || this.kategori(d.jenis)[0].id;
      this.go('catat', true);
    } else if (a === 'batal') { Nota.buang(this.draft); this.draft = null; this.go(this.balik || 'beranda'); }
    else if (a === 'simpan' || a === 'simpan-baru') this.simpanTx(a === 'simpan-baru');
    else if (a === 'dup-tx') {
      const d = this.bacaForm(); Nota.buang(d); this.draft = Object.assign({}, d, { id: null, tanggal: isoHari(), nota: null, notaLama: null }); this.hapusMinta = null;
      this.toast('Disalin sebagai transaksi baru — ubah bila perlu, lalu Simpan'); this.go('catat', true);
    } else if (a === 'hapus-tx') {
      const d = this.draft;
      if (this.hapusMinta === d.id) {
        const t = this.data.transaksi.find((x) => x.id === d.id);
        if (t) { t.terhapus = true; t.diubah = nowIso(); this.simpan(); }
        this.hapusMinta = null; this.draft = null; this.toast('Transaksi dihapus'); this.go(this.balik || 'beranda');
      } else { this.bacaForm(); this.hapusMinta = d.id; this.go('catat', true); }
    }
    else if (a === 'tambah-kat') this.tambahKat();
    else if (a === 'hapus-kat') {
      const k = this.data.kategori.find((x) => x.id === el.dataset.id);
      if (k) { k.terhapus = true; this.simpan(); this.go('lainnya', true); }
    }
    else if (a === 'ekspor-csv') this.eksporCsv();
    else if (a === 'impor-csv') this.imporCsv();
    else if (a === 'berkas-csv') $('csvFile').click();
    else if (a === 'contoh') this.contoh();
    else if (a === 'hapus-contoh') Contoh.hapus(el);
  },
  simpanTx(lagi) {
    const d = this.bacaForm();
    if (d.jumlah <= 0) { this.toast('Isi jumlah lebih dari 0'); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.tanggal)) { this.toast('Isi tanggal'); return; }
    const kat = this.semuaKat().find((k) => k.id === d.kat);
    const sifat = d.jenis === 'keluar' ? (kat && kat.sifatBiaya) || 'variabel' : null;
    if (d.id) {
      const t = this.data.transaksi.find((x) => x.id === d.id);
      Object.assign(t, { tanggal: d.tanggal, jenis: d.jenis, kategoriId: d.kat, jumlah: d.jumlah, sifatBiaya: sifat, catatan: d.catatan, siklusId: d.siklus || null, notaId: d.nota || null, diubah: nowIso() });
    } else {
      this.data.transaksi.push({ id: uid('t'), tanggal: d.tanggal, jenis: d.jenis, kategoriId: d.kat, jumlah: d.jumlah, siklusId: d.siklus || null,
        sifatBiaya: sifat, catatan: d.catatan, notaId: d.nota || null, dibuat: nowIso(), diubah: nowIso(), terhapus: false });
    }
    this.lastKat[d.jenis] = d.kat;
    if (d.notaLama && d.notaLama !== d.nota) Nota.hapus(d.notaLama);
    this.simpan();
    if (lagi) {
      this.draft = { id: null, jenis: d.jenis, jumlah: 0, kat: d.kat, tanggal: d.tanggal, catatan: '', siklus: d.siklus, nota: null, notaLama: null };
      this.toast('Tersimpan'); this.go('catat', true);
      const j = $('f_jumlah'); if (j) j.focus();
    } else { this.draft = null; this.toast('Tersimpan'); this.go(['transaksi', 'siklus-detail'].includes(this.balik) ? this.balik : 'beranda'); }
  },
  tambahKat() {
    const nama = $('k_nama').value.trim(), jenis = $('k_jenis').value;
    if (!nama) { this.toast('Isi nama kategori'); return; }
    if (this.kategori(jenis).some((k) => k.nama.toLowerCase() === nama.toLowerCase())) { this.toast('Kategori sudah ada'); return; }
    this.data.kategori.push({ id: uid('c'), nama, jenis, sifatBiaya: jenis === 'keluar' ? 'variabel' : null, bawaan: false, terhapus: false });
    this.simpan(); this.toast('Kategori ditambah'); this.go('lainnya', true);
  },

  /* ---------- CSV ---------- */
  eksporCsv() {
    const q = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
    const baris = ['tanggal,jenis,kategori,siklus,jumlah,catatan'].concat(
      this.aktif().slice().sort((a, b) => a.tanggal.localeCompare(b.tanggal)).map((t) =>
        [t.tanggal, t.jenis, q(this.namaKat(t.kategoriId)), q(t.siklusId || ''), t.jumlah, q(t.catatan)].join(',')));
    const csv = baris.join('\n');
    $('csvBox').value = csv;
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
      a.download = 'tani-transaksi-' + isoHari() + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) {}
    $('csvMsg').textContent = this.aktif().length + ' transaksi diekspor. Jika unduhan tidak mulai, salin teks di kotak.';
  },
  urai(teks) {
    const rows = []; let r = [], f = '', q = false;
    teks = teks.replace(/^\ufeff/, '');
    for (let i = 0; i < teks.length; i++) {
      const c = teks[i];
      if (q) { if (c === '"') { if (teks[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { r.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && teks[i + 1] === '\n') i++; r.push(f); f = ''; if (r.some((x) => x.trim())) rows.push(r); r = []; }
      else f += c;
    }
    r.push(f); if (r.some((x) => x.trim())) rows.push(r);
    return rows;
  },
  imporCsv() {
    const rows = this.urai($('csvBox').value || '');
    if (rows.length < 2) { $('csvMsg').textContent = 'CSV kosong atau tanpa baris data.'; return; }
    const h = rows[0].map((x) => x.trim().toLowerCase()), ix = (n) => h.indexOf(n);
    if (ix('tanggal') < 0 || ix('jenis') < 0 || ix('jumlah') < 0) { $('csvMsg').textContent = 'Kolom tanggal, jenis, dan jumlah wajib ada.'; return; }
    let ok = 0, lewat = 0;
    rows.slice(1).forEach((r) => {
      const tgl = (r[ix('tanggal')] || '').trim(), jenis = (r[ix('jenis')] || '').trim().toLowerCase(), jml = angka(r[ix('jumlah')]);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl) || (jenis !== 'keluar' && jenis !== 'masuk') || jml <= 0) { lewat++; return; }
      const nama = ix('kategori') >= 0 ? (r[ix('kategori')] || '').trim() : '';
      let k = this.kategori(jenis).find((x) => x.nama.toLowerCase() === nama.toLowerCase());
      if (!k && nama) { k = { id: uid('c'), nama, jenis, sifatBiaya: jenis === 'keluar' ? 'variabel' : null, bawaan: false, terhapus: false }; this.data.kategori.push(k); }
      if (!k) k = this.kategori(jenis).slice(-1)[0];
      this.data.transaksi.push({ id: uid('t'), tanggal: tgl, jenis, kategoriId: k.id, jumlah: jml, siklusId: null,
        sifatBiaya: jenis === 'keluar' ? k.sifatBiaya || 'variabel' : null, catatan: ix('catatan') >= 0 ? (r[ix('catatan')] || '').trim() : '',
        dibuat: nowIso(), diubah: nowIso(), terhapus: false });
      ok++;
    });
    this.simpan(); this.ringkas();
    $('csvMsg').textContent = ok + ' transaksi diimpor' + (lewat ? ', ' + lewat + ' baris dilewati (format tidak sesuai)' : '') + '.';
  },
  contoh() { Contoh.isi(); }
};

document.addEventListener('DOMContentLoaded', () => App.init());

</script>

</body>
