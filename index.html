<script>
/* Buku Kebun — FAB mengikuti halaman aktif (v0.1.020; Rencana lewat modal v0.1.055) */
const Fab = {
  c: null, terbuka: false,
  catat(jenis, sid) { App.draft = { id: null, jenis }; App.baru(sid); },
  /* v0.1.155: dari Beranda, pilih siklus berjalan lebih dulu (langsung bila hanya satu) */
  untukSiklus(judul, fn) {
    const L = Siklus.daftar().filter((s) => s.status === 'berjalan');
    if (L.length === 1) { fn(L[0].id); return; }
    if (!L.length) return;
    Modal.buka({ html: '<h2 id=\"fsT\">' + judul + '</h2>' + L.map((s) => '<button type=\"button\" class=\"btn\" data-fs=\"' + s.id + '\" style=\"width:100%;margin-top:8px\">' + esc(Siklus.nama(s.id)) + '</button>').join(''), judulId: 'fsT',
      klik(e) { const b = e.target.closest('[data-fs]'); if (!b) return; const id = b.dataset.fs; Modal.tutup(true); setTimeout(() => fn(id), 250); } }); // tunda: penutupan modal memicu 'kembali' di riwayat browser, yang bisa membatalkan halaman/modal berikutnya
  },
  /* null = FAB disembunyikan; { nama, aksi } = satu ketukan; { nama, pilih: [[label, fungsi]] } = pilihan melayang */
  cfg() {
    const t = App.tab, tx = (sid) => [['Catat modal', () => Fab.catat('keluar', sid)], ['Catat hasil', () => Fab.catat('masuk', sid)]];
    if (t === 'beranda' || t === 'transaksi') return { nama: 'Catat transaksi', pilih: t === 'beranda' && Siklus.daftar().some((s) => s.status === 'berjalan') ? tx().concat([['Catat panen', () => Fab.untukSiklus('Catat panen untuk siklus', (id) => { Siklus.sid = id; Siklus.aksi('catat-panen', {}); })], ['Catat jurnal', () => Fab.untukSiklus('Catat jurnal untuk siklus', (id) => { Siklus.sid = id; Rencana.dlgBuka('jurnal'); })]]) : tx() };
    if (t === 'master') return { nama: 'Tambah unit atau komoditas', pilih: [['Tambah unit', () => Siklus.aksi('form-baru', { dataset: { j: 'unit' } })], ['Tambah komoditas', () => Siklus.aksi('form-baru', { dataset: { j: 'kom' } })]] };
    if (t === 'siklus') return { nama: 'Siklus baru', aksi: () => App.go('siklus-form') };
    if (t === 'siklus-detail') {
      const s = Siklus.cari(Siklus.sid);
      return s && s.status === 'berjalan' ? { nama: 'Catat untuk siklus ini', pilih: tx(s.id).concat([['Catat panen', () => Siklus.aksi('catat-panen', {})], ['Catat jurnal', () => Rencana.dlgBuka('jurnal')], ['Catat upah', () => Upah.catat('', s.id)], ['Pakai stok', () => Stok.pakai('', s.id)], ['Tambah jadwal kegiatan', () => Rencana.dlgBuka('jadwal')]]) } : null;
    }
    if (t === 'jurnal') {
      const s = Siklus.cari(Siklus.sid);
      return s && s.status === 'berjalan' ? { nama: 'Catat jurnal', aksi: () => Rencana.dlgBuka('jurnal') } : null;
    }
    if (t === 'rencana') {
      const R = (j) => () => Rencana.dlgBuka(j);
      if (Rencana.sub === 'kas') return { nama: 'Catat transaksi atau atur saldo awal', pilih: tx().concat([['Atur saldo awal kas', R('awal')]]) };
      if (Rencana.sub === 'anggaran') return { nama: 'Atur anggaran', aksi: R('anggaran') };
      if (Rencana.sub === 'aset') return { nama: 'Tambah aset', aksi: R('aset') };
      if (Rencana.sub === 'upah') return { nama: 'Catat upah atau tambah pekerja', pilih: [['Catat upah', () => Upah.catat()], ['Tambah pekerja', R('pekerja')]] };
      if (Rencana.sub === 'stok') return { nama: 'Pakai stok, tambah stok, atau tambah barang', pilih: [['Pakai stok', () => Stok.pakai()], ['Tambah stok (beli)', () => Stok.masuk()], ['Tambah barang', R('saprodi')]] };
      if (Rencana.sub === 'harga') return { nama: 'Catat harga pasar', aksi: R('harga') };
      if (Rencana.sub === 'utang') return { nama: 'Catat utang atau piutang', aksi: R('utang') };

  },
  atur() {
    const f = $('fab'); this.c = this.cfg(); this.tutup(); f.classList.remove('turun');
    f.hidden = !this.c;
    if (this.c) { f.setAttribute('aria-label', this.c.nama); f.title = this.c.nama; f.setAttribute('aria-haspopup', this.c.pilih ? 'true' : 'false'); }
  },

    this.terbuka = false;

  },
  bukaDial() {

    this.terbuka = true;

    $('fab').classList.add('open'); $('fab').setAttribute('aria-expanded', 'true');
  },

    $('fab').addEventListener('click', () => {
      if (!this.c) return;

    });

    });

    }, { passive: true });
  }
};

<script>
/* Buku Kebun — data contoh realistis (v0.1.022). Semua entri bertanda contoh:true agar bisa dihapus tanpa menyentuh data pengguna. */
const Contoh = {
  FLAG: 'tani.contoh', minta: null,
  tgl(n) { const d = new Date(); return isoHari(new Date(d.getFullYear(), d.getMonth(), d.getDate() - n)); },
  ada() { const D = App.data; return ['unit', 'komoditas', 'siklus', 'transaksi', 'panen', 'aset', 'utang', 'jurnal'].some((k) => (D[k] || []).some((x) => x.contoh && !x.terhapus)); },
  /* Terisi otomatis hanya saat pertama kali dibuka (belum ada data dan belum pernah diisi/dihapus) */
  otomatis() {
    if (Penyimpanan.get(KUNCI) !== null || Penyimpanan.get(this.FLAG) !== null) return false;
    this.bangun(App.data); App.simpan(); Penyimpanan.set(this.FLAG, '1'); return true;
  },
  isi() {
    if (this.ada()) { App.toast('Data contoh sudah ada'); return; }

  },
  bangun(D) {

<script>
/* Buku Kebun — geser ke kiri untuk hapus transaksi, dengan Urungkan (v0.1.032) */
const Geser = {
  r: null, x0: 0, y0: 0, dx: 0, arah: '', baru: 0,
  tutup() { document.querySelectorAll('.tx.geser').forEach((e) => { e.classList.remove('geser'); e.style.transform = ''; }); },
  hapus(id) {
    const t = App.data.transaksi.find((x) => x.id === id); if (!t || t.terhapus) return;
    if (Utang.tahan(t)) { this.tutup(); return; }
    t.terhapus = true; t.diubah = nowIso(); Utang.ikut(t, true); App.simpan(); App.go(App.tab, true);
    App.toast('Transaksi dihapus', { label: 'Urungkan', fn: () => { t.terhapus = false; t.diubah = nowIso(); Utang.ikut(t, false); App.simpan(); App.go(App.tab, true); } });
  },
  mulai(e) {
    const r = e.target.closest && e.target.closest('.tx[data-edit]');
    if (!r || e.target.closest('.tx-hapus')) { if (!(e.target.closest && e.target.closest('.tx-hapus'))) this.tutup(); this.r = null; return; }
    if (!r.classList.contains('geser')) this.tutup();
    if (!r.querySelector('.tx-hapus')) { const b = document.createElement('button'); b.type = 'button'; b.className = 'tx-hapus'; b.dataset.hapus = r.dataset.edit; b.textContent = 'Hapus'; r.appendChild(b); }
    const p = e.touches[0]; this.r = r; this.x0 = p.clientX; this.y0 = p.clientY; this.dx = 0; this.arah = ''; this.awal = r.classList.contains('geser') ? -96 : 0;
  },
  gerak(e) {
    if (!this.r) return; const p = e.touches[0], dx = p.clientX - this.x0, dy = p.clientY - this.y0;
    if (!this.arah && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) this.arah = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    if (this.arah !== 'h') return;
    this.dx = dx; this.r.classList.add('menggeser'); this.r.style.transition = 'none';
    this.r.style.transform = 'translateX(' + Math.min(0, Math.max(-96, this.awal + dx)) + 'px)';
  },
  selesai() {
    const r = this.r; if (!r) return; this.r = null;
    r.style.transition = ''; r.classList.remove('menggeser');
    if (this.arah === 'h') { this.baru = Date.now(); const buka = this.awal + this.dx < -48; r.classList.toggle('geser', buka); r.style.transform = ''; }
  }
};
document.addEventListener('touchstart', (e) => Geser.mulai(e), { passive: true });
document.addEventListener('touchmove', (e) => Geser.gerak(e), { passive: true });
document.addEventListener('touchend', () => Geser.selesai());
document.addEventListener('touchcancel', () => Geser.selesai());
document.addEventListener('click', (e) => {
  const h = e.target.closest && e.target.closest('.tx-hapus'); if (h) { e.stopPropagation(); Geser.hapus(h.dataset.hapus); return; }
  const r = e.target.closest && e.target.closest('.tx.geser');
  if (Date.now() - Geser.baru < 350 || r) { e.stopPropagation(); e.preventDefault(); if (r) Geser.tutup(); }
}, true);

</script>
<script>
/* Buku Kebun — panduan cepat 4 layar, tampil otomatis saat pertama dibuka (v0.1.034) */
var Panduan = (function () {

  var IK = {

    aman: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>'
  };
  function layar() {

    return [
      { ik: 'tunas', j: 'Selamat datang di Buku Kebun', t: ['Catat modal dan hasil kebun, kolam, atau kandang Anda, lalu lihat untung atau ruginya per siklus.',
        contoh ? 'Data contoh sudah terisi agar Anda bisa langsung mencoba. Hapus kapan saja lewat Setelan.' : 'Semua data tersimpan di perangkat ini.'] },
      { ik: 'plus', j: 'Catat dengan tombol +', t: ['Ketuk tombol + untuk mencatat modal (pengeluaran) atau hasil (pemasukan). Pilih siklusnya agar biaya dan hasil terhitung per siklus.',

        'Menu Laporan menampilkan untung, R/C, titik impas, dan harga jual minimum, plus simulasi bila harga berubah.'] },

        'Tema, efek kaca, dan ukuran tampilan juga diatur di Setelan. Panduan ini bisa dibuka lagi dari Setelan, bagian Tentang.'] }

  function gambar() {

      s.t.map(function (p) { return '<p class="pd-isi">' + p + '</p>'; }).join('') +

      '<div class="pd-aksi"><div class="pd-kiri">' + kiri + '</div><button type="button" class="btn gold pd-maju" data-pd="' + (akhir ? 'selesai' : 'maju') + '">' + (akhir ? 'Mulai' : 'Lanjut') + '</button></div>';
    var p = el.querySelector('.pd-maju'); if (p) p.focus();
  }
  function buka() { // memakai mesin Modal (v0.1.076): Back, Esc, fokus, dan kunci gulir sama dengan modal lain
    if (el || Modal.m) return;
    i = 0;
    el = Modal.buka({ judulId: 'pdJudul', kartu: 'pd-kartu', tutupLatar: false, html: '', onTutup: function () { el = null; Penyimpanan.set(KUNCI, '1'); } });
    if (el) gambar();
  }
  function tutup() { Modal.tutup(); }
  function otomatis() { if (Penyimpanan.get(KUNCI) === null) setTimeout(buka, 500); }
  function html() {
    return '<div class="settings-row"><div class="settings-desc"><strong>Panduan cepat</strong><span>Pengenalan singkat 4 layar: mencatat, siklus, laporan, dan cadangan.</span></div>' +
      '<button type="button" class="btn" data-pd="buka">Tampilkan</button></div>';
  }
  function init() {
    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-pd]'); if (!b) return;
      var a = b.dataset.pd;
      if (a === 'buka') buka();

})();

<script>
/* Buku Kebun — pembayaran Tunai / Belum dibayar / Sebagian, tombol Bayar + cicilan, dan perhitungan kas (v0.1.049, docs/UTANG.md)
   Transaksi selalu menyimpan nilai penuh (untung, HPP, laporan memakai nilai ini).
   Bagian yang belum dibayar menjadi catatan utang/piutang tertaut (utang.transaksiId); pembayarannya di utang.bayar.
   Kas = bagian tunai transaksi + pembayaran utang/piutang, bukan jumlah semua transaksi. */
const Utang = {
  MODE: [['tunai', 'Tunai (lunas)'], ['belum', 'Belum dibayar'], ['sebagian', 'Sebagian dibayar']],
  d0() { return { bayar: 'tunai', muka: 0, pihak: '', tempo: '', kunci: false }; },
  semua(t) { return App.data.utang.filter((u) => u.transaksiId === t.id); },
  tertaut(t) { return App.data.utang.find((u) => u.transaksiId === t.id && !u.terhapus) || null; },
  dibayar(u) { return (u.bayar || []).reduce((a, p) => a + p.jumlah, 0); },
  sisa(u) { return u.transaksiId ? Math.max(0, u.jumlah - this.dibayar(u)) : (u.lunas ? 0 : u.jumlah); },
  ada(u) { return !!(u.bayar && u.bayar.length); },
  /* isi draft form dari utang tertaut (mode, uang muka, pihak, tempo, terkunci bila sudah ada pembayaran) */
  dari(t) {
    const u = this.tertaut(t); if (!u) return this.d0();
    const muka = Math.max(0, t.jumlah - u.jumlah);
    return { bayar: muka > 0 ? 'sebagian' : 'belum', muka, pihak: u.pihak || '', tempo: u.jatuhTempo || '', kunci: this.ada(u) };
  },
  /* periksa isian pembayaran; kembalikan pesan galat atau '' */
  cek(jumlah, s, u) {
    if (s.kunci) return u && jumlah < u.jumlah ? 'Jumlah tidak boleh lebih kecil dari utang yang tercatat (' + rp(u.jumlah) + ')' : '';
    if (s.bayar === 'tunai') return '';
    if (!String(s.pihak || '').trim()) return 'Isi nama pihak (pemasok atau pembeli)';
    if (s.bayar === 'sebagian' && !(s.muka > 0 && s.muka < jumlah)) return 'Uang muka harus lebih dari 0 dan kurang dari jumlah';
    return '';
  },
  /* samakan catatan utang dengan transaksi t setelah disimpan */
  sinkron(t, s) {
    const D = App.data, u = this.tertaut(t), jenis = t.jenis === 'keluar' ? 'utang' : 'piutang';
    if (s.kunci && u) { u.jenis = jenis; u.diubah = nowIso(); return; }
    const sisa = s.bayar === 'tunai' ? 0 : s.bayar === 'belum' ? t.jumlah : t.jumlah - s.muka;
    if (sisa > 0) {
      const f = { jenis, pihak: String(s.pihak).trim(), jumlah: sisa, jatuhTempo: s.tempo || '', lunas: false, diubah: nowIso() };
      const lama = u || this.semua(t).find((x) => x.terhapus && !this.ada(x)); // pulihkan catatan lama agar tidak kembar
      if (lama) Object.assign(lama, f, { terhapus: false });
      else D.utang.push(Object.assign({ id: uid('u'), transaksiId: t.id, bayar: [], dibuat: nowIso(), terhapus: false }, f));
    } else if (u) { u.terhapus = true; u.diubah = nowIso(); }
  },
  /* hapus/pulihkan utang tertaut bersama transaksinya */
  ikut(t, hapus) { this.semua(t).forEach((u) => { u.terhapus = hapus; u.diubah = nowIso(); }); },
  /* utang tertaut yang sudah ada pembayarannya menahan penghapusan transaksi */
  tahan(t) {
    const u = this.tertaut(t);
    if (u && this.ada(u)) { App.toast('Sudah ada pembayaran — buka lagi dulu di Rencana → Utang/piutang'); return true; }
    return false;
  },
  /* ---------- pembayaran / cicilan (tahap 2, v0.1.049) ----------
     Pembayaran = { id, tanggal, jumlah } di utang.bayar. Hanya menggerakkan kas, bukan transaksi Modal/Hasil baru.
     Lunas otomatis saat sisa nol; hapus pembayaran membuka lagi. */
  tx(u) { return App.data.transaksi.find((x) => x.id === u.transaksiId) || null; },
  segar(u) { u.lunas = this.sisa(u) <= 0; u.diubah = nowIso(); },
  /* tanggal bayar paling akhir yang boleh (hari ini, atau tanggal transaksi bila di masa depan) */
  tglMaks(u) { const t = this.tx(u), h = isoHari(); return t && t.tanggal > h ? t.tanggal : h; },
  /* periksa isian pembayaran; kembalikan pesan galat atau '' */
  cekBayar(u, jumlah, tgl) {
    const t = this.tx(u), sisa = this.sisa(u);
    if (!(jumlah > 0)) return 'Isi jumlah pembayaran lebih dari 0';
    if (jumlah > sisa) return 'Jumlah melebihi sisa (' + rp(sisa) + ')';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl || '')) return 'Isi tanggal bayar';
    if (t && tgl < t.tanggal) return 'Tanggal bayar sebelum tanggal transaksi (' + Setelan.tgl(t.tanggal) + ')';
    if (tgl > this.tglMaks(u)) return 'Tanggal bayar tidak boleh di masa depan';
    return '';
  },
  catatBayar(u, jumlah, tgl) {
    (u.bayar = u.bayar || []).push({ id: uid('b'), tanggal: tgl, jumlah: jumlah });
    u.bayar.sort((a, b) => String(a.tanggal).localeCompare(b.tanggal));
    this.segar(u);
  },
  /* hapus satu pembayaran; kembalikan catatannya agar bisa dipulihkan lewat Urungkan */
  hapusBayar(u, bid) {
    const i = (u.bayar || []).findIndex((p) => p.id === bid); if (i < 0) return null;
    const rec = u.bayar.splice(i, 1)[0]; this.segar(u); return rec;
  },
  pulihBayar(u, rec) {
    (u.bayar = u.bayar || []).push(rec); u.bayar.sort((a, b) => String(a.tanggal).localeCompare(b.tanggal)); this.segar(u);
  },

  /* ---------- jendela Bayar ---------- */
  dlg: null,
  dlgBuka(u) {
    const t = this.tx(u); if (Modal.m || !t || this.sisa(u) <= 0) return;
    const sisa = this.sisa(u), byr = this.dibayar(u), keluar = u.jenis === 'utang';
    const row = (a, b) => '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>';
    this.dlg = { id: u.id };
    Modal.buka({
      judulId: 'ubJudul', fokus: 'ub_jumlah', tutupLatar: false,
      html: '<div class="dm-kepala"><div><div class="dm-jenis">' + (keluar ? 'Bayar utang' : 'Terima pembayaran piutang') + '</div><h2 class="dm-judul" id="ubJudul">' + esc(u.pihak) + '</h2></div>' +
        '<button type="button" class="dm-x" data-ub="tutup" aria-label="Tutup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
        '<div class="dm-isi">' + row('Jumlah ' + u.jenis, rp(u.jumlah)) + (byr ? row('Sudah dibayar', rp(byr)) : '') + row('Sisa', '<strong>' + rp(sisa) + '</strong>') +
        '<label for="ub_jumlah">' + (keluar ? 'Dibayar sekarang (Rp)' : 'Diterima sekarang (Rp)') + '</label><input id="ub_jumlah" data-rp inputmode="numeric" autocomplete="off" placeholder="0" value="' + fmtInput(sisa) + '">' +
        '<div class="seg sm" style="justify-content:flex-start;margin-top:8px"><button type="button" class="btn" data-ub="semua">Semua sisa</button></div>' +
        '<label for="ub_tgl">Tanggal ' + (keluar ? 'bayar' : 'terima') + '</label><input type="date" id="ub_tgl" min="' + esc(t.tanggal) + '" max="' + esc(this.tglMaks(u)) + '" value="' + esc(this.tglMaks(u)) + '">' +
        '<p class="note" style="margin-top:8px">Bisa dicicil: isi sebagian saja, sisanya tetap tercatat. Pembayaran hanya menggerakkan kas, tidak mengubah untung atau HPP.</p></div>' +
        '<div class="dm-aksi"><button type="button" class="btn gold" data-ub="simpan">Simpan pembayaran</button><button type="button" class="btn" data-ub="tutup" style="width:100%">Batal</button></div>',
      klik: (e) => {
        const b = e.target.closest('[data-ub]'); if (!b) return; const a = b.dataset.ub;
        if (a === 'tutup') Modal.tutup();
        else if (a === 'semua') { const i = document.getElementById('ub_jumlah'); i.value = fmtInput(this.sisa(u)); i.focus(); }
        else if (a === 'simpan') this.dlgSimpan(u);
      },
      simpan: () => this.dlgSimpan(u),
      onTutup: () => { this.dlg = null; }
    });
  },
  dlgTutup(tanpaFokus) { Modal.tutup(tanpaFokus); },
  dlgSimpan(u) {
    const g = (i) => document.getElementById(i).value, j = angka(g('ub_jumlah')), tgl = g('ub_tgl'), gal = this.cekBayar(u, j, tgl);
    if (gal) { Modal.galat(gal); return; }
    this.catatBayar(u, j, tgl);
    const sisa = this.sisa(u);
    Modal.tutup(true); App.simpan(); App.go('rencana', true); Modal.pulihFokus();
    App.toast(sisa <= 0 ? 'Pembayaran tersimpan — lunas' : 'Pembayaran tersimpan — sisa ' + rp(sisa));
  },

  /* ---------- kas: uang yang benar-benar bergerak ---------- */
  peristiwa() {
    const out = [];
    App.semuaTx().forEach((t) => { // termasuk Prive: uang tetap keluar dari kas
      const u = this.tertaut(t), tunai = t.jumlah - (u ? Math.min(u.jumlah, t.jumlah) : 0);
      out.push({ tgl: t.tanggal, n: (t.jenis === 'masuk' ? 1 : -1) * tunai });
      if (u) (u.bayar || []).forEach((p) => out.push({ tgl: p.tanggal, n: (u.jenis === 'piutang' ? 1 : -1) * p.jumlah }));
    });
    return out;
  },
  saldoAwal() { return Number(App.data.pengaturan.saldoAwal) || 0; },
  saldo() { return this.saldoAwal() + this.peristiwa().reduce((a, e) => a + e.n, 0); },
  saldoSd(k) { return this.saldoAwal() + this.peristiwa().filter((e) => e.tgl.slice(0, 7) <= k).reduce((a, e) => a + e.n, 0); },
  net(k) { return this.peristiwa().filter((e) => e.tgl.slice(0, 7) === k).reduce((a, e) => a + e.n, 0); },
  /* v0.1.155: uang yang benar-benar masuk dan keluar pada bulan k ('YYYY-MM') */
  bulan(k) { const E = this.peristiwa().filter((e) => e.tgl.slice(0, 7) === k); return { masuk: E.filter((e) => e.n > 0).reduce((a, e) => a + e.n, 0), keluar: -E.filter((e) => e.n < 0).reduce((a, e) => a + e.n, 0) }; },

  /* ---------- tampilan: kotak pembayaran di form ---------- */
  /* pre: awalan id ('f' atau 'p'); pihakId: id isian pihak yang sudah ada di form (panen: p_pembeli) atau '' bila perlu isian pihak sendiri */
  kotak(s, pre, lbPihak, pihakId) {
    if (s.kunci) return '<p class="note" style="margin-top:12px">Utang/piutang transaksi ini sudah ada pembayarannya. Ubah lewat Rencana → Utang/piutang (Buka lagi) bila perlu.</p>';
    const o = this.MODE.map((m) => '<option value="' + m[0] + '"' + (s.bayar === m[0] ? ' selected' : '') + '>' + m[1] + '</option>').join('');
    let h = '<label for="' + pre + '_bayar">Pembayaran</label><select id="' + pre + '_bayar">' + o + '</select>';
    if (s.bayar === 'tunai') return h;
    if (s.bayar === 'sebagian') h += '<label for="' + pre + '_muka">Dibayar di muka (Rp)</label><input id="' + pre + '_muka" data-rp inputmode="numeric" autocomplete="off" placeholder="0" value="' + fmtInput(s.muka) + '">';
    if (!pihakId) h += '<label for="' + pre + '_pihak">' + lbPihak + '</label><input id="' + pre + '_pihak" maxlength="60" value="' + esc(s.pihak) + '">';
    h += '<label for="' + pre + '_tempo">Jatuh tempo (opsional)</label><input type="date" id="' + pre + '_tempo" value="' + esc(s.tempo) + '">';
    return h + '<p class="note" style="margin-top:8px">Nilai penuh tetap dihitung di untung dan HPP. Kas hanya berubah sebesar yang dibayar. Sisanya masuk Rencana → Utang/piutang.</p>';
  },
  /* baca isian kotak dari form ke objek s (nilai lama dipertahankan bila elemen tidak ada) */
  baca(s, pre) {
    const g = (i) => document.getElementById(pre + '_' + i);
    if (g('bayar')) s.bayar = g('bayar').value;
    if (g('muka')) s.muka = angka(g('muka').value); else if (s.bayar !== 'sebagian') s.muka = 0;
    if (g('pihak')) s.pihak = g('pihak').value;
    if (g('tempo')) s.tempo = g('tempo').value;
    return s;
  }
};

</script>
<script>
/* Buku Kebun — rute web: tiap halaman punya alamat #nama yang bisa dibuka langsung, dimuat ulang, dan dibagikan (v0.1.077, docs/RUTE.md)
   Hanya "#nama" dengan huruf, angka, dan tanda hubung (tanpa "#/jalur"), supaya cocok dengan penampil artefak dan hosting statis.
   Halaman tetap dikelola App.go; modul ini hanya menerjemahkan keadaan aplikasi ke hash dan sebaliknya. */
const Rute = {
  nid(id) { return String(id).replace(/_/g, '-'); },
  aman(id) { return /^[A-Za-z0-9_-]+$/.test(String(id)); },
  cari(arr, n) { return arr.find((x) => !x.terhapus && this.aman(x.id) && this.nid(x.id) === n) || null; },

  /* keadaan aplikasi saat ini → nama rute (tanpa tanda #) */
  hash() {
    const t = App.tab;
    if (t === 'laporan') return 'laporan';
    if (t === 'rencana') return 'rencana-' + Rencana.sub;
    if (t === 'master') return Siklus.msub === 'kom' ? 'komoditas' : 'unit';
    if (t === 'siklus') return Siklus.sub && Siklus.sub !== 'berjalan' ? 'siklus-' + Siklus.sub : 'siklus';
    if (t === 'siklus-detail' || t === 'siklus-form' || t === 'panen') {
      const id = t === 'siklus-form' && Siklus.sf && !Siklus.sf.id ? '' : Siklus.sid;
      if (t === 'siklus-form' && !id) return 'siklus-baru';
      if (!id || !this.aman(id)) return 'siklus';
      return (t === 'panen' && Siklus.pd && !Siklus.pd.id ? 'panen-' : 'siklus-') + this.nid(id);
    }
    if (t === 'jurnal') { const id = Siklus.sid; return id && this.aman(id) ? 'jurnal-' + this.nid(id) : 'siklus'; }
    if (t === 'catat') {
      const d = App.draft; if (!d) return 'transaksi';
      return d.id && this.aman(d.id) ? 'transaksi-' + this.nid(d.id) : 'catat-' + (d.jenis === 'masuk' ? 'hasil' : 'modal');
    }
    return t || 'beranda';
  },

  /* nama rute → membuka halaman; true bila dikenali */
  buka(h) {
    h = String(h || '').replace(/^#/, '');
    if (!h) return false;
    const D = App.data, tetap = ['beranda', 'transaksi', 'lainnya', 'setelan', 'laporan', 'profil'];
    if (tetap.includes(h)) { App.go(h); return true; }
    let m;
    if ((m = /^laporan-(grafik|rincian)$/.exec(h))) { App.go('laporan'); return true; } // alamat lama (sub-tab) → satu halaman
    if ((m = /^rencana-(\w+)$/.exec(h)) && Rencana.SUB.some((x) => x[0] === m[1])) { Rencana.sub = m[1]; App.go('rencana'); return true; }
    if (h === 'unit' || h === 'komoditas') { Siklus.msub = h === 'unit' ? 'unit' : 'kom'; App.go('master'); return true; }
    if (h === 'siklus') { Siklus.sub = 'berjalan'; App.go('siklus'); return true; }
    if (h === 'siklus-selesai' || h === 'siklus-agenda' || h === 'siklus-jurnal') { Siklus.sub = h.slice(7); App.go('siklus'); return true; }
    if (h === 'siklus-baru') { Siklus.sf = Siklus.sfBaru(); App.go('siklus-form'); return true; }
    if (h === 'catat-modal' || h === 'catat-hasil') { App.draft = { jenis: h === 'catat-hasil' ? 'masuk' : 'keluar' }; App.baru(); return true; }
    if ((m = /^jurnal-(.+)$/.exec(h))) { const s = this.cari(D.siklus, m[1]); if (s) { Siklus.sid = s.id; App.go('jurnal'); return true; } }
    if ((m = /^siklus-(.+)$/.exec(h))) { const s = this.cari(D.siklus, m[1]); if (s) { Siklus.sid = s.id; App.go('siklus-detail'); return true; } }
    if ((m = /^panen-(.+)$/.exec(h))) {
      const s = this.cari(D.siklus, m[1]);
      if (s) { Siklus.sid = s.id; if (s.status === 'berjalan') Siklus.aksi('catat-panen', { dataset: {} }); else App.go('siklus-detail'); return true; }
    }
    if ((m = /^transaksi-(.+)$/.exec(h))) { const t = this.cari(D.transaksi, m[1]); if (t) { App.ubahTx(t.id); return true; } }
    return false;
  },

  /* dipanggil App.go setelah halaman tergambar: samakan alamat di bilah alamat tanpa menambah riwayat */
  sinkron() {
    const h = '#' + this.hash();
    if (location.hash === h) return;
    try { history.replaceState(history.state, '', h); } catch (e) { /* alamat tidak bisa diubah (mis. dibuka dalam bingkai) */ }
  },

  /* halaman pertama: ikuti alamat bila dikenali, kalau tidak Beranda */
  awal() {
    let ok = false;
    try { ok = this.buka(location.hash); } catch (e) { ok = false; }
    if (!ok) App.go('beranda');
  },

  /* alamat diubah dari luar (tempel tautan, ubah manual) tanpa lewat riwayat aplikasi */
  pasang() {
    window.addEventListener('hashchange', () => {
      if (Modal.m || location.hash === '#' + this.hash()) return;
      if (!this.buka(location.hash)) this.sinkron();
    });
  }
};

</script>
<script>
/* Buku Kebun — jadwal kegiatan per siklus: pupuk, semprot, dsb., sekali atau berulang (v0.1.051, docs/JADWAL.md)
   Disimpan di siklus.jadwal = [{ id, nama, tanggal, ulang, selesai, terakhir }]; ulang = tiap N hari (0 = sekali). */
const Jadwal = {
  tambahHari(iso, n) { const [y, m, d] = iso.split('-').map(Number); return isoHari(new Date(y, m - 1, d + n)); },
  selisih(iso) { const [y, m, d] = iso.split('-').map(Number), n = new Date(); return Math.round((new Date(y, m - 1, d) - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5); },
  daftar(s) { return (s.jadwal || []).slice().sort((a, b) => (!!a.selesai - !!b.selesai) || String(a.tanggal).localeCompare(b.tanggal)); },
  /* teks status: lewat / hari ini / sekian hari lagi */
  teksN(n) { return n < 0 ? 'lewat ' + (-n) + ' hari' : n === 0 ? 'hari ini' : n + ' hari lagi'; },
  teks(j) { return this.teksN(this.selisih(j.tanggal)); },
  /* Agenda lintas siklus (v0.1.068): kegiatan belum selesai + perkiraan panen dari siklus berjalan, urut dari yang terdekat */
  itemAgenda(daftar) {
    const out = [];
    daftar.filter((s) => s.status === 'berjalan').forEach((s) => {
      (s.jadwal || []).filter((j) => !j.selesai).forEach((j) => out.push({ tipe: 'kegiatan', s: s, j: j, tgl: j.tanggal, n: this.selisih(j.tanggal) }));
      const pp = Siklus.panenPerkiraan(s); if (pp) out.push({ tipe: 'panen', s: s, tgl: pp.tgl, n: pp.sisa });
    });
    return out.sort((a, b) => a.n - b.n || (a.tipe === b.tipe ? 0 : a.tipe === 'kegiatan' ? -1 : 1) || Siklus.nama(a.s.id).localeCompare(Siklus.nama(b.s.id)));
  },
  GRUP: [['Terlambat', (n) => n < 0], ['Hari ini', (n) => n === 0], ['7 hari ke depan', (n) => n >= 1 && n <= 7], ['8–30 hari ke depan', (n) => n >= 8 && n <= 30], ['Lebih dari 30 hari', (n) => n > 30]],
  agenda(daftar) {
    const L = this.itemAgenda(daftar);
    if (!L.length) return '<p class="note" style="margin-top:14px">Belum ada kegiatan terjadwal atau perkiraan panen. Buka siklus berjalan, lalu ketuk tombol + dan pilih Tambah jadwal kegiatan. Perkiraan panen muncul bila komoditas punya umur panen.</p>';
    return '<p class="note" style="margin-top:12px">Kegiatan dan perkiraan panen dari semua siklus berjalan. Ketuk baris untuk membuka siklusnya; ✓ menandai kegiatan sudah dikerjakan.</p>' +
      this.GRUP.map((g) => {
        const isi = L.filter((x) => g[1](x.n)); if (!isi.length) return '';
        return '<h2 class="ag-grup' + (g[0] === 'Terlambat' ? ' down' : '') + '">' + g[0] + ' (' + isi.length + ')</h2>' + isi.map((x) => {
          const status = '<span class="' + (x.n < 0 ? 'down' : '') + '">' + this.teksN(x.n) + '</span>';
          const judul = x.tipe === 'panen' ? 'Perkiraan panen' : esc(x.j.nama);
          const ket = esc(Siklus.nama(x.s.id)) + (Tahap.ringkas(x.s) ? ' · ' + esc(Tahap.ringkas(x.s)) : '') + ' · ' + Setelan.tgl(x.tgl) + ' · ' + status + (x.tipe === 'kegiatan' && x.j.ulang > 0 ? ' · tiap ' + x.j.ulang + ' hari' : '');
          return '<div class="ag-row"><button type="button" class="ag-main" data-do="buka-siklus" data-id="' + x.s.id + '" aria-label="' + (x.tipe === 'panen' ? 'Perkiraan panen ' : 'Kegiatan ' + esc(x.j.nama) + ', ') + esc(Siklus.nama(x.s.id)) + ', ' + this.teksN(x.n) + '. Buka siklus"><strong>' + (x.tipe === 'panen' ? '🌾 ' : '') + judul + '</strong><span class="note">' + ket + '</span></button>' +
            (x.tipe === 'kegiatan' ? '<button type="button" class="btn ag-ok" data-do="agenda-selesai" data-sid="' + x.s.id + '" data-id="' + x.j.id + '" aria-label="Tandai sudah dikerjakan: ' + esc(x.j.nama) + ', ' + esc(Siklus.nama(x.s.id)) + '">✓</button>' : '') + '</div>';
        }).join('');
      }).join('');
  },
  /* kegiatan yang perlu diingatkan di Beranda: siklus berjalan, belum selesai, jatuh tempo dalam 3 hari atau sudah lewat */
  mendekat() {
    const out = [];
    Siklus.daftar().filter((s) => s.status === 'berjalan').forEach((s) => (s.jadwal || []).filter((j) => !j.selesai && this.selisih(j.tanggal) <= 3).forEach((j) => out.push({ s: s, j: j, n: this.selisih(j.tanggal) })));
    return out.sort((a, b) => a.n - b.n);
  },
  v(s) {
    const jalan = s.status === 'berjalan', L = this.daftar(s);
    if (!jalan && !L.length) return '';
    const baris = (j) => { const n = this.selisih(j.tanggal), telat = !j.selesai && n < 0;

      App.toast(j.evaluasi ? 'Evaluasi dihapus' : 'Catatan dihapus', { label: 'Urungkan', fn: () => { batalFoto(); j.terhapus = false; j.diubah = nowIso(); s.diubah = nowIso(); App.simpan(); if (App.tab === hal) App.go(hal, true); } });
    } }
});

<script>
/* Buku Kebun — Catatan cepat Jurnal: chip satu ketukan yang langsung membuat catatan kegiatan hari ini (v0.1.100, docs/JURNAL.md bagian 6)
   Entri = jurnal jenis 'kegiatan' dengan cepat:true (judul = nama kegiatan, tanggal = hari ini). Tidak memengaruhi uang atau laporan.
   Chip mengikuti jenis komoditas siklus. Toast memberi Urungkan dan Tambah detail (membuka formulir Ubah catatan untuk isi atau foto). */
const Cepat = {
  TABEL: {
    Umum: ['Siram', 'Pupuk', 'Semprot', 'Penyiangan', 'Pindah tanam'],
    'Sayur daun': ['Siram', 'Pupuk', 'Semprot', 'Penyiangan', 'Pindah tanam'],
    Cabai: ['Siram', 'Pupuk', 'Semprot', 'Penyiangan', 'Pindah tanam'],
    Tomat: ['Siram', 'Pupuk', 'Semprot', 'Pasang ajir', 'Pangkas tunas'],
    Lele: ['Beri pakan', 'Ganti air', 'Cek kualitas air', 'Sortir', 'Probiotik'],
    'Ayam petelur': ['Beri pakan', 'Ganti air minum', 'Bersihkan kandang', 'Vaksin', 'Vitamin']
  },
  _t: { k: '', n: 0 },
  daftar(s) { const k = Siklus.kom(s.komoditasId), tp = k && Siklus.templateUntuk(k.nama); return (tp && this.TABEL[tp.label]) || this.TABEL.Umum; },
  /* hanya siklus berjalan yang sudah mulai (tanggal catatan tidak boleh sebelum mulai atau di masa depan) */
  boleh(s) { return !!s && s.status === 'berjalan' && s.mulai <= isoHari(); },
  chips(s) {
    if (!this.boleh(s)) return '';
    return '<div class="jr-cepat no-print"><div class="note" style="margin:6px 0 2px">Catat cepat hari ini, satu ketukan</div>' +
      '<div class="seg sm rc-chips" role="group" aria-label="Catat cepat kegiatan" style="justify-content:flex-start;margin:0 0 6px">' +
      this.daftar(s).map((n) => '<button type="button" class="btn" data-do="jurnal-cepat" data-sid="' + s.id + '" data-k="' + esc(n) + '">' + esc(n) + '</button>').join('') +
      '<button type="button" class="btn" data-do="jurnal-baru" data-sid="' + s.id + '">+ Catatan lain</button></div></div>';
  },
  aksi(a, el) {
    if (a !== 'jurnal-cepat' && a !== 'jurnal-baru') return false;
    const s = Siklus.cari(el.dataset.sid); if (!s) return true;
    Siklus.sid = s.id;
    if (a === 'jurnal-baru') { Rencana.dlgBuka('jurnal'); return true; }
    this.buat(s, el.dataset.k); return true;
  },
  buat(s, nama) {
    if (!this.boleh(s) || !nama) return;
    const kini = Date.now(); if (this._t.k === s.id + '|' + nama && kini - this._t.n < 2500) return; // cegah ketukan ganda
    this._t = { k: s.id + '|' + nama, n: kini };
    const n = nowIso(), x = { id: uid('jr'), siklusId: s.id, tanggal: isoHari(), jenis: 'kegiatan', judul: nama, isi: '', cepat: true, dibuat: n, diubah: n, terhapus: false };
    Jurnal.semua().push(x); s.diubah = n; App.simpan(); App.go(App.tab, true);
    App.toast('Dicatat: ' + nama, [
      { label: 'Urungkan', fn: () => { x.terhapus = true; x.diubah = nowIso(); s.diubah = nowIso(); App.simpan(); App.go(App.tab, true); } },
      { label: 'Tambah detail', fn: () => { Siklus.sid = s.id; Rencana.dlgBuka('jurnal', x.id); } }
    ]);
  }
};

<script>
/* Buku Kebun — Linimasa siklus, Jurnal Tahap 2 (v0.1.089, docs/JURNAL.md §7)
   Satu halaman kronologis per siklus (tab `jurnal`, rute #jurnal-<id>): catatan jurnal + peristiwa turunan
   (mulai, selesai, transaksi, panen). Peristiwa turunan hanya dibaca dari data yang ada, tidak disalin; ketuk membuka aslinya. */
const Linimasa = {
  pilih: null, sid: null, f: 'semua', urut: 'baru', n: 100,
  FILTER: [['semua', 'Semua'], ['catatan', 'Catatan'], ['uang', 'Uang'], ['panen', 'Panen'], ['kegiatan', 'Kegiatan']],
  BATAS: 100,

  siap(s) { if (this.sid !== s.id) { this.sid = s.id; this.pilih = null; this.f = 'semua'; this.urut = 'baru'; this.n = this.BATAS; } },
  grup(k) { return k === 'mulai' || k === 'selesai' ? 'semua' : k; },

  /* semua peristiwa siklus; rank: mulai 0, entri 1, selesai 2 (urutan dalam hari yang sama) */
  peristiwa(s) {
    const E = [], sat = (Siklus.kom(s.komoditasId) || {}).satuan || '';
    E.push({ k: 'mulai', tgl: s.mulai, rank: 0, dibuat: '' });
    if (s.status === 'selesai' && s.selesai) E.push({ k: 'selesai', tgl: s.selesai, rank: 2, dibuat: '' });
    Jurnal.of(s.id).forEach((j) => E.push({ k: j.jenis === 'kegiatan' ? 'kegiatan' : 'catatan', tgl: j.tanggal, rank: 1, dibuat: String(j.dibuat || ''), j: j }));
    App.aktif().filter((t) => t.siklusId === s.id).forEach((t) => E.push({ k: 'uang', tgl: t.tanggal, rank: 1, dibuat: String(t.dibuat || ''), t: t }));
    Siklus.panenOf(s.id).forEach((p) => E.push({ k: 'panen', tgl: p.tanggal, rank: 1, dibuat: String(p.dibuat || ''), p: p, sat: sat }));
    const mul = this.urut === 'lama' ? 1 : -1;
    return E.sort((a, b) => mul * (a.tgl.localeCompare(b.tgl) || a.rank - b.rank || a.dibuat.localeCompare(b.dibuat) || this.kunci(a).localeCompare(this.kunci(b))));
  },
  lebar() { return window.matchMedia && window.matchMedia('(min-width:1024px)').matches; },
  /* panel detail di kiri (desktop): catatan jurnal terpilih menggantikan Ringkasan, tanpa modal */
  panel(s, j) {
    const h = Jurnal.hariKe(s, j.tanggal), boleh = Jurnal.boleh(s, j);
    return '<div class="dt-kiri"><section aria-label="Detail catatan"><div class="sc-head"><h2 style="margin:0;overflow-wrap:anywhere">' + esc(Jurnal.judul(j)) + '</h2><button type="button" class="dm-x" data-do="lm-tutup" aria-label="Tutup detail (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<p class="note" style="margin:8px 0 12px">' + Setelan.tgl(j.tanggal) + ' · hari ' + h + ' · minggu ' + Math.max(1, Math.ceil(h / 7)) + (j.evaluasi ? ' · evaluasi' : '') + '</p>' + Kejadian.detail(j) +
      (j.isi ? '<div style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.65">' + esc(j.isi) + '</div>' : (j.foto && j.foto.length ? '' : '<p class="note">Tidak ada isi.</p>')) +
      Foto.galeri(j, 'data-do="foto-lihat"', 'lm-galeri') +
      (boleh ? '<div class="seg" style="margin-top:14px"><button type="button" class="btn gold" data-do="lm-ubah" data-id="' + j.id + '" style="margin-top:0">Ubah</button><button type="button" class="btn danger" data-do="lm-hapus" data-id="' + j.id + '">Hapus</button></div>' : '') + '</section></div>';
  },
  fotoAda(s) { return typeof Foto !== 'undefined' && Foto.ada() && Jurnal.of(s.id).some((j) => (j.foto || []).length); },
  kunci(e) { return String((e.j || e.t || e.p || {}).id || ''); },
  tampil(E) { return this.f === 'semua' ? E : E.filter((e) => e.k === this.f); },
  minggu(s, tgl) { const h = Jurnal.hariKe(s, tgl); return h < 1 ? 0 : Math.ceil(h / 7); },
  rentang(s, m) { // tanggal awal–akhir minggu ke-m

    const f = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    return Setelan.tgl(f(a)) + ' – ' + Setelan.tgl(f(b));

  /* teks satu peristiwa: { ikon, judul, ket, nilai, kelas, ket2 } */
  isi(s, e) {
    if (e.k === 'mulai') return { ikon: '🌱', judul: 'Siklus dimulai', ket: '', turunan: true };
    if (e.k === 'selesai') return { ikon: '🏁', judul: 'Siklus selesai', ket: '', turunan: true };
    if (e.k === 'uang') {
      const t = e.t, m = t.jenis === 'masuk';
      return { ikon: m ? '↑' : '↓', judul: App.namaKat(t.kategoriId), ket: t.catatan || '', nilai: (m ? '+' : '−') + rp(t.jumlah).replace('Rp ', 'Rp '), kelas: m ? 'up' : 'down', turunan: true, edit: t.id, label: m ? 'Hasil' : 'Modal' };
    }
    if (e.k === 'panen') {
      const p = e.p;
      return { ikon: '🧺', judul: 'Panen ' + fmtN(p.kuantitasKotor - p.susut) + ' ' + e.sat + ' bersih', ket: (p.susut ? 'susut ' + fmtN(p.susut) : '') + (p.pembeli ? (p.susut ? ' · ' : '') + p.pembeli : ''), turunan: true, panen: p.id, label: 'Panen' };
    }
    const j = e.j;
    const ket = j.judul && j.isi ? String(j.isi).replace(/\s+/g, ' ').slice(0, 90) + (String(j.isi).length > 90 ? '…' : '') : '';
    return { ikon: j.jenis === 'kegiatan' ? '✓' : j.jenis === 'tahap' ? '❖' : j.jenis === 'kejadian' ? '⚠' : j.jenis === 'ukuran' ? '↕' : j.evaluasi ? '★' : '✎', judul: Jurnal.judul(j), ket: ket, jurnal: j.id, label: j.jenis === 'kegiatan' ? 'Kegiatan' : j.jenis === 'tahap' ? 'Tahap' : j.jenis === 'kejadian' ? 'Kejadian' : j.jenis === 'ukuran' ? 'Ukuran' : j.evaluasi ? 'Evaluasi' : 'Catatan' };
  },
  baris(s, e) {
    const x = this.isi(s, e), h = Jurnal.hariKe(s, e.tgl);
    const att = x.edit ? ' data-edit="' + x.edit + '"' : x.panen ? ' data-do="panen-detail" data-id="' + x.panen + '" aria-haspopup="dialog"' : x.jurnal ? ' data-do="jurnal-detail" data-id="' + x.jurnal + '" aria-haspopup="dialog"' : '';
    const tag = x.label ? '<span class="lm-tag">' + x.label + '</span>' : '';
    const meta = Setelan.tgl(e.tgl) + (h >= 1 ? ' · hari ' + h : ' · sebelum mulai');
    const inner = '<span class="lm-ik" aria-hidden="true">' + x.ikon + '</span><div class="tx-l"><div class="note">' + meta + (tag ? ' · ' : '') + tag + '</div><div class="tx-n">' + esc(x.judul) + '</div>' + (x.ket ? '<div class="note">' + esc(x.ket) + '</div>' : '') + '</div>' +
      (x.nilai ? '<div class="tx-a ' + x.kelas + '">' + x.nilai + '</div>' : '');
    const gal = x.jurnal ? Foto.galeri(e.j, 'data-do="foto-lihat"', 'lm-galeri no-print') : '';
    return (att ? '<div class="tx lm-baris' + (x.turunan ? ' lm-turun' : '') + (x.jurnal && x.jurnal === this.pilih ? ' lm-sel' : '') + '"' + (x.jurnal && x.jurnal === this.pilih ? ' aria-current="true"' : '') + att + ' role="button" tabindex="0">' + inner + '</div>'
      : '<div class="tx lm-baris lm-turun lm-diam">' + inner + '</div>') + gal;
  },
  daftar(s, L) {
    let h = '', last = null;
    L.slice(0, this.n).forEach((e) => {
      const m = this.minggu(s, e.tgl);
      if (m !== last) { last = m; h += '<h3 class="lm-minggu">' + (m === 0 ? 'Sebelum mulai' : 'Minggu ke-' + m + ' <span class="note">· ' + this.rentang(s, m) + '</span>') + '</h3>'; }
      h += this.baris(s, e);
    });
    return h;
  },

  v() {
    const s = Siklus.cari(Siklus.sid);
    if (!s) return Siklus.vList();
    this.siap(s);
    const E = this.peristiwa(s), L = this.tampil(E), jalan = s.status === 'berjalan';
    const hit = (k) => E.filter((e) => e.k === k).length;
    const chip = this.FILTER.map((c) => '<button type="button" class="btn' + (this.f === c[0] ? ' gold' : '') + '" data-do="lm-f" data-f="' + c[0] + '" aria-pressed="' + (this.f === c[0]) + '">' + c[1] + '</button>').join('');
    const r = Siklus.ringkas(s.id), u = r.hasil - r.modal;
    const jp = this.pilih && Jurnal.cari(this.pilih), ringkas = '<div class="dt-kiri"><section><div class="sc-head"><h2 style="margin:0">Ringkasan</h2><span class="badge' + (jalan ? ' live' : '') + '">' + (jalan ? 'berjalan' : 'selesai') + '</span></div>' +
      '<p class="note" style="margin:8px 0 0">Mulai ' + Setelan.tgl(s.mulai) + (jalan ? ' · hari ' + Siklus.hari(s) : ' · selesai ' + Setelan.tgl(s.selesai) + ' (' + Siklus.hari(s) + ' hari)') + '</p>' +
      '<div class="row"><span class="mu">Catatan</span><span>' + hit('catatan') + '</span></div><div class="row"><span class="mu">Kegiatan</span><span>' + hit('kegiatan') + '</span></div>' +
      '<div class="row"><span class="mu">Transaksi</span><span>' + hit('uang') + '</span></div><div class="row"><span class="mu">Panen</span><span>' + hit('panen') + '</span></div>' +
      '<div class="row"><span class="mu">' + (u < 0 ? 'Rugi' : 'Untung') + '</span><span class="' + (u < 0 ? 'down' : 'up') + '">' + rp(u) + '</span></div>' +
      '<button type="button" class="btn" data-go="siklus-detail" style="width:100%;margin-top:12px;min-height:44px">Kembali ke detail siklus</button></section></div>';
    const kiri = jp && jp.siklusId === s.id && this.lebar() ? this.panel(s, jp) : ringkas;
    const kanan = '<div class="dt-kanan"><section><div class="sc-head"><h2 style="margin:0">Linimasa</h2>' +
      '<div class="lap-aksi no-print" style="margin:0">' + (this.fotoAda(s) ? '<button type="button" class="ikon-btn" data-do="perjalanan-cetak" data-mode="linimasa" data-foto="1" aria-label="Cetak linimasa dengan foto atau simpan PDF">' + Analisa.IKON.cetak + '<span>Dengan foto</span></button>' : '') + '<button type="button" class="ikon-btn" data-an="cetak" aria-label="Cetak linimasa atau simpan PDF">' + Analisa.IKON.cetak + '<span>Cetak</span></button></div></div>' +
      Cepat.chips(s) + '<div class="seg sm lm-filter no-print" role="group" aria-label="Saring linimasa">' + chip + '<button type="button" class="btn lm-urut-btn" data-do="lm-urut" aria-label="Urutan: ' + (this.urut === 'baru' ? 'terbaru dulu' : 'terlama dulu') + '. Ketuk untuk membalik">' + (this.urut === 'baru' ? '↓ Terbaru' : '↑ Terlama') + '</button></div>' +
      (L.length ? this.daftar(s, L) + (L.length > this.n ? '<button type="button" class="btn" data-do="lm-lagi" style="width:100%;margin-top:12px;min-height:44px">Tampilkan lebih banyak (sisa ' + (L.length - this.n) + ')</button>' : '')
        : '<p class="note">Belum ada ' + (this.f === 'semua' ? 'peristiwa' : this.FILTER.find((c) => c[0] === this.f)[1].toLowerCase()) + '.</p>') +
      '<p class="note">Baris berikon redup berasal dari transaksi, panen, atau siklus; ketuk untuk membuka aslinya.' + (jalan ? ' Ketuk tombol + untuk mencatat jurnal<span class="hanya-lebar"> atau tekan J</span>.' : '') + '</p></section></div>';
    return kanan + kiri; // di HP linimasa dulu; di desktop kolom diatur CSS
  },

  /* isi tambahan di bawah judul pada cetakan; tanpa mengulang teks yang sudah menjadi judul */
  rinci(j, judul) {
    const isi = String(j.isi || '').trim(); if (!isi) return '';
    let t = isi;
    const L = isi.split('\n'), sisa = L.slice(1).join('\n').trim();
    if (j.jenis === 'kejadian') t = L[0].length <= 50 ? sisa : isi; // judul kejadian = jenis + baris pertama isi (maks. 50 huruf)
    else if (!j.judul && (j.jenis === 'catatan' || j.jenis === 'kegiatan')) t = sisa;
    return t ? '<br>' + esc(t).replace(/\n/g, '<br>') : '';
  },
  /* dokumen cetak polos linimasa: mengikuti saringan dan urutan di layar, dikelompokkan per minggu (v0.1.113) */
  cetakDoc(dgn) {
    const s = Siklus.cari(Siklus.sid), semua = this.peristiwa(s), E = this.tampil(semua), k = Siklus.kom(s.komoditasId) || {}, r = Siklus.ringkas(s.id), u = r.hasil - r.modal;
    const fl = this.FILTER.find((c) => c[0] === this.f)[1], urut = this.urut === 'baru' ? 'terbaru dulu' : 'terlama dulu';
    let baris = '', last = null;
    E.forEach((e) => {
      const x = this.isi(s, e), h = Jurnal.hariKe(s, e.tgl), m = this.minggu(s, e.tgl);
      if (m !== last) { last = m; baris += '<tr class="ct-grup"><td colspan="5">' + (m === 0 ? 'Sebelum mulai' : 'Minggu ke-' + m + ' · ' + this.rentang(s, m)) + '</td></tr>'; }
      baris += '<tr><td>' + Setelan.tgl(e.tgl) + '</td><td class="n">' + (h >= 1 ? h : '—') + '</td><td>' + (x.label || (e.k === 'mulai' ? 'Mulai' : 'Selesai')) + '</td><td>' + esc(x.judul) + (e.j ? this.rinci(e.j, x.judul) : x.ket ? '<br>' + esc(x.ket) : '') + '</td><td class="n">' + (x.nilai || '') + '</td></tr>';
      const f = e.j && dgn ? Perjalanan.foto(e.j, true) : ''; if (f) baris += '<tr><td colspan="5">' + f + '</td></tr>';
    });
    return '<div class="ct-kop"><h1>Jurnal Siklus</h1><p class="ct-sub">' + esc(Siklus.nama(s.id)) + '</p><table class="ct-meta"><tr><th>Komoditas</th><td>' + esc(k.nama || '—') + '</td><th>Dicetak</th><td>' + Setelan.tgl(isoHari()) + '</td></tr>' +
      '<tr><th>Mulai</th><td>' + Setelan.tgl(s.mulai) + (s.status === 'selesai' && s.selesai ? ' – ' + Setelan.tgl(s.selesai) : '') + '</td><th>Status</th><td>' + (s.status === 'berjalan' ? 'Berjalan, hari ke-' + Siklus.hari(s) : 'Selesai, ' + Siklus.hari(s) + ' hari') + '</td></tr>' +
      '<tr><th>Peristiwa</th><td>' + E.length + (E.length !== semua.length ? ' dari ' + semua.length : '') + '</td><th>' + (u < 0 ? 'Rugi' : 'Untung') + '</th><td>' + rp(u) + '</td></tr>' +
      '<tr><th>Saringan</th><td>' + fl + ' · ' + urut + '</td><th>Aplikasi</th><td>Buku Kebun v' + VERSI + '</td></tr></table></div>' +
      '<div class="ct-bag ct-lanjut"><table class="ct-tab"><thead><tr><th>Tanggal</th><th class="n">Hari</th><th>Jenis</th><th>Keterangan</th><th class="n">Nilai</th></tr></thead><tbody>' + (baris || '<tr><td colspan="5">Tidak ada peristiwa untuk saringan ini.</td></tr>') + '</tbody></table></div>';
  },

  pilihJ(id) { this.pilih = id; const y = window.scrollY; App.go('jurnal', true); window.scrollTo(0, y); const b = document.querySelector('[data-do="lm-tutup"]'); if (b) b.focus(); },
  tutupPanel() { const id = this.pilih; this.pilih = null; const y = window.scrollY; App.go('jurnal', true); window.scrollTo(0, y); const r = id && document.querySelector('.lm-baris[data-id="' + id + '"]'); if (r) r.focus(); },
  /* pintasan keyboard (desktop): J catat jurnal, Esc tutup panel detail */
  pasang() {
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey || Modal.m || !this.lebar()) return;
      const t = e.target, ketik = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
      if (e.key === 'Escape' && App.tab === 'jurnal' && this.pilih && !ketik) { this.tutupPanel(); return; }
      if ((e.key === 'j' || e.key === 'J') && !ketik && (App.tab === 'jurnal' || App.tab === 'siklus-detail')) {
        const s = Siklus.cari(Siklus.sid); if (s && s.status === 'berjalan') { e.preventDefault(); Rencana.dlgBuka('jurnal'); }
      }
    });
  },
  aksi(a, el) {
    const ulang = () => { const y = window.scrollY; App.go('jurnal', true); window.scrollTo(0, y); };
    if (a === 'lm-f') { this.f = el.dataset.f; this.n = this.BATAS; ulang(); const b = document.querySelector('.lm-filter [data-f="' + this.f + '"]'); if (b) b.focus(); return true; }
    if (a === 'lm-urut') { this.urut = this.urut === 'baru' ? 'lama' : 'baru'; this.n = this.BATAS; ulang(); const b = document.querySelector('[data-do="lm-urut"]'); if (b) b.focus(); return true; }
    if (a === 'lm-lagi') { this.n += this.BATAS; ulang(); return true; }
    if (a === 'jurnal-linimasa') { App.go('jurnal'); return true; }
    if (a === 'lm-tutup') { this.tutupPanel(); return true; }

      out.push([Siklus.nama(s.id), j.tanggal, Jurnal.hariKe(s, j.tanggal), this.label(j), this.rincian(j), Jurnal.judul(j), j.isi || '', j.jenis === 'ukuran' && j.ukuran ? j.ukuran.nilai : '', j.jenis === 'ukuran' && j.ukuran ? j.ukuran.satuan || '' : '', (j.foto || []).length])));

<script>

  aktif: false, urls: [], _cf: null,

  fotoJumlah(s) { return Jurnal.of(s.id).reduce((a, j) => a + (j.foto || []).length, 0); },

  },

  /* lebar = persentase tiap kolom (opsional): kolom tetap agar tabel seragam dan angka sejajar */
  LEBAR: {

  teks(j) { return esc(Jurnal.judul(j)) + (j.isi && j.judul ? '<br>' + esc(j.isi).replace(/\n/g, '<br>') : j.isi && !j.judul && String(j.isi).split('\n').length > 1 ? '<br>' + esc(String(j.isi).split('\n').slice(1).join('\n')).replace(/\n/g, '<br>') : ''); },

    const katBaris = Object.keys(kat).sort((a, b) => kat[b] - kat[a]).map((n) => '<tr><td>' + esc(n) + '</td><td class="n">' + rp(kat[n]) + '</td><td class="n">' + (r.modal ? Math.round(kat[n] / r.modal * 100) + '%' : '') + '</td></tr>');

    const uang = '<table class="ct-kpi"><tr>' + kpi(u < 0 ? 'Rugi' : 'Untung', rp(u), r.hasil || r.modal ? (u < 0 ? 'Modal melebihi hasil' : 'Hasil melebihi modal') : 'Belum ada transaksi') + kpi('Hasil', rp(r.hasil), 'Pemasukan') + kpi('Modal', rp(r.modal), 'Pengeluaran') +
      kpi('R/C ratio', rc === null ? '—' : fmtRC(rc), rc === null ? 'Belum ada modal' : (rc >= 1 ? 'Hasil menutup modal' : 'Hasil belum menutup modal')) + '</tr></table>' +
      '<p class="ct-cat">Panen bersih ' + fmtN(r.bersih) + ' ' + esc(sat) + (r.bersih > 0 && r.modal ? ' · Modal per ' + esc(sat) + ' ' + rp(Math.round(r.modal / r.bersih)) : '') + '</p>' +

    /* tahap */
    const T = J.filter((j) => j.jenis === 'tahap'), akhir = s.selesai || isoHari();
    const tahap = T.length ? this.tab([['Tahap'], ['Tanggal'], ['Hari ke', 1], ['Lama (hari)', 1]], T.map((j, i) => {
      const nx = T[i + 1], lama = Jurnal.hariKe(s, nx ? nx.tanggal : akhir) - Jurnal.hariKe(s, j.tanggal);

    })) + (s.status === 'selesai' ? '' : '<p class="ct-cat">* tahap masih berjalan sampai ' + Setelan.tgl(akhir) + '</p>') : '';
    /* catatan, evaluasi */
    const C = J.filter((j) => j.jenis === 'catatan' && !j.evaluasi), ev = J.find((j) => j.evaluasi);
    const baris = (j, extra) => '<tr><td>' + Setelan.tgl(j.tanggal) + '</td><td class="n">' + this.hari(s, j.tanggal) + '</td><td>' + this.teks(j) + this.foto(j, dgn) + (extra || '') + '</td></tr>';

    /* kejadian */

    /* ukuran: per nama, dari awal ke akhir */
    const Uk = J.filter((j) => j.jenis === 'ukuran' && j.ukuran);
    const per = {}; Uk.forEach((j) => { (per[j.ukuran.nama] = per[j.ukuran.nama] || []).push(j); });
    const ukuran = Object.keys(per).length ? this.tab([['Ukuran'], ['Pengukuran', 1], ['Pertama', 1], ['Terakhir', 1], ['Perubahan', 1]], Object.keys(per).map((n) => {
      const L = per[n], a = L[0], b = L[L.length - 1], sa = a.ukuran.satuan ? ' ' + esc(a.ukuran.satuan) : '', d = b.ukuran.nilai - a.ukuran.nilai;
      return '<tr><td>' + esc(n) + '</td><td class="n">' + L.length + '</td><td class="n">' + Kejadian.fmt(a.ukuran.nilai) + sa + '<br><span class="ct-cat">hari ' + this.hari(s, a.tanggal) + '</span></td><td class="n">' + Kejadian.fmt(b.ukuran.nilai) + sa + '<br><span class="ct-cat">hari ' + this.hari(s, b.tanggal) + '</span></td><td class="n">' + (L.length > 1 ? (d > 0 ? '+' : d < 0 ? '−' : '') + Kejadian.fmt(Math.abs(d)) + sa : '—') + '</td></tr>';
    })) : '';
    /* panen */
    const P = Siklus.panenOf(s.id).slice().reverse();
    const panen = P.length ? this.tab([['Tanggal'], ['Hari', 1], ['Kotor', 1], ['Susut', 1], ['Bersih', 1], ['Harga/' + esc(sat), 1], ['Pembeli']], P.map((p) =>
      '<tr><td>' + Setelan.tgl(p.tanggal) + '</td><td class="n">' + this.hari(s, p.tanggal) + '</td><td class="n">' + fmtN(p.kuantitasKotor) + '</td><td class="n">' + fmtN(p.susut) + '</td><td class="n">' + fmtN(p.kuantitasKotor - p.susut) + '</td><td class="n">' + (p.hargaPerSatuan ? rp(p.hargaPerSatuan) : '—') + '</td><td>' + esc(p.pembeli || '') + '</td></tr>')) : '';
    /* kegiatan */
    const G = J.filter((j) => j.jenis === 'kegiatan');
    const keg = G.length ? '<p class="ct-cat" style="font-size:9pt">' + G.length + ' kali: ' + G.map((j) => esc(Jurnal.judul(j)) + ' (' + Setelan.tgl(j.tanggal) + ')').join('; ') + '</p>' : '';
    const kop = '<div class="ct-kop"><h1>Laporan Perjalanan Siklus</h1><p class="ct-sub">' + esc(Siklus.nama(s.id)) + '</p><table class="ct-meta"><tr><th>Status</th><td>' + (s.status === 'berjalan' ? 'Berjalan, hari ke-' + hari : 'Selesai, ' + hari + ' hari') + '</td><th>Dicetak</th><td>' + Setelan.tgl(isoHari()) + '</td></tr>' +
      '<tr><th>Mulai</th><td>' + Setelan.tgl(s.mulai) + (s.status === 'selesai' && s.selesai ? ' – ' + Setelan.tgl(s.selesai) : '') + '</td><th>Aplikasi</th><td>Buku Kebun v' + VERSI + '</td></tr></table></div>';
    return kop + this.bag('Ringkasan uang', uang) + this.bag('Tahap pertumbuhan', tahap) + this.bag('Catatan', catatan) + this.bag('Kejadian', kejadian) + this.bag('Ukuran', ukuran) + this.bag('Panen', panen) + this.bag('Kegiatan dikerjakan', keg) +
      this.bag('Evaluasi', evaluasi) + (s.catatan ? this.bag('Catatan siklus', '<div style="white-space:pre-wrap">' + esc(s.catatan) + '</div>') : '');
  },

  /* muat foto jadi gambar sementara, lalu cetak setelah semua gambar siap */
  async cetak(dgn, mode) {
    const s = Siklus.cari(Siklus.sid); if (!s) return;
    this.lepas();
    const d = document.createElement('div'); d.id = 'cetak-lap'; d.className = 'ct-semua'; d.innerHTML = mode === 'linimasa' ? Linimasa.cetakDoc(dgn) : this.dok(s, dgn);
    document.body.appendChild(d); document.documentElement.classList.add('cetak-lap'); this.aktif = true;

    await Promise.all(L.map((im) => Nota.ambil(im.dataset.foto).then((r) => new Promise((ok) => {
      if (!r) { im.remove(); return ok(); }
      const u = URL.createObjectURL(r.blob); this.urls.push(u); im.onload = im.onerror = () => ok(); im.src = u;
    })).catch(() => im.remove())));

  },
  lepas() {
    this.urls.forEach((u) => URL.revokeObjectURL(u)); this.urls = []; this.aktif = false;
    const d = document.getElementById('cetak-lap'); if (d) d.remove(); document.documentElement.classList.remove('cetak-lap');
  },
  aksi(a, el) {
    if (a !== 'perjalanan-cetak') return false;

    this.cetak(!!el.dataset.foto, el.dataset.mode); return true;
  }

<script>
/* Buku Kebun — Pengalaman lintas siklus (Fase 6E Tahap 6, v0.1.103, docs/JURNAL.md bagian 7)
   Dari siklus SELESAI satu komoditas: panen pertama rata-rata hari ke-N dan lama rata-rata tiap tahap,
   dibandingkan dengan umur panen komoditas. Hanya saran; umur panen diubah bila pengguna mengetuk tombolnya. */
const Pengalaman = {
  /* panen pertama (hari ke-N) dan lama tiap tahap untuk satu siklus selesai */
  satu(s) {
    const P = Siklus.panenOf(s.id).slice().sort((a, b) => a.tanggal.localeCompare(b.tanggal));
    if (!P.length) return null;
    const hp = Jurnal.hariKe(s, P[0].tanggal), T = Jurnal.of(s.id).filter((j) => j.jenis === 'tahap').slice().sort((a, b) => a.tanggal.localeCompare(b.tanggal) || String(a.dibuat).localeCompare(String(b.dibuat)));
    const akhir = Jurnal.hariKe(s, s.selesai || P[0].tanggal), lama = {};
    T.forEach((j, i) => { const sd = T[i + 1] ? Jurnal.hariKe(s, T[i + 1].tanggal) : Math.max(hp, 0) || akhir; lama[j.tahap] = (lama[j.tahap] || 0) + Math.max(0, sd - Jurnal.hariKe(s, j.tanggal)); });
    return { hp: hp, lama: lama };
  },
  untuk(k) {
    const R = Siklus.daftar().filter((s) => s.komoditasId === k.id && s.status === 'selesai').map((s) => this.satu(s)).filter((r) => r && r.hp >= 1);
    if (!R.length) return null;
    const rata = (a) => Math.round(a.reduce((x, y) => x + y, 0) / a.length), tahap = {};
    R.forEach((r) => Object.keys(r.lama).forEach((kd) => (tahap[kd] = tahap[kd] || []).push(r.lama[kd])));
    const daftar = Tahap.paketKom(k).daftar.filter((t) => tahap[t.kode]).map((t) => ({ nama: t.nama, hari: rata(tahap[t.kode]), n: tahap[t.kode].length }));
    return { n: R.length, hp: rata(R.map((r) => r.hp)), min: Math.min.apply(null, R.map((r) => r.hp)), maks: Math.max.apply(null, R.map((r) => r.hp)), tahap: daftar };
  },
  /* blok di modal detail komoditas */
  v(k) {
    const p = this.untuk(k); if (!p) return '';
    const u = k.umurPanenHari, d = u ? p.hp - u : null, baris = (a, b) => '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>';
    return '<div class="dm-sub">Pengalaman ' + p.n + ' siklus selesai</div>' +
      baris('Panen pertama rata-rata', 'hari ke-' + p.hp + (p.n > 1 ? ' <span class="note">(' + p.min + '–' + p.maks + ')</span>' : '')) +
      (u ? baris('Umur panen sekarang', '±' + u + ' hari' + (d ? ' · <span class="' + (d > 0 ? 'down' : 'up') + '">' + (d > 0 ? 'lebih lambat ' : 'lebih cepat ') + Math.abs(d) + ' hari</span>' : ' · sama')) : '') +
      p.tahap.map((t) => baris(esc(t.nama), 'rata-rata ' + t.hari + ' hari' + (p.n > 1 ? ' <span class="note">(' + t.n + ' siklus)</span>' : ''))).join('') +
      (u !== p.hp ? '<button type="button" class="btn" data-do="pengalaman-pakai" data-id="' + k.id + '" style="width:100%;margin-top:10px;min-height:44px">Pakai ' + p.hp + ' hari sebagai umur panen</button><p class="note" style="margin:6px 0 0">Hanya saran. Umur panen dipakai untuk perkiraan panen dan saran tahap.</p>' : '');
  },
  aksi(a, el) {
    if (a !== 'pengalaman-pakai') return false;
    const k = Siklus.kom(el.dataset.id), p = k && this.untuk(k); if (!k || !p) return true;
    const lama = k.umurPanenHari || null; k.umurPanenHari = p.hp; k.diubah = nowIso(); App.simpan();
    if (Siklus.dmEl) Siklus.dmGambar(); if (App.tab === 'master') App.go('master', true);
    App.toast('Umur panen ' + k.nama + ' menjadi ' + p.hp + ' hari', { label: 'Urungkan', fn: () => { k.umurPanenHari = lama; k.diubah = nowIso(); App.simpan(); if (Siklus.dmEl) Siklus.dmGambar(); if (App.tab === 'master') App.go('master', true); } });
    return true;
  }
};

<script>
/* Buku Kebun — Umpan Jurnal lintas siklus (Fase 6E Tahap 7, v0.1.104, docs/JURNAL.md)
   Chip "Jurnal" di tab Siklus: semua entri jurnal dari siklus yang lolos saringan Unit/Komoditas, terbaru dulu,
   dengan pencarian kata kunci dan saringan jenis. Ketuk entri membuka modal detail seperti di linimasa. */
const Umpan = {
  q: '', jenis: 'semua', n: 100, BATAS: 100,
  JENIS: [['semua', 'Semua'], ['catatan', 'Catatan'], ['tahap', 'Tahap'], ['kejadian', 'Kejadian'], ['ukuran', 'Ukuran'], ['kegiatan', 'Kegiatan']],

  semua(base) {
    const out = [];
    base.forEach((s) => Jurnal.of(s.id).forEach((j) => out.push({ s: s, j: j })));
    return out.sort((a, b) => b.j.tanggal.localeCompare(a.j.tanggal) || String(b.j.dibuat).localeCompare(String(a.j.dibuat)));
  },
  hitung(base) { return this.semua(base).length; },
  teks(e) {
    const x = Linimasa.isi(e.s, { k: 'catatan', j: e.j });
    return { x: x, hay: (x.judul + ' ' + (e.j.isi || '') + ' ' + x.label + ' ' + Siklus.nama(e.s.id)).toLowerCase() };
  },
  saring(base) {
    const q = this.q.trim().toLowerCase();
    return this.semua(base).map((e) => Object.assign(e, this.teks(e))).filter((e) => (this.jenis === 'semua' || e.j.jenis === this.jenis) && (!q || e.hay.indexOf(q) >= 0));
  },
  baris(e) {
    const j = e.j, h = Jurnal.hariKe(e.s, j.tanggal), x = e.x, ket = j.isi ? String(j.isi).replace(/\s+/g, ' ').slice(0, 90) + (String(j.isi).length > 90 ? '…' : '') : '';
    return '<div class="tx lm-baris" data-do="jurnal-detail" data-id="' + j.id + '" data-sid="' + e.s.id + '" role="button" tabindex="0" aria-haspopup="dialog"><span class="lm-ik" aria-hidden="true">' + x.ikon + '</span><div class="tx-l"><div class="note">' +
      Setelan.tgl(j.tanggal) + ' · hari ' + h + ' · <span class="lm-tag">' + x.label + '</span></div><div class="tx-n">' + esc(x.judul) + '</div>' + (ket && ket !== x.judul ? '<div class="note">' + esc(ket) + '</div>' : '') +
      '<div class="note">' + esc(Siklus.nama(e.s.id)) + '</div></div></div>';
  },
  hasil(base) {
    const L = this.saring(base);
    if (!L.length) return '<p class="note">' + (this.q || this.jenis !== 'semua' ? 'Tidak ada entri yang cocok.' : 'Belum ada entri jurnal. Buka siklus berjalan, lalu ketuk tombol + dan pilih Catat jurnal.') + '</p>';
    return '<p class="note" style="margin:10px 0 0">' + L.length + ' entri</p>' + L.slice(0, this.n).map((e) => this.baris(e)).join('') +
      (L.length > this.n ? '<button type="button" class="btn" data-do="uj-lagi" style="width:100%;margin-top:12px;min-height:44px">Tampilkan lebih banyak (sisa ' + (L.length - this.n) + ')</button>' : '');
  },
  v(base) {
    return '<div class="lap-aksi no-print" style="margin:12px 0 0"><button type="button" class="ikon-btn" data-an="cetak" aria-label="Cetak umpan jurnal atau simpan PDF">' + Analisa.IKON.cetak + '<span>Cetak</span></button></div>' +
      '<input type="search" id="uj_cari" class="cari" style="margin-top:12px" placeholder="Cari judul, isi, siklus" aria-label="Cari jurnal" value="' + esc(this.q) + '" autocomplete="off">' +
      '<div class="seg sm lm-filter" role="group" aria-label="Saring jenis entri">' + this.JENIS.map((c) => '<button type="button" class="btn' + (this.jenis === c[0] ? ' gold' : '') + '" data-do="uj-f" data-f="' + c[0] + '" aria-pressed="' + (this.jenis === c[0]) + '">' + c[1] + '</button>').join('') + '</div>' +
      '<div id="ujHasil" aria-live="polite">' + this.hasil(base) + '</div>';
  },
  basis() {
    const fu = Siklus.fu && Siklus.unit(Siklus.fu) ? Siklus.fu : '', fk = Siklus.fk && Siklus.kom(Siklus.fk) ? Siklus.fk : '';

  },
  /* dokumen cetak polos: semua entri yang lolos saringan dan pencarian saat ini */
  cetakDoc() {

    const baris = L.map((e) => { const x = e.x; return '<tr><td>' + Setelan.tgl(e.j.tanggal) + '</td><td>' + esc(Siklus.nama(e.s.id)) + '</td><td>' + Jurnal.hariKe(e.s, e.j.tanggal) + '</td><td>' + x.label + '</td><td>' + esc(x.judul) + Linimasa.rinci(e.j, x.judul) + '</td></tr>'; }).join('');
    return '<div class="ct-kop"><h1>Jurnal Lintas Siklus</h1><p class="ct-sub">' + esc(fu) + ' · ' + esc(fk) + '</p><table class="ct-meta"><tr><th>Entri</th><td>' + L.length + '</td><th>Dicetak</th><td>' + Setelan.tgl(isoHari()) + '</td></tr>' +
      '<tr><th>Jenis</th><td>' + fl + '</td><th>Aplikasi</th><td>Buku Kebun v' + VERSI + '</td></tr>' + (this.q.trim() ? '<tr><th>Kata kunci</th><td colspan="3">' + esc(this.q.trim()) + '</td></tr>' : '') + '</table></div>' +
      '<div class="ct-bag ct-lanjut"><table class="ct-tab"><thead><tr><th>Tanggal</th><th>Siklus</th><th>Hari</th><th>Jenis</th><th>Keterangan</th></tr></thead><tbody>' + (baris || '<tr><td colspan="5">Tidak ada entri.</td></tr>') + '</tbody></table></div>';
  },
  ulang() { const el = document.getElementById('ujHasil'); if (el) { el.innerHTML = this.hasil(this.basis()); if (typeof Samar !== 'undefined') Samar.terapkan(); } },
  aksi(a, el) {

<script>
/* Buku Kebun — pencarian cepat (Fase 6G Tahap 3, v0.1.133; docs/CARI.md).
   Ikon kaca pembesar di header (dan bilah ringkas) membuka dialog; pintasan "/" di desktop.
   Mencari transaksi, siklus, dan entri jurnal sekaligus; setiap kata harus cocok (DAN). Hanya membaca data, tidak mengubahnya. */
const Cari = {
  q: '', MAKS: 5, RIWAYAT: 'tani.cari',
  IKON: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>',
  /* angka berformat ("552.500", "1,5jt" tidak) disamakan dengan nominal polos: titik/koma pemisah dibuang */
  kata(q) { return String(q || '').toLowerCase().split(/\s+/).filter(Boolean).map((k) => (/^\d+([.,]\d{3})+$/.test(k) ? k.replace(/[.,]/g, '') : k)); },
  /* jarak edit (Levenshtein) dengan batas; > maks mengembalikan maks + 1 */
  jarak(a, b, maks) {
    if (Math.abs(a.length - b.length) > maks) return maks + 1;
    let p = []; for (let j = 0; j <= b.length; j++) p[j] = j;
    for (let i = 1; i <= a.length; i++) {
      const c = [i]; let min = i;
      for (let j = 1; j <= b.length; j++) { c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); if (c[j] < min) min = c[j]; }
      if (min > maks) return maks + 1; p = c;
    }
    return p[b.length];
  },
  /* this.mirip: dipakai hanya saat pencarian persis kosong; kata ≥4 huruf (bukan angka) boleh salah 1 huruf (≥7 huruf: 2 huruf) */
  cocok(hay, kata) {
    return kata.every((k) => {
      if (hay.indexOf(k) >= 0) return true;
      if (!this.mirip || k.length < 4 || /\d/.test(k)) return false;
      const m = k.length >= 7 ? 2 : 1;
      return hay.split(/[^a-z0-9]+/).some((w) => w.length >= 3 && this.jarak(k, w, m) <= m);
    });
  },
  ket(s, n) { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n) + '…' : s; },
  /* hasil: { tx: [], sk: [], jr: [], n: { tx, sk, jr } } — tiap daftar sudah dibatasi MAKS bila tidak "semua" */
  cariData(q, semua) {
    const kata = this.kata(q), D = App.data, batas = semua ? 1e9 : this.MAKS, out = { tx: [], sk: [], jr: [], pn: [], ut: [], as: [], hg: [], mk: [], jd: [], n: { tx: 0, sk: 0, jr: 0, pn: 0, ut: 0, as: 0, hg: 0, mk: 0, jd: 0 } };
    if (!kata.length) return out;
    const tambah = (k, item) => { out.n[k]++; if (out[k].length < batas) out[k].push(item); };
    (D.siklus || []).filter((s) => !s.terhapus).sort((a, b) => (a.status === b.status ? 0 : a.status === 'berjalan' ? -1 : 1) || String(b.mulai).localeCompare(String(a.mulai))).forEach((s) => {
      const hay = (Siklus.nama(s.id) + ' ' + (s.status === 'berjalan' ? 'berjalan' : 'selesai') + ' ' + s.mulai).toLowerCase();
      if (this.cocok(hay, kata)) tambah('sk', s);
    });
    (D.transaksi || []).filter((t) => !t.terhapus).sort((a, b) => b.tanggal.localeCompare(a.tanggal) || String(b.dibuat).localeCompare(String(a.dibuat))).forEach((t) => {
      const sk = t.siklusId && Siklus.cari(t.siklusId) ? Siklus.nama(t.siklusId) : '';
      const hay = (App.namaKat(t.kategoriId) + ' ' + (t.catatan || '') + ' ' + sk + ' ' + (t.jenis === 'masuk' ? 'hasil masuk' : 'modal keluar biaya') + ' ' + Setelan.tgl(t.tanggal) + ' ' + t.tanggal + ' ' + t.jumlah).toLowerCase();
      if (this.cocok(hay, kata)) tambah('tx', t);
    });
    (D.siklus || []).filter((s) => !s.terhapus).forEach((s) => Jurnal.of(s.id).forEach((j) => {
      const e = Object.assign({ s: s, j: j }, Umpan.teks({ s: s, j: j }));
      if (this.cocok(e.hay, kata)) { out.n.jr++; out.jr.push(e); }
    }));
    (D.siklus || []).filter((s) => !s.terhapus).forEach((s) => (s.jadwal || []).forEach((j) => {
      if (this.cocok(('jadwal kegiatan ' + j.nama + ' ' + Siklus.nama(s.id) + ' ' + (j.selesai ? 'selesai' : 'belum') + ' ' + (j.tanggal || '')).toLowerCase(), kata)) { out.n.jd++; out.jd.push({ s: s, j: j }); }
    }));
    out.jd.sort((a, b) => (a.j.selesai ? 1 : 0) - (b.j.selesai ? 1 : 0) || String(a.j.tanggal || '9').localeCompare(String(b.j.tanggal || '9'))); if (out.jd.length > batas) out.jd.length = batas;
    (D.panen || []).filter((p) => !p.terhapus && Siklus.cari(p.siklusId)).sort((a, b) => b.tanggal.localeCompare(a.tanggal)).forEach((p) => {
      const k = Siklus.kom(Siklus.cari(p.siklusId).komoditasId);
      if (this.cocok(('panen ' + Siklus.nama(p.siklusId) + ' ' + (p.pembeli || '') + ' ' + Setelan.tgl(p.tanggal) + ' ' + p.tanggal + ' ' + (k ? k.satuan : '')).toLowerCase(), kata)) tambah('pn', p);
    });
    (D.utang || []).filter((u) => !u.terhapus).sort((a, b) => (a.lunas ? 1 : 0) - (b.lunas ? 1 : 0) || String(a.jatuhTempo || '9').localeCompare(String(b.jatuhTempo || '9'))).forEach((u) => {
      if (this.cocok((u.jenis + ' ' + (u.jenis === 'utang' ? 'utang bayar' : 'piutang tagih') + ' ' + u.pihak + ' ' + (u.lunas ? 'lunas' : 'belum lunas') + ' ' + (u.jatuhTempo || '') + ' ' + u.jumlah).toLowerCase(), kata)) tambah('ut', u);
    });
    (D.aset || []).filter((a) => !a.terhapus).sort((a, b) => String(b.tanggalBeli).localeCompare(String(a.tanggalBeli))).forEach((a) => {
      if (this.cocok(('aset ' + a.nama + ' ' + a.tanggalBeli + ' ' + a.hargaBeli).toLowerCase(), kata)) tambah('as', a);
    });
    (D.komoditas || []).filter((k) => !k.terhapus).forEach((k) => (k.hargaPasar || []).forEach((h) => {
      if (this.cocok(('harga pasar ' + k.nama + ' ' + (h.sumber || '') + ' ' + h.tanggal + ' ' + h.harga).toLowerCase(), kata)) out.n.hg++, out.hg.push({ k: k, h: h });
    }));
    [['unit', D.unit], ['kom', D.komoditas]].forEach((g) => (g[1] || []).filter((x) => !x.terhapus).forEach((x) => {
      const hay = (g[0] === 'unit' ? 'unit lahan ' + (x.jenis || '') : 'komoditas ' + (x.satuan || '')) + ' ' + x.nama + (x.arsip ? ' arsip' : '');
      if (this.cocok(hay.toLowerCase(), kata)) tambah('mk', { j: g[0], x: x });
    }));
    out.hg.sort((a, b) => b.h.tanggal.localeCompare(a.h.tanggal)); if (out.hg.length > batas) out.hg.length = batas;
    out.jr.sort((a, b) => b.j.tanggal.localeCompare(a.j.tanggal) || String(b.j.dibuat).localeCompare(String(a.j.dibuat)));
    if (out.jr.length > batas) out.jr.length = batas;
    return out;
  },
  /* ---------- tampilan ---------- */
  barisTx(t) {
    const m = t.jenis === 'masuk', sk = t.siklusId && Siklus.cari(t.siklusId) ? ' · ' + esc(Siklus.nama(t.siklusId).split(' · ')[0]) : '';
    return '<button type="button" class="cr-baris" data-cr="tx" data-id="' + t.id + '"><span class="cr-l"><span class="cr-n">' + esc(App.namaKat(t.kategoriId)) + '</span>' +
      '<span class="note">' + esc(Setelan.tgl(t.tanggal)) + sk + (t.catatan ? ' · ' + esc(this.ket(t.catatan, 50)) : '') + '</span></span>' +
      '<span class="cr-a ' + (m ? 'up' : 'down') + '">' + (m ? '+' : '−') + esc(rp(t.jumlah).replace('Rp ', 'Rp\u00a0')) + '</span></button>';
  },
  barisSk(s) {
    const live = s.status === 'berjalan';
    return '<button type="button" class="cr-baris" data-cr="sk" data-id="' + s.id + '"><span class="cr-l"><span class="cr-n">' + esc(Siklus.nama(s.id)) + '</span>' +
      '<span class="note">' + (live ? 'Berjalan · hari ' + Siklus.hari(s) : 'Selesai') + ' · mulai ' + esc(Setelan.tgl(s.mulai)) + '</span></span><span class="m-chev" aria-hidden="true">›</span></button>';
  },
  barisJr(e) {
    const ket = this.ket(e.j.isi, 70), judul = e.x.judul;
    return '<button type="button" class="cr-baris" data-cr="jr" data-id="' + e.j.id + '" data-sid="' + e.s.id + '"><span class="cr-l"><span class="cr-n">' + esc(judul) + '</span>' +
      '<span class="note">' + esc(Setelan.tgl(e.j.tanggal)) + ' · ' + esc(Siklus.nama(e.s.id).split(' · ')[0]) + (ket && ket !== judul ? ' · ' + esc(ket) : '') + '</span></span><span class="m-chev" aria-hidden="true">›</span></button>';
  },
  barisPn(p) {
    const k = Siklus.kom((Siklus.cari(p.siklusId) || {}).komoditasId), bersih = (+p.kuantitasKotor || 0) - (+p.susut || 0);
    return '<button type="button" class="cr-baris" data-cr="pn" data-id="' + p.id + '" data-sid="' + p.siklusId + '"><span class="cr-l"><span class="cr-n">Panen ' + esc(Setelan.tgl(p.tanggal)) + '</span>' +
      '<span class="note">' + esc(Siklus.nama(p.siklusId).split(' · ')[0]) + ' · ' + bersih + ' ' + esc(k ? k.satuan : '') + (p.pembeli ? ' · ' + esc(p.pembeli) : '') + '</span></span><span class="m-chev" aria-hidden="true">›</span></button>';
  },
  barisUt(u) {
    return '<button type="button" class="cr-baris" data-cr="ut" data-id="' + u.id + '"><span class="cr-l"><span class="cr-n">' + esc(u.pihak) + '</span>' +
      '<span class="note">' + (u.jenis === 'utang' ? 'Utang' : 'Piutang') + (u.lunas ? ' · lunas' : u.jatuhTempo ? ' · jatuh tempo ' + esc(Setelan.tgl(u.jatuhTempo)) : '') + '</span></span>' +
      '<span class="cr-a ' + (u.jenis === 'utang' ? 'down' : 'up') + '">' + esc(rp(u.jumlah).replace('Rp ', 'Rp\u00a0')) + '</span></button>';
  },
  barisAs(a) {
    return '<button type="button" class="cr-baris" data-cr="as" data-id="' + a.id + '"><span class="cr-l"><span class="cr-n">' + esc(a.nama) + '</span><span class="note">Dibeli ' + esc(Setelan.tgl(a.tanggalBeli)) + '</span></span>' +
      '<span class="cr-a">' + esc(rp(a.hargaBeli).replace('Rp ', 'Rp\u00a0')) + '</span></button>';
  },
  barisMk(e) {
    const un = e.j === 'unit', x = e.x;
    return '<button type="button" class="cr-baris" data-cr="mk" data-j="' + e.j + '" data-id="' + x.id + '"><span class="cr-l"><span class="cr-n">' + esc(x.nama) + '</span><span class="note">' + (un ? 'Unit' + (x.jenis ? ' · ' + esc(x.jenis) : '') : 'Komoditas' + (x.satuan ? ' · ' + esc(x.satuan) : '')) + (x.arsip ? ' · arsip' : '') + '</span></span><span class="m-chev" aria-hidden="true">›</span></button>';
  },
  barisJd(e) {
    const j = e.j, hari = j.tanggal ? Math.round((new Date(j.tanggal + 'T00:00:00') - new Date(isoHari() + 'T00:00:00')) / 864e5) : null;
    const ket = j.selesai ? 'Selesai' : hari === null ? 'Tanpa tanggal' : hari < 0 ? 'Terlambat ' + (-hari) + ' hari' : hari === 0 ? 'Hari ini' : 'Dalam ' + hari + ' hari';
    return '<button type="button" class="cr-baris" data-cr="jd" data-id="' + j.id + '" data-sid="' + e.s.id + '"><span class="cr-l"><span class="cr-n">' + esc(j.nama) + '</span><span class="note">' + ket + (j.tanggal ? ' · ' + esc(Setelan.tgl(j.tanggal)) : '') + ' · ' + esc(Siklus.nama(e.s.id).split(' · ')[0]) + '</span></span><span class="m-chev" aria-hidden="true">›</span></button>';
  },
  barisHg(e) {
    return '<button type="button" class="cr-baris" data-cr="hg" data-id="' + e.k.id + '|' + e.h.id + '"><span class="cr-l"><span class="cr-n">' + esc(e.k.nama) + '</span><span class="note">' + esc(Setelan.tgl(e.h.tanggal)) + (e.h.sumber ? ' · ' + esc(e.h.sumber) : '') + '</span></span>' +
      '<span class="cr-a">' + esc(rp(e.h.harga).replace('Rp ', 'Rp\u00a0')) + '</span></button>';
  },
  grup(judul, n, baris, lagi) {
    if (!n) return '';
    return '<div class="cr-grup" role="group" aria-label="' + judul + '"><div class="dm-sub">' + judul + ' (' + n + ')</div>' + baris.join('') + (lagi || '') + '</div>';
  },
  isiHasil() {
    const q = this.q.trim();
    if (!q) return '<p class="note cr-info">Ketik nama kategori, catatan transaksi, siklus, isi jurnal, jadwal kegiatan, pembeli panen, pihak utang, aset, harga pasar, unit, atau komoditas. Angka boleh berformat, mis. 552.500. Beberapa kata dicocokkan sekaligus, mis. “cabai pupuk”.</p>' + this.terakhir();
    this.mirip = false; let r = this.cariData(q, false), mirip = false;
    if (!r.n.tx && !r.n.sk && !r.n.jr && !r.n.pn && !r.n.ut && !r.n.as && !r.n.hg && !r.n.mk && !r.n.jd) { this.mirip = true; r = this.cariData(q, false); mirip = true; this.mirip = false; }
    const total = r.n.tx + r.n.sk + r.n.jr + r.n.pn + r.n.ut + r.n.as + r.n.hg + r.n.mk + r.n.jd;
    if (!total) return '<p class="note cr-info" role="status">Tidak ada yang cocok dengan “' + esc(q) + '”.</p>';
    const lagi = (k, teks) => r.n[k] > r[k].length ? '<button type="button" class="cr-lagi" data-cr="lagi-' + k + '">' + teks + ' (' + r.n[k] + ')</button>' : '';
    return '<p class="sr-only" role="status">' + total + ' hasil</p>' + (mirip ? '<p class="note cr-info">Tidak ada yang persis sama; ini hasil yang mirip.</p>' : '') +
      this.grup('Siklus', r.n.sk, r.sk.map((s) => this.barisSk(s)), '') +
      this.grup('Transaksi', r.n.tx, r.tx.map((t) => this.barisTx(t)), lagi('tx', 'Lihat semua di Transaksi')) +
      this.grup('Jurnal', r.n.jr, r.jr.map((e) => this.barisJr(e)), lagi('jr', 'Lihat semua di Jurnal')) +
      this.grup('Jadwal kegiatan', r.n.jd, r.jd.map((e) => this.barisJd(e)), '') +
      this.grup('Panen', r.n.pn, r.pn.map((p) => this.barisPn(p)), '') +
      this.grup('Utang / piutang', r.n.ut, r.ut.map((u) => this.barisUt(u)), '') +
      this.grup('Aset', r.n.as, r.as.map((a) => this.barisAs(a)), '') +
      this.grup('Harga pasar', r.n.hg, r.hg.map((e) => this.barisHg(e)), '') +
      this.grup('Unit & komoditas', r.n.mk, r.mk.map((e) => this.barisMk(e)), '');
  },
  /* pencarian terakhir (hanya kata kunci, disimpan di perangkat ini) */
  muatRiwayat() { try { const a = JSON.parse(localStorage.getItem(this.RIWAYAT) || '[]'); return Array.isArray(a) ? a.filter((x) => typeof x === 'string').slice(0, 5) : []; } catch (e) { return []; } },
  simpanRiwayat(q) {
    q = q.trim(); if (!q) return;
    try { const a = [q].concat(this.muatRiwayat().filter((x) => x.toLowerCase() !== q.toLowerCase())).slice(0, 5); localStorage.setItem(this.RIWAYAT, JSON.stringify(a)); } catch (e) { /* abaikan */ }
  },
  terakhir() {
    const a = this.muatRiwayat(); if (!a.length) return '';
    return '<div class="cr-grup"><div class="dm-sub">Pencarian terakhir</div><div class="cr-chip">' + a.map((x) => '<button type="button" class="btn" data-cr="riwayat" data-q="' + esc(x) + '">' + esc(x) + '</button>').join('') + '</div></div>';
  },
  segar() {
    const w = document.getElementById('crHasil'); if (!w) return;
    w.innerHTML = this.isiHasil(); if (typeof Samar !== 'undefined' && Samar.aktif()) Samar.sapu(w);
  },
  /* ---------- buka dan tindakan ---------- */
  buka(pemicu) {
    if (Modal.m) return;
    this.q = '';
    Modal.buka({
      judulId: 'crJudul', fokus: 'crQ', pemicu: pemicu || document.activeElement, kartu: 'cr-kartu', lapis: 'cr-lapis',
      html: '<div class="dm-kepala"><div><div class="dm-jenis">Pencarian cepat</div><h2 class="dm-judul" id="crJudul">Cari</h2></div>' +
        '<button type="button" class="dm-x" data-cr="tutup" aria-label="Tutup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
        '<div class="dm-isi"><input type="search" id="crQ" class="cari" placeholder="Transaksi, siklus, jurnal, panen…" aria-label="Cari transaksi, siklus, jurnal, panen, utang, aset, dan harga pasar" aria-controls="crHasil" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">' +
        '<div id="crHasil">' + this.isiHasil() + '</div></div>',

    else if (e.target.id === 'rm_bayar') { Utang.baca(Upah.s, 'rm'); const b = el.querySelector('#rm_byr'); b.innerHTML = Utang.kotak(Upah.s, 'rm', '', 'rm_pkj'); if (typeof Form !== 'undefined') Form.upgrade(b); }
    Upah.total(el);
  },
  ok(v, id) {
    const t = id && Upah.cariTx(id), pid = v('rm_pkj');

    const hari = Upah.hariNum(v('rm_hari')), tarif = angka(v('rm_tarif')), tgl = v('rm_tgl'), note = v('rm_cat').trim();
    if (!(hari > 0) || hari > 31) return 'Isi jumlah hari antara 0,01 dan 31 (0,5 = setengah hari).';

};

  },

Rencana.FORM.pekerja = {

      Rencana.lab('rm_cat', 'Catatan (opsional)', '<input id="rm_cat" maxlength="60" autocomplete="off" placeholder="mis. nomor HP, bagian kerja" value="' + esc(p ? p.catatan || '' : '') + '">') +

  ok(v, id) {

Rencana.FORM.pekerjaDetail = {
  jenis: 'Pekerja', judul: 'Detail pekerja', ada(id) { return !!Upah.aktifP(id); }, judulFn(id) { const p = Upah.cariP(id); return p ? esc(p.nama) : 'Detail pekerja'; },

    return B('Upah per hari', rp(p.tarif)) + B('Bulan ini', r(st.bulan)) + B('Bulan lalu', r(st.lalu)) + B('Seluruhnya', r(st.semua)) +

    }
