<script>
/* Buku Kebun — Stok saprodi (v0.1.191, docs/STOK.md)
   Sisa pupuk, benih, pestisida, dan barang lain. Dua koleksi:
   - `saprodi`: barang { id, nama, jenis, satuan, min (batas peringatan, 0 = tanpa), dibuat, diubah, terhapus }
   - `mutasiStok`: tiap perubahan stok { id, saprodiId, tanggal, tipe: 'masuk' | 'pakai' | 'koreksi', qty, siklusId, transaksiId, catatan, dibuat, diubah, terhapus }
   Sisa = masuk + koreksi (bertanda) − pakai. Mutasi terpisah dari barang agar gabungan multi-tab dan sinkron aman per catatan.
   Tambah stok yang berharga membuat transaksi Modal (kategori sesuai jenis) dan ikut mesin Utang; pemakaian tidak mengubah biaya
   (biaya sudah dihitung saat beli). Tampil sebagai sub-tab Stok di Rencana keuangan; isian lewat modal Rencana (Rencana.FORM). */
const Stok = {
  JENIS: [['pupuk', 'Pupuk / nutrisi', 'kg'], ['benih', 'Benih / bibit', 'kg'], ['pestisida', 'Pestisida / obat', 'liter'], ['lain', 'Lainnya', 'unit']],
  KAT: { pupuk: 'pupuk', benih: 'benih', pestisida: 'pestisida', lain: 'lain-keluar' },
  pre: { s: '' }, s: null,

  /* ---------- data ---------- */
  jenisNama(j) { const x = this.JENIS.find((a) => a[0] === j); return x ? x[1] : 'Lainnya'; },
  barang(semua) { return (App.data.saprodi || []).filter((x) => semua || !x.terhapus).slice().sort((a, b) => a.nama.localeCompare(b.nama, 'id')); },
  cari(id) { return (App.data.saprodi || []).find((x) => x.id === id && !x.terhapus) || null; },
  mut(id) { return (App.data.mutasiStok || []).filter((m) => m.saprodiId === id && !m.terhapus); },
  efek(m) { return m.tipe === 'pakai' ? -m.qty : m.qty; },
  peta() { const o = {}; (App.data.mutasiStok || []).forEach((m) => { if (!m.terhapus) o[m.saprodiId] = (o[m.saprodiId] || 0) + this.efek(m); }); return o; },
  sisa(x, M) { return Math.round(((M || this.peta())[x.id] || 0) * 1000) / 1000; },
  qTeks(n) { return String(Math.round(n * 1000) / 1000).replace('.', ','); },
  /* "2", "2,5", "2.5" -> angka (maks. 3 desimal); selain itu 0 */
  qNum(s) { const t = String(s == null ? '' : s).trim(); return /^\d+([.,]\d{1,3})?$/.test(t) ? Math.round(parseFloat(t.replace(',', '.')) * 1000) / 1000 : 0; },
  status(x, M) { const s = this.sisa(x, M); return s <= 0 ? 'habis' : (x.min > 0 && s <= x.min ? 'menipis' : 'ok'); },
  /* barang yang punya batas peringatan dan sisanya sudah di bawah atau sama dengan batas (untuk Beranda) */
  menipis() { const M = this.peta(); return this.barang().filter((x) => x.min > 0 && this.sisa(x, M) <= x.min).map((x) => ({ id: x.id, nama: x.nama, satuan: x.satuan, sisa: this.sisa(x, M) })); },
  butuh() { if (!this.barang().length) { App.toast('Tambah barang dulu'); Rencana.dlgBuka('saprodi'); return false; } return true; },

  /* ---------- tampilan: sub-tab Stok di Rencana ---------- */
  v() {
    const B = this.barang();
    if (!B.length) return '<section><p class="note">Belum ada barang. Ketuk tombol + lalu pilih Tambah barang (pupuk, benih, pestisida). Catat stok masuk saat membeli dan pemakaian saat dipakai, supaya sisa selalu terlihat dan ada peringatan saat menipis.</p></section>';
    const M = this.peta(), rank = (x) => ({ habis: 0, menipis: 1, ok: 2 }[this.status(x, M)]), bln = bulanIni(), P = {};
    (App.data.mutasiStok || []).forEach((m) => { if (!m.terhapus && m.tipe === 'pakai' && m.tanggal.slice(0, 7) === bln) P[m.saprodiId] = (P[m.saprodiId] || 0) + m.qty; });
    const L = B.slice().sort((a, b) => rank(a) - rank(b) || a.nama.localeCompare(b.nama, 'id')), n = B.filter((x) => this.status(x, M) !== 'ok').length;
    const baris = (x) => { const st = this.status(x, M);
      return '<button type="button" class="ang-baris" data-rc="stok-detail" data-id="' + x.id + '" aria-label="Detail stok ' + esc(x.nama) + '"><div class="bar-top"><strong>' + esc(x.nama) + '</strong><span class="mu">' + this.qTeks(this.sisa(x, M)) + ' ' + esc(x.satuan) + '</span></div>' +
        '<div class="note">' + esc(this.jenisNama(x.jenis)) + (P[x.id] ? ' · dipakai bulan ini ' + this.qTeks(P[x.id]) + ' ' + esc(x.satuan) : '') + (x.min > 0 ? ' · batas ' + this.qTeks(x.min) : '') +
        (st === 'habis' ? '<span class="lencana">Habis</span>' : st === 'menipis' ? '<span class="lencana">Menipis</span>' : '') + '</div></button>'; };
    return '<section><div class="sum"><div><span class="note">Barang</span><strong>' + B.length + '</strong></div><div><span class="note">Habis atau menipis</span><strong class="' + (n ? 'down' : '') + '">' + n + '</strong></div></div></section>' +
      '<section><h2>Stok saprodi</h2><p class="note">Ketuk barang untuk melihat riwayat, memakai, menambah stok, atau mengoreksi sisa. Yang habis atau menipis tampil paling atas.</p>' + L.map(baris).join('') + '</section>';
  },

  /* ---------- membuka modal ---------- */
  pakai(id, sid) { if (!this.butuh()) return false; this.pre = { s: sid || '' }; return Rencana.dlgBuka('stokPakai', id || undefined); },
  masuk(id, sid) { if (!this.butuh()) return false; this.pre = { s: sid || '' }; return Rencana.dlgBuka('stokMasuk', id || undefined); },
  opsiBarang(id) { const M = this.peta(), B = this.barang(), sel = B.find((x) => x.id === id) || B[0];
    return '<select id="rm_brg">' + B.map((x) => '<option value="' + x.id + '"' + (x.id === sel.id ? ' selected' : '') + '>' + esc(x.nama) + ' (sisa ' + this.qTeks(this.sisa(x, M)) + ' ' + esc(x.satuan) + ')</option>').join('') + '</select>'; },
  opsiSiklus(sid) { return '<select id="rm_sik"><option value="">Tanpa siklus</option>' + Siklus.opsi(Siklus.daftar().filter((s) => s.status === 'berjalan' || s.id === sid), sid, (x) => Siklus.nama(x.id)) + '</select>'; },
  tgl(v) { return !/^\d{4}-\d{2}-\d{2}$/.test(v) ? 'Isi tanggal.' : v > isoHari() ? 'Tanggal tidak boleh di masa depan.' : ''; },
  tambahMut(x, tipe, qty, tgl, f) {
    const m = Object.assign({ id: uid('m'), saprodiId: x.id, tanggal: tgl, tipe: tipe, qty: qty, siklusId: null, transaksiId: null, catatan: '', dibuat: nowIso(), diubah: nowIso(), terhapus: false }, f || {});
    (App.data.mutasiStok = App.data.mutasiStok || []).push(m); x.diubah = nowIso(); return m;
  },
  /* hapus satu mutasi (dan transaksi belinya); kembalikan false bila ditolak */
  hapusMut(x, m) {
    if (this.sisa(x) - this.efek(m) < 0) { App.toast('Tidak bisa dihapus: sisa stok akan negatif'); return false; }
    const tx = m.transaksiId && App.data.transaksi.find((t) => t.id === m.transaksiId && !t.terhapus);
    if (tx && Utang.tahan(tx)) return false;
    m.terhapus = true; m.diubah = nowIso(); if (tx) { tx.terhapus = true; tx.diubah = nowIso(); Utang.ikut(tx, true); }
    App.simpan(); Rencana.segarDlg('stokDetail', x.id);
    App.toast(tx ? 'Stok masuk dan transaksi belinya dihapus' : 'Catatan stok dihapus', { label: 'Urungkan', fn: () => {
      m.terhapus = false; m.diubah = nowIso(); if (tx) { tx.terhapus = false; tx.diubah = nowIso(); Utang.ikut(tx, false); }
      App.simpan(); Rencana.segarDlg('stokDetail', x.id); } });
    return true;
  },
  riwayat(x) {
    const L = this.mut(x.id).sort((a, b) => b.tanggal.localeCompare(a.tanggal) || String(b.dibuat || '').localeCompare(String(a.dibuat || ''))), sat = ' ' + esc(x.satuan);
    if (!L.length) return '<p class="note">Belum ada riwayat.</p>';
    return '<div class="byr" role="list" aria-label="Riwayat stok">' + L.slice(0, 8).map((m) => {
      const tx = m.transaksiId && App.data.transaksi.find((t) => t.id === m.transaksiId && !t.terhapus), sk = m.siklusId && Siklus.cari(m.siklusId) ? ' · ' + esc(Siklus.nama(m.siklusId).split(' · ')[0]) : '';
      const ket = m.tipe === 'pakai' ? '−' + this.qTeks(m.qty) + sat + sk : m.tipe === 'masuk' ? '+' + this.qTeks(m.qty) + sat + (tx ? ' · beli ' + rp(tx.jumlah) : ' · stok') : (m.qty > 0 ? '+' : '−') + this.qTeks(Math.abs(m.qty)) + sat + ' · koreksi';
      return '<div class="byr-baris" role="listitem"><span class="mu">' + Setelan.tgl(m.tanggal) + '</span><span>' + ket + '</span><button type="button" class="btn byr-x" data-rm="mx" data-mid="' + m.id + '" aria-label="Hapus catatan ' + Setelan.tgl(m.tanggal) + ' ' + esc(ket) + '">Hapus</button></div>';
    }).join('') + '</div>' + (L.length > 8 ? '<p class="note">Menampilkan 8 terbaru dari ' + L.length + ' catatan.</p>' : '');
  }
};

/* ---------- formulir dan detail (mesin modal Rencana) ---------- */
const stokTab = { get tab() { return App.tab === 'siklus-detail' ? 'siklus-detail' : 'rencana'; } };
Rencana.FORM.saprodi = Object.defineProperties({
  jenis: 'Stok saprodi', judul: 'Tambah barang', judulUbah: 'Ubah barang', simpan: 'Simpan barang', lagi: true, fokus: 'rm_nama',
  ada(id) { return !id || !!Stok.cari(id); },
  isi(id) {
    const x = id && Stok.cari(id), j = x ? x.jenis : 'pupuk', d = Stok.JENIS.find((a) => a[0] === j);
    return Rencana.lab('rm_nama', 'Nama barang', '<input id="rm_nama" maxlength="40" autocomplete="off" placeholder="mis. NPK 16-16-16" value="' + esc(x ? x.nama : '') + '">') +
      Rencana.lab('rm_jns', 'Jenis', '<select id="rm_jns">' + Stok.JENIS.map((a) => '<option value="' + a[0] + '"' + (a[0] === j ? ' selected' : '') + '>' + a[1] + '</option>').join('') + '</select>') +
      Rencana.lab('rm_sat', 'Satuan', '<input id="rm_sat" maxlength="12" autocomplete="off" placeholder="kg, liter, sak, botol" value="' + esc(x ? x.satuan : d[2]) + '">') +
      Rencana.lab('rm_min', 'Batas peringatan (opsional)', '<input id="rm_min" inputmode="decimal" autocomplete="off" maxlength="9" placeholder="0 = tanpa peringatan" value="' + (x && x.min ? Stok.qTeks(x.min) : '') + '">') +
      (x ? '' : Rencana.lab('rm_awal', 'Stok awal (opsional)', '<input id="rm_awal" inputmode="decimal" autocomplete="off" maxlength="9" placeholder="sisa yang sudah ada sekarang">')) +
      '<p class="note">Beri batas peringatan agar Beranda memberi tahu saat stok tinggal segitu atau kurang.</p>';
  },
  ubah(e, el) {
    if (e.target.id !== 'rm_jns') return;
    const s = el.querySelector('#rm_sat'), baku = Stok.JENIS.map((a) => a[2]); if (s && (!s.value.trim() || baku.includes(s.value.trim()))) s.value = Stok.JENIS.find((a) => a[0] === e.target.value)[2];
  },
  ok(v, id) {
    const nama = v('rm_nama').trim(), sat = v('rm_sat').trim(), mn = v('rm_min').trim() === '' ? 0 : Stok.qNum(v('rm_min')), aw = v('rm_awal').trim() === '' ? 0 : Stok.qNum(v('rm_awal'));
    if (!nama) return 'Isi nama barang.';
    if (!sat) return 'Isi satuan (mis. kg, liter, sak).';
    if (v('rm_min').trim() !== '' && !mn && !/^0([.,]0+)?$/.test(v('rm_min').trim())) return 'Batas peringatan: isi angka (boleh desimal) atau kosongkan.';
    if (v('rm_awal').trim() !== '' && !aw && !/^0([.,]0+)?$/.test(v('rm_awal').trim())) return 'Stok awal: isi angka (boleh desimal) atau kosongkan.';
    const D = App.data; D.saprodi = D.saprodi || [];
    if (D.saprodi.some((b) => !b.terhapus && b.id !== id && b.nama.toLowerCase() === nama.toLowerCase())) return 'Nama barang itu sudah ada.';
    const x = id && Stok.cari(id);
    if (x) { Object.assign(x, { nama: nama, jenis: v('rm_jns'), satuan: sat, min: mn, diubah: nowIso() }); return { toast: 'Barang diperbarui' }; }
    const b = { id: uid('s'), nama: nama, jenis: v('rm_jns') || 'lain', satuan: sat, min: mn, dibuat: nowIso(), diubah: nowIso(), terhapus: false };
    D.saprodi.push(b); if (aw > 0) Stok.tambahMut(b, 'masuk', aw, isoHari(), { catatan: 'Stok awal' });
    return { toast: 'Barang ditambahkan' };
  }
}, Object.getOwnPropertyDescriptors(stokTab));
Rencana.FORM.stokPakai = Object.defineProperties({
  jenis: 'Stok saprodi', judul: 'Pakai stok', simpan: 'Simpan pemakaian', fokus: 'rm_qty',
  ada(id) { return !id || !!Stok.cari(id); },
  isi(id) {
    return Rencana.lab('rm_brg', 'Barang', Stok.opsiBarang(id)) +
      Rencana.lab('rm_qty', 'Jumlah dipakai (sesuai satuan barang)', '<input id="rm_qty" inputmode="decimal" autocomplete="off" maxlength="9" placeholder="mis. 2,5">') +

Rencana.FORM.stokMasuk = Object.defineProperties({
  jenis: 'Stok saprodi', judul: 'Tambah stok (beli)', simpan: 'Simpan stok', fokus: 'rm_qty',

      App.data.transaksi.push(tx = { id: uid('t'), tanggal: tgl, jenis: 'keluar', kategoriId: kid, jumlah: harga, siklusId: v('rm_sik') || null, sifatBiaya: (kat && kat.sifatBiaya) || 'variabel',
        catatan: 'Beli ' + x.nama + ' · ' + Stok.qTeks(q) + ' ' + x.satuan + (cat ? ' · ' + cat : ''), notaId: null, saprodiId: x.id, qty: q, dibuat: nowIso(), diubah: nowIso(), terhapus: false });
      Utang.sinkron(tx, s);
    }
    Stok.tambahMut(x, 'masuk', q, tgl, { transaksiId: tx ? tx.id : null, siklusId: tx ? tx.siklusId : null, catatan: cat });

Rencana.FORM.stokKoreksi = Object.defineProperties({
  jenis: 'Stok saprodi', judul: 'Koreksi sisa stok', simpan: 'Simpan koreksi', fokus: 'rm_sisa',
  ada(id) { return !!Stok.cari(id); },
  judulFn(id) { const x = Stok.cari(id); return x ? 'Koreksi ' + esc(x.nama) : 'Koreksi sisa stok'; },

      Rencana.lab('rm_sisa', 'Sisa sebenarnya (' + esc(x.satuan) + ')', '<input id="rm_sisa" inputmode="decimal" autocomplete="off" maxlength="9" value="' + Stok.qTeks(Stok.sisa(x)) + '">');
  },
  ok(v, id) {
    const x = Stok.cari(id); if (!x) return 'Barang tidak ditemukan.';
    const t = v('rm_sisa').trim(), baru = Stok.qNum(t), sisa = Stok.sisa(x);
    if (!t || (!baru && !/^0([.,]0+)?$/.test(t))) return 'Isi sisa sebenarnya (angka, boleh desimal).';
    const d = Math.round((baru - sisa) * 1000) / 1000; if (!d) return 'Sisa sama dengan yang tercatat.';
    Stok.tambahMut(x, 'koreksi', d, isoHari(), { catatan: 'Koreksi' });
    return { toast: 'Sisa ' + x.nama + ' dikoreksi menjadi ' + Stok.qTeks(baru) + ' ' + x.satuan };

}, Object.getOwnPropertyDescriptors(stokTab));
Rencana.FORM.stokDetail = {
  jenis: 'Stok saprodi', judul: 'Detail stok', ada(id) { return !!Stok.cari(id); }, judulFn(id) { const x = Stok.cari(id); return x ? esc(x.nama) : 'Detail stok'; },
  isi(id) {
    const x = Stok.cari(id), B = (a, b) => Rencana.baris(a, b), st = Stok.status(x), s = Stok.sisa(x), bln = bulanIni();
    const pakai = Stok.mut(id).filter((m) => m.tipe === 'pakai' && m.tanggal.slice(0, 7) === bln).reduce((a, m) => a + m.qty, 0);
    return B('Sisa', '<strong class="' + (st === 'ok' ? '' : 'down') + '">' + Stok.qTeks(s) + ' ' + esc(x.satuan) + '</strong>' + (st === 'habis' ? ' <span class="down">(habis)</span>' : st === 'menipis' ? ' <span class="down">(menipis)</span>' : '')) +
      B('Jenis', esc(Stok.jenisNama(x.jenis))) + B('Batas peringatan', x.min > 0 ? Stok.qTeks(x.min) + ' ' + esc(x.satuan) : 'tanpa batas') + B('Dipakai bulan ini', Stok.qTeks(pakai) + ' ' + esc(x.satuan)) + Stok.riwayat(x);
  },
  tombol() { return Rencana.bt('pakai', 'Pakai stok', 'gold') + Rencana.bt('masuk', 'Tambah stok (beli)', '') + Rencana.bt('koreksi', 'Koreksi sisa', '') + Rencana.bt('ubah', 'Ubah barang', '') + Rencana.bt('hapus', 'Hapus barang', 'danger') + Rencana.bt('tutup', 'Tutup', ''); },
  aksi(a, id, b) {
    const x = Stok.cari(id); if (!x) return;
    if (a === 'pakai') { Rencana.dlgTutup(true); Stok.pakai(id); }
    else if (a === 'masuk') { Rencana.dlgTutup(true); Stok.masuk(id); }
    else if (a === 'koreksi') { Rencana.dlgTutup(true); Rencana.dlgBuka('stokKoreksi', id); }
    else if (a === 'ubah') { Rencana.dlgTutup(true); Rencana.dlgBuka('saprodi', id); }
    else if (a === 'mx') { const m = (App.data.mutasiStok || []).find((q) => q.id === b.dataset.mid && !q.terhapus && q.saprodiId === id); if (m) Stok.hapusMut(x, m); }
    else if (a === 'hapus') {
      x.terhapus = true; x.diubah = nowIso(); Rencana.dlgTutup(true); App.simpan(); App.go('rencana', true); Modal.pulihFokus();
      App.toast('Barang dihapus dari daftar stok', { label: 'Urungkan', fn: () => { x.terhapus = false; x.diubah = nowIso(); App.simpan(); App.go(App.tab, true); } });
    }
  }
};

<script>
/* Buku Kebun — Buku pembeli (v0.1.193, docs/PEMBELI.md)
   Daftar pembeli atau tengkulak yang DIHITUNG dari data yang sudah ada: nama `pembeli` pada panen dan `pihak` pada piutang.
   Tanpa koleksi atau kolom baru, jadi impor, cadangan, ekspor JSON, dan sinkron tidak berubah.
   Nama dicocokkan tanpa membedakan huruf besar kecil dan spasi ganda ("Pak Joko" = "pak  joko").
   Menampilkan: penjualan, jumlah panen, rata-rata harga per komoditas, harga terakhir, piutang, dan riwayat jual.
   Ganti nama (atau gabungkan dengan nama lain) memperbarui semua panen, catatan transaksi panen, dan piutang pembeli itu.
   Tampil sebagai sub-tab Pembeli di Rencana keuangan; detail lewat modal Rencana (Rencana.FORM). */
const Pembeli = {
  per: 'semua', batas: 20,
  PER: [['semua', 'Semua'], ['tahun', 'Tahun ini'], ['bulan', 'Bulan ini']],

  /* ---------- nama ---------- */
  rapi(n) { return String(n == null ? '' : n).trim().replace(/\s+/g, ' '); },
  kunci(n) { return this.rapi(n).toLowerCase(); },
  /* nama baku untuk disimpan di panen: bila sudah ada pembeli dengan nama sama (beda huruf besar kecil), pakai ejaan yang sudah ada */
  baku(n, kecuali) {
    const r = this.rapi(n), k = this.kunci(r); if (!k) return '';
    const ada = this.panenSemua().filter((p) => p.id !== kecuali && this.kunci(p.pembeli) === k).sort((a, b) => b.tanggal.localeCompare(a.tanggal))[0]; // ejaan panen terbaru, sama seperti di daftar
    return ada ? this.rapi(ada.pembeli) : r;
  },
  dalam(tgl) { const h = isoHari(); return this.per === 'semua' || (this.per === 'tahun' ? tgl.slice(0, 4) === h.slice(0, 4) : tgl.slice(0, 7) === h.slice(0, 7)); },

  /* ---------- data ---------- */
  panenSemua() { return (App.data.panen || []).filter((p) => !p.terhapus && this.kunci(p.pembeli) && Siklus.cari(p.siklusId)); },
  bersih(p) { return (p.kuantitasKotor || 0) - (p.susut || 0); },
  nilai(p) { return p.hargaPerSatuan ? Math.round(this.bersih(p) * p.hargaPerSatuan) : 0; },
  kom(p) { const s = Siklus.cari(p.siklusId), k = s && Siklus.kom(s.komoditasId); return k ? { id: k.id, nama: k.nama, sat: k.satuan } : { id: '?', nama: '?', sat: '' }; },
  piutangSemua() { return (App.data.utang || []).filter((u) => !u.terhapus && u.jenis === 'piutang' && this.kunci(u.pihak) && Utang.sisa(u) > 0); },
  /* semua pembeli: { key, nama, panen: [semua panen], piutang: [piutang belum lunas], sisa } */
  daftar() {
    const M = {}, ambil = (nama) => { const k = this.kunci(nama); return M[k] || (M[k] = { key: k, nama: this.rapi(nama), panen: [], piutang: [], sisa: 0, tglNama: '' }); };
    this.panenSemua().sort((a, b) => a.tanggal.localeCompare(b.tanggal)).forEach((p) => { const x = ambil(p.pembeli); x.panen.push(p); if (p.tanggal > x.tglNama) { x.tglNama = p.tanggal; x.nama = this.rapi(p.pembeli); } });
    this.piutangSemua().forEach((u) => { const x = ambil(u.pihak); x.piutang.push(u); x.sisa += Utang.sisa(u); });
    return Object.keys(M).map((k) => M[k]);
  },
  cari(key) { return this.daftar().find((x) => x.key === key) || null; },
  /* rekap satu daftar panen: total, jumlah, dan per komoditas { nama, sat, qty (bersih), nilai, qtyHarga, terakhir: {tgl, harga}, rata } */
  rekap(P) {
    const K = {}; let tot = 0;
    P.slice().sort((a, b) => a.tanggal.localeCompare(b.tanggal)).forEach((p) => {
      const k = this.kom(p), x = K[k.id] || (K[k.id] = { nama: k.nama, sat: k.sat, qty: 0, nilai: 0, qtyHarga: 0, terakhir: null });
      x.qty += this.bersih(p); const n = this.nilai(p); tot += n;
      if (p.hargaPerSatuan) { x.nilai += n; x.qtyHarga += this.bersih(p); x.terakhir = { tgl: p.tanggal, harga: p.hargaPerSatuan }; }
    });
    const L = Object.keys(K).map((i) => Object.assign(K[i], { rata: K[i].qtyHarga > 0 ? Math.round(K[i].nilai / K[i].qtyHarga) : 0 })).sort((a, b) => b.nilai - a.nilai || a.nama.localeCompare(b.nama, 'id'));
    return { n: P.length, total: tot, kom: L };
  },
  qTeks(n) { return fmtN(Math.round(n * 100) / 100); },
  barisKom(x) { return esc(x.nama) + ' ' + this.qTeks(x.qty) + ' ' + esc(x.sat) + (x.rata ? ' · rata-rata ' + rp(x.rata) + '/' + esc(x.sat) : ' · tanpa harga'); },

  /* ---------- tampilan: sub-tab Pembeli di Rencana ---------- */
  v() {
    const D = this.daftar();
    if (!D.length) return '<section><p class="note">Belum ada pembeli. Isi kolom Pembeli saat mencatat panen (Siklus → Catat panen) dan pembeli otomatis tampil di sini, lengkap dengan total penjualan, rata-rata harga, dan piutangnya.</p></section>';
    const chips = '<div class="seg sm" style="justify-content:flex-start;margin:0 0 6px">' + this.PER.map((x) => '<button type="button" class="btn' + (this.per === x[0] ? ' on' : '') + '" data-rc="pbl" data-v="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>';
    const R = D.map((x) => Object.assign({ r: this.rekap(x.panen.filter((p) => this.dalam(p.tanggal))) }, x)).filter((x) => x.r.n || x.sisa > 0);
    R.sort((a, b) => b.r.total - a.r.total || b.sisa - a.sisa || a.nama.localeCompare(b.nama, 'id'));
    const jml = R.filter((x) => x.r.n).length, jual = R.reduce((a, x) => a + x.r.total, 0), piu = D.reduce((a, x) => a + x.sisa, 0);
    const ring = '<div class="sum"><div><span class="note">Pembeli</span><strong>' + jml + '</strong></div><div><span class="note">Penjualan</span><strong class="up">' + rp(jual) + '</strong></div><div><span class="note">Piutang</span><strong class="' + (piu > 0 ? 'down' : '') + '">' + rp(piu) + '</strong></div></div>';
    const baris = (x) => '<button type="button" class="ang-baris" data-rc="pbl-detail" data-id="' + esc(x.key) + '" aria-label="Detail pembeli ' + esc(x.nama) + '"><div class="bar-top"><strong>' + esc(x.nama) + '</strong><span class="mu">' + (x.r.n ? rp(x.r.total) : '—') + '</span></div>' +
      '<div class="note">' + (x.r.n ? x.r.n + ' panen' + (x.r.kom.length ? ' · ' + this.barisKom(x.r.kom[0]) + (x.r.kom.length > 1 ? ' · +' + (x.r.kom.length - 1) + ' komoditas' : '') : '') : 'Tidak ada panen pada periode ini') + (x.sisa > 0 ? '<span class="lencana">Piutang ' + rp(x.sisa) + '</span>' : '') + '</div></button>';
    return '<section>' + chips + ring + '<p class="note" style="margin:8px 0 0">Piutang selalu seluruh waktu; penjualan mengikuti periode.</p></section>' +
      '<section><h2>Daftar pembeli</h2><p class="note">Ketuk pembeli untuk melihat riwayat jual, rata-rata harga, dan piutangnya, atau untuk mengganti nama dan menggabungkan ejaan yang berbeda.</p>' + (R.length ? R.slice(0, this.batas).map(baris).join('') +
        (R.length > this.batas ? '<button type="button" class="btn" data-rc="pbl-lagi" style="width:100%;margin-top:8px">Tampilkan lebih banyak (' + (R.length - this.batas) + ')</button>' : '') : '<p class="note">Belum ada pembeli pada periode ini.</p>') + '</section>';
  },
  aksi(a, b) {
    if (a === 'pbl') { this.per = b.dataset.v; this.batas = 20; } else if (a === 'pbl-lagi') this.batas += 20; else return false;
    App.go('rencana', true); return true;
  },
  /* untuk saran nama di form panen (datalist) */
  saran() { return this.daftar().filter((x) => x.panen.length).map((x) => x.nama).sort((a, b) => a.localeCompare(b, 'id')); },
  datalist() { return '<datalist id="dl_pembeli">' + this.saran().map((n) => '<option value="' + esc(n) + '"></option>').join('') + '</datalist>'; },

  /* ---------- ganti nama / gabung ---------- */
  ganti(key, baru) {
    const nama = this.rapi(baru), D = App.data, n = { panen: 0, piutang: 0 };
    D.panen.forEach((p) => {
      if (p.terhapus || this.kunci(p.pembeli) !== key) return;
      const lama = this.rapi(p.pembeli), t = p.transaksiId && D.transaksi.find((x) => x.id === p.transaksiId);
      p.pembeli = nama; p.diubah = nowIso(); n.panen++;
      if (t && typeof t.catatan === 'string' && t.catatan.endsWith(' ke ' + lama)) { t.catatan = t.catatan.slice(0, -lama.length) + nama; t.diubah = nowIso(); }
    });
    D.utang.forEach((u) => { if (!u.terhapus && u.jenis === 'piutang' && this.kunci(u.pihak) === key) { u.pihak = nama; u.diubah = nowIso(); n.piutang++; } });
    return n;
  }
};

/* ---------- formulir dan detail (mesin modal Rencana) ---------- */
Rencana.FORM.pembeliDetail = {
  jenis: 'Buku pembeli', judul: 'Detail pembeli', ada(id) { return !!Pembeli.cari(id); }, judulFn(id) { const x = Pembeli.cari(id); return x ? esc(x.nama) : 'Detail pembeli'; },
  isi(id) {
    const x = Pembeli.cari(id), B = (a, b) => Rencana.baris(a, b), r = Pembeli.rekap(x.panen), tgl = x.panen.map((p) => p.tanggal).sort();
    const kom = r.kom.map((k) => '<div class="note" style="margin:4px 0">' + Pembeli.barisKom(k) + (k.terakhir ? ' · terakhir ' + rp(k.terakhir.harga) + ' (' + Setelan.tgl(k.terakhir.tgl) + ')' : '') + '</div>').join('');
    const piu = x.piutang.slice().sort((a, b) => (a.jatuhTempo || '9999').localeCompare(b.jatuhTempo || '9999')).map((u) =>
      '<button type="button" class="ang-baris" data-rm="pu" data-uid="' + u.id + '" aria-label="Buka piutang ' + rp(Utang.sisa(u)) + '"><div class="bar-top"><strong>' + rp(Utang.sisa(u)) + '</strong><span class="mu">' + (u.jatuhTempo ? 'tempo ' + Setelan.tgl(u.jatuhTempo) : 'tanpa jatuh tempo') + '</span></div></button>').join('');
    const L = x.panen.slice().sort((a, b) => b.tanggal.localeCompare(a.tanggal) || String(b.dibuat || '').localeCompare(String(a.dibuat || '')));
    const riw = L.length ? '<div class="byr" role="list" aria-label="Riwayat jual">' + L.slice(0, 8).map((p) => { const k = Pembeli.kom(p);
      return '<div class="byr-baris" role="listitem"><span class="mu">' + Setelan.tgl(p.tanggal) + '</span><span>' + esc(k.nama) + ' ' + Pembeli.qTeks(Pembeli.bersih(p)) + ' ' + esc(k.sat) + (p.hargaPerSatuan ? ' · ' + rp(p.hargaPerSatuan) + '/' + esc(k.sat) : '') + '</span></div>'; }).join('') + '</div>' +
      (L.length > 8 ? '<p class="note">Menampilkan 8 terbaru dari ' + L.length + ' panen. Ubah atau hapus panen lewat detail siklusnya.</p>' : '') : '<p class="note">Belum ada panen untuk pembeli ini (hanya piutang).</p>';
    return B('Total penjualan', '<strong class="up">' + rp(r.total) + '</strong>') + B('Jumlah panen', String(r.n)) + (tgl.length ? B('Pertama dan terakhir', Setelan.tgl(tgl[0]) + (tgl.length > 1 && tgl[tgl.length - 1] !== tgl[0] ? ' – ' + Setelan.tgl(tgl[tgl.length - 1]) : '')) : '') +
      B('Piutang', x.sisa > 0 ? '<strong class="down">' + rp(x.sisa) + '</strong>' : 'tidak ada') + (kom ? '<h3 style="margin:12px 0 4px">Per komoditas</h3>' + kom : '') +
      (piu ? '<h3 style="margin:12px 0 4px">Piutang belum lunas</h3>' + piu : '') + '<h3 style="margin:12px 0 4px">Riwayat jual</h3>' + riw;
  },
  tombol() { return Rencana.bt('ubah', 'Ganti nama atau gabungkan', 'gold') + Rencana.bt('tutup', 'Tutup', ''); },
  aksi(a, id, b) {
    if (a === 'ubah') { Rencana.dlgTutup(true); Rencana.dlgBuka('pembeliUbah', id); }
    else if (a === 'pu') { const uid2 = b.dataset.uid; Rencana.dlgTutup(true); Rencana.dlgBuka('utangDetail', uid2); }
  }
};
Rencana.FORM.pembeliUbah = {

<script>
/* Buku Kebun — katalog harga pasar (input manual) dan pembanding harga (v0.1.052, docs/HARGA.md)
   Disimpan di komoditas.hargaPasar = [{ id, tanggal, harga, sumber }]; harga per satuan komoditas. */
const Harga = {
  pilih: '',
  daftar(k) { return (k.hargaPasar || []).slice().sort((a, b) => String(b.tanggal).localeCompare(a.tanggal)); },
  terakhir(k) { return k ? this.daftar(k)[0] || null : null; },
  /* perubahan harga terakhir terhadap sebelumnya: { pct } atau null */
  ubah(k) { const L = this.daftar(k); return L.length > 1 && L[1].harga ? { pct: Math.round((L[0].harga - L[1].harga) / L[1].harga * 100) } : null; },
  /* harga jual rata-rata sendiri (tertimbang jumlah panen bersih) untuk panen berharga 90 hari terakhir */
  sendiri(kid) {
    const batas = Jadwal.tambahHari(isoHari(), -90); let q = 0, nilai = 0;
    App.data.panen.filter((p) => !p.terhapus && p.hargaPerSatuan > 0 && p.tanggal >= batas).forEach((p) => {
      const s = Siklus.cari(p.siklusId); if (!s || s.komoditasId !== kid) return;
      const b = Math.max(0, p.kuantitasKotor - p.susut); q += b; nilai += b * p.hargaPerSatuan;
    });
    return q ? nilai / q : null;
  },
  pembanding(k) {
    const t = this.terakhir(k), h = this.sendiri(k.id); if (!t || !h) return '';
    const pct = Math.round((h - t.harga) / t.harga * 100);
    return this.baris('Harga jualmu (90 hari)', rp(Math.round(h)) + '/' + esc(k.satuan)) +
      this.baris('Dibanding pasar', pct === 0 ? 'sama' : '<span class="' + (pct > 0 ? 'up' : 'down') + '">' + Math.abs(pct) + '% ' + (pct > 0 ? 'di atas' : 'di bawah') + ' pasar</span>');
  },
  /* garis tren harga (maks. 12 catatan terakhir, urut waktu) */
  tren(L) {
    if (L.length < 2) return '';
    const P = L.slice(0, 12).reverse(), hs = P.map((p) => p.harga), mn = Math.min(...hs), mx = Math.max(...hs), n = P.length - 1;
    return '<svg class="kas-spark" viewBox="0 0 300 40" preserveAspectRatio="none" role="img" aria-label="Tren harga pasar ' + P.length + ' catatan terakhir"><polyline points="' + P.map((p, i) => (2 + i / n * 296).toFixed(1) + ',' + (37 - (p.harga - mn) / ((mx - mn) || 1) * 34).toFixed(1)).join(' ') + '"/></svg>';
  },
  baris(a, b) { return '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>'; },
  v() {
    const K = Siklus.koms();
    if (!K.length) return '<section><p class="note">Belum ada komoditas. Tambahkan dulu di menu Unit.</p></section>';
    const k = K.find((x) => x.id === this.pilih) || K[0]; this.pilih = k.id;
    const L = this.daftar(k), t = L[0], u = this.ubah(k);
    const opsi = K.map((x) => '<option value="' + x.id + '"' + (x.id === k.id ? ' selected' : '') + '>' + esc(x.nama) + '</option>').join('');
    const row = (p) => '<button type="button" class="ang-baris" data-rc="harga-detail" data-id="' + k.id + '|' + p.id + '" aria-label="Detail harga ' + Setelan.tgl(p.tanggal) + ' ' + rp(p.harga) + '"><div class="bar-top"><strong>' + rp(p.harga) + '/' + esc(k.satuan) + '</strong><span class="mu">' + Setelan.tgl(p.tanggal) + (p.sumber ? ' · ' + esc(p.sumber) : '') + '</span></div></button>';
    const hist = L.slice(0, 5).map(row).join(''), sisa = L.slice(5).map(row).join('');
    return '<section><p class="note">Catat harga pasar sendiri (manual) lewat tombol + untuk membandingkan dengan harga jualmu.</p>' +
      '<label for="hp_kom">Komoditas</label><select id="hp_kom" data-hk>' + opsi + '</select>' +
      (t ? '<div style="margin-top:12px">' + this.baris('Harga pasar terakhir', '<strong>' + rp(t.harga) + '/' + esc(k.satuan) + '</strong>') + this.baris('Dicatat', Setelan.tgl(t.tanggal) + (t.sumber ? ' · ' + esc(t.sumber) : '')) +
        (u ? this.baris('Dari catatan sebelumnya', u.pct === 0 ? 'tetap' : '<span class="' + (u.pct > 0 ? 'up' : 'down') + '">' + (u.pct > 0 ? '▲ ' : '▼ ') + Math.abs(u.pct) + '%</span>') : '') + this.pembanding(k) + '</div>' : '<p class="note" style="margin-top:12px">Belum ada harga pasar untuk ' + esc(k.nama) + '. Ketuk tombol + untuk mencatat.</p>') + '</section>' +
      (L.length ? '<section><h2>Riwayat</h2>' + this.tren(L) + '<div>' + hist + '</div>' + (sisa ? '<details class="lg-detail"><summary>Lihat semua (' + L.length + ')</summary><div>' + sisa + '</div></details>' : '') + '</section>' : '');
  },
  cek(h, tgl) {
    if (!(h > 0)) return 'Isi harga pasar lebih dari 0.';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl)) return 'Isi tanggal.';
    if (tgl > isoHari()) return 'Tanggal tidak boleh di masa depan.';
    return '';
  },
  /* simpan satu harga pasar; kembalikan pesan galat atau '' (dipanggil dari modal FAB, v0.1.055) */
  simpan(k, h, tgl, sumber) {
    const e = this.cek(h, tgl); if (e) return e;
    (k.hargaPasar = k.hargaPasar || []).push({ id: uid('h'), tanggal: tgl, harga: h, sumber: sumber });
    k.diubah = nowIso(); return '';
  },
  /* id gabungan "idKomoditas|idHarga" (v0.1.062) */
  cari(gid) {
    const [kid, hid] = String(gid).split('|'), k = Siklus.kom(kid), p = k && (k.hargaPasar || []).find((x) => x.id === hid);
    return p ? { k: k, p: p } : null;
  },
  edit(gid, h, tgl, sumber) {
    const r = this.cari(gid); if (!r) return 'Catatan harga tidak ditemukan.';
    const e = this.cek(h, tgl); if (e) return e;
    Object.assign(r.p, { harga: h, tanggal: tgl, sumber: sumber }); r.k.diubah = nowIso(); return '';
  },
  hapus(gid) {
    const r = this.cari(gid); if (!r) return;
    const i = r.k.hargaPasar.indexOf(r.p), rec = r.k.hargaPasar.splice(i, 1)[0], k = r.k; k.diubah = nowIso();
    Rencana.dlgTutup(true); App.simpan(); App.go('rencana', true); Modal.pulihFokus();
    App.toast('Harga pasar dihapus', { label: 'Urungkan', fn: () => { k.hargaPasar.push(rec); k.diubah = nowIso(); App.simpan(); App.go('rencana', true); } });
  }
};

<script>
/* Buku Kebun — kalkulator kelayakan usaha: NPV, IRR, balik modal, PI (v0.1.053, docs/KELAYAKAN.md)
   Model sederhana: investasi awal, arus kas bersih tetap per periode, nilai sisa di akhir. Tidak memakai data transaksi kecuali tombol isi cepat. */
const Kelayakan = {
  s: null,
  BAWAAN: { invest: '', net: '', n: '12', sisa: '', d: '12', unit: 'bulan' },
  muat() { if (!this.s) this.s = Object.assign({}, this.BAWAAN, App.data.pengaturan.kelayakan || {}); return this.s; },
  /* hitung dari angka mentah; kembalikan { galat } atau hasil */
  hitung(x) {
    const inv = Number(x.invest) || 0, net = Number(x.net) || 0, n = Number(x.n) || 0, sisa = Number(x.sisa) || 0, d = Number(x.d);
    if (!(inv > 0)) return { galat: 'Isi investasi awal lebih dari 0.' };
    if (!Number.isInteger(n) || n < 1 || n > 120) return { galat: 'Jumlah periode 1 sampai 120.' };
    if (!(d >= 0 && d <= 100)) return { galat: 'Diskonto per tahun 0 sampai 100%.' };
    const bln = x.unit !== 'tahun', r = bln ? Math.pow(1 + d / 100, 1 / 12) - 1 : d / 100;
    const cf = [-inv]; for (let t = 1; t <= n; t++) cf.push(net + (t === n ? sisa : 0));
    const npv = (rate) => cf.reduce((a, c, t) => a + c / Math.pow(1 + rate, t), 0);
    let irr = null, lo = -0.99, hi = 10;
    if (npv(lo) * npv(hi) < 0) { for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (npv(lo) * npv(m) <= 0) hi = m; else lo = m; } irr = (lo + hi) / 2; }
    let kum = -inv, balik = null;
    for (let t = 1; t <= n && balik === null; t++) { const baru = kum + cf[t]; if (baru >= 0 && cf[t] > 0) balik = t - 1 + (-kum) / cf[t]; kum = baru; }
    const total = cf.slice(1).reduce((a, c) => a + c, 0), v = npv(r);
    return { npv: v, irr: irr, irrTahun: irr === null ? null : (bln ? Math.pow(1 + irr, 12) - 1 : irr), balik: balik, pi: (v + inv) / inv, total: total, r: r, n: n, bln: bln, inv: inv, layak: v > 0 };
  },
  hasil(x) {
    const h = this.hitung(x); if (h.galat) return '<p class="note">' + esc(h.galat) + '</p>';
    const u = h.bln ? 'bulan' : 'tahun', baris = (a, b) => '<div class="row"><span class="mu">' + a + '</span><span>' + b + '</span></div>', pct = (n) => (Math.round(n * 1000) / 10).toLocaleString('id-ID') + '%';
    return '<div class="row"><strong class="' + (h.layak ? 'up' : 'down') + '">' + (h.layak ? 'Layak' : 'Belum layak') + '</strong><span class="mu">' + (h.layak ? 'NPV positif' : 'NPV nol atau negatif') + '</span></div>' +
      baris('NPV (nilai sekarang bersih)', '<span class="' + (h.layak ? 'up' : 'down') + '">' + rp(Math.round(h.npv)) + '</span>') +
      baris('IRR per tahun', h.irrTahun === null ? 'tidak dapat dihitung' : pct(h.irrTahun)) +
      baris('Balik modal', h.balik === null ? 'tidak dalam ' + h.n + ' ' + u : (Math.round(h.balik * 10) / 10).toLocaleString('id-ID') + ' ' + u) +
      baris('Indeks profitabilitas (PI)', (Math.round(h.pi * 100) / 100).toLocaleString('id-ID')) +
      baris('Total arus kas masuk', rp(Math.round(h.total))) +
      '<p class="note">Layak bila NPV positif, yaitu IRR di atas diskonto. Diskonto ' + pct(h.r) + ' per ' + u + '. Model sederhana: arus kas dianggap tetap tiap periode.</p>';
  },
  v() {
    const s = this.muat(), f = (k) => s[k] === '' ? '' : fmtInput(Number(s[k]) || 0), unit = s.unit === 'tahun' ? 'tahun' : 'bulan';
    const inp = (id, lab, k, ph) => '<label for="kl_' + id + '">' + lab + '</label><input id="kl_' + id + '" data-kl="' + k + '" data-rp inputmode="numeric" autocomplete="off" placeholder="' + ph + '" value="' + f(k) + '">';
    const isi = '<section><p class="note">Hitung apakah sebuah usaha atau investasi (mis. kolam, greenhouse, alat) layak dijalankan. Angka di sini tidak mengubah catatan keuanganmu.</p>' +
      '<div class="seg sm" style="justify-content:flex-start;margin:6px 0">' + [['bulan', 'Periode bulanan'], ['tahun', 'Periode tahunan']].map((x) => '<button type="button" class="btn' + (unit === x[0] ? ' on' : '') + '" data-rc="kl-unit" data-id="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>' +
      inp('invest', 'Investasi awal (Rp)', 'invest', '0') + inp('net', 'Arus kas bersih per ' + unit + ' (Rp)', 'net', '0') + inp('n', 'Jumlah ' + unit, 'n', '12') + inp('sisa', 'Nilai sisa di akhir (Rp, opsional)', 'sisa', '0') + '<label for="kl_d">Diskonto per tahun (%)</label><input id="kl_d" data-kl="d" inputmode="decimal" autocomplete="off" placeholder="12" value="' + esc(s.d) + '">' +
      '<div class="seg" style="margin-top:8px"><button type="button" class="btn" data-rc="kl-isi">Isi arus kas dari rata-rata 3 bulan</button></div></section>';
    const hasil = '<section><h2>Hasil</h2><div id="kl_hasil" aria-live="polite">' + this.hasil(s) + '</div></section>';
    return hasil + isi;
  },
  simpan() { App.data.pengaturan.kelayakan = Object.assign({}, this.s); App.simpan(); },
  /* dipanggil dari Rencana.klik */
  aksi(a, b) {
    const s = this.muat();
    if (a === 'kl-unit') { s.unit = b.dataset.id === 'tahun' ? 'tahun' : 'bulan'; }
    else if (a === 'kl-isi') { s.net = String(Math.round(Rencana.rata3())); s.unit = 'bulan'; if (!Number(s.net)) App.toast('Belum ada arus kas 3 bulan terakhir — isi manual'); }
    this.simpan(); App.go('rencana', true); return true;
  },
  masuk(e) {
    const i = e.target.closest && e.target.closest('[data-kl]'); if (!i) return;
    const s = this.muat(), k = i.dataset.kl;
    s[k] = k === 'd' ? i.value.replace(/[^\d.,]/g, '').replace(',', '.') : (i.value.trim() === '' ? '' : String(angka(i.value)));
    const h = document.getElementById('kl_hasil'); if (h) h.innerHTML = this.hasil(s);

  }
};
document.addEventListener('input', (e) => Kelayakan.masuk(e));

<script>

  /* ---------- draf formulir catatan ---------- */

      }).catch(() => { const hl = document.getElementById('flHilang'); if (t === tok && hl) { document.getElementById('flImg').hidden = true; hl.hidden = false; } });

  /* ---------- Setelan: pemakaian dan penyimpanan tetap ---------- */
  ringkas() {

      const r = { nota: { n: 0, b: 0 }, jurnal: { n: 0, b: 0 } };

<script>
/* Buku Kebun — Cadangan foto ke ZIP (Fase 6E Tahap 6, v0.1.094; docs/CADANGAN.md)
   Foto nota dan jurnal hanya di IndexedDB browser ini. ZIP berisi indeks.json + foto/<id>.<jpg|png|webp>, tanpa kompresi (memakai Xlsx.zip). */
const CadFoto = {
  KUNCI: 'tk-foto-cad', MAKS: 250 * 1048576, MAKSFOTO: 30 * 1048576,
  EKS: { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }, TIPE: { jpg: 'image/jpeg', png: 'image/png', webp: 'image/webp' },
  terakhir() { try { return JSON.parse(Penyimpanan.get(this.KUNCI) || 'null'); } catch (e) { return null; } },
  /* kalimat status untuk Setelan: kapan cadangan terakhir dan berapa foto yang lebih baru */
  teks(L) {
    if (!L.length) return '';
    const t = this.terakhir(); if (!t) return ' Foto belum pernah dicadangkan.';
    const baru = L.filter((x) => (x.ms || 0) > t.ms).length;
    return ' Cadangan foto terakhir ' + Setelan.tgl(isoHari(new Date(t.ms))) + (baru ? '; ' + baru + ' foto belum dicadangkan.' : '; semua foto sudah dicadangkan.');
  },
  /* keterangan tiap foto: dari mana asalnya (jurnal atau transaksi) */
  meta(id) {
    const j = (App.data.jurnal || []).find((x) => !x.terhapus && (x.foto || []).includes(id));
    if (j) return { jenis: 'jurnal', siklusId: j.siklusId, tanggal: j.tanggal, ref: j.id };
    const t = App.data.transaksi.find((x) => x.notaId === id);
    return t ? { jenis: 'nota', siklusId: t.siklusId || null, tanggal: t.tanggal, ref: t.id } : { jenis: 'lepas' };
  },
  async buat() {
    const L = await Nota.semua(); if (!L.length) throw new Error('Belum ada foto untuk dicadangkan.');
    const total = L.reduce((a, r) => a + (r.ukuran || (r.blob && r.blob.size) || 0), 0);
    if (total > this.MAKS) throw new Error('Foto terlalu besar untuk satu ZIP (' + Nota.mb(total) + '). Hapus foto yang tidak perlu dulu.');
    const berkas = [], daftar = [];
    for (const r of L) {
      const eks = this.EKS[r.tipe] || 'jpg', nama = 'foto/' + r.id + '.' + eks;
      berkas.push({ nama: nama, data: new Uint8Array(await r.blob.arrayBuffer()) });
      daftar.push(Object.assign({ id: r.id, berkas: nama, tipe: r.tipe || 'image/jpeg', ukuran: r.ukuran || r.blob.size }, this.meta(r.id)));
    }
    berkas.unshift({ nama: 'indeks.json', data: JSON.stringify({ versi: 1, aplikasi: 'buku-kebun', dibuat: new Date().toISOString(), foto: daftar }, null, 1) });
    return { zip: Xlsx.zip(berkas), n: L.length, total: total };
  },
  async ekspor() {
    const r = await this.buat(), a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([r.zip], { type: 'application/zip' })); a.download = 'buku-kebun-foto-' + isoHari() + '.zip';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    Penyimpanan.set(this.KUNCI, JSON.stringify({ ms: Date.now(), n: r.n }));
    return r;
  },
  /* pembaca ZIP sederhana: hanya berkas tanpa kompresi (hasil ekspor aplikasi ini) */
  baca(buf) {
    const d = new Uint8Array(buf), dv = new DataView(buf), dec = new TextDecoder(), out = []; let p = 0;
    if (d.length < 30 || dv.getUint32(0, true) !== 0x04034b50) throw new Error('Berkas ini bukan ZIP cadangan foto.');
    while (p + 30 <= d.length && dv.getUint32(p, true) === 0x04034b50) {
      const flag = dv.getUint16(p + 6, true), metode = dv.getUint16(p + 8, true), cs = dv.getUint32(p + 18, true), nl = dv.getUint16(p + 26, true), el = dv.getUint16(p + 28, true), mulai = p + 30 + nl + el;
      if (metode !== 0 || (flag & 8)) throw new Error('ZIP ini terkompresi; hanya ZIP hasil Cadangkan foto yang bisa dipulihkan.');
      if (mulai + cs > d.length) throw new Error('Berkas ZIP rusak atau terpotong.');
      out.push({ nama: dec.decode(d.subarray(p + 30, p + 30 + nl)), data: d.subarray(mulai, mulai + cs) }); p = mulai + cs;
    }

  },
  async imporBuf(buf, kering) { // kering = true: hanya menghitung (pratinjau), tanpa menyimpan
    const L = this.baca(buf), ix = L.find((x) => x.nama === 'indeks.json'); if (!ix) throw new Error('indeks.json tidak ditemukan; ini bukan ZIP cadangan foto.');
    let idx; try { idx = JSON.parse(new TextDecoder().decode(ix.data)); } catch (e) { throw new Error('indeks.json tidak terbaca.'); }
    if (!idx || idx.versi !== 1 || !Array.isArray(idx.foto)) throw new Error('Versi cadangan foto tidak dikenal.');
    const peta = {}; L.forEach((x) => { peta[x.nama] = x.data; });
    const r = { baru: 0, ada: 0, lewat: 0 };
    for (const f of idx.foto) {
      const m = f && /^foto\/([A-Za-z0-9_]{3,40})\.(jpg|png|webp)$/.exec(String(f.berkas || '')), data = m && peta[f.berkas];
      if (!m || m[1] !== f.id || !data || !data.length || data.length > this.MAKSFOTO) { r.lewat++; continue; }
      if (await Nota.ambil(f.id)) { r.ada++; continue; }
      if (kering) { r.baru++; continue; }
      const tipe = this.TIPE[m[2]]; await Nota.simpan({ id: f.id, blob: new Blob([data], { type: tipe }), tipe: tipe, ukuran: data.length, ms: Date.now() }); r.baru++;
    }
    return r;
  },
  pilih() {
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.zip,application/zip';
    i.onchange = () => { const f = i.files && i.files[0]; if (f) this.impor(f); };
    i.click();
  },
  async impor(file) {
    try {
      if (file.size > this.MAKS + 5242880) throw new Error('Berkas terlalu besar.');
      const buf = await file.arrayBuffer(), k = await this.imporBuf(buf, true);
      if (!k.baru) { App.toast('Tidak ada foto baru untuk dipulihkan' + (k.ada ? ': ' + k.ada + ' sudah ada' : '') + (k.lewat ? ', ' + k.lewat + ' dilewati' : '')); return; }
      Impor.foto(k, { nama: file.name, ukuran: file.size }, async () => {
        try {
          const r = await this.imporBuf(buf);
          App.toast('Impor berhasil: ' + r.baru + ' foto dipulihkan' + (r.ada ? ', ' + r.ada + ' sudah ada' : '') + (r.lewat ? ', ' + r.lewat + ' dilewati' : '')); Foto.isiInfo();
          if (App.tab) App.go(App.tab, true);
        } catch (e) { App.toast(e && e.message ? e.message : 'Foto tidak bisa dipulihkan'); }
      });
    } catch (e) { App.toast(e && e.message ? e.message : 'Foto tidak bisa dipulihkan'); }
  },
  async aksiEkspor() {
    try { const r = await this.ekspor(); App.toast(r.n + ' foto dicadangkan (' + Nota.mb(r.total) + ')'); Foto.isiInfo(); }
    catch (e) { App.toast(e && e.message ? e.message : 'Cadangan foto gagal'); }
  }
};

<script>
/* Buku Kebun — status tombol pilihan untuk pembaca layar (v0.1.105, docs/AUDIT.md)
   Kelompok tombol yang hanya berisi tombol/tautan dan salah satunya berkelas "on" (chip 6 bulan, Semua, Berjalan, Periode bulanan, dsb.)
   diberi aria-pressed true/false agar pilihan aktif tidak hanya terlihat dari warna. Dijalankan lagi tiap tampilan berubah. */
const Aks = {
  sinkron(akar) {
    const grup = new Set();
    (akar || document).querySelectorAll('button.on, a.btn.on').forEach((e) => { if (e.parentElement) grup.add(e.parentElement); });
    grup.forEach((p) => {
      const anak = [...p.children]; if (anak.length < 2 || !anak.every((x) => x.tagName === 'BUTTON' || x.tagName === 'A')) return;
      anak.forEach((x) => { if (x.hasAttribute('aria-current') || x.hasAttribute('aria-selected') || x.hasAttribute('aria-expanded')) return; x.setAttribute('aria-pressed', x.classList.contains('on') ? 'true' : 'false'); });
    });
  },
  pasang() {
    let t = 0; const jalan = () => { t = 0; this.sinkron(document); };
    new MutationObserver(() => { if (!t) t = requestAnimationFrame(jalan); }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
    jalan();
  }
};
Aks.pasang();

<script>
/* Buku Kebun — pelengkap desktop (Fase 6D Tahap 1, v0.1.118): pintasan keyboard dan ukuran teks grafik tetap; docs/DESKTOP.md */
const Pintasan = {

  TUJUAN: { b: 'beranda', t: 'transaksi', s: 'siklus', u: 'master', l: 'laporan', r: 'rencana' },
  DAFTAR: [['N', 'Catat transaksi (atau tombol + di halaman ini)'], ['/', 'Cari cepat (transaksi, siklus, jurnal)'], ['G lalu B', 'Beranda'], ['G lalu T', 'Transaksi'], ['G lalu S', 'Siklus'], ['G lalu U', 'Unit dan komoditas'],
    ['G lalu L', 'Laporan'], ['G lalu R', 'Rencana keuangan'], [',', 'Setelan'], ['?', 'Daftar pintasan ini'], ['Esc', 'Tutup dialog atau menu']],
  aktif() { return Setelan.get('pintasan') !== false; },
  /* tidak aktif saat mengetik, memakai Ctrl/Alt/Cmd, atau mengisi huruf lewat IME */
  boleh(e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return false;
    const t = e.target; if (!t) return true;

  akhiriG() { this.g = false; clearTimeout(this.t); },

        '<div class="dm-isi"><table class="pn-tab"><tbody>' + this.DAFTAR.map((r) => '<tr><td>' + r[0].split(' ').map((x) => x === 'lalu' ? '<span class="mu"> lalu </span>' : '<kbd>' + x + '</kbd>').join('') + '</td><td>' + r[1] + '</td></tr>').join('') + '</tbody></table>' +
        '<p class="note">Aktif di luar kolom isian dan tidak bentrok dengan Ctrl, Alt, atau Cmd. Bisa dimatikan di Setelan → Preferensi → Pintasan keyboard.</p></div>' +
        '<div class="dm-aksi"><button type="button" class="btn gold" data-pn="tutup">Tutup</button></div>',

/* teks di grafik SVG ikut membesar mengikuti lebar layar; batasi agar tetap terbaca dan tidak raksasa di desktop */
const GrafikFont = {

  jalan() {

/* daftar Transaksi ⇄ tabel saat lebar layar melewati 1024 px */

<script>
/* Buku Kebun — bilah ringkas saat gulir (HP/tablet, <1024 px; Fase 6G Tahap 2, v0.1.126).
   Muncul saat menggulir ke atas setelah melewati header, tersembunyi saat menggulir ke bawah dan di dekat puncak halaman. */
const Ringkas = {
  y: 0, tunggu: false, el: null,
  aktif() { return !!(window.matchMedia && window.matchMedia('(max-width:1023px)').matches); },
  kurang() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches); },
  init() {
    this.el = document.getElementById('hdrRingkas'); if (!this.el) return;
    this.y = window.scrollY;
    window.addEventListener('scroll', () => {
      if (this.tunggu) return; this.tunggu = true;
      requestAnimationFrame(() => { this.tunggu = false; this.geser(); });
    }, { passive: true });
    document.getElementById('hrJudul').addEventListener('click', () => { window.scrollTo({ top: 0, behavior: this.kurang() ? 'auto' : 'smooth' }); });
    const g = document.getElementById('gear'), hg = document.getElementById('hrGear'); if (g && hg) hg.innerHTML = g.innerHTML;
    const sk = document.getElementById('skDot'); if (sk && window.MutationObserver) new MutationObserver(() => this.segar()).observe(sk, { childList: true, subtree: true, characterData: true, attributes: true });
    window.addEventListener('resize', () => { if (!this.aktif()) this.sembunyi(); });

  geser() {

    if (y <= batas) this.sembunyi(); else if (dy < -8) this.tunjuk(); else if (dy > 8) this.sembunyi();
    this.y = y;
  },
  tunjuk() { if (this.el) this.el.classList.add('on'); },
  sembunyi() { if (this.el) this.el.classList.remove('on'); },
  /* salin judul, tombol kembali, dan status sinkron dari header utama */
  segar() {
    if (!this.el) return;
    const j = document.getElementById('hdrJudul'), bk = document.getElementById('hdrBack'), hb = document.getElementById('hrBack'), hj = document.getElementById('hrJudul'), hs = document.getElementById('hrSk'), chip = document.querySelector('#skDot .sk-chip');
    if (j && hj) hj.textContent = document.body.dataset.hal === 'beranda' ? 'Buku Kebun' : (j.textContent || '').trim() || 'Buku Kebun';
    if (bk && hb) {

      this.toast('Transaksi tersimpan'); this.go('catat', true);
      const j = $('f_jumlah'); if (j) j.focus();
    } else { this.draft = null; this.toast(d.id ? 'Transaksi diperbarui' : 'Transaksi tersimpan'); this.go(['transaksi', 'siklus-detail', 'jurnal'].includes(this.balik) ? this.balik : 'beranda'); }
  },
  tambahKat() {
    const nama = $('k_nama').value.trim(), jenis = $('k_jenis').value;
    if (!nama) { this.toast('Isi nama kategori'); return; }
    if (this.kategori(jenis).some((k) => k.nama.toLowerCase() === nama.toLowerCase())) { this.toast('Kategori sudah ada'); return; }
    this.data.kategori.push({ id: uid('c'), nama, jenis, sifatBiaya: jenis === 'keluar' ? 'variabel' : null, bawaan: false, terhapus: false });
    this.simpan(); this.toast('Kategori ditambahkan'); this.go('lainnya', true);
  },

  /* ---------- CSV ---------- */
  eksporCsv() {
    const q = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
    const baris = ['tanggal,jenis,kategori,siklus,jumlah,catatan'].concat(
      this.semuaTx().slice().sort((a, b) => a.tanggal.localeCompare(b.tanggal)).map((t) =>
        [t.tanggal, t.jenis, q(this.namaKat(t.kategoriId)), q(t.siklusId && Siklus.cari(t.siklusId) ? Siklus.nama(t.siklusId) : ''), t.jumlah, q(t.catatan)].join(',')));
    const csv = baris.join('\r\n');
    $('csvBox').value = csv;
    if (baris.length < 2) { $('csvMsg').textContent = 'Belum ada transaksi untuk diekspor.'; return; }
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
      a.download = 'buku-kebun-transaksi-' + isoHari() + '.csv';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    } catch (e) {}
    $('csvMsg').textContent = (baris.length - 1) + ' transaksi diekspor. Jika unduhan tidak mulai, salin teks di kotak.';
  },
  urai(teks) {
    const rows = []; let r = [], f = '', q = false;
    teks = teks.replace(/^\ufeff/, '');
    for (let i = 0; i < teks.length; i++) {
      const c = teks[i];
      if (q) { if (c === '"') { if (teks[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { r.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && teks[i + 1] === '\n') i++; r.push(f); f = ''; if (r.some((x) => x.trim())) rows.push(r); r = []; }
      else f += c;
    }
    r.push(f); if (r.some((x) => x.trim())) rows.push(r);
    return rows;
  },
  /* mengganti seluruh data dengan isi berkas (impor JSON, Urungkan impor); data lama dicadangkan otomatis */
  pasangData(o) { const r = Store.dari(o); Cadangan.catat('Sebelum impor', true); this.data = r.data; Profil.terap(); this.simpan(true); this.go(this.tab, true); return r; },
  /* impor CSV (v0.1.102): analisa dulu tanpa mengubah data, tampilkan pratinjau (Impor.csv), baru terapkan */
  analisaCsv(teks) {
    const rows = this.urai(teks || '');
    if (rows.length < 2) return { galat: 'CSV kosong atau tanpa baris data.' };
    const h = rows[0].map((x) => x.trim().toLowerCase()), ix = (n) => h.indexOf(n);
    if (ix('tanggal') < 0 || ix('jenis') < 0 || ix('jumlah') < 0) return { galat: 'Kolom tanggal, jenis, dan jumlah wajib ada.' };
    const data = rows.slice(1).filter((r) => r.some((c) => String(c).trim()));
    const a = { baris: [], lewat: 0, total: data.length, masuk: 0, keluar: 0, dari: '', sampai: '', kategoriBaru: [], tanpaKategori: 0, kembar: 0 }, baru = {};
    const ada = new Set(this.semuaTx().map((t) => [t.tanggal, t.jenis, t.jumlah, t.catatan || ''].join('|')));
    data.forEach((r) => {
      const tgl = (r[ix('tanggal')] || '').trim(), jenis = (r[ix('jenis')] || '').trim().toLowerCase(), jml = angka(r[ix('jumlah')]);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl) || (jenis !== 'keluar' && jenis !== 'masuk') || jml <= 0) { a.lewat++; return; }
      const nama = ix('kategori') >= 0 ? (r[ix('kategori')] || '').trim() : '', catatan = ix('catatan') >= 0 ? (r[ix('catatan')] || '').trim() : '';
      a.baris.push({ tgl: tgl, jenis: jenis, jml: jml, nama: nama, catatan: catatan }); a[jenis === 'masuk' ? 'masuk' : 'keluar'] += jml;
      if (!a.dari || tgl < a.dari) a.dari = tgl; if (!a.sampai || tgl > a.sampai) a.sampai = tgl;
      if (!nama) a.tanpaKategori++; else if (!this.kategori(jenis).some((x) => x.nama.toLowerCase() === nama.toLowerCase())) baru[jenis + '|' + nama.toLowerCase()] = nama;
      if (ada.has([tgl, jenis, jml, catatan].join('|'))) a.kembar++;
    });
    a.kategoriBaru = Object.keys(baru).map((k) => baru[k]);
    return a;
  },
  terapkanCsv(a) {
    const ids = [], kat = [];
    a.baris.forEach((r) => {
      let k = this.kategori(r.jenis).find((x) => x.nama.toLowerCase() === r.nama.toLowerCase());
      if (!k && r.nama) { k = { id: uid('c'), nama: r.nama, jenis: r.jenis, sifatBiaya: r.jenis === 'keluar' ? 'variabel' : null, bawaan: false, terhapus: false }; this.data.kategori.push(k); kat.push(k.id); }
      if (!k) k = this.kategori(r.jenis).slice(-1)[0];
      const t = { id: uid('t'), tanggal: r.tgl, jenis: r.jenis, kategoriId: k.id, jumlah: r.jml, siklusId: null,
        sifatBiaya: r.jenis === 'keluar' ? k.sifatBiaya || 'variabel' : null, catatan: r.catatan, dibuat: nowIso(), diubah: nowIso(), terhapus: false };
      this.data.transaksi.push(t); ids.push(t.id);
    });
    this.simpan(); this.ringkas();
    return { ids: ids, kat: kat };
  },
  batalkanCsv(h) { // Urungkan: hapus lunak transaksi dan kategori yang baru dibuat oleh impor itu
    const n = nowIso();
    this.data.transaksi.forEach((t) => { if (h.ids.includes(t.id)) { t.terhapus = true; t.diubah = n; } });
    this.data.kategori.forEach((k) => { if (h.kat.includes(k.id)) { k.terhapus = true; k.diubah = n; } });
    this.simpan(); this.ringkas(); this.go(this.tab, true);
  },
  imporCsv(info) {
    const a = this.analisaCsv($('csvBox').value || ''), pesan = (t) => { const e = $('csvMsg'); if (e) e.textContent = t; };
    if (a.galat) { pesan(a.galat); this.toast(a.galat); return; }
    Impor.csv(a, info, pesan);
  },
  contoh() { Contoh.isi(); }
};

document.addEventListener('DOMContentLoaded', () => App.init());

</script>
